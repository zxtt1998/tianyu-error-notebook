</script><script id="bank" type="application/json">{"version":"2026-10-03-v1","title":"安全生产技术 · 错题本","papers":[{"id":1,"title":"第1套","count":52,"single":40,"multiple":12},{"id":2,"title":"第2套","count":48,"single":38,"multiple":10},{"id":3,"title":"第3套","count":55,"single":42,"multiple":13},{"id":4,"title":"第4套","count":39,"single":26,"multiple":13},{"id":5,"title":"第5套","count":45,"single":33,"multiple":12}],"questions":[{"id":"1-1","paper":1,"number":1,"type":"single","stem":"操作人员易接触到的运动零部件是机械设备最危险的部位，以皮带传动装置为例，下列各项说法中相对最为符合要求的是（）。","options":{"A":"危险仅集中在皮带接头和皮带进入皮带轮的部位","B":"可采用将皮带全部遮盖的防护网、防护栅栏进行防护","C":"传动机构离地2m以下的小型带传动装置，可不设防护罩","D":"皮带轮中心距3m以下的小型带传动装置，可不设防护罩"},"images":[],"answer":["B"],"explanation":"危险主要集中在皮带接头和皮带进入皮带轮的部位，可采用将皮带全部遮盖的防护网、防护栅栏进行防护，因此B选项满足要求；传动机构离地2m以下的小型带传动装置，应设防护罩；皮带轮中心距3m以下的小型带传动装置，应根据传动装置的高度决定是否需要设置防护罩。","pages":[1],"topic":"机械与人机安全"},{"id":"1-4","paper":1,"number":4,"type":"single","stem":"机械设备在设计中应充分考虑系统的可靠性、可维修性设计，减少人员的暴露频率从而降低事故概率。以大型游乐设施为例，下列各项设计参数要求中，（）属于可维修性设计。","options":{"A":"设置放行联锁装置实现联锁自动化控制","B":"滑索到达站应当设置不少于两套独立的自动制动装置","C":"牵引动力机构、承载索具备型式认证标识","D":"到达站预留两套标准备用缓冲垫、拦截索"},"images":[],"answer":["D"],"explanation":"设置放行联锁装置实现联锁自动化控制，属于可靠性设计的机械化和自动化设计；滑索到达站应当设置不少于两套独立的自动制动装置，属于可靠性设计中的加倍冗余和多样化设计；牵引动力机构、承载索具备型式认证标识，属于可靠性设计中的安全性已知的部件。","pages":[1],"topic":"机械与人机安全"},{"id":"1-7","paper":1,"number":7,"type":"single","stem":"木工作业通过刀具切割破坏木材纤维之间的联系，从而改变木材加工件的形状、尺寸和表面特征。针对其加工特点情景，下列说法中正确的是（）。","options":{"A":"在诸多危险有害因素中，噪声振动危害发生概率高、危险性大","B":"肺叶纤维化症状、呼吸道疾病危害，主要归因于木材生物效应","C":"防腐、修饰粘结作业的皮炎和急性中毒，表现为化学危害","D":"机械危险取决于木材种类、接触时间和操作者自身体质条件"},"images":[],"answer":["C"],"explanation":"在诸多危险有害因素中，机械危险发生概率高、危险性大；肺叶纤维化症状、呼吸道疾病危害，主要归因于木材的粉尘危害；防腐、修饰粘结作业的皮炎和急性中毒，表现为化学危害；木材生物效应危险取决于木材种类、接触时间和操作者自身体质条件。","pages":[2],"topic":"机械与人机安全"},{"id":"1-9","paper":1,"number":9,"type":"single","stem":"民用爆炸品种类繁多，不同类别和品种的爆炸品在生产、储运和使用中的危险因素不尽相同。下列各项关于民用爆炸品特性及影响因素的描述中，最为符合要求的是（）。","options":{"A":"加入增塑剂、嵌入金属丝提高燃烧效率影响炸药能量特征","B":"通常为改善炸药的安全性，一般加入少量稳定剂（如二苯胺）","C":"燃烧特性主要取决于炸药的燃烧类型和燃烧表面积","D":"安全性在配方设计时考虑炸药在生产、使用和运输中安全可靠"},"images":[],"answer":["D"],"explanation":"加入增塑剂、嵌入金属丝提高燃烧效率影响炸药燃烧特性；通常为改善炸药的安定性，一般加入少量稳定剂（如二苯胺）；燃烧特性主要取决于炸药的燃烧速率和燃烧表面积。","pages":[2],"topic":"防火防爆"},{"id":"1-11","paper":1,"number":11,"type":"single","stem":"将爆炸性物质溶解或悬浮于水等液体中形成均质溶液，利用液态介质抑制其爆炸特性属于常见的液态退敏爆炸物。下列各项关于退敏爆炸物的说法中，正确的是（）。","options":{"A":"将放热分解能不足300J/g的物质，称作退敏爆炸物","B":"硝化纤维素按照其稳定性，不稳定的划入退敏爆炸物","C":"应使用信号词警告提示类别1、类别2的退敏爆炸物的危害程度","D":"不具有整体爆炸且不会迅速燃烧特性，采用“火焰”标识"},"images":[],"answer":["D"],"explanation":"将放热分解能大于300J/g的物质，称作退敏爆炸物；硝化纤维素按照其稳定性，稳定的划入退敏爆炸物；应使用信号词危险提示类别1、类别2的退敏爆炸物的危害程度。","pages":[2,3],"topic":"防火防爆"},{"id":"1-12","paper":1,"number":12,"type":"single","stem":"所谓凝聚态标志物反设计，通过事故后现场标志物的受破坏情况，对爆炸源性质、位置、爆炸当量进行推测，从而为事故调查分析提供参考依据。某事故现场呈现下列情景：①工位残留大小不一的炸坑；②50m处相邻建筑物的砖墙倒塌；③50m暴露人员呈现严重内脏挫伤、心肌撕裂；④80m处办公用房的房屋玻璃基本无破坏。针对上述情景，下列说法中正确的是（）。","options":{"A":"基本可判定属于粉尘爆炸、气体爆炸或液体蒸汽爆炸","B":"50m处爆炸超压处于50~100kPa，内部安全距离不足","C":"50m处暴露人员可能大部分死亡，内部安全距离不足","D":"80m处爆炸超压处于5~11kPa，不会导致暴露人员直接致死"},"images":[],"answer":["B"],"explanation":"基本可判定属于凝聚态爆炸；50m处爆炸超压处于50~100kPa导致暴露人员可能死亡，内部安全距离不足；80m处爆炸超压不足5kPa，不会导致暴露人员直接致死。","pages":[3],"topic":"防火防爆"},{"id":"1-13","paper":1,"number":13,"type":"single","stem":"《烟花爆竹工程设计安全标准》明确危险性建筑物的危险等级。下列关于烟花爆竹建筑物危险等级的说法中，正确的是（）。","options":{"A":"礼花弹成品、半成品仓库属于1.3级仓库","B":"黑火药、烟火药、开球药仓库属于1.1-1级仓库","C":"1.3级仓库无整体爆炸危险，破坏效应通常局限在建筑内","D":"引火线、水溶剂湿法制引的湿引火线仓库属于1.1-2级仓库"},"images":[],"answer":["C"],"explanation":"","pages":[3],"explanationImages":[{"src":"../assets/0d2280d71d172246d6103da1.png","alt":"原卷第13题解析表格","width":554,"height":244}],"topic":"防火防爆"},{"id":"1-14","paper":1,"number":14,"type":"single","stem":"某化工生产企业编制了危险化学品火灾事故应急预案，提请企业安全管理委员会审议。下列预案条款中，符合危险化学品火灾控制措施中，最为符合现场要求的是（）。","options":{"A":"易燃固体、自燃物品火灾一般采用水和泡沫扑救","B":"甲醇、乙醇等水溶性液体火灾，采用直流水稀释灭火","C":"甲烷、乙烯等气体泄漏火灾，立即启用水雾系统灭火降温","D":"爆炸物品、电石火灾，切忌用沙土盖压灭火以免增加爆炸威力"},"images":[],"answer":["A"],"explanation":"甲醇、乙醇等水溶性液体火灾，采用抗溶性泡沫灭火剂灭火；甲烷、乙烯等气体泄漏火灾，没有封堵措施切忌盲目压灭火焰；爆炸物品切忌用沙土盖压灭火以免增加爆炸威力。","pages":[3],"topic":"危险化学品安全"},{"id":"1-15","paper":1,"number":15,"type":"single","stem":"接地装置是指埋设在地下的接地电极与由该接地电极到设备之间的连接导线的总称，下列关于接地装置的说法中正确的是（）。","options":{"A":"接地体上端离地面深度不应小于0.6 m","B":"接地线与建筑物伸缩缝、沉降缝交叉时，应穿管或用角钢保护","C":"接地线与管道的连接必须采用镀锌件，以防止锈蚀","D":"自然接地体的接地电阻符合要求时，可不敷设人工接地体"},"images":[],"answer":["C"],"explanation":"接地体上端离地面深度不应小于0.6 m（农田地带不应小于1m），并应在冰冻层以下。接地线与建筑物伸缩缝、沉降缝交叉时，应弯成弧状或另加补偿连接件。当自然接地体的接地电阻符合要求时，可不敷设人工接地体（发电厂和变电所除外）。","pages":[3],"topic":"电气安全"},{"id":"1-16","paper":1,"number":16,"type":"single","stem":"危化品的生产经营应严格遵守《中华人民共和国危险化学品安全法》的基本规定，在《危化品经营企业安全技术基本要求》的框架内从事生产经营活动。下列关于危化品经营场所和储存设施的要求中，符合规定的是（）。","options":{"A":"零售业务存放小包装危化品，其总质量不能超过2t","B":"零售业务的店面备货库房应报公安、消防部门批准2","C":"零售业务的店面内生活设施应不小于60m","D":"经营场所应坐落在交通便利的商业区或人口稠密区"},"images":[],"answer":["B"],"explanation":"零售业务存放小包装危化品，其总质量不能超过1t；零售业务的店面备货库房应报公安、消防部门批准；零售业务的店面内不得设有生活设施；经营场所应坐落在交通便利的、便于疏散处。","pages":[3],"topic":"危险化学品安全"},{"id":"1-19","paper":1,"number":19,"type":"single","stem":"通过向爆炸性混合物中加入惰性气体，能有效缩小甚至消除爆炸极限并将混合物冲淡，具有良好的防爆控制效果。以气相空间200L的丙酮储罐（气相含氧量按照20%计算）为例，采用不同惰性介质的最高氧浓度如下表所示，故下列说法中正确的是（）。（结果保留一位小数点）","options":{"A":"二氧化碳的惰化效果优于氮气","B":"采用二氧化碳惰化剂，最低需求量80.0L","C":"采用氮气惰化剂，最低需求量27.0L","D":"惰性气体通过物理阻隔效果对爆炸下限的影响较大"},"images":[{"src":"../assets/b703de9627ee0ce53cf748e7.png","alt":"第1套第19题原卷配图","width":476,"height":102}],"answer":["A"],"explanation":"惰性气体通过物理阻隔效果对爆炸上限的影响较大。采用二氧化碳惰化剂，最低需求量66.7L；采用氮气惰化剂，最低需求量96.3L。储罐气相容积 V0=200L，初始氧浓度 20% 原有氧气体积： VO2=200*20% = 40.0LV充(CO2)=40/0.15−200≈66.7 LV充(N2)=40/0.135−200≈96.3 L","pages":[4],"topic":"防火防爆"},{"id":"1-20","paper":1,"number":20,"type":"single","stem":"烟花爆竹厂房通过合理化布局、平面布置在满足作业需求的同时消减事故损失，是工艺流程本质化设计的关键核心环节之一。因此，下列各项关于布局要求中正确的是（）。","options":{"A":"燃烧、爆炸危险作业宜采取隔离操作，做到小型、分散化设计","B":"临时存药间的最大药量不超过单人半天需用量","C":"1.3级厂房内不应设置除更衣室外的辅助用房","D":"危险品晒场周围应设置防护堤，防护堤顶面应高出地面1m"},"images":[],"answer":["A"],"explanation":"燃烧、爆炸危险作业宜采取隔离操作，做到小型、分散化设计；临时存药间的最大药量不超过单人半天需用量且不应超过10Kg ；1.1级厂房内不应设置除更衣室外的辅助用房，1.3级厂房内可设置生产辅助用室（类似工器具室等）；危险品晒场周围应设置防护堤，防护堤顶面应高出产品面1m。","pages":[4],"topic":"防火防爆"},{"id":"1-21","paper":1,"number":21,"type":"single","stem":"气瓶充装的整体工艺布置应符合《气瓶充装站安全技术条件》的规定，通过建筑特性、充装工艺的衔接配合保证充装作业的安全。因此，下列说法中（）符合其安全控制要求。","options":{"A":"充装设备、管道和阀件应选用与充装介质特性不相容的材料","B":"充装氮气、氩气及窒息性气体的缺氧危险场所严禁封闭作业","C":"充装气体过程中，操作人员应远离放空口，避免造成冻伤","D":"充装中发现泄漏，应沿气流方向先关气瓶阀、再关汇流排阀门"},"images":[],"answer":["B"],"explanation":"充装设备、管道和阀件应选用与充装介质特性不相容的材料，A选项是教材原文但是不满足规范要求；充装氮气、氩气及窒息性气体的缺氧危险场所严禁封闭作业；充装冷冻液化气体过程中，操作人员应远离放空口，避免造成冻伤；充装中发现泄漏，应沿气流方向先关汇流排阀门、再关气瓶阀。","pages":[4],"topic":"特种设备安全"},{"id":"1-22","paper":1,"number":22,"type":"single","stem":"兼用于防止间接接触电击和直接接触电击的剩余电流动作保护装置，通常作为附加保护措施防止触电事故、相对地故障。综上所述，下列关于剩余电流保护装置的运行要求中，符合规定的是（）。","options":{"A":"额定动作电流大于30mA的保护装置，作为触电防护附加措施","B":"TN-C系统中装设高灵敏度、快速型剩余电流动作保护装置","C":"采用剩余电流动作保护装置时应装设保护接地导体","D":"确保安全、消防设备的电源可以不安装剩余电流动作保护装置"},"images":[],"answer":["C"],"explanation":"对于公共场所的通道照明电源和应急照明电源、消防用电梯及确保公共场所安全的电气设备、用于消防设备的电源、用于防盗报警的电源（消防、安防电源），应装设不切断电源的报警式剩余电流动作保护装置。作为电击防护附加措施时，额定剩余动作电流不应大于30mA；采用剩余电流动作保护装置时应装设保护接地导体。","pages":[4,5],"topic":"电气安全"},{"id":"1-25","paper":1,"number":25,"type":"single","stem":"电气引火源按照引燃形式可分为电气装置的危险温度和发生在可燃物上的电火花和电弧，其中的电弧、电火花则可细分为工作火花和事故火花。针对上述情景，下列说法中正确的是（）。","options":{"A":"控制开关、断路器、熔断器的火花属于工作火花","B":"电机转动部件与其他部件相碰产生火花不属于电火花","C":"直流电机电刷与换向器滑动接触处的火花属于工作火花","D":"连接点松动断开、插销拔插时的火花属于事故火花"},"images":[],"answer":["C"],"explanation":"控制开关、断路器的火花属于工作火花，但是熔断器断开的火花事故事故火花；电机转动部件与其他部件相碰产生火花属于事故火花；直流电机电刷与换向器滑动接触处的火花属于工作火花；连接点松动断开属于事故火花、插销拔插时的火花属于工作火花。","pages":[5],"topic":"电气安全"},{"id":"1-26","paper":1,"number":26,"type":"single","stem":"粉尘爆炸形成的闪爆瞬时温度高于气体爆炸，极易导致现场作业人员体表的深度烧伤，治愈难度和生理痛苦偏高。下列爆炸过程中所表现出的各种特性，属于粉尘爆炸的特征表现是（）。","options":{"A":"促使温度上升的传热方式主要是热辐射","B":"粒度对粉尘爆炸压力上升速率的影响比压力大得多","C":"悬浮性爆炸性扬尘、更强的点火源能量","D":"具有产生二次爆炸的潜在可能性"},"images":[],"answer":["D"],"explanation":"促使温度上升的传热方式主要是热辐射，选项A属于粉尘爆炸过程中的热传递方式；粒度对粉尘爆炸压力上升速率的影响比压力大得多，属于粉尘爆炸的影响因素；悬浮性爆炸性扬尘、更强的点火源能量，属于粉尘爆炸的基本条件；具有产生二次爆炸的潜在可能性，属于粉尘爆炸的特征特点。","pages":[5],"topic":"防火防爆"},{"id":"1-27","paper":1,"number":27,"type":"single","stem":"参照《危险化学品仓库储存通则》，采用隔离、隔开、分离储存对危险化学品进行储存是保证安全储存的基本要求。某危化品企业主要储存介质如下表所示，依据储存情况下列方式方法中符合规定的是（）。","options":{"A":"烯丙醇、苯应分离储存","B":"甲醇、苯应实行双人收发、双人保管制度","C":"烯丙醇、甲醇和苯应将储存方式、流向及用途备案","D":"烯丙醇应在专用仓库内单独存放"},"images":[{"src":"../assets/99872313de0895f58ec57269.png","alt":"第1套第27题原卷配图","width":603,"height":128}],"answer":["D"],"explanation":"烯丙醇应分离储存，故A选项不满足要求；烯丙醇、甲醇应实行双人收发、双人保管制度，故B选项不对；烯丙醇、甲醇和苯应将储存地点、储存数量、流向及管理人员的情况报相关部门备案。","pages":[5],"topic":"危险化学品安全"},{"id":"1-28","paper":1,"number":28,"type":"single","stem":"针对某在用的金属压力容器进行定期安全状况的分级检查中发现：①技术资料基本齐全，设计制造基本符合要求；②存在部分焊缝体积性超标缺陷，但未发现扩展趋势；③密封面对接焊缝存在延展性裂纹等线性焊接缺陷，需限时间内减负荷运行。针对上述情况，针对压力容器的安全状况分级和检验周期的说法均满足要求的是（）。","options":{"A":"安全状况3级，一般每3年至6年检验一次","B":"安全状况4级，监控使用，其检验周期由检验机构确定","C":"安全状况4级，累计监控使用时间不得超过1年","D":"安全状况5级，应当对缺陷进行处理，否则不得继续使用"},"images":[],"answer":["B"],"explanation":"密封面对接焊缝存在延展性裂纹等线性焊接缺陷，需短时间内减负荷运行属于安全状况4级，监控使用，其检验周期由检验机构确定，累计监控使用时间不得超过3年。","pages":[5,6],"topic":"特种设备安全"},{"id":"1-29","paper":1,"number":29,"type":"single","stem":"为保证起重机械操作使用安全，起重机安全装置按照其结构特点及配置特性包括通用性安全装置、专属安全装置和电气控制类安全装置。下列各项关于安全装置的说法中，（）符合规范要求。","options":{"A":"对重下方设有人可以到达的空间，则应当配备缓冲器","B":"动臂的支持制动器与动臂变幅机构之间，应设联锁保护装置","C":"安装在吊笼、端部止挡上的防坠安全器由超速直接触发","D":"液压变幅的起重机，装设臂架低位置和高位置的幅度限位器"},"images":[],"answer":["B"],"explanation":"对重下方设有人可以到达的空间，则应当配备防坠安全器；防坠安全器或其制停装置应当安装在吊笼上并由吊笼超速来直接触发；动力驱动的动臂变幅的起重机（液压变幅除外），应当在臂架俯仰行程的极限位置处装设臂架低位置和高位置的幅度限位器。","pages":[6],"topic":"特种设备安全"},{"id":"1-32","paper":1,"number":32,"type":"single","stem":"起重作业前通过作业面的危险辨识分析，选择合适的吊具吊索、确认吊装固定点并据此制定作业方案和应急预案是作业基本要求。查阅作业方案，下列的操作技术中符合规范要求的是（）。","options":{"A":"对吊物的质量和重心进行受力计算，严禁目测估算","B":"应有专人负责吊装指挥，严禁多人吊挂同一重物","C":"选择合适的吊装固定点，被吊重物和吊装绳夹角不应大于30°","D":"吊装过程中应保持钢丝绳垂直，保持运行同步"},"images":[],"answer":["D"],"explanation":"对吊物的质量和重心进行受力计算，目测估算应增加20%选择吊具吊索；多人吊挂同一被吊重物，应有专人负责指挥协调；选择合适的吊装固定点，被吊重物和吊装绳夹角不应小于30°，防止吊装绳断裂。","pages":[6],"topic":"特种设备安全"},{"id":"1-35","paper":1,"number":35,"type":"single","stem":"《危险货物运输包装通用技术条件》规定危险货物包装分级、基本要求、性能试验和校验方法，下列针对危险货物的包装要求中，符合规定的是（）。","options":{"A":"爆炸物质严禁使用双重卷边接合的钢桶、金属桶","B":"危险性较大的放射性物质，应选用Ⅰ类包装","C":"复合包装应紧密贴合，外包装不得有擦伤内容器的突出物","D":"危险性中等的乙酸乙酯等易燃液体，可采用Ⅱ类、Ⅲ类包装"},"images":[],"answer":["C"],"explanation":"危化品包装中的Ⅰ、Ⅱ和Ⅲ类包装不能盛载放射性物质；危险性中等的乙酸乙酯等易燃液体，可采用Ⅰ类、Ⅱ类包装；复合包装应紧密贴合，外包装不得有擦伤内容器的突出物；爆炸物质使用双重卷边接合的钢桶、金属桶，应能防止爆炸物进入缝隙。","pages":[7],"topic":"危险化学品安全"},{"id":"1-37","paper":1,"number":37,"type":"single","stem":"人机系统中的人工操作系统、半自动化系统，依照人机特性差异实现功能性分配是系统稳定运行的基础条件。因此，下列各项人机特性的说法中正确的是（）。","options":{"A":"机械的操作精度和刺激的感受阈值高，擅长于精细调整","B":"机械具有多种信息接收通道对特定信息的感受能力较高","C":"人具有高度灵活性、稳定性和可塑性，灵活的处理问题","D":"人具有良好的优化决策能力，具备学习能力并适应环境"},"images":[],"answer":["C"],"explanation":"机械的操作精度和刺激的感受阈值高，但不擅长于精细调整；机械对特定信息的感受能力较高；人具有高度灵活性和可塑性，能灵活的处理问题。","pages":[8],"topic":"机械与人机安全"},{"id":"1-40","paper":1,"number":40,"type":"single","stem":"安全阀、爆破片是防爆泄压设施的主要应用形式，参照《承压类特种设备安全附件安全技术规程》、《安全阀安全技术监察规程》等规范，下列说法中正确的是（）。","options":{"A":"微启式安全阀适用于排放气体、蒸汽和液体介质","B":"排放有毒或者可燃性介质时必须选用封闭式安全阀","C":"杠杆式安全阀对振动、高温敏感性高，不适于持续运行的系统","D":"弹簧式安全阀应结构紧凑、灵敏度高，有利于阀的迅速开启"},"images":[],"answer":["B"],"explanation":"全启式安全阀适用于排放气体、蒸汽和液体介质；杠杆式安全阀对振动敏感性高，不适于持续运行的系统；弹簧式安全阀应结构紧凑、灵敏度高，不利于阀的迅速开启。","pages":[8],"topic":"特种设备安全"},{"id":"1-41","paper":1,"number":41,"type":"single","stem":"金属切削机床按照应用及相关危险，可分为1类、2类、3类和4类机床。下列关于2类机床的定义及特征描述中，正确的是（）。","options":{"A":"2类机床必须配置手动模式和自动模式","B":"2类机床选配手动模式、具有手动干预的自动模式和服务模式","C":"2类机床具备自动程序启动、自动换刀、无限速轴向运动特征","D":"2类机床所有运动的启动和控制由操作者完成"},"images":[],"answer":["A"],"explanation":"2类机床属于具有有限数控功能的手动机床，必须配置手动模式和自动模式，选配设置模式、具有手动干预的自动模式和服务模式。","pages":[8],"topic":"机械与人机安全"},{"id":"1-43","paper":1,"number":43,"type":"single","stem":"某专用设备采用如下供电保护方式，参照图示并结合规范要求，下列说法定义中正确的是（）。","options":{"A":"接地电阻1称作工作接地电阻、PE线称作保护接地中性导体","B":"重复接地电阻2具有分流作用，能有效改善电网的防雷性能","C":"保护接地电阻2具有分压作用，能有效降低故障时对地电压","D":"重复接地电阻2具有保护作用，能有效减小PE线断开故障率"},"images":[{"src":"../assets/dc73cffa5e6c114ac5da6593.jpg","alt":"第1套第43题原卷配图","width":660,"height":427}],"answer":["B"],"explanation":"接地电阻1称作工作接地电阻、PE线称作保护接地导体；重复接地电阻2具有分流作用能有效改善电网的防雷性能，重复接地电阻2具有分压作用能有效降低故障时对地电压，重复接地电阻2具有保护作用能有效减小PE线断开的危险性。","pages":[9],"topic":"电气安全"},{"id":"1-45","paper":1,"number":45,"type":"single","stem":"甲基对硫磷呈粘稠状，剧毒液体具有轻微刺激性（非腐蚀性危险化学品），曾广泛应用于农业、林业领域，属于典型的Ⅰa类农药。下列针对甲基对硫磷泄漏、中毒的现场急救措施，正确的是（）。","options":{"A":"口服引起急性中毒不宜洗胃，采用蛋清、牛奶或氢氧化铝灌服","B":"采用大量清水或解毒剂冲洗被化学品污染的体表皮肤","C":"呼吸摄入导致急性中毒，应立即嘴对嘴人工呼吸或呼吸氧气","D":"抢救抬运过程中，应松开患者衣服、腰带并使其仰卧"},"images":[],"answer":["D"],"explanation":"甲基对硫磷不具备腐蚀性，可采用洗胃消解毒性催吐；粘稠状剧毒液体应采用肥皂水冲洗被化学品污染的体表皮肤；呼吸摄入导致急性中毒，应立即呼吸氧气保持呼吸畅通。","pages":[9],"topic":"危险化学品安全"},{"id":"1-51","paper":1,"number":51,"type":"single","stem":"参照规范《固定式压力容器安全技术监察规程》将压力容器分为Ⅰ类、Ⅱ类和Ⅲ类，下列关于压力容器分类的说法定义中，符合规定的是（）。","options":{"A":"通过介质特性、设计压力、设计温度和容积，确定容器类别","B":"承载介质为氢气的压力容器，不可能划分为Ⅰ类压力容器","C":"承载介质为氮气的压力容器，不可能划分为Ⅰ类压力容器","D":"设计压力不足0.1Mpa的容器，划分为Ⅰ类压力容器"},"images":[],"answer":["B"],"explanation":"通过介质特性、设计压力和容积，确定容器类别，设计压力不足0.1Mpa的容器不属于压力容器；此外，承载介质为氢气的压力容器，由于氢气属于第一类介质因此不可能划分为Ⅰ类压力容器。","pages":[10],"topic":"特种设备安全"},{"id":"1-52","paper":1,"number":52,"type":"single","stem":"场内专用机动车辆的安全管理在国内起步较晚，对其的技术标准、检验要求、管理规定体系并不健全，因此对现场带来极大隐患。参照某企业的场内机动车辆操作技术管理规定，下列说法中正确的是（）。","options":{"A":"观光车启动前，应告知乘客不应离开座位","B":"内燃机动力叉车，严禁在易燃、易爆仓库内作业","C":"观光车起步时，方向盘严禁处在极限位置","D":"物件超载时，将物件叉离地面100mm检查稳定性无误后运送"},"images":[],"answer":["B"],"explanation":"观光车行驶过程中，应告知乘客不应离开座位；观光车起步时，方向盘不应处在极限位置（特殊情况除外）；物件重量不清时，将物件叉离地面100mm检查稳定性无误后运送。","pages":[10,11],"topic":"特种设备安全"},{"id":"1-53","paper":1,"number":53,"type":"single","stem":"气瓶附件是气瓶的重要组成部分，对气瓶安全起着非常重要的作用，包括瓶阀、瓶帽、保护罩、安全泄压装置等。依照规范要求，下列关于气瓶附件的说法正确的是（）。","options":{"A":"瓶帽是装在气瓶顶部的帽罩式保护附件，也可兼作提升零件","B":"采用铸铁制造的瓶帽和保护罩，应当具有良好的抗撞击性能","C":"盛装易燃气体的瓶阀非金属密封材料，具有阻燃性和抗老化性","D":"工业用非重复充装焊接钢瓶应当装设爆破片"},"images":[],"answer":["D"],"explanation":"瓶帽是装在气瓶顶部的帽罩式保护附件；瓶帽和保护罩不得用铸铁制造；盛装氧气或强氧化性气体的瓶阀非金属密封材料，具有阻燃性和抗老化性。","pages":[11],"topic":"特种设备安全"},{"id":"1-54","paper":1,"number":54,"type":"single","stem":"气瓶泄压装置的主要作用（甚至是唯一作用）是保护气瓶在遇到周围发生火灾时，不会因瓶体受热、瓶内温度升高过快而造成气瓶爆炸。下列关于安全泄压装置的要求、类型的说法中，正确的是（）。","options":{"A":"盛装高压有毒气体的气瓶应当选用爆破片-易熔合金塞复合装置","B":"盛装剧毒气体、自燃气体的气瓶，应采用爆破片而不宜用安全阀","C":"爆破片-易熔合金塞复合装置的爆破片，应当置于合金塞排放侧","D":"燃气气瓶、氧气、氮气及惰性气体气瓶，禁止装设泄压装置"},"images":[],"answer":["A"],"explanation":"盛装高压有毒气体的气瓶应当选用爆破片-易熔合金塞复合装置；盛装剧毒气体、自燃气体的气瓶，禁止装设泄压装置；爆破片-易熔合金塞复合装置的易熔合金塞，应当置于爆破片排放一侧；燃气气瓶、氧气、氮气及惰性气体气瓶，一般不装设安全泄压装置。","pages":[11],"topic":"特种设备安全"},{"id":"1-55","paper":1,"number":55,"type":"single","stem":"烟花爆竹工厂的安全距离实际上是危险性建筑物和周围建筑物之间的最小允许距离，包括内部距离和外部距离。参照规范《烟花爆竹工程设计安全标准》的有关规定，下列说法中正确的是（）。","options":{"A":"防护屏障内的危险品药量应计入该屏障内的建筑物的计算药量","B":"采取分隔防护不会同时爆炸燃烧时，计算药量分别计算取均值","C":"防护屏障内的周转药量、临时停滞药量，不计入建筑计算药量","D":"任意情况下，抗爆间室的药量不计入建（构）筑物的计算药量"},"images":[],"answer":["A"],"explanation":"防护屏障内的危险品药量应计入该屏障内的建筑物的计算药量；危险性建（构）筑物中抗爆间室的药量可不计入建（构）筑物的计算药量，但该建（构）筑物的计算药量不应小于其中一个抗爆间室内的最大药量；当危险性建（构）筑物内已采取分隔防护措施，危险品相互间不会引起同时爆炸或燃烧时，计算药量可分别计算取最大值。上述定义中对计算药量的定义是：在危险性场所允许存放（滞留）的最大药物质量（含半成品、成品中的药物质量），因此计算药量和停滞药量规定实际上都是烟花爆竹生产建（构）筑物中暂时搁置时允许存放的最大药量。","pages":[11],"topic":"防火防爆"},{"id":"1-56","paper":1,"number":56,"type":"single","stem":"危险化学品所表现出的中毒窒息作用按照对人体机能影响因素，应细化为单纯窒息、血液窒息和细胞内窒息。下列说法中，属于典型的血液窒息特点及致害因素的是（）。","options":{"A":"环境氧含量不足致使供氧能力缺失导致的昏迷、甚至死亡","B":"典型的血液窒息性物质就是一氧化碳","C":"影响机体细胞和氧气结合能力所导致的昏迷、甚至死亡","D":"典型的血液窒息性物质就是氮气、硫化氢和氰化氢"},"images":[],"answer":["B"],"explanation":"环境氧含量不足致使供氧能力缺失导致的昏迷、甚至死亡，属于单纯物理窒息；影响机体细胞和氧气结合能力所导致的昏迷、甚至死亡，属于细胞内窒息；典型的血液窒息性物质就是一氧化碳，硫化氢和氰化氢属于典型的细胞内窒息致害物。","pages":[11],"topic":"危险化学品安全"},{"id":"1-57","paper":1,"number":57,"type":"single","stem":"塔器吊装作业中作业人员发现被吊重物重心偏移、长径比较大、吊钩变形开口量过大，按照原吊装作业方案难以实现被吊重物的固定、改变吊装固定点又会导致吊装绳夹角偏大。针对上述情景，下列说法正确的是（）。","options":{"A":"偏载、吊装绳夹角偏大都可能导致脱绳事故","B":"经负责人同意后，选择具有同等承载能力的钢丝绳","C":"协同负责人、监护人共同编写新的吊装作业方案","D":"吊钩变形开口量过大可能导致脱钩事故"},"images":[],"answer":["D"],"explanation":"偏载可能导致脱绳事故、吊装绳夹角偏大导致断绳事故、吊钩变形开口量过大可能导致脱钩事故；协同负责人、作业单位共同编写新的吊装作业方案，选择具有同等承载能力的钢丝绳。","pages":[11],"topic":"特种设备安全"},{"id":"1-58","paper":1,"number":58,"type":"single","stem":"移动式和手持式电动工具，通常没有具体的工作，依靠操作者手持把控操纵，实际上具有更高的触电危险。下列关于移动式、手持式电动工具的安全使用要求，正确的是（）。","options":{"A":"绿线、黄线在任何情况下只能用作保护接地导体","B":"移动式电气设备的保护线应单独敷设","C":"一般场所，手持电动工具应采用Ⅱ类设备","D":"在插头、插座内用导线直接将保护接地极与中性线连接"},"images":[],"answer":["C"],"explanation":"Ⅰ类设备采用剩余电流动作保护装置、隔离变压器等保护措施，绿/黄双色线在任何情况下只能用作保护接地导体；移动式电气设备的保护线不应单独敷设，而应当与电源线有同样的防护措施，即采用带有保护芯线的橡皮套软线作为电源线。","pages":[11,12],"topic":"电气安全"},{"id":"1-62","paper":1,"number":62,"type":"single","stem":"双线往复式客运架空索道通过双牵引承载系统，能极大提高运载效率和承载阈值，在城市跨区域（跨江、喀斯特地貌）架空索道中具有广泛应用。因此，下列关于其安全装置的各项说法中，正确的是（）。","options":{"A":"承载索两端锚固的索道，应采用可测固定的双重锚固装置","B":"应设有牵引索断裂以及双牵引索道速度差、长度差检测开关","C":"设置超速检测开关，未按设计减速或低速进站时自动紧急停车","D":"定员大于15人和运行速度大于3m/s索道吊架与小车间设减震措施"},"images":[],"answer":["B"],"explanation":"承载索两端锚固的索道，应采用可测可调的双重锚固装置；吊架与车厢连接处应有减震措施。车厢定员大于15人和运行速度大于3m/s索道客车吊架与运行小车之间应设减摆器。应设有进站速度检测开关，当索道减速后，应能按设定减速曲线可靠减速至低速进站，若未按设计减速或设定的低速进站时，检测开关控制自动紧急停车。","pages":[12],"topic":"特种设备安全"},{"id":"1-63","paper":1,"number":63,"type":"single","stem":"长输油气管道的天然气增压气站，通过增压补偿管道内介质的压力损耗确保天然气能按时、足量的输送至目标设置点。针对天然气增压期间的检查中发现下列情况，其中（）符合规范要求。","options":{"A":"探测器的安装高度距地面0.3~0.6m","B":"探测器所接电线采用非屏蔽双绞线","C":"探测器报警设定值为可燃气体爆炸下限20%","D":"探测器具有形式检验标识、消防产品型式认证"},"images":[],"answer":["C"],"explanation":"天然气相对密度比空气轻，探测器应在释放源上方2.0m内，报警设定值为可燃气体爆炸下限20%；此外，探测器所接电线应采用三芯屏蔽线防止强弱电干扰，并具有型式检验标识、消防产品型式认证和防爆合格证。","pages":[12],"topic":"特种设备安全"},{"id":"1-65","paper":1,"number":65,"type":"single","stem":"金属型铸造相较于砂型铸造能显著提升铸件的机械性能、尺寸精度和表面质量，同时兼具高生产率和环境友好等综合优势。但是，高昂的初始成本、严苛的工艺及安全要求却也带来显著的局限性。下列各项关于金属型铸造设备的要求，符合规定的是（）。","options":{"A":"冷室压铸机应有合模到位和扣嘴到位的两个独立的回路元件","B":"低压、差压铸造机动模机构应设置反向安全锁机构","C":"热室压铸机应设置敏感保护设备，并与开模、合模控制程序联锁","D":"离心铸造机应设置防止浇注嘴在浇注过程中移位的装置"},"images":[],"answer":["D"],"explanation":"冷室压铸机熔融金属给料装置的危险区域应设置单独的防护装置；防护装置能打开的部件应与控制系统联锁。热室压铸机应至少通过一个防护装置防止喷嘴与模具间熔融金属的飞溅；应有合模到位和扣嘴到位的两个独立的回路元件，确保系统出现故障时压射过程不能发生。差压铸造机的动模机构应设置反向安全锁机构。低压、差压铸造机动模机构应设置自锁装置，动模停止运行时应自动锁定。离心铸造机应防止因离心力导致模具脱开和防止管模从托轮上脱出或掉落的措施；应设置模具旋转时可能产生熔融金属飞溅的防护装置；应设置防止浇注嘴在浇注过程中移位的装置。","pages":[13],"topic":"机械与人机安全"},{"id":"1-67","paper":1,"number":67,"type":"single","stem":"防雷技术主要考虑雷电特性所导致的直击雷防护、二次放电防护、感应雷防护和雷电冲击波防护等。因此，下列各项关于二次放电防护的应用方式中，符合规范要求的是（）。","options":{"A":"设备间距不能满足要求时，应予跨接进行等电位联结","B":"第一类防雷建筑物防止二次放电的最小距离不得小于2m","C":"第二类防雷建筑物防止二次放电的最小距离不得小于3m","D":"避雷针、避雷线、避雷带和避雷网是二次放电防护的主要措施"},"images":[],"answer":["A"],"explanation":"避雷针、避雷线、避雷带和避雷网是直击雷的主要措施；第一类防雷建筑物防止二次放电的最小距离不得小于3m、第二类防雷建筑物防止二次放电的最小距离不得小于2m，设备间距不能满足要求时，应予跨接进行等电位联结。","pages":[13],"topic":"电气安全"},{"id":"1-69","paper":1,"number":69,"type":"single","stem":"气瓶的公称工作压力是气瓶试验压力的取值基础，下列关于公称压力确定原则的说法中正确的是（）。","options":{"A":"压缩气体气瓶，基准温度（60℃）下完全均匀状态的限定压力","B":"高压液化气瓶，60℃时气瓶内气体压力的上限值","C":"溶解气体气瓶，20℃时化学、物理达到平衡条件下的静置压力","D":"低温绝热气瓶，内胆底部气相空间可能达到的最高压力"},"images":[],"answer":["B"],"explanation":"压缩气体气瓶，基准温度（20℃）下完全均匀状态的限定压力；高压液化气瓶，60℃时气瓶内气体压力的上限值；溶解气体气瓶，15℃时化学、物理达到平衡条件下的静置压力；低温绝热气瓶，内胆顶部气相空间可能达到的最高压力。","pages":[13],"topic":"特种设备安全"},{"id":"1-70","paper":1,"number":70,"type":"single","stem":"某企业拟新增燃油锅炉并入原热电装置，保障低压蒸汽供应的同时提高再热蒸汽量用于电能负荷。打开蒸汽管道并炉期间，液位计显示汽水界面上下翻腾并呈现蒸汽带水的情景。针对上述异常工况，下列各项说法中正确的是（）。","options":{"A":"满水事故，应打开省煤器再循环管道并减弱燃烧","B":"汽水共腾，应全开连续排污阀、打开定期排污阀并同时上水","C":"汽水共腾，推测由于蒸炉、煮炉不到位所致","D":"汽水共腾，应关小蒸汽阀开度并加强过热器、蒸汽管道疏水第2题 多选题 （每题2分，共15题，共30分）"},"images":[],"answer":["D"],"explanation":"液位计显示汽水界面上下翻腾并呈现蒸汽带水的情景，属于典型的汽水共腾事故；事故发生在打开蒸汽管道并炉期间，推测由于压力下降过快所导致，应关小蒸汽阀开度并加强过热器、蒸汽管道疏水。","pages":[13,14],"topic":"特种设备安全"},{"id":"1-71","paper":1,"number":71,"type":"multiple","stem":"触电事故按照带电体的形式包括直接接触电击、间接接触电击，下列的技术措施对直接接触电击、间接接触电击都能起到有效防护效果的是（）。","options":{"A":"电气隔离和不导电环境","B":"系统接地（IT、TT和TN供电保护）","C":"双重绝缘","D":"特低电压","E":"剩余电流动作保护装置"},"images":[],"answer":["D","E"],"explanation":"电气隔离和不导电环境、系统接地和双重绝缘，主要防止间接接触电击的技术措施；特低电压、剩余电流动作保护装置属于兼用于直接接触电击、间接接触电击的有效措施。","pages":[14],"topic":"电气安全"},{"id":"1-72","paper":1,"number":72,"type":"multiple","stem":"某企业电气设备采用如下供电保护方式，参照规范及安全技术要求，下列说法正确的是（）。","options":{"A":"属于TN-S供电保护方式，适用于火灾爆炸危险性较大的作业面","B":"电气设备外露可导电部分与电源端接地点有直接电气连接","C":"系统中不存在保护接地中性导体","D":"电源侧中性点接地Rm属于工作接地电阻","E":"系统不能降低故障电压，通过剩余电流保护装置速断实现防护"},"images":[{"src":"../assets/fa62b6dcb3c176686de85736.jpg","alt":"第1套第72题原卷配图","width":942,"height":566}],"answer":["B","D"],"explanation":"属于TN-C-S供电保护方式，适用于非生产性楼房，存在保护接地中性导体（PEN线）；电气设备外露可导电部分与电源端接地点有直接电气连接；电源侧中性点接地Rm属于工作接地电阻；系统能降低故障电压，并通过剩余电流保护装置速断实现防护。","pages":[14],"topic":"电气安全"},{"id":"1-73","paper":1,"number":73,"type":"multiple","stem":"低压配电柜和配电箱是低压成套电气，实现分配电能和保护电路的作用。加油加气站检修作业设置如下图所示室外落地式配电箱（触电危险性大），检查中发现的情况符合规定的是（）。","options":{"A":"箱柜采用不可燃材料制作","B":"高度h2距地面1.3m","C":"高度h1距地面100mm","D":"采用封闭式箱柜","E":"孔洞及电缆管封堵严密"},"images":[{"src":"../assets/20b081438786988ac701704a.jpg","alt":"第1套第73题原卷配图","width":448,"height":244}],"answer":["A","B","D","E"],"explanation":"箱柜采用不可燃材料制作，孔洞及电缆管封堵严密，箱柜分别设置中性导体和保护接地导体汇流排；落地式配电箱的底部应抬高，室外不应低于200mm，故C选项不符合规定。","pages":[14,15],"topic":"电气安全"},{"id":"1-75","paper":1,"number":75,"type":"multiple","stem":"砂轮机借助砂轮的切削作用去除工件表面的多余层，使工件结构尺寸和表面质量达到设置预定要求。但是，由于作业特点和设备特征确实存在潜在机械致害危险。因此，下列关于砂轮机特点描述及安全要求的说法，正确的是（）。","options":{"A":"砂轮运动速度高、结构强度大导致机械致害是最严重伤害类型","B":"砂轮圆周表面和可调护板边缘之间的间隙应小于6mm","C":"无法校验特性的砂轮，经过静平衡、音响检查后方可使用","D":"砂轮与托架台面之间的距离不超过3mm，调整后应紧固","E":"顶部磨削用砂轮防护罩使用中心线水平以上部分，顶部最大开口不准超过60°"},"images":[],"answer":["B","E"],"explanation":"砂轮运动速度高、结构强度低导致机械致害是最严重伤害类型；砂轮圆周表面和可调护板边缘之间的间隙应小于6mm；无法校验特性的砂轮，不可使用；砂轮与工件托架之间的距离应小于被磨工件最小外形尺寸的1/2，最大不准超过 3 mm，调整后应紧固；顶部磨削用砂轮防护罩在使用砂轮中心线水平面以上部分时，防护罩顶部最大开口角度不准超过 60°。","pages":[15],"topic":"机械与人机安全"},{"id":"1-76","paper":1,"number":76,"type":"multiple","stem":"锅炉作为现代工业体系中最成熟、常见的供能热传递装置，近期爆炸事故频发，暴露出特种设备安全管理的困局—自动化热工仪表虽能保障运行安全稳定，但作业人员的疏忽、安全意识淡薄及能力不足已成为明显短板。因此，下列紧急停炉处置准则中的说法，正确的是（）。","options":{"A":"操作顺序：停止燃料供应、停止送风、停止引风","B":"注意事项：逐渐降低锅炉燃烧热负荷，关闭锅炉上水","C":"注意事项：紧急停炉的4~6h内，应紧闭炉门和烟道挡板","D":"严禁命令：缺水导致的紧急停炉，严禁给锅炉上水","E":"注意事项：较快降压并更换锅水，冷却至70℃左右允许排水"},"images":[],"answer":["D","E"],"explanation":"紧急停炉的操作次序是：立即停止添加燃料和送风，减弱引风；同时，设法熄灭炉膛内的燃料；灭火后即把炉门、灰门及烟道挡板打开，以加强通风冷却；锅内可以较快降压并更换锅水，锅水冷却至70℃左右允许排水。因缺水紧急停炉时，严禁给锅炉上水。","pages":[15],"topic":"特种设备安全"},{"id":"1-77","paper":1,"number":77,"type":"multiple","stem":"参照规范《机器人 安全要求应用规范》，机器人应设置保护性停止和独立的急停功能并与外部保护装置连接。下列关于机器人的急停功能的说法定义，符合规范要求的是（）。","options":{"A":"急停功能的复位采用手动或控制逻辑自动方式复位","B":"急停确定选择0类或1类停止功能的作用","C":"急停控制优先于机器人的其他控制","D":"急停电路本身的复位应启动机器人的任何运动","E":"急停信号能撤除机器人驱动器的动力"},"images":[],"answer":["B","C"],"explanation":"急停功能的复位采用手动方式复位；急停确定选择0类或1类停止功能的作用；急停控制优先于机器人的其他控制；急停电路本身的复位不应启动机器人的任何运动；急停信号能切断机器人驱动器的动力。","pages":[15,16],"topic":"机械与人机安全"},{"id":"1-78","paper":1,"number":78,"type":"multiple","stem":"高压开关柜应有足够的结构强度并装设必须得安全联锁装置，通过强制性的技术方法防止错误操作，典型的安全联锁形式包括机械式联锁、电磁式联锁。下列各项属于开关柜具备的联锁“五防”功能的是（）。","options":{"A":"断路器处于断开位置才能操作隔离开关","B":"防止合闸送电前拆除临时接地线或拉开隔离开关","C":"防止断开电源前挂临时接地线或合上接地隔离开关","D":"防止断路器在合闸状态移动手车","E":"保证断路器、隔离开关未断开前，开关柜的门不能打开"},"images":[],"answer":["A","D","E"],"explanation":"断路器处于断开位置才能操作隔离开关；防止合闸送电前未拆除临时接地线或未拉开隔离开关；防止未断开电源前挂临时接地线或合上接地隔离开关；防止断路器在合闸状态移动手车；保证断路器、隔离开关未断开前，开关柜的门不能打开。","pages":[16],"topic":"电气安全"},{"id":"1-79","paper":1,"number":79,"type":"multiple","stem":"移动式压力容器转运毒性程度为极度、高度危害或腐蚀性介质，应采用爆破片—安全阀串联泄压装置保护承压设备，并将爆破片设置在安全阀入口侧。针对上述泄压型式，下列说法中正确的是（）。","options":{"A":"爆破片破裂后的泄压面积应大于安全阀的进口截面积","B":"爆破片在爆破时不应产生碎片、脱落或火花","C":"爆破片应设置在距离安全阀入口侧5倍管径内","D":"安全阀与爆破片之间存在背压时，安全阀仍能正常开启","E":"容器内的介质应是洁净的，不含胶着物质或阻塞物质"},"images":[],"answer":["A","B","C"],"explanation":"采用爆破片—安全阀串联泄压装置保护承压设备，并将爆破片设置在安全阀入口侧，爆破片破裂后的泄压面积应大于安全阀的进口截面积；爆破片在爆破时不应产生碎片、脱落或火花；爆破片应设置在距离安全阀入口侧5倍管径内。","pages":[16],"topic":"特种设备安全"},{"id":"1-80","paper":1,"number":80,"type":"multiple","stem":"危险化学品按照其危险特性分为物理危险、健康危险和环境危害三大类，熟悉危险化学品的分类划分在生产、储运环节至关重要。下列危险化学品，（）归属于物理危险。","options":{"A":"自反应物质和混合物","B":"皮肤腐蚀物","C":"危害臭氧层","D":"有机过氧化物","E":"吸入危害"},"images":[],"answer":["A","D"],"explanation":"自反应物质和混合物、有机过氧化物属于物理危险；皮肤腐蚀物、吸入危害属于健康危险；危害臭氧层属于环境危害。","pages":[16],"topic":"危险化学品安全"},{"id":"1-81","paper":1,"number":81,"type":"multiple","stem":"按照NFPA、FNSPF、消防安全协会的解读，火灾扑救前熟悉着火物种类、数量并进行辨识分类，是消防应急救援人员的基础能力。下列火灾划分中，正确的是（）。","options":{"A":"液氨、液化石油气泄漏火灾，属于C类火灾","B":"沥青、石蜡火灾，属于B类火灾","C":"碳化钙、镁铝合金火灾，属于D类火灾","D":"电缆仓库火灾，属于E类火灾","E":"电动车自燃火灾，同时具有A类火灾、D类火灾和E类火灾"},"images":[],"answer":["A","B"],"explanation":"液氨、液化石油气泄漏火灾，属于C类火灾；沥青、石蜡火灾，属于B类火灾；镁铝合金火灾，属于D类火灾；电缆仓库火灾，属于A类火灾；电动车自燃火灾，同时具有A类火灾、B类火灾和E类火灾。","pages":[16],"topic":"防火防爆"},{"id":"1-82","paper":1,"number":82,"type":"multiple","stem":"木工圆锯机以圆锯片对木材进行锯切加工，通过锯片和轴的配合、防护装置的协同作用保护作业者安全。下列关于圆锯机的各项说法中，正确的是（）。","options":{"A":"锯片与法兰盘应与锯轴的旋转中心线平行防止锯片摆动","B":"法兰盘外夹紧直径至少为锯片最大设计直径的1/4","C":"带有两法兰盘其夹紧面的宽度至少为3mm并平整无凸起","D":"圆锯片断齿或出现裂纹时应停止使用，不允许修复","E":"分料刀宽度应介于锯身厚度与锯料宽度之间"},"images":[],"answer":["B","E"],"explanation":"锯片与法兰盘应与锯轴的旋转中心线垂直防止锯片摆动；法兰盘外夹紧直径至少为锯片最大设计直径的1/4；带有两法兰盘其夹紧面的宽度至少为3mm并中凹；圆锯片连续断裂2齿或出现裂纹时应停止使用，不允许修复。","pages":[16,17],"topic":"机械与人机安全"},{"id":"1-85","paper":1,"number":85,"type":"multiple","stem":"某企业进行防火防爆安全技术改造应对日益凸显的消防安全隐患，按照防火防爆的原则可划分为防止形成爆炸性混合物、消除点火源和阻止限制火灾爆炸的蔓延扩散。因此，下列安全措施中（）属于阻止限制火灾爆炸蔓延扩散。","options":{"A":"蒸馏车间设置可燃气体探测报警系统、事故送排风装置","B":"萃取车间电气设备具有本质安全型、隔爆型防爆型式","C":"灌装车间地面采用防爆骨架—丁腈地坪","D":"勾兑车间设置在多层建筑顶层靠外墙处并设置轻质屋面","E":"控制室设置气体灭火系统、火灾自动报警系统"},"images":[],"answer":["D","E"],"explanation":"蒸馏车间设置可燃气体探测报警系统、事故送排风装置，防止形成爆炸性混合物；萃取车间电气设备具有本质安全型、隔爆型防爆型式，消除电火源；灌装车间地面采用防爆骨架—丁腈地坪，防止静电及撞击打火属于消除点火源。考证就上233网校APP 免费题库，复习资料包，扫码下载即可获得","pages":[17],"topic":"防火防爆"},{"id":"2-3","paper":2,"number":3,"type":"single","stem":"某压力容器在定期检验中发现壁厚为14mm的焊缝区域存在深度为4mm的表面裂纹（未贯穿），材质为奥氏体不锈钢。因无法进行耐压试验，决定采用无损检测方法对焊补修复后的焊缝进行质量检测，最优的方法是（）。","options":{"A":"射线探伤","B":"超声探伤","C":"渗透探伤","D":"磁粉探伤"},"images":[],"answer":["C"],"explanation":"不锈钢属非磁性材料，表面开口缺陷首选渗透探伤。","pages":[1],"topic":"特种设备安全"},{"id":"2-4","paper":2,"number":4,"type":"single","stem":"某烟花爆竹企业进行烟火药调整，具体方案如下：①添加含Al的药剂K提高敏感度并降低用药量从而限制产品成本；②烟火药呈现多孔微观结构，提高燃烧表面积。上述烟火药在安全性能检测中发现，由于药剂成分过于复杂极易由摩擦产生静电；此外，组分之间产生反应直接影响运输、使用安全。针对上述情景，下列说法定义中正确的是（）。","options":{"A":"摩擦产生静电属于摩擦感度的测试要求","B":"不同药剂对产品的影响不同，药剂K属于提高感度的敏化剂","C":"组分之间产生反应属于外相容性的测试要求","D":"微观结构提高燃烧表面积，影响烟火药的能量特征"},"images":[],"answer":["B"],"explanation":"摩擦产生静电属于静电感度的测试要求；不同药剂对产品的影响不同，药剂K属于提高感度的敏化剂；组分之间产生反应属于内相容性的测试要求；微观结构提高燃烧表面积，影响烟火药的燃烧特性。","pages":[1,2],"topic":"防火防爆"},{"id":"2-7","paper":2,"number":7,"type":"single","stem":"作业现场生产设备通过合理化布局、安全防护装置和人机工程学的协调实现安全卫生要求，下列关于机械设备的安全要求，符合规范的是（）。","options":{"A":"运动传动部位的危险，应采用固定式或活动式防护装置","B":"高于2m的操作平台应设高度不低于1050mm的防护挡板","C":"生产线辊道、输送机的人员跨越处，应设带栏杆的人行走桥","D":"采用钢直梯时，3m以上的钢直梯应设安全护笼"},"images":[],"answer":["C"],"explanation":"重型机床高于500mm的操作平台应设高度不低于1050mm的防护栏杆；采用钢直梯时，高于3m的部分应设安全护笼；生产线辊道、输送机等人员跨越处，应设带栏杆的人行走桥；传动部件产生的危险，应采用固定式或活动式联锁防护装置。","pages":[2],"topic":"机械与人机安全"},{"id":"2-8","paper":2,"number":8,"type":"single","stem":"切削设备的夹持装置是连接工件与机床、刀具的关键部件，在切削加工中，确保工件或刀具能够被快速、精准、牢固地固定在正确的位置上。下列关于切削机床夹持装置的各项说法要求，正确的是（）。","options":{"A":"机床运转时，动力夹持装置夹紧力低于允许值时应自动调整","B":"机床运转前，未达到安全预紧力时动力夹持装置不应动作","C":"磁性夹持装置断开连接，夹紧力应自动复位至初始状态","D":"磁性夹持装置应通过启动控制装置松开或夹紧工件"},"images":[],"answer":["D"],"explanation":"机床运转时，动力夹持装置夹紧力低于允许值时应自动停止；机床运转前，未达到安全预紧力时动力驱动装置不应动作；磁性夹持装置断开连接，夹紧力应保持夹持装置上工件不发生意外危险。","pages":[2],"topic":"机械与人机安全"},{"id":"2-9","paper":2,"number":9,"type":"single","stem":"危险化学品的安全标签在出厂时通常由生产经销单位加贴安全标签至每层外包装上，在危化品流通的同时作为信息的载体供操作人员的操作指导和使用说明。下列针对安全标签的各项规定中，正确的是（）。","options":{"A":"对构成商业机密的危化品成分，可以不标明成分及危险特性","B":"进口的危化品标签至少注明一家原生产商家的应急咨询电话","C":"应提示化学品用户参阅化学品安全技术说明书","D":"根据危险程度类别，用“危险、警告“两个词同时进行危害警示"},"images":[],"answer":["C"],"explanation":"对构成商业机密的危化品成分，可以不标明成分但是应明确列明介质的危险特性；进口的危化品标签至少注明一家中国境内的应急咨询电话；根据危险程度类别，用“危险”、“警告“两个词分别进行不同程度的危害警示。","pages":[2],"topic":"危险化学品安全"},{"id":"2-10","paper":2,"number":10,"type":"single","stem":"某大型家具制造单位采用如图所示加工设备用于基材成型加工，下锯轮设置为主动轮、上锯轮为调整轮；为避免图示不清导致考生识图不当，其中①代表图中黄色部分。因此，下列关于上述设备的各项说法中满足要求的是（）。","options":{"A":"设置锯条承受器，兼用于防止断裂的锯条高速弹出伤人","B":"①属于高度可调的锯齿防护罩，与控制系统形成联锁关系","C":"一旦锯条的结构强度受到破坏，严禁修复使用","D":"上锯轮应装有能对运转进行有效制动的装置"},"images":[{"src":"../assets/c34ac2b9a9a486b727ea79e5.jpg","alt":"第2套第10题原卷配图","width":248,"height":402}],"answer":["A"],"explanation":"设置锯条承受器，兼用于防止断裂的锯条高速弹出伤人；①属于高度可调的锯齿防护罩，操作期间应保持固定、自锁状态；严格控制锯条的横向裂纹，裂纹超长应切断重新焊接；下锯轮应装有能对运转进行有效制动的装置。","pages":[2,3],"topic":"机械与人机安全"},{"id":"2-11","paper":2,"number":11,"type":"single","stem":"在实际生产中，介于火灾爆炸事故的多米诺效应爆炸通常导致灾难性后果，因此科学防爆属于企业安全管理的基本工作。下列说法中，用于爆炸控制的正确措施是（）。","options":{"A":"可燃气体气瓶瓶头阀的手轮采用阻燃材料制作","B":"压力容器设置压力报警器，在设备内压力失常时及时报警","C":"电气设备设置气密性外壳，采用氮气负压防护","D":"甲苯代替苯用作喷涂料中的溶剂、分散剂"},"images":[],"answer":["B"],"explanation":"可燃气体气瓶瓶头阀的手轮采用阻燃材料制作，用于灭火施救和防爆无关；压力容器设置压力报警器，在设备内压力失常时及时报警属于防爆控制措施；电气设备设置气密性外壳，采用氮气正压防护；甲苯代替苯用作喷涂料中的溶剂、分散剂，和防爆无关主要是防止毒性介质的健康危害性。","pages":[3],"topic":"防火防爆"},{"id":"2-13","paper":2,"number":13,"type":"single","stem":"某石化企业因应急预案、应急演练不到位，被上级管理部门勒令限期整改，查阅企业备案的应急预案，下列各项要求符合规定的是（）。","options":{"A":"通过工业电视监控系统进行现场查验，关闭泄漏段前后阀门","B":"对已经泄漏的有毒气体启动通风排毒设施并用消防水雾驱离","C":"应急处置人员选择动力送风过滤式防毒面具、隔离式防化服","D":"将现场中毒者仰卧并松开衣物和腰带，保持呼吸系统的畅通"},"images":[],"answer":["A"],"explanation":"对已经泄漏的有毒气体启动通风排毒设施，并用中和剂进行处理；应急处置人员选择动力隔离式呼吸用具、隔离式防化服；将现场中毒者转移至空气新鲜、通风良好的地方。","pages":[3,4],"topic":"危险化学品安全"},{"id":"2-15","paper":2,"number":15,"type":"single","stem":"具有放射性危险特性的危险化学品，主要危险特性在于放射性，放射性强度越大危险性就越大。在极高剂量的放射线作用下，下列放射性危害的说法正确的是（）。","options":{"A":"属于接触性伤害，会产生剧痛","B":"进入体内并累积一定量后方才会表现危险特性","C":"对肠胃的伤害表现为脱发、流鼻血、腹泻和极度憔悴","D":"对中枢神经和大脑系统的伤害表现为虚弱、倦怠、嗜睡、昏迷"},"images":[],"answer":["D"],"explanation":"属于非接触性伤害，并不需要进入体内就会表现危险特性，对肠胃的伤害表现为为恶心、呕吐、腹泻、虚弱和虚脱。","pages":[4],"topic":"危险化学品安全"},{"id":"2-16","paper":2,"number":16,"type":"single","stem":"起重机械安全装置应依照其结构特点、作业方式及危险特性综合考虑选择，下列类型的起重机械中，（）可能应按需设置回转锁定装置、幅度限制装置。","options":{"A":"门式起重机","B":"桥式起重机","C":"缆索式起重机","D":"门座式起重机"},"images":[],"answer":["D"],"explanation":"应按需设置回转锁定装置、幅度限制装置的是臂架式起重机，选项中属于臂架式起重机的只有D选项的门座式起重机。","pages":[4],"topic":"特种设备安全"},{"id":"2-19","paper":2,"number":19,"type":"single","stem":"化工企业为提高大检修工作效率，通常在检修中关于化工企业设置固定动火区的说法，正确的是（）。","options":{"A":"为方便检修属地管理，在火灾爆炸危险场所设置固定动火区","B":"固定动火区距火灾爆炸场所的厂房、库房等不应小于30m","C":"固定动火区设置在火灾爆炸场所全年最小频率上风向","D":"落实完善防火措施和责任人后，可在动火区存放可燃物及杂物"},"images":[],"answer":["B"],"explanation":"A错误，为方便大检修属地管理，在非火灾爆炸危险场所设置固定动火区；C错误，固定动火区应设置在火灾爆炸危险场所全年最小频率风向下风或侧风方向，并与相邻企业火灾爆炸危险场所满足防火间距要求；D错误，原则上，不应在固定动火区内存放可燃物及其他杂物。","pages":[4,5],"topic":"防火防爆"},{"id":"2-20","paper":2,"number":20,"type":"single","stem":"华夏铸造，源远流长，已有数千年之传承。静观博物馆中陈列的青铜重器、礼器与兵器，每一道纹饰、每一寸锈色，无不凝结着先民的精湛技艺与卓绝智慧。下列关于现在铸造机械安全要求中，符合规定的是（）。","options":{"A":"模具容腔相连的压力腔压力未完全释放，模具无法打开","B":"燃烧系统的燃气总管设置火焰监测和熄火保护系统","C":"急停装置应保证在任何操作下都能撤销驱动器的动力源","D":"燃烧系统的燃气总管设置压力检测装置并与送排风装置联锁"},"images":[],"answer":["A"],"explanation":"燃烧装置应设置火焰监测和熄火保护系统；急停装置应保证在任何操作下都能切断驱动器的动力源；燃烧系统的燃气总管设置压力检测装置并与紧急切断装置联锁。","pages":[5],"topic":"机械与人机安全"},{"id":"2-21","paper":2,"number":21,"type":"single","stem":"单向阻火器的正确安装是其发挥安全阻火作用的前提，某企业工业阻火器如下图所示，针对所示的单向阻火器的各项说法中，符合要求的是（）。","options":{"A":"箭头A→B表示阻火器的阻火方向，应将A朝向点火源","B":"适用于颗粒粉末介质时，阻火器的进口、出口分设压力表","C":"阻火原件堵塞时，拆下后用高压蒸汽、空气吹扫清理","D":"任何情况下，阻火原件严禁靠近炉子和加热设备"},"images":[],"answer":["C"],"explanation":"箭头A→B表示阻火器所承载的介质流向；阻火器适用于气体介质、蒸汽介质，但不适用于颗粒粉末介质；原则上，阻火原件不得靠近炉子和加热设备，除非温度不会影响其阻火性能。","pages":[5],"note":"原卷题干提到配图，但该题所在页面未附图；这里保留原卷文字。","topic":"防火防爆"},{"id":"2-22","paper":2,"number":22,"type":"single","stem":"气瓶附件包括瓶帽、瓶阀、保护罩、安全泄压装置、防震胶圈、液位计等，属于气瓶的重要组成部分，对气瓶安全起到重要作用。下列针对有毒气体低温液氨无缝钢瓶的附件说法中，符合要求的是（）。","options":{"A":"瓶阀材料，选用含铜量小于65%的铜合金","B":"严禁设置安全泄压装置","C":"可采用安全阀、爆破片组合结构型式泄压装置","D":"安全泄压装置设置在气瓶封头、瓶阀或瓶座上"},"images":[],"answer":["C"],"explanation":"有毒气体低温液氨无缝钢瓶，可采用安全阀、爆破片组合结构型式泄压装置，但是考虑到瓶体结构属于无缝钢瓶，因此安全泄压装置应装设在瓶阀上不宜破坏整体气瓶结构。","pages":[5],"topic":"特种设备安全"},{"id":"2-23","paper":2,"number":23,"type":"single","stem":"危险化学品进入人体的主要途径包括呼吸系统、消化系统和表皮渗入，在体内累计一定量以后所表现出的身体机能受损就是通常所说的毒性。下列针对毒性介质侵入人体的各项说法，正确的是（）。","options":{"A":"毒性危险化学品进入人体的最重要的途径是消化系统","B":"吸入危害和危化品浓度相关，浓度越低、渗透压越高，吸收越快","C":"通常脂溶性的物质易被皮肤吸收，通过表皮渗入","D":"经由消化系统吸收多半是由于个人卫生习惯不良所导致"},"images":[],"answer":["D"],"explanation":"毒性危险化学品进入人体的最重要的途径是呼吸系统；吸入危害和危化品的浓度相关，浓度越低，吸收越快；通常水、脂溶性的物质易被皮肤吸收，通过表皮渗入。","pages":[5],"topic":"危险化学品安全"},{"id":"2-25","paper":2,"number":25,"type":"single","stem":"使用木工机械进行木材加工过程中，危险因素多、伤害程度严重，因此应通过安全设计减少危险源，并采取有效的安全技术措施。下列对木工机械采取的安全技术措施中，正确的是（）。","options":{"A":"木工带锯机上安装锯轴锁定装置","B":"手动进料木工圆锯机上安装锯片承受器","C":"木工平刨床上设置遮盖式屏障装置","D":"自动进料木工圆锯机上安装分料刀"},"images":[],"answer":["C"],"explanation":"木工圆锯机上安装锯轴锁定装置；手动进料木工圆锯机上安装分料刀；木工平刨床上设置遮盖式屏障装置；自动进料木工圆锯机上安装止逆器、压料装置和侧向防护挡板。","pages":[5],"topic":"机械与人机安全"},{"id":"2-26","paper":2,"number":26,"type":"single","stem":"锅炉使用单位应当安排锅炉的定期检验工作，向具有相应资质的检验机构提出检验要求。因此，下列检验要求的各项说法中，符合《锅炉安全技术规程》要求的是（）。","options":{"A":"在下次检验日期前3个月提出定期检验要求","B":"外部检验，每年进行1次","C":"结构原因无法外部检验时，应进行内部检验","D":"内部检验，一般每3~6年进行1次"},"images":[],"answer":["B"],"explanation":"下次检验日期前1个月提出定期检验要求；外部检验，每年进行1次；；内部检验，一般每2年进行1次；结构原因无法进行内部检测时，进行水压（耐压）试验检测。","pages":[5,6],"topic":"特种设备安全"},{"id":"2-27","paper":2,"number":27,"type":"single","stem":"某电气设备采用如下所示供电保护方式，参照图示其中用于故障状态下防止电击所设置的导体包括（）。","options":{"A":"②③④","B":"①②③","C":"③④⑤","D":"①②⑤"},"images":[{"src":"../assets/e72b1b94446ebc5980c60bce.png","alt":"第2套第27题原卷配图","width":497,"height":249}],"answer":["A"],"explanation":"保护导体主要包括接地导体、保护接地导体和保护联结导体，也就是上述图示中的②③④。","pages":[6],"topic":"电气安全"},{"id":"2-29","paper":2,"number":29,"type":"single","stem":"依据《气瓶安全技术规程》，关于气瓶公称工作压力的说法，错误的是（）。","options":{"A":"盛装压缩气体气瓶的公称工作压力，是指在基准温度（20℃）下，瓶内气体达到完全均匀状态时的限定（充）压力","B":"盛装液化气体气瓶的公称工作压力，是指温度为60℃时瓶内气体压力的下限值","C":"盛装溶解气体气瓶的公称工作压力，是指瓶内气体达到化学、热量以及扩散平衡条件下的静置压力（15℃）","D":"焊接绝热气瓶的公称工作压力，是指在气瓶正常工作状态下，内胆顶部气相空间可能达到的最高压力"},"images":[],"answer":["B"],"explanation":"对于盛装高压液化气体的钢瓶，气瓶的公称工作压力指温度为60℃时瓶内气体压力的上限值。","pages":[6],"topic":"特种设备安全"},{"id":"2-32","paper":2,"number":32,"type":"single","stem":"从事危险化学品零售业务的小微企业应分别从安全距离的限制、储量要求、存放控制措施等多方面保证日常业务的正常安全运行。下列各项基本要求中，符合规定的是（）。","options":{"A":"零售业务的店面备货库房应报公安、消防部门批准","B":"综合性商场严禁经营危险化学品","C":"限制爆炸品、放射性物品、剧毒物品的存放量","D":"零售业务的店面与存放危险化学品的库房必须防爆墙分隔"},"images":[],"answer":["A"],"explanation":"零售业务只许经营除爆炸品、放射性物品、剧毒物品以外的危险化学品；零售业务的店面内显著位置应设有“禁止烟火”等警示标志；零售业务的店面与存放危险化学品的库房应有实墙相隔。","pages":[7],"topic":"危险化学品安全"},{"id":"2-33","paper":2,"number":33,"type":"single","stem":"燃烧在燃烧学原理的定义中通常被界定为可控能量释放，一旦稳定的燃烧条件被打破后果往往是灾难性的。奥运会接力用火炬为适应高原缺氧、高对流条件，设置混气旋流器将空气和燃气按一定比例混合后送入燃烧系统。针对上述描述，下列说法错误的是（）。","options":{"A":"属于预混燃烧","B":"严格控制送气量、燃烧速率，避免形成回火现象","C":"设置防回火装置","D":"环境含氧量影响燃烧效率"},"images":[],"answer":["D"],"explanation":"奥运会接力用火炬属于预混燃烧，严格控制送气量、燃烧速率并设置避免形成回火现象。","pages":[7],"topic":"防火防爆"},{"id":"2-34","paper":2,"number":34,"type":"single","stem":"静电在工业生产中易引发火灾爆炸事故，因此必须采取有效的防护措施。某化工企业车间内存在易燃液体蒸气，操作人员需进入该区域进行设备巡检。下列有关静电防护及危害的说法中，正确的是（）。","options":{"A":"为消散静电，生产工艺设备应优先采用非导体材料","B":"静电能量不大，但仍可能达到可燃物的最小点燃能量引发爆炸","C":"为防止静电积聚，车间内所有金属设备均应单独接地","D":"防静电工作服应选用电阻率极低的导电材料将静电导入大地"},"images":[],"answer":["B"],"explanation":"为消散静电，生产工艺设备应优先采用导体材料；静电能量不大，但仍可能达到可燃物的最小点燃能量引发爆炸；为防止静电积聚，车间内所有金属设备均应接地并进行等电位联结；防静电工作服应选用电阻率较低的亚导电材料将静电导入大地。","pages":[7],"topic":"电气安全"},{"id":"2-37","paper":2,"number":37,"type":"single","stem":"双重绝缘的防触电意义在于构建不依赖接地的独立防触电体系，从而在根本上提升用电安全与便利性。下列关于双重绝缘的各项要求，符合规定的是（）。","options":{"A":"绝缘电阻采用500v直流电压测试","B":"具有双重绝缘型式的Ⅱ类设备，应再行保护接地","C":"明显位置有回字形标识的Ⅱ类设备，适用于爆炸性气体环境","D":"加强绝缘的绝缘电阻不得低于5MΩ"},"images":[],"answer":["A"],"explanation":"绝缘电阻采用500v直流电压测试，具有双重绝缘型式的Ⅱ类设备，不得再行保护接地；加强绝缘的绝缘电阻不得低于7MΩ。","pages":[8],"topic":"电气安全"},{"id":"2-39","paper":2,"number":39,"type":"single","stem":"移动式压力容器转运毒性程度为极度、高度危害或腐蚀性介质，应采用爆破片—安全阀串联泄压装置保护承压设备，并将爆破片设置在安全阀入口侧。针对上述泄压型式，下列说法中错误的是（）。","options":{"A":"爆破片破裂后的泄压面积应大于安全阀的进口截面积","B":"爆破片在爆破时不应产生碎片、脱落或火花","C":"爆破片应设置在距离安全阀入口侧5倍管径内","D":"容器内的介质应试洁净的，不含胶着物质或阻塞物质"},"images":[],"answer":["D"],"explanation":"采用爆破片—安全阀串联泄压装置保护承压设备，并将爆破片设置在安全阀入口侧，爆破片破裂后的泄压面积应大于安全阀的进口截面积；爆破片在爆破时不应产生碎片、脱落或火花；爆破片应设置在距离安全阀入口侧5倍管径内。","pages":[8],"topic":"特种设备安全"},{"id":"2-41","paper":2,"number":41,"type":"single","stem":"《危险化学品目录》中针对剧毒类化学品有明确的定义和判定界限，下列针对剧毒类介质的定义界限中，不正确的是（）。","options":{"A":"人工合成的化学品，毒性类别1","B":"天然毒素，毒性类别1","C":"具有急性毒性易造成公共安全危害的化学品","D":"急性水生毒性，毒性类别1"},"images":[],"answer":["D"],"explanation":"具有剧烈急性毒性危害的化学品，包括人工合成的化学品及其混合物和天然毒素，还包括具有急性毒性易造成公共安全危害的化学品。","pages":[8,9],"topic":"危险化学品安全"},{"id":"2-44","paper":2,"number":44,"type":"single","stem":"依据应急管理部统计数据，烟花爆竹生产环节中，制药与压柱工序的事故发生率居各工序之首。然而，表面看似平静的干燥工段虽常被忽视，却潜藏着引发重大伤亡事故的灾难性风险。下列关于烟花爆竹干燥工序的各项要求中，符合规范规定的是（）。","options":{"A":"采用明火烘干应设置排湿装置、感温报警装置及通风凉药设施","B":"热风可对有裸露药剂的成品、半成品及无药半成品进行干燥","C":"晒场有可靠的防雨和防溅措施时，可不设凉药厂房","D":"危险品晒场周围应设置防护堤，防护堤地面应高出地面1m"},"images":[],"answer":["C"],"explanation":"烟花爆竹成品、半成品和药剂干燥，严禁采用明火；热风可对没有裸露药剂的成品、半成品及无药半成品进行干燥；晒场有可靠的防雨和防溅措施时，可不设凉药厂房；危险品晒场周围应设置防护堤，防护堤地面应高出产品面1m。","pages":[9],"topic":"防火防爆"},{"id":"2-45","paper":2,"number":45,"type":"single","stem":"某机械加工企业依附于园区内煤化工单位，利用其转换气进行热锻造、加工处理，为方便操作提高工艺稳定性设置燃气压缩罐。转换气主要成分包括甲烷（体积分数10%，爆炸极限5~15%）、一氧化碳（体积分数90%，爆炸极限12~75%），为简化管控要求现将其视作单一易燃气体。针对上述情况，下列说法中正确的是（）。 注释：上述知识点参照工贸企业规定","options":{"A":"爆炸下限11.3%，动火作业前应将其浓度降低至0.2%及以下","B":"爆炸下限10.5%，动火作业前应将其浓度降低至0.5%及以下","C":"爆炸下限11.3%，通风良好的标志一般是降低至2.8%以下","D":"爆炸下限10.5%，探测报警系统检测到浓度达到1.6%时应报警"},"images":[],"answer":["B"],"explanation":"爆炸下限10.5%，动火作业前应将其浓度降低至0.5%及以下，通风良好的标志一般是降低至2.0%以下，探测报警系统检测到浓度达到2.1%时应报警。注释：上述知识点参照工贸企业规定","pages":[9,10],"topic":"防火防爆"},{"id":"2-47","paper":2,"number":47,"type":"single","stem":"接地装置包括接地体和接地线，有效接地可预防触电事故，运行中的电气设备接地装置应始终保持良好状态。关于电气设备接地装置的说法，正确的是（）。提醒：这种题型在2022~2024极为常见，考生一定要注意考察的是接地体、接地线还是保护导体。","options":{"A":"铠装电缆的金属保护层可作用于接地线","B":"非爆炸环境接地线截面积足够，可不再另行敷设人工接地线","C":"接地装置地下部分采用防腐镀锌处理的螺栓压接","D":"利用起重机轨道作接地线时，应焊接填充伸缩缝"},"images":[],"answer":["B"],"explanation":"不得利用蛇皮管、 管道保温层的金属外皮或金属网以及电缆的金属护层作接地线；利用建筑物的钢结构、起重机轨道、工业管道等自然导体作接地线时，其伸缩缝或接头处应另加跨接线，以保证连续可靠。自然接地体与人工接地体之间的连接必须可靠。接地线与管道的连接可采用螺纹连接或抱箍螺纹连接，但必须采用镀钵件，以防止锈蚀。","pages":[10],"topic":"电气安全"},{"id":"2-48","paper":2,"number":48,"type":"single","stem":"安全检测是保障安全生产的重要手段，常用的电气安全检测仪器包括绝缘电阻测量仪、接地电阻测量仪、红外测温仪、可燃气体检测仪等。针对如图所示的电气检测仪表，下列说法定义中正确的是（）。","options":{"A":"测量电极间的连线应避免与临近高压架空线平行","B":"指针式兆欧表俗称摇表，用于测量绝缘电阻","C":"一般在旱季前或其他土壤湿润的季节测量","D":"测量连接导线不得使用双股绝缘线，以免带来测量误差"},"images":[{"src":"../assets/6c92dbc048176a18064972ec.png","alt":"第2套第48题原卷配图","width":400,"height":400}],"answer":["A"],"explanation":"图示为接地电阻测量仪（接地摇表），测量电极间的连线应避免与临近高压架空线平行，一般在雨季前或其他土壤干燥的季节测量。摇表测量连接导线不得使用双股绝缘线，以免带来测量误差，但是图示不属于摇表。","pages":[10],"topic":"电气安全"},{"id":"2-52","paper":2,"number":52,"type":"single","stem":"工业索类火工品是装有火药或炸药，受外界刺激后产生燃烧或爆炸，以引燃火药、引爆炸药或做机械功的一次性使用的元器件和装置的总称。下列各项民用爆炸品属于工业索类火工品的是（）。","options":{"A":"工业导火索、工业导爆索、引火线、继爆管","B":"工业导火索、工业导爆索、切割索、导爆管雷管","C":"工业导火索、工业导爆索、切割索、引火线","D":"工业导火索、工业导爆索、塑料导爆管、起爆药"},"images":[],"answer":["C"],"explanation":"工业索类火工品：关键词—索导引如工业导火索、工业导爆索、切割索、塑料导爆管、引火线。","pages":[11],"topic":"防火防爆"},{"id":"2-55","paper":2,"number":55,"type":"single","stem":"按照《燃烧学原理》的定义描述燃烧、爆炸反应历程在本质上都可采用支链反应理论，燃烧属于稳定和缓的氧化放热、爆炸倾向于瞬间能量释放。以可燃性混合气体为例，决定气体燃烧抑或是爆炸的主要条件取决于（）过程。","options":{"A":"扩散阶段","B":"感应阶段","C":"化学反应阶段","D":"空间释能阶段"},"images":[],"answer":["A"],"explanation":"决定可燃气体混合物是燃烧还是爆炸的主要因素就是扩散阶段，扩散时间短表现为扩散燃烧、扩散时间长表现为预混爆炸。","pages":[11,12],"topic":"防火防爆"},{"id":"2-56","paper":2,"number":56,"type":"single","stem":"中国是最早开放智能驾驶应用市场的国家，希望通过部门、行业规范和政府管控引导保障司乘安全，但是所谓的智驾系统基本还是在传统人机工程学范围内，尝试利用大模型数据收集为后续全智能链条提供理论支持。以市场上某品牌车辆为例，人作为决策、车辆作为动力源输出并在人员失误时提出警告并拒绝执行。针对上述传统人机工程体系，下列说法中正确的是（）。","options":{"A":"属于自动化系统，当车机系统出现差错时转为人工干预","B":"属于人机并联系统，能有效提高系统正常工况下可靠度","C":"安全性取决于系统的冗余化和人低负荷时应急反应能力","D":"系统中人机共体，人在系统中充当操作者与控制者"},"images":[],"answer":["D"],"explanation":"属于半自动化系统，系统中人机共体，人在系统中充当操作者与控制者，通常属于人机串并联混用模式，系统安全性取决于人机功能分配的合理性、机械的本质安全性和人的失误情况。","pages":[12],"topic":"机械与人机安全"},{"id":"2-57","paper":2,"number":57,"type":"single","stem":"2026年应上级部门要求对中南五省机械加工制造企业进行防火防爆检查，原则上要求从源头上管控、消除事故隐患，避免同年类似特重大伤亡事故的发生。以其中的喷漆烘干车间为例，分别有如下技术措施：①喷漆车间采用常负压设计；②烘干车间采用热风烘干，循环热风经过净化系统限制爆炸性蒸汽含量；③喷漆车间的油漆暂存间设置漫坡、围堰系统；④烘干车间循环热风风管设置阻火器、化学抑爆系统联用；⑤烘干车间采用防爆墙分隔且采用轻质屋面。针对上述情景，属于消除、防止爆炸性混合物接触混合条件的是（）。","options":{"A":"④⑤","B":"①②","C":"③④","D":"②③"},"images":[],"answer":["B"],"explanation":"喷漆车间采用常负压设计、烘干车间采用热风烘干，属于防止形成爆炸性混合物的技术措施；喷漆车间的油漆暂存间设置漫坡和围堰系统、烘干车间循环热风风管设置阻火器和化学抑爆系统联用、烘干车间采用防爆墙分隔且采用轻质屋面，属于防止火灾蔓延扩散的技术措施。","pages":[12],"topic":"防火防爆"},{"id":"2-59","paper":2,"number":59,"type":"single","stem":"电机属于常见的低压电气设备通常用于将电能转换为机械能，电机的漏电、缺相、严重过载、短路等事故都可能导致电机过热引发二次事故。因此，下列针对电机的安全运行条件的要求中，正确的是（）。","options":{"A":"电压波动不超过5%~10%","B":"电流不平衡不超过5%、电压不平衡不超过10%","C":"继电器保护，热元件动作电流不大于额定电流的1~1.5倍","D":"全压启动异步电机熔断器保护时，熔体额定电流取电机额定电流的1.5倍"},"images":[],"answer":["C"],"explanation":"电压波动不超过-5%~10%、电压不平衡不超过5%、电流不平衡不超过10%；继电器保护，热元件动作电流不大于额定电流的1~1.5倍；全压启动异步电机熔断器保护时，熔体额定电流取电机额定电流的2.5倍。","pages":[12],"topic":"电气安全"},{"id":"2-61","paper":2,"number":61,"type":"single","stem":"压力管道保障不同装置间的物料输送，既要承受内部介质额外压力也受外部环境因素影响，极易发生泄漏事故引发一系列的衍生事故，针对压力管道的事故原因及预防措施满足要求的是（）。","options":{"A":"温度波动易导致疲劳破坏，应选择合适抗疲劳材料并加强检验","B":"地质灾害易导致管道破坏，属于长输油气管道事故的主要原因","C":"压力波动易导致蠕变破坏，常发生在管道弯头、三通焊缝区域","D":"频繁启停易导致液击破坏，应减少启停次数并选择防液击阀门"},"images":[],"answer":["D"],"explanation":"介质和电化学腐蚀，属于长输油气管道事故的主要原因；管道长期受到反复加载泄压的交变载荷作用，易导致疲劳破坏，应选择合适的抗疲劳材料并加强定期检验；异常高温条件下由于管道自身的拉伸应力，易导致蠕变破坏，常发生在管道弯头、三通焊缝等高拉伸应力区域。","pages":[13],"topic":"特种设备安全"},{"id":"2-64","paper":2,"number":64,"type":"single","stem":"根据《客运索道监督检验和定期检验规则》运行速度大于3.5m/s的架空客运索道，在满载全速运行的情况下突然停电，控制系统在5min内能够保持正常工作，为确保该索道能平稳停止运行，正确的制动次序是（）。","options":{"A":"工作制动器和安全制动器先后下闸","B":"安全制动器和固定抱索器先后下闸","C":"固定抱索器和行程制动器先后下闸","D":"行程制动器和工作制动器先后下闸"},"images":[],"answer":["A"],"explanation":"满载全速运行的情况下突然停电，控制系统在5min内能够保持正常工作，为确保该索道能平稳停止运行，正确的制动次序是工作制动器和安全制动器先后下闸，索道被平稳制动。","pages":[13],"topic":"特种设备安全"},{"id":"2-66","paper":2,"number":66,"type":"single","stem":"充足的电气照明是改善劳动环境、保障安全生产的必要条件，按照照明功能分为正常照明、应急照明、值班照明、警卫照明和障碍照明。下列关于电气照明的各项要求，正确的是（）。","options":{"A":"室外照明配电终端回路应设置剩余电流保护装置作为附加防护","B":"采用交流低压供电的灯具，应设置剩余电流保护装置作为附加防护","C":"接线盒引至嵌入式灯具或槽灯的电线应采用绝缘柔性导管保护","D":"配电箱内单相照明线路的单极开关必须装在相线上"},"images":[],"answer":["A"],"explanation":"采用交流低压供电且安装高度在2.5m及以下的灯具，应设置剩余电流保护装置作为附加防护；接线盒引至嵌入式灯具或槽灯的电线应采用金属柔性导管保护；配电箱内单相照明线路必须采用双极开关。","pages":[13,14],"topic":"电气安全"},{"id":"2-69","paper":2,"number":69,"type":"single","stem":"爆炸危险环境中电气设备应根据电气设备使用环境的等级、电气设备的种类和使用条件选择电气设备，所选用的防爆电气设备的级别和组别不应低于该环境内爆炸性混合物的级别和组别。针对下述说法中，符合规范要求的是（）。","options":{"A":"爆炸危险环境严禁用携带式设备和移动式设备","B":"爆炸危险0区操作用小开关应选用本安型、隔爆型设备","C":"爆炸危险1区固定式白炽灯应选用增安型、隔爆型设备","D":"爆炸危险2区直流电机应选用隔爆型、正压型设备"},"images":[],"answer":["D"],"explanation":"爆炸危险环境应尽量少用携带式设备和移动式设备，爆炸危险0区操作用小开关应选用本安型、爆炸危险1区固定式白炽灯应选用隔爆型设备、爆炸危险2区直流电机应选用隔爆型、正压型设备。","pages":[14],"topic":"电气安全"},{"id":"2-71","paper":2,"number":71,"type":"multiple","stem":"安全技术说明书SDS是化学品作为商品属性在市场上流通、使用的指导性文件，下列各项属于SDS的十六个大项的是（）。","options":{"A":"图形标识","B":"化学品和企业标识","C":"信号词（警示词）","D":"泄漏应急处理","E":"稳定性和反应性"},"images":[],"answer":["B","D","E"],"explanation":"图形标识、信号词（警示词）是安全标签的组成内容。","pages":[14,15],"topic":"危险化学品安全"},{"id":"2-72","paper":2,"number":72,"type":"multiple","stem":"场内专用机动车辆的控制系统是车辆的大脑和神经中枢，接收操作指令、处理各种信息并精确控制车辆动作。下列各项关于电动场内专用机动车辆控制系统的说法中，符合《场内专用机动车辆安全技术规程》要求的是（）。","options":{"A":"设置开关装置，需要由钥匙、密码或磁卡方能启动","B":"控制系统设置欠电压、过电压、过电流和过载保护功能","C":"控制系统采用双线制，保证绝缘良好","D":"设置非自动复位且能切断所有驱动部件电源的紧急切断装置","E":"蓄电池场车充电时，应当保证电源和车辆控制电路分离"},"images":[],"answer":["A","C","D","E"],"explanation":"设置开关装置，需要由钥匙、密码或磁卡方能启动；控制系统设置欠电压、过电压、过电流和过热保护功能；控制系统采用双线制，保证绝缘良好；设置非自动复位且能切断所有驱动部件电源的紧急切断装置；蓄电池场车充电时，应当保证电源和车辆控制电路分离。","pages":[15],"topic":"特种设备安全"},{"id":"2-73","paper":2,"number":73,"type":"multiple","stem":"压力容器在使用过程中，使用单位应对其进行年度检查。根据《固定式压力容器安全技术监察规程》，下表检查内容中，属于搪玻璃压力容器年度检查的是（） 。","options":{"A":"内表面的腐蚀开裂情况，防腐蚀涂层附着情况","B":"密封面的密封情况","C":"夹套疏水阀启闭密封情况","D":"夹套顶部放气口启闭情况","E":"搪玻璃层直流高电压监测"},"images":[],"answer":["B","C","D"],"explanation":"压力容器使用单位每年对所使用的压力容器至少进行1次年度检查，搪玻璃压力容器年度检查专项要求如下：（1）压力容器外表面防腐漆是否完好，是否有锈蚀、腐蚀现象。（2）密封面是否有泄漏。（3）夹套底部排净（疏水）口开闭是否灵活。（4）夹套顶部放气口开闭是否灵活。","pages":[15],"topic":"特种设备安全"},{"id":"2-75","paper":2,"number":75,"type":"multiple","stem":"双手操作装置包括双手按钮式操作装置和双手柄式操作装置，通过控制系统和滑块下行程运行形成控制体系。参照规范《机械安全 双手操作装置设计和选择原则》下列说法中，正确的是（）。","options":{"A":"一旦释放任意一个或两个操纵执行器材，输出信号都应被终止","B":"释放任意操纵执行器材后，应再次触发输出信号","C":"执行器材之间至少间隔260mm，防止使用单手造成弃用","D":"采用盖板，使得操纵执行器材不能用肘部操作","E":"最小安全距离的设置应在危险状态终止前，无法触及危险区"},"images":[],"answer":["A","C","D","E"],"explanation":"一旦释放任意一个或两个操纵执行器材，输出信号都应被终止；释放全部操纵执行器材后，应再次触发输出信号；执行器材之间至少间隔260mm，防止使用单手造成弃用；采用盖板，使得操纵执行器材不能用肘部操作；安装位置应在危险状态终止前，无法触及危险区。","pages":[15],"topic":"机械与人机安全"},{"id":"2-76","paper":2,"number":76,"type":"multiple","stem":"等电位联结是指保护导体与建筑物的金属结构、生产用的金属设备以及允许用作保护线的金属管道等用于其他目的的不导电导体之间的联结。如下所示保护方式，说法正确的是（）。","options":{"A":"①属于辅助等电位联结线","B":"等电位联结线②不得小于相应保护接地导体截面积的1/2","C":"接地导体③属于保护导体","D":"④属于中性导体，用于构成单相设备的供电回路","E":"⑤属于保护接地导体（PE线）"},"images":[{"src":"../assets/c47e066210f1c432d546a040.jpg","alt":"第2套第76题原卷配图","width":964,"height":485}],"answer":["B","C","E"],"explanation":"①属于主等电位联结线、辅助等电位联结线②不得小于相应保护接地导体截面积的1/2；接地导体③属于保护导体、④和⑤属于保护接地导体（PE线）。","pages":[15,16],"topic":"电气安全"},{"id":"2-78","paper":2,"number":78,"type":"multiple","stem":"与传统的砂型铸造等方法相比，消失模铸造的优势非常突出，尤其在铸件质量、生产效率和环保性上表现卓越，被誉为绿色铸造的代表。下列安全要求中，（）属于正确的消失模铸造设备要求。","options":{"A":"脱蜡釜快开门与控制系统联锁，快开门未关闭时釜内无法进汽","B":"低压铸造机的动模机构应设置自锁装置、反向安全锁机构","C":"翻箱机及转运车运行时应发出声光报警信号","D":"全自动成型机合模工位设置安全门，并与控制系统联锁","E":"消失模成型机应设置泄压阀"},"images":[],"answer":["C","D","E"],"explanation":"脱蜡釜快开门与控制系统联锁，快开门未关闭时釜内无法进汽属于熔模铸造要求；低压铸造机的动模机构应设置自锁装置、差压铸造在上述基础上增设反向安全锁机构，上述要求属于金属型铸造。","pages":[16],"topic":"机械与人机安全"},{"id":"2-81","paper":2,"number":81,"type":"multiple","stem":"依照建筑设计防火规范具有爆炸性厂房、区域应通过防爆泄压设施导除爆炸波阵面超压，从而消减爆炸辐射面。下列各项防爆泄压要求，符合规范的是（）。","options":{"A":"泄压设施的设置应避开建筑内的爆炸中心区域","B":"爆炸中心区域应避开建筑的承重结构及重要区域","C":"泄压面积不足，允许通过计算段的公共截面泄压","D":"泄压面积的计算应考虑爆炸区域的长径比","E":"泄压面积的计算应考虑爆炸区域的设计最大储量"},"images":[],"answer":["B","D"],"explanation":"爆炸中心区域应避开建筑的承重结构及重要区域，泄压设施的设置应靠近建筑内的爆炸中心区域；计算段的公共截面不得作为泄压面积；泄压面积的计算应考虑爆炸区域的长径比。","pages":[17],"topic":"防火防爆"},{"id":"2-82","paper":2,"number":82,"type":"multiple","stem":"避雷器是用于保护电气设备免受高瞬态过电压危害并限制续流时间的保护设备，下列关于避雷器的各项说法中正确的是（）。","options":{"A":"正常工作模式，处于导通状态","B":"出现雷击过电压，击穿放电切断过电压","C":"过电压终止后，恢复导通状态","D":"住宅建筑中，电涌保护器通常安装在配电箱中保护家用电器","E":"工业环境中，电涌保护器用于保护敏感的控制系统和生产设备"},"images":[],"answer":["B","D","E"],"explanation":"避雷器正常工作模式，处于不通状态；出现雷击过电压，击穿放电切断过电压；过电压终止后，恢复不通状态；住宅建筑中，电涌保护器通常安装在配电箱中保护家用电器；工业环境中，电涌保护器用于保护敏感的控制系统和生产设备。","pages":[17],"topic":"电气安全"},{"id":"2-83","paper":2,"number":83,"type":"multiple","stem":"某单相设备采用如下的供电保护方式实现间接接触电击的安全防护，下列各项关于所示供电保护方式的说法中，相对最为符合要求的是（）。","options":{"A":"不能降低故障电压，设置高灵敏度剩余电流保护装置","B":"适用于用电设备复杂的非生产性楼房","C":"能有效降低故障电压，不能装设剩余电流保护装置","D":"线路①为保护接地中性导体，通常用PEN线表示","E":"电气装置的外露导电部分与电源侧接地点有直接电气连接"},"images":[{"src":"../assets/a3f10e0d34bf7c22a093c0ac.png","alt":"第2套第83题原卷配图","width":348,"height":204}],"answer":["C","D","E"],"explanation":"图示属于TN-C供电保护方式，适用于用电设备简单、火灾爆炸性较低的环境能有效降低故障电压，不能装设剩余电流保护装置；线路①为保护接地中性导体，通常用PNE线表示。","pages":[17],"topic":"电气安全"},{"id":"2-84","paper":2,"number":84,"type":"multiple","stem":"某战略应急管理部在西南腹地深处新建大型石油库，以其中某重大危险源罐区为例主要包括汽油储罐（非水溶性液体）、战略应急食品级乙醇储罐（水溶性液体）和乙烯压力罐（易燃气体）。针对上述设备设施，下列防灭火设施的选择设置符合要求的是（）。","options":{"A":"乙醇储罐设置轻水泡沫灭火系统","B":"乙烯压力罐设置水雾冷却灭火系统","C":"汽油储罐设置二氧化碳灭火系统","D":"罐区设置ABC干粉灭火器、泡沫灭火器","E":"罐区控制站、机房设置二氧化碳灭火器"},"images":[],"answer":["B","D","E"],"explanation":"乙醇储罐设置抗溶性泡沫灭火系统；乙烯压力罐设置水雾冷却灭火系统；汽油储罐设置泡沫灭火系统；罐区设置ABC干粉灭火器、泡沫灭火器；罐区控制站、机房设置二氧化碳灭火器。","pages":[17,18],"topic":"防火防爆"},{"id":"3-1","paper":3,"number":1,"type":"single","stem":"保护装置在机械设备的应用中承担不可或缺的重要涵义，能有效避免设备故障、操作失误或环境不良所导致的机械致害，甚至在可预测的不可抗力条件也能将伤害情况将至可接受水平。综上所述，以木工圆锯机为例下列说法中正确的是（）。","options":{"A":"锯轴锁定装置在更换圆锯片期间锁定锯轴，属于机械约束装置","B":"锯轴限速装置防止超过设计限值，属于联锁保护装置","C":"上锯轮联锁装置避免故障条件被运行，属于联锁保护装置","D":"自动进料圆锯机的止逆器防止反向行程，属于有限运动控制装置"},"images":[],"answer":["A"],"explanation":"锯轴锁定装置在更换圆锯片期间锁定锯轴，属于机械约束装置；锯轴限速装置防止超过设计限值，属于限制装置；上锯轮联锁装置避免故障条件被运行，属于联锁保护装置，但是上锯轮的联锁装置属于带锯机；自动进料圆锯机的止逆器防止反向行程，属于特殊应用方式的限制装置，用于限定矢量方向。","pages":[1],"topic":"机械与人机安全"},{"id":"3-3","paper":3,"number":3,"type":"single","stem":"机械制造生产场所是机械设备和物料集中区域同时兼具多种危害因素，通过区域的合理布局保障操作和应急施救的安全是有重大应用意义的。因此，下列关于机械加工生产场所通道的布置中，合理的是（）。","options":{"A":"主要生产区、仓库区和动力区应设置尽端式道路","B":"道路上部管架和栈桥，在干道上的净空不得小于2m","C":"锻造和焊接车间，机床间次要通道宽度不应小于1m","D":"铸造和锻造车间，纵向主要通道的宽度不应小于1m"},"images":[],"answer":["C"],"explanation":"主要生产区、仓库区和动力区应设置环形道路；道路上部管架和栈桥，在干道上的净空不得小于5m；锻造和焊接车间，机床间次要通道宽度不应小于1m；冷加工车间采用人工运输，纵向主要通道的宽度不应小于1m。","pages":[1],"topic":"机械与人机安全"},{"id":"3-6","paper":3,"number":6,"type":"single","stem":"在爆炸危险环境中使用的电气设备和电气线路不应产生能够造成引燃源的火花、电弧或危险温度。下列针对爆炸危险环境中电气设备和电气线路的要求中，正确的是（）。","options":{"A":"架空线路与爆炸性气体环境的水平距离不应小于杆塔高度的1.5倍","B":"架空电力线路跨越爆炸性气体环境应选用多股铜芯软线","C":"电气线路穿过不同区域间隔墙孔洞应采用钢管配线、电缆配线","D":"在0区内电缆线路严禁有中间接头，在1区内不应有中间接头"},"images":[],"answer":["A"],"explanation":"架空电力线路严禁跨越爆炸性气体环境；电气线路穿过不同区域间隔墙孔洞应采用非燃性材料进行隔离封堵；在1区内电缆线路严禁有中间接头。","pages":[2],"topic":"电气安全"},{"id":"3-7","paper":3,"number":7,"type":"single","stem":"防雷技术的核心目的是保护生命、财产和设备安全，避免或减轻雷电造成的破坏。其用途和对应的技术要求是紧密相连的，需要根据具体的保护对象和环境来明确。下列各项针对防雷技术的说法中，正确的是（）。","options":{"A":"在架设通信线、广播线或低压线的构筑物上装避雷针","B":"任何情况下，第一类防雷建筑物防二次放电间距不小于2m","C":"管道交叉相距不到100mm，交叉处应用金属线跨接","D":"用电设备侧装设电涌保护器防冲击电涌和电磁脉冲"},"images":[],"answer":["C"],"explanation":"严禁在装有避雷针的构筑物上架设通信线、广播线或低压线；任何情况下，第一类防雷建筑物防二次放电间距不小于3m；管道交叉相距不到100mm，交叉处应用金属线跨接；在配电柜和开关柜侧装设电涌保护器防冲击电涌和电磁脉冲。","pages":[2],"topic":"电气安全"},{"id":"3-11","paper":3,"number":11,"type":"single","stem":"依据《危险化学品仓库储存通则》要求，剧毒化学品、监控化学品、易制毒化学品、易制爆危险化学品，应按规定报相关部门备案。下列属于备案内容的是（）。","options":{"A":"储存地点、储存数量、流向及管理人员","B":"储存方式、储存数量、工艺条件及管理人员","C":"储存地点、储存数量、包装和储存条件、流向及管理人员","D":"储存方式、储存数量、包装和储存条件、流向及管理人员"},"images":[],"answer":["A"],"explanation":"剧毒化学品、监控化学品、易制毒化学品、易制爆危险化学品，应按规定将储存地点、储存数量、流向及管理人员的情况报相关部门备案，剧毒化学品以及构成重大危险源的危险化学品，应在专用仓库内单独存放，并实行双人收发、双人保管制度。","pages":[3],"topic":"危险化学品安全"},{"id":"3-13","paper":3,"number":13,"type":"single","stem":"气瓶的瓶帽是在日常生产使用、储存运输中最容易被忽略的气瓶安全附件，但是由此导致的事故却往往是触目惊心的。下列针对气瓶瓶帽的安全要求中，描述最为贴切的是（）。","options":{"A":"装在气瓶阀门外的帽罩式安全附件，可兼作提升零件","B":"采用铸铁铸造具有良好的抗撞击性","C":"瓶帽上设置对称的泄气孔，防止排气导致倾倒或旋转","D":"用于保护气瓶本体免受撞击而导致损伤"},"images":[],"answer":["C"],"explanation":"保护罩是保护瓶帽、瓶阀或易熔塞免受撞击而设置的敞口屏罩式零件，也可兼作提升零件，多用于焊接气瓶及液化石油气钢瓶，所有保护罩应为不可拆卸结构；瓶帽是装在气瓶顶部、阀门之外的帽罩式保护附件，是气瓶保护帽的简称，具有良好的抗撞击性不应采用铸铁铸造；其功能在于避免气瓶在搬运、运输或者使用过程中，受碰撞或冲击损伤阀门。","pages":[3],"topic":"特种设备安全"},{"id":"3-15","paper":3,"number":15,"type":"single","stem":"恒定功率的绕步式异步电机使用或故障状态可能会产生异常温度、电弧电火花，从而由于电气引火源导致燃爆事故。综上所述，下列关于其电气引燃源的各项说法正确的是（）。","options":{"A":"电压过高导致电流增加，从而增加发热","B":"电机电刷与滑环接触处的事故火花构成引燃源","C":"电机空转或轴承损坏、缺油，导致负载转矩过大产生危险温度","D":"未按要求采用铜铝过渡接头，接触处产生危险温度"},"images":[],"answer":["D"],"explanation":"恒定功率的绕步式异步电机，电压过低导致电流增加，从而增加发热；电机电刷与滑环接触处的工作火花构成引燃源；电机卡死或轴承损坏、缺油，导致负载转矩过大产生危险温度；未按要求采用铜铝过渡接头，接触处产生危险温度。","pages":[3],"topic":"电气安全"},{"id":"3-16","paper":3,"number":16,"type":"single","stem":"高压供电设备的电气开关主要在保障安全需求的基础上考虑便利性，某集团断路器—双隔离开关配电母线配线专利具有及广泛的适应性，采用隔离开关—断路器—隔离开关的方式实现安全及便利性共存保障35kV系统运行。针对上述专利情况的描述，下列描述符合规范的是（）。","options":{"A":"正常情况下，隔离开关用于小容量线路的控制和保护","B":"正常情况下，断路器只用来操作空载线路或空载变压器","C":"合闸时，依次关合电源侧、负荷侧隔离开关，最后合上断路器","D":"切断时，依次拉开负荷侧、电源侧隔离开关，最后拉开断路器"},"images":[{"src":"../assets/a78cd8f2ead7c910b45a1afa.png","alt":"第3套第16题原卷配图","width":1000,"height":552}],"answer":["C"],"explanation":"正常情况下，隔离开关用于隔断电压形成明显断开点；正常情况下，断路器用来控制及保护主开关；合闸时，依次关合电源侧、负荷侧隔离开关，最后合上断路器；切断时，首先拉开断路器，依次拉开负荷侧、电源侧隔离开关。","pages":[3,4],"topic":"电气安全"},{"id":"3-17","paper":3,"number":17,"type":"single","stem":"某烟花爆竹企业因突发爆炸事故导致现场两名操作人员撤离不及时当场死亡，事发后查阅现场操作记录、工业视频资料显示，由于动火作业不慎引燃烟火药堆垛，后续因应急处置不当发生二次闪爆。针对上述事故描述，下列各项说法正确的是（）。","options":{"A":"首次爆炸事故属于化学爆炸、气相爆炸","B":"二次爆炸事故属于化学爆炸、气相爆炸","C":"利用首次爆炸后空挡，针对烟火药进行覆盖隔离灭火","D":"二次爆炸形成的条件包括悬浮性爆炸扬尘、助燃物和点火源"},"images":[],"answer":["B"],"explanation":"烟火药堆垛首次爆炸事故属于化学爆炸、固相爆炸，二次爆炸事故属于化学爆炸、气相爆炸，利用首次爆炸后空挡，针对烟火药进行喷水降温，采用吊射的方式抑制爆炸性扬尘。烟火药的粉尘爆炸属于分解爆炸，形成的条件包括悬浮性爆炸扬尘和点火源能量。","pages":[4],"topic":"防火防爆"},{"id":"3-19","paper":3,"number":19,"type":"single","stem":"某机械离合器采用金属结构件作为结合零件实现和动力设备的结合—分离状态，是金属冲压剪切机械的控制系统核心。针对上述离合器形式，下列说法中最为符合要求的是（）。","options":{"A":"结合平稳，冲击和噪声小","B":"需要持续额外动力源，能使设备停在行程任意位置","C":"不需要持续额外动力源，正常状态使滑块停在上死点","D":"按结构特点属于刚性离合器，急停状态使设备停在上死点"},"images":[],"answer":["C"],"explanation":"按结构特点属于刚性离合器，冲击和噪声较大但是制动行程短，不需要持续额外动力源，正常状态使滑块停在上死点。","pages":[4,5],"topic":"机械与人机安全"},{"id":"3-21","paper":3,"number":21,"type":"single","stem":"等电位连接是保护导体和建筑物的金属结构、生产用金属设备以及允许用作保护线的金属管道等不带电导体之间的连接，属于保护接零系统的组成部分。如下图所示的等电位联结，各项说法中正确的是（）。","options":{"A":"①的最小截面积不得小于最大保护导体截面积的1/2","B":"②的截面积不得小于该设备保护零支线截面积的1/2","C":"①、③属于总等电位联结线","D":"②、④属于辅助等电位联结线"},"images":[{"src":"../assets/e65ae7a31676827b7ba22c67.jpg","alt":"第3套第21题原卷配图","width":834,"height":325}],"answer":["B"],"explanation":"①属于总等电位联结线最小截面积不得小于最大保护导体截面积的1/2且不得小于6mm；②属于辅助等电位联结线截面积不得小于该设备保护零支线截面积的1/2。","pages":[5],"topic":"电气安全"},{"id":"3-23","paper":3,"number":23,"type":"single","stem":"某大型物流企业检查在役起重机械，某型式起重机械设置力矩限制器、幅度限制器，针对上述安全装置反推起重机械的结构型式。下列选项中，最为可能的是（）。","options":{"A":"室外轨道上运行的门式起重机","B":"设置固定支座采用液压变幅的门座式起重机","C":"设置在固定地点采用动臂变幅的桅杆式起重机","D":"室内轨道上运行的单主梁桥式起重机"},"images":[],"answer":["C"],"explanation":"起重机设置力矩限制器则一定属于臂架式起重机，因此AD不符合要求；此外，由于液压变幅没有必要设置幅度限制器因此建议考生选择C。","pages":[6],"topic":"特种设备安全"},{"id":"3-25","paper":3,"number":25,"type":"single","stem":"管道工程质量检验主要包括外观检查、无损检测、压力试验、泄漏性试验、硬度检验、力学性能检验及其他检验等。其中，焊缝内部质量、细微缺陷通常采用无损检测进行判定。因此，下列无损检测要求中，符合规定的是（）。","options":{"A":"焊缝无损检测通常在焊缝焊接完成并经外观检查合格后进行","B":"对有延迟裂纹倾向的材料，无损检测应在热处理后进行","C":"对有再热裂纹倾向的焊缝，无损检测应至少在焊接完成24h后进行","D":"抽样检验发现不合格时，应进行返修或更换"},"images":[],"answer":["A"],"explanation":"对有延迟裂纹倾向的材料，无损检测应至少在焊接完成24h后进行；对有再热裂纹倾向的焊缝，无损检测应在热处理后进行；抽样检验发现不合格时，应按原规定的检验方法进行扩大检验。","pages":[6],"topic":"特种设备安全"},{"id":"3-26","paper":3,"number":26,"type":"single","stem":"某爆破片泄压装置的具体结构型式如下图所示，针对所示的爆破片结构特点、应用及适用范围的各项说法中，符合要求的是（）。","options":{"A":"适用高纯度介质场景、耐受腐蚀","B":"适用有冲击脉动载荷场所和真空条件","C":"反拱形爆破片，凹面朝向高压侧，可能产生碎片","D":"正拱型爆破片，耐受复杂工艺、工艺成本低"},"images":[{"src":"../assets/631fb7e3ffd8d8e728195c4b.jpg","alt":"第3套第26题原卷配图","width":311,"height":200}],"answer":["B"],"explanation":"图示属于反拱形爆破片，凸面朝向高压侧适用有冲击脉动载荷场所和真空条件。","pages":[6],"topic":"特种设备安全"},{"id":"3-27","paper":3,"number":27,"type":"single","stem":"保护导体和接地装置便于将故障设备构成闭合回路，便于故障告警、切断用于保护触电者的作业安全。其中的保护导体按照用途分为人工保护导体和自然保护导体，针对保护导体的各项说法要求最为符合规范要求的是（）。","options":{"A":"保护导体，包括有保护作用的PEN线不得安装单极开关和熔断器","B":"不得利用配线的钢管、蛇皮管、保温层的金属皮做保护导体","C":"采用单芯绝缘导线做保护导体，无机械防护的不得小于2.5mm2","D":"保护导体包括保护接地导体、中性导体和保护接地中性导体"},"images":[],"answer":["A"],"explanation":"保护导体可优先采用建筑物的金属结构件、起重机轨道、配线的钢管作为自然保护导体；采用单芯绝缘导线做保护零线，有机械防护的不得小于2.5mm2；保护导体包括接地导体、保护接地导体和保护联结导体。","pages":[6,7],"topic":"电气安全"},{"id":"3-28","paper":3,"number":28,"type":"single","stem":"针对某大型酿造企业的消防安全验收，设计院协同参与针对消防安全设施、防火分区、疏散设计等进行性能化评定。以其中的火灾自动报警系统为例，下列情景的探测器设置符合早期探测要求的是（）。","options":{"A":"开关间、变压器房采用点型感烟探测器","B":"高粱储库采用点型感温探测器（差温型）","C":"白兰地酒窖采用红外火焰探测器","D":"电缆夹层、电缆桥架采用点型感烟探测器"},"images":[],"answer":["A"],"explanation":"高粱储库采用点型感烟探测器、白兰地酒窖采用紫外火焰探测器符合早期探测要求。电缆夹层、电缆桥架采用缆式线型感温探测器用于电气火灾的早期探测。","pages":[7],"topic":"防火防爆"},{"id":"3-32","paper":3,"number":32,"type":"single","stem":"剩余电流保护装置在实现接地保护速断的同时，也能适用于直接接触电击的防护具有广泛的应用意义。但是，下列设备或者供电回路中满足一定需求可不设置剩余电流保护装置的是（）。","options":{"A":"电源插座或插座回路","B":"用于公共场所安全、消防电源的设备","C":"采用Ⅰ类触电防护的移动式、手持式电气设备","D":"采用安全隔离变压器供电且二次侧不接地的电气设备"},"images":[],"answer":["A"],"explanation":"用于公共场所安全、消防电源的设备应设置报警式剩余电流保护装置；采用Ⅰ类触电防护的移动式、手持式电气设备应设置剩余电流保护装置；采用安全隔离变压器供电且二次侧不接地的电气设备，可不设置剩余电流保护装置。","pages":[7],"topic":"电气安全"},{"id":"3-33","paper":3,"number":33,"type":"single","stem":"机械设备运行中的危险包括机械性危险、非机械性危险，以木工机械设备为例下列的各项说法中既满足设计要求也属于消减非机械性危险的措施是（）。","options":{"A":"圆锯片的夹紧法兰至少为锯片最大设计直径的1/4","B":"圆锯片和法兰盘应与锯轴同心","C":"锯条接头之间长度应为总长1/5以上且与锯条厚度一致","D":"木工平刨床组装后的装刀槽应为封闭式或半敞开式"},"images":[],"answer":["B"],"explanation":"圆锯片的夹紧法兰至少为锯片最大设计直径的1/4，保障圆锯片的夹紧力防止机械性危险；圆锯片和法兰盘应与锯轴同心，防止圆锯片的震颤属于消减非机械性危险；锯条接头之间长度应为总长1/5以上且与锯条厚度一致，防止锯条崩断打击伤害属于防止机械性危险；木工平刨床组装后的装刀槽应为封闭式或半封闭式结构防止机械性危险。","pages":[7,8],"topic":"机械与人机安全"},{"id":"3-34","paper":3,"number":34,"type":"single","stem":"燃烧机理包括链式反应机理、过氧化物机理、活化能机理等，其中的活化能机理经过上百年的丰富完善最浅显易懂但是也暴漏出部分缺陷并不能完全介质燃烧爆炸过程。链式反应机理的过程，相对而言更贴近实际燃爆过程，下列各项说法中符合链式反应机理的是（）。","options":{"A":"由外界刺激使分子键破坏产生自由基定义为引发阶段","B":"自由基与反应物生成燃烧分子和新自由基属于自由基终止","C":"压力较低，自由基相互碰撞生成分子","D":"压力较高，自由基撞击器壁将能量散失或被吸附"},"images":[],"answer":["A"],"explanation":"由外界刺激使分子键破坏产生自由基定义为引发阶段；稳定性差的自由基与反应物作用生成燃烧产物分子和新的自由基属于自由基发展阶段；压力较高，自由基相互碰撞生成分子；压力较低，自由基撞击器壁将能量散失或被吸附。","pages":[8],"topic":"防火防爆"},{"id":"3-35","paper":3,"number":35,"type":"single","stem":"起重作业中最常发生的重物坠落事故，按照具体形式包括断绳、脱绳、断钩和脱钩事故。吊装作业现场检查中发现下列情况：①被吊重物受到撞击导致摇摆不定；②歪拉斜吊；③被吊重物捆绑不牢；④钢丝绳绳长选择不足导致吊装固定点相距太远；⑤护钩装置失效。上述情况，主要导致脱绳事故的是（）。","options":{"A":"②","B":"①③","C":"④","D":"⑤"},"images":[],"answer":["B"],"explanation":"①被吊重物受到撞击导致摇摆不定，主要导致脱绳；②歪拉斜吊，主要导致起升绳断裂；③被吊重物捆绑不牢，主要导致脱绳；④钢丝绳绳长选择不足导致吊装固定点相距太远，主要导致吊装绳断裂；⑤护钩装置失效，主要导致脱钩。","pages":[8],"topic":"特种设备安全"},{"id":"3-36","paper":3,"number":36,"type":"single","stem":"锅炉的外部检验一般每年进行一次，内部检验一般每2年进行一次，水压试验一般每6年进行一次。除进行正常的定期检验外，锅炉还应进行内部检验的情况是（）。","options":{"A":"新安装的锅炉运行前","B":"移装的锅炉运行前","C":"停运的锅炉恢复运行前","D":"紧急停炉的锅炉恢复运行前"},"images":[],"answer":["B"],"explanation":"锅炉有下列情况之一时，应进行内部检验（1）新安装的锅炉在运行一年后。（2）移装锅炉投运前。（3）锅炉停止运行一年以上恢复运行前。（4）受压元件经重大修理或改造后及重新运行一年后。（5）上次内部检验结果和锅炉运行情况对设备安全可靠性有怀疑时。（6）根据外部检验结果和锅炉运行情况，对设备安全可靠性有怀疑时。","pages":[8],"topic":"特种设备安全"},{"id":"3-37","paper":3,"number":37,"type":"single","stem":"防火防爆安全措施的落实执行中会发现部分安全措施兼具预防性、减轻性效果，类似于气体惰化系统在应用中能有效防止形成爆炸性混合物，在火灾发生后也能降低氧含量从而压灭初期火灾。综上所述，下列的汽油储罐所采取的技术措施中兼具预防性、减轻性效果的是（）。","options":{"A":"储罐设置防火堤、围堰和事故储池","B":"路面采用钢纤维石墨导电混凝土","C":"防火堤内设置可燃气体探测报警系统","D":"罐体设置水雾系统、细水雾灭火系统"},"images":[],"answer":["D"],"explanation":"储罐设置防火堤、围堰和事故储池，属于减轻性措施防止火灾蔓延扩散；路面采用钢纤维石墨导电混凝土，属于预防性措施消除点火源；防火堤内设置可燃气体探测报警系统，属于预防性措施防止产生爆炸性混合物；罐体设置水雾系统、细水雾灭火系统，兼具预防性、减轻性效果，正常状态下能降温防止阳光直射导致介质被引燃，火灾状态下也能针对邻近罐冷却降温防止火灾蔓延。","pages":[8],"topic":"防火防爆"},{"id":"3-38","paper":3,"number":38,"type":"single","stem":"大型游乐设施的安全防护措施作为隔离防护的第一道屏障是守护游乐安全的基本保障，常见的型式包括安全栅栏、安全网。下列各项防护措施的设计要求中，符合要求的是（）。","options":{"A":"安全栅栏开启方向不应与乘客行进方向相同","B":"安全栅栏共用进出口通道时，在进口处宜有引导栅栏","C":"安全栅栏的间隙和距离地面的间隙应当不大于120mm","D":"安全栅栏的高度应当不低于1050mm"},"images":[],"answer":["C"],"explanation":"安全栅栏开启方向应与乘客行进方向一致（特殊情况除外）安全栅栏应当分别设进出口通道时，在进口处宜有引导栅栏；安全栅栏的间隙和距离地面的间隙应当不大于120mm；安全栅栏的高度应当不低于1100mm。","pages":[8],"topic":"特种设备安全"},{"id":"3-39","paper":3,"number":39,"type":"single","stem":"场内专用机动车辆的日常管理和定期检查维护是保障车体工况的主要手段，使用单位应结合工况、车况和运行要求综合确定检查周期频次要求。下列的定期检查中，符合要求的是（）。","options":{"A":"年度检查包括隔爆部件隔爆面、箱盖可靠性，浇封面完整性","B":"每月检查包括指示系统的可靠性和精度、电气控制系统的检查","C":"轮胎胎压、警示装置、仪表显示属于每日投用前的检查","D":"月度检查包括动力系统、转向系统和载荷实验"},"images":[],"answer":["A"],"explanation":"指示系统的可靠性和精度、电气控制系统的检查属于年度检查项目；轮胎胎压、警示装置、仪表显示属于月度检查要求；月度检查包括动力系统、转向系统，但是载荷实验属于年度检查要求。","pages":[8,9],"topic":"特种设备安全"},{"id":"3-40","paper":3,"number":40,"type":"single","stem":"某加油加气母站实现天然气、航空煤油区域性调配，将通过长输油管道送至现场的轻柴油经过调和、添加后适用于高原缺氧性环境。油品调和作业中，为防范静电引燃风险，下列措施中不符合规范要求的是（）。","options":{"A":"调和管道采用金属材质，法兰接头采用金属垫片","B":"静电接地桩设置在防火堤内，接地线采用多股铜芯软线","C":"作业区外设置人体静电导除装置","D":"增设末端扩散缓冲器，绝缘法兰两侧分别设独立接地线"},"images":[],"answer":["B"],"explanation":"可燃液体储罐的防雷接地装置不得设在防火堤内。","pages":[9],"topic":"电气安全"},{"id":"3-42","paper":3,"number":42,"type":"single","stem":"按照规范《烟花爆竹工程设计安全规范》明确危险建筑物的危险等级，按照其规定划分为1.1、1.3级别。 下列关于1.1级厂房的各项说法中，正确的是（）。","options":{"A":"具有燃烧危险，较小爆炸或迸射危险但无整体爆炸危险","B":"工作间联建时采用密实砌体墙隔开，联建间数不应超过6间","C":"可设置生产辅助用房，类似工器具室","D":"厂房人均使用面积不宜少于9.0m2"},"images":[],"answer":["D"],"explanation":"1.1级厂房具有整体爆炸危险性，当采用抗爆间室、隔离操作时可以联建。1.1级厂房不应设置除更衣室外的辅助用房。","pages":[9],"topic":"防火防爆"},{"id":"3-46","paper":3,"number":46,"type":"single","stem":"铸造成型作业在中国已有上千年的历史沉淀，在二里头遗址中就出土过早期泥范铸造的礼器。但是，不可否认的是铸造作业伴随诸多的有害因素，下列关于铸造作业有害因素的说法中，最为恰当的是（）。","options":{"A":"熔融金属灼烫伤是铸造作业最主要的伤害类型","B":"铸造作业中散发的热量导致高温和电离辐射","C":"烘烤砂型和砂芯时产生的二氧化碳导致血氧窒息","D":"铸型、砂芯干燥和浇铸作业中的二氧化硫引起呼吸道疾病"},"images":[],"answer":["D"],"explanation":"机械致害是铸造作业最主要的伤害类型；铸造作业中散发的热量导致高温和热辐射；烘烤砂型和砂芯时产生的二氧化碳导致物理性窒息；铸型、砂芯干燥和浇铸作业中的二氧化硫引起呼吸道疾病。","pages":[10],"topic":"机械与人机安全"},{"id":"3-49","paper":3,"number":49,"type":"single","stem":"有些危险化学品具有放射性，如果人体直接暴露在存在此类危险化学品的环境中，就会产生不同程度的损伤。高强度的放射线对人体造血系统造成伤害后，人体表现的主要症状为（ ）。","options":{"A":"恶心、腹泻、流鼻血等","B":"震颤、呕吐、腹泻等","C":"恶心、脱发、痉挛等","D":"嗜睡、昏迷、震颤等"},"images":[],"answer":["A"],"explanation":"放射性危险化学品对造血系统的伤害。这种伤害主要表现为恶心、呕吐、腹泻，但很快能好转，经过2～3周无症状之后，出现脱发、经常性流鼻血，再出现腹泻，极度憔悴，通常在2～6周后死亡。","pages":[10,11],"topic":"危险化学品安全"},{"id":"3-50","paper":3,"number":50,"type":"single","stem":"某烟花爆竹半成药进行性能检测期间发现两项主要问题：首先，燃烧速率太快导致开球后不能形成完美球状疏散焰；其次，混药期间极易产生和积累静电导致可预见的灾难性事故。针对上述情况，下列说法中正确的是（）。","options":{"A":"可通过添加敏化剂降低感度","B":"可通过添加降速剂降低燃烧速率","C":"产生和积累静电主要受摩擦感度影响","D":"燃烧速率标志烟火药做功能力的参量"},"images":[],"answer":["B"],"explanation":"燃烧速率太快导致开球后不能形成完美球状疏散焰，可通过添加降速剂降低燃烧速率，燃烧速率标志火药能量释放的能力；混药期间极易产生和积累静电主要受静电感度影响，可通过添加钝化剂降低感度。","pages":[11],"topic":"防火防爆"},{"id":"3-52","paper":3,"number":52,"type":"single","stem":"燃烧在燃烧学原理的定义中通常被界定为可控能量释放，有效识别定义燃烧类型是提高燃烧效率的基础条件。因此，下列燃烧类型的定义分类中正确的是（）。","options":{"A":"沥青、石蜡等熔点较低的固体受热熔融燃烧属于蒸发燃烧","B":"木炭、金属镁等分子结构简单的固体兼有分解和表面燃烧","C":"木材、纸张等分子结构复杂的固体分解成气体的燃烧属于阴燃","D":"闭杯法测量可燃液体爆炸极限形成的闪爆属于扩散燃烧"},"images":[],"answer":["A"],"explanation":"沥青、石蜡等熔点较低的固体受热熔融燃烧属于蒸发燃烧；木炭、金属镁等分子结构简单的固体属于表面燃烧；木材、纸张等分子结构复杂的固体分解成气体的燃烧属于分解燃烧；闭杯法测量可燃液体爆炸极限形成的闪爆属于预混燃烧。","pages":[11],"topic":"防火防爆"},{"id":"3-54","paper":3,"number":54,"type":"single","stem":"民用爆炸品生产场所的电气设备防爆、防雷及静电措施、消防系统是建筑安全设计中的重要环节，下列关于电气设备防爆要求的定义中，不符合要求的是（）。","options":{"A":"投光灯起爆药、火工品制造场所，属于F0区域","B":"F0区照明采用安装在建筑外墙的壁龛灯或室外的","C":"F1区选用尘密结构型、本质安全型、增安型（限灯、控制按钮）","D":"F2区选用密封性、防水防尘型设备"},"images":[],"answer":["A"],"explanation":"起爆药、火工品制造场所，属于F1区域。","pages":[12],"topic":"电气安全"},{"id":"3-55","paper":3,"number":55,"type":"single","stem":"静电电压等级高、放电形式多，通常并没有直接致死的可能性，而一般定义下的静电防护技术主要是防止由于静电放电导致的二次事故。因此，下列符合规定的安全技术措施中属于静电防护的是（）。","options":{"A":"管道连接处尽量采用止口连接型法兰","B":"敲打工具应用铍青铜或包铜的钢制作","C":"管道连接处设置波纹管、膨胀节","D":"管流介质添加TK-1并保持在2.5ppm"},"images":[],"answer":["D"],"explanation":"管道连接处尽量采用止口连接型法兰，用于保证设备密闭性；敲打工具应用铍青铜或包铜的钢制作，用于防止撞击打火；供电回路设置电涌保护器用于防止雷击过电压。","pages":[12],"topic":"电气安全"},{"id":"3-56","paper":3,"number":56,"type":"single","stem":"机械产品设计应考虑维修性，以确保机械产品一旦出现故障，易发现、易检修。下列机械产品设计要求中，不属于维修性考虑的是（）。","options":{"A":"足够的检维修和操作空间","B":"关键零部件的冗余化设计","C":"故障部位置于危险区以外","D":"零部件的标准化与互换性"},"images":[],"answer":["B"],"explanation":"维修性设计应考虑以下要求：将维护、润滑和维修设定点放在危险区之外；检修人员接近故障部位进行检查、修理、更换零件等维修作业的可达性，即安装场所可达性(有足够的检修活动空间)、设备外部的可达性(考虑封闭设备用于人员进行检修的开口部分的结构及其固定方式)、设备内部的可达性(设备内部各零、组部件之间的合理布局和安装空间)；零、组部件的标准化与互换性，同时，必须考虑维修人员的安全。","pages":[12],"topic":"机械与人机安全"},{"id":"3-57","paper":3,"number":57,"type":"single","stem":"在一定的高温环境下，压力管道会随时间的延长而发生缓慢持续的延展收缩（蠕变）。下列关于蠕变失效的特征和预防措施的说法中，正确的是（）。","options":{"A":"常位于弯头等高拉伸应力区域和承受弯曲应力的管道端部","B":"主要方法是通过防腐蚀涂层和阴极保护联合使用","C":"管道弯头、阀门处的破裂变形主要由于蠕变所致","D":"金相检测、无损探伤是预防蠕变的重要取样检测手段"},"images":[],"answer":["A"],"explanation":"预防蠕变措施之一为加强定期检验。按期进行定期检验，并在定期检验中重点检查设置的监察管段的变化情况，进行必要的化学分析、金相分析，必要时应在管路中设置可拆卸管段以供检验分析取样和破坏性检验。","pages":[12],"topic":"特种设备安全"},{"id":"3-58","paper":3,"number":58,"type":"single","stem":"某大型游乐设施采用特殊的操纵控制方式，通过放行联锁装置实现运行安全，具体方式如下：①服务人员检查安全压杠后按压通行按钮，操作人员观察到绿灯常亮后操纵控制装置正常启动；②操纵控制装置监控设备工作状态，放行绿灯常亮之前，设备不能被启动。针对上述情况，下列说法中正确的是（）。","options":{"A":"人作为监督者、管理者，控制命令由操作人员提出","B":"系统安全性取决于机器本质安全性、人低负荷应急反应能力","C":"半自动化系统，操作失误机器会拒绝命令或提出警告","D":"人机串联系统，能有效提高系统可靠度"},"images":[],"answer":["C"],"explanation":"半自动化系统，操作失误机器会拒绝命令或提出警告；人机并联系统，可靠度实际上是降低的；人作为操作者和控制者，控制命令由操作人员提出；系统安全性取决于人机功能分配的合理性。","pages":[12],"topic":"特种设备安全"},{"id":"3-59","paper":3,"number":59,"type":"single","stem":"危险货物包装是化学品储运安全的基础，包装方法得当，就会降低储存、运输过程中的风险。关于危险货物包装的说法，正确的是（）。","options":{"A":"爆炸品的包装按其内装物危险程度分为Ⅰ类、Ⅱ类和Ⅲ类","B":"具有两种以上危险性时，其包装类别应按危险性小的确定","C":"液体爆炸品容器的封闭形式，应具有防止渗漏的双重保护","D":"对于刚用完的危险化学品包装物容器，可直接重复使用"},"images":[],"answer":["C"],"explanation":"A选项，根据《危险货物运输包装类别划分方法》（GB/T15098）规定，除了爆炸品、气体、有机过氧化物和自反应物质，感染性物质、放射性物质，杂项危险物质和物品及净质量大于40kg和容积大于450L的包装外，其他危险货物按其内装物的危险程度将包装划分为I类、Ⅱ类和Ⅲ类。B选项，货物具有两种以上危险性时，其包装类别须按级别高的确定。D选项，对重复使用的危险化学品包装物，容器，使用单位在重复使用前应当进行检查；发现存在安全隐患的，应当维修或者更换。","pages":[12],"topic":"危险化学品安全"},{"id":"3-61","paper":3,"number":61,"type":"single","stem":"某生产经营单位决定对本单位所使用的搪玻璃压力容器进行年度安全检查，下列为列举的检查项目根据《固定式压力容器安全技术监察规程》不属于搪玻璃压力容器年度检查项目的是（）。","options":{"A":"管口、支撑件等连接部位是否有开裂、拉脱现象","B":"压力容器外表面防腐漆是否完好，是否有锈蚀、腐蚀现象","C":"密封面是否有泄漏","D":"夹套底部疏水口开闭是否灵活"},"images":[],"answer":["A"],"explanation":"搪玻璃压力容器年度检查项目包括：压力容器外表面防腐漆是否完好，是否有锈蚀、腐蚀现象；密封面是否有泄漏；夹套底部疏水口开闭是否灵活；夹套顶部放气口开闭是否灵活。","pages":[13],"topic":"特种设备安全"},{"id":"3-62","paper":3,"number":62,"type":"single","stem":"民用爆炸品中的乳化炸药在建筑、开采等多领域中有着广泛应用，乳化炸药通常将水相材料和油相爆炸物在高速转动和强剪切力作用下，借助乳化作用形成的基质，继而通过敏化作用得到油包水型爆炸物质。下列针对乳化炸药生产中的火灾爆炸危险因素，主要来自于（）。","options":{"A":"物质的危险性","B":"生产设备的高速旋转摩擦力","C":"水油两相介质之间的剪切力","D":"温湿度、蒸气压等环境因素"},"images":[],"answer":["A"],"explanation":"生产中的危险特性主要由于介质本身的危险性，在此基础上由于生产设备的高速旋转摩擦力、水油两相介质之间的剪切力和温湿度、蒸气压等环境因素影响作业安全。","pages":[13],"topic":"防火防爆"},{"id":"3-63","paper":3,"number":63,"type":"single","stem":"通过《妇女权益保障法》《女职工劳动保护特别规定》等法律确立保护框架，明确用人单位对女性用工的限制并不是职业限制，而是基于人机作业环境、生理特性的特殊保护。下列作业方式符合女工用工标准，但是不适用于经期从事的劳动范围包括（）。","options":{"A":"大强度的挖掘搬运作业","B":"操作、控制仪器，查看设备和上臂用力为主的装配作业","C":"体力劳动强度指数20的作业","D":"搬重物、锯刨或凿硬木"},"images":[],"answer":["D"],"explanation":"大强度的挖掘搬运作业属于Ⅳ级体力劳动强度，属于女工禁忌作业；操作、控制仪器，查看设备和上臂用力为主的装配作业属于Ⅰ级体力劳动强度，经期女工可以从事；体力劳动强度指数20的作业属于Ⅱ级体力劳动强度，经期女工可以从事；搬重物、锯刨或凿硬木属于Ⅲ级体力劳动强度，属于女工允许但是经期禁忌作业。","pages":[13],"topic":"机械与人机安全"},{"id":"3-66","paper":3,"number":66,"type":"single","stem":"按照上级主管部门要求，企业应逐步落实场内专用机动车辆的安全装置，下列关于叉车受力结构、安全保护和防护装置的各项说法定义中正确的是（）。","options":{"A":"型钢焊接而成的护顶架，应进行载荷和拉伸试验","B":"高压胶管通过耐压试验、长度变化试验、替代实验等","C":"取物装置应通过反复加载的载荷试验","D":"通过货物稳定器防止货物向后坠落"},"images":[],"answer":["C"],"explanation":"型钢焊接而成的护顶架，应进行静态和动态载荷试验；高压胶管通过耐压试验、长度变化试验、脉冲试验等；取物装置应通过反复加载的载荷试验；通过挡货架防止货物向后坠落。","pages":[14],"topic":"特种设备安全"},{"id":"3-67","paper":3,"number":67,"type":"single","stem":"机械设备按照运动方式划分，包括直线运动、转动和转动直线运动同时存在三种情况，其中直线运动的机械主要极易导致穿刺挤压式穿透性伤害。下列属于正确的直线运动的危险部位及防护措施的是（）。","options":{"A":"带锯机设置可调节式锯齿防护罩","B":"检维修过程中的剪刀式升降机设置帘布加以封闭","C":"移动式平衡配重在靠近操作者的区域设置防护罩","D":"辊式输送机在驱动轴的下游安装防护罩"},"images":[],"answer":["A"],"explanation":"操作过程中的剪刀式升降机设置帘布加以封闭；移动式平衡配重在全程设置防护罩；辊式输送机在驱动轴的下游安装防护罩，属于转动运动方式不符合题意。","pages":[14],"topic":"机械与人机安全"},{"id":"3-68","paper":3,"number":68,"type":"single","stem":"气瓶充装作业应充分考虑介质特点和物性参数，制定符合充装作业要求的特殊规定以适应安全需求。以其中的压缩气体为例，下列各项说法中符合要求的是（）。","options":{"A":"充装后的重量不得超过气瓶的设计规定值","B":"充装氟或二氟化氧的气瓶最大重装量不得大于10Kg","C":"氢气中含氧量或氧气中含氢量超过0.5%（体积比）应停止作业","D":"充装电解法制氢气、氧气，应装设可燃气体检测仪器和报警装置"},"images":[],"answer":["C"],"explanation":"充装电解法制氢气、氧气，应装设氢氧浓度检测仪器和报警装置；充装氟或二氟化氧的气瓶最大重装量不得大于5Kg","pages":[14],"topic":"特种设备安全"},{"id":"3-72","paper":3,"number":72,"type":"multiple","stem":"某单位沉降消解池进行清淤作业，池内包括硫化氢、氰化氢、一氧化碳等有毒、剧毒类气体，作业前经过工艺处置但一直未能达到作业要求（中高浓度剧毒环境），于是经逐级审批辨识给清理作业人员配置合适的防护后交替作业。与此同时，现场设置应急物资柜满足复杂性环境中的救援作业。因此，下列关于防护装置的配置定义及配置情况中得当的是（）。","options":{"A":"防护用具是防止毒性化学品进入体内的主要物理屏障","B":"清理作业属于中高浓度剧毒性环境，人员配置双罐式防毒面具","C":"清理作业属于中高浓度剧毒性环境，人员配置动力送风呼吸面罩","D":"应急施救属于复杂环境救援作业，人员配置供气式全面罩","E":"应急施救属于复杂环境救援作业，人员配置携气式空气呼吸器"},"images":[],"answer":["C","E"],"explanation":"防护用具是防止毒性化学品进入体内的最后一道物理屏障；清理作业属于中高浓度剧毒性环境，人员配置动力送风呼吸面罩；应急施救属于复杂环境救援作业，人员配置携气式空气呼吸器。","pages":[15],"topic":"危险化学品安全"},{"id":"3-73","paper":3,"number":73,"type":"multiple","stem":"某石化企业的增稠车间属于爆炸性21区，同时存在爆炸性飞絮、非导电性粉尘，参照设计文件要求电气设备外壳满足“防尘”、“防喷水”要求并通过提供特殊防护以适应规定环境。针对上述情景，下列能适用的防爆型设备应选择（）。","options":{"A":"Ex d ⅢB T150℃ Db","B":"Ex tc ⅢC T150℃ Dc","C":"Ex tb ⅢB T150℃ Db","D":"Ex ta ⅢA T150℃ Da","E":"Ex id ⅢB T150℃ Da"},"images":[],"answer":["C","E"],"explanation":"属于爆炸性21区，因此固有保护级别不应低于b级导致B选项不满足要求；此外，隔爆型式d适用于爆炸性气体环境，因此A选项不满足要求；上述区域同时存在爆炸性飞絮、非导电性粉尘，因此D选项不满足要求。","pages":[15],"topic":"电气安全"},{"id":"3-74","paper":3,"number":74,"type":"multiple","stem":"某球罐用于高压液化石油气储存，乙烯爆炸极限按照2.0%~10%确定（参照企业安全设计专篇，由于C3介质含量影响导致）。按要求设置可燃气体探测系统防止爆炸性介质的泄漏积蓄，下列检查检查结果中符合规范要求的是（）。","options":{"A":"探测器设置在距地面0.3~0.5m间","B":"探测器采用三芯屏蔽线，芯线截面积1.5mm2","C":"探测器标识具有消防产品型式认证","D":"探测器距潜在泄漏点的距离1m","E":"探测器的一级报警设定值取1.0%"},"images":[],"answer":["A","B","D"],"explanation":"探测器设置在距地面0.3~0.5m间，符合要求；探测器采用三芯屏蔽线，芯线截面积1.5mm2，符合要求；探测器标识具有消防产品型式认证，但也应具备防爆标识；探测器距潜在泄漏点的距离1m，符合要求；探测器的一级报警设定值不应超过爆炸下限的25%，在工贸企业中一般取值爆炸下限的20%。","pages":[15],"topic":"防火防爆"},{"id":"3-75","paper":3,"number":75,"type":"multiple","stem":"金属铸造工艺的熔炼设备包括冲天炉、电炉，通过不同的供能供热方式实现金属熔炼。下列关于熔炼设备的安全技术要求，符合规范要求的是（）。","options":{"A":"冲天炉及冲天炉加料机的高空平台及地坑周边应设置护栏","B":"冲天炉加料机设置制动器和料桶上升/下降极限位置限制器","C":"电炉加料平台设置一氧化碳浓度检测装置及警示标志","D":"电炉加料机运行时发出声光报警信号","E":"冲天炉和电炉加料机上均应设置急停按钮"},"images":[],"answer":["A","B","D","E"],"explanation":"冲天炉及冲天炉加料机的高空平台及地坑周边应设置护栏；冲天炉加料机设置制动器和料桶上升/下降极限位置限制器；冲天炉加料平台设置一氧化碳浓度检测装置及警示标志；电炉加料机运行时发出声光报警信号；冲天炉和电炉加料机上均应设置急停按钮。","pages":[15],"topic":"机械与人机安全"},{"id":"3-76","paper":3,"number":76,"type":"multiple","stem":"系统接地是非安全电压供电的电气设备实现间接接触电击的重要防护措施，能有效降低故障电压抑或通过安全装置实现速断。以下图所述的供电保护方式而言，下列各选项说法中符合要求的是（）。","options":{"A":"属于TT系统，适用于低压小型用户的直接供电","B":"属于TN系统，适用于用电设备复杂的配电场所及非生产性楼房","C":"PEN线被称作保护接地中性导体","D":"设备外露可导电部分与电源端接地点有直接电气连接","E":"个别设备采用接地保护时，应装有快速切断故障的自动保护装置"},"images":[{"src":"../assets/79c1882c495866e3b6905846.jpg","alt":"第3套第76题原卷配图","width":397,"height":331}],"answer":["C","D","E"],"explanation":"属于TN系统中的TN-C系统，适用于火灾爆炸危险性较小、用电设备简单的场所；PEN线被称作保护接地中性导体；设备外露可导电部分与电源端接地点有直接电气连接；个别设备采用接地保护时，应装有快速切断故障的自动保护装置。","pages":[15,16],"topic":"电气安全"},{"id":"3-77","paper":3,"number":77,"type":"multiple","stem":"某爆炸事故调查中发现，爆炸现场存留大小不一的炸坑标志物，现场存留爆炸坑2.2m、深度0.3m，爆炸物TNT转换当量系数为0.65（1吨爆炸物相当于0.65吨TNT）。针对爆炸现场可参照下列方式估算，W_TNT表示爆炸源的TNT当量（Kg）、d代表炸坑的直径（m）、h代表炸坑的深度（m）。  按照上述行业事故隐患判定标准，工位爆炸物储量不应超过30Kg，否则应判定属于事故隐患。综上所述，下列说法中正确的是（）。","options":{"A":"按照炸坑标志物确认，属于典型的凝聚态爆炸","B":"按照炸坑标志物确认，爆炸物储量29.8Kg","C":"按照炸坑标志物确认，判定不属于事故隐患","D":"按照炸坑标志物确认，爆炸物储量45.9Kg","E":"按照炸坑标志物确认，判定属于事故隐患"},"images":[{"src":"../assets/1dec800c29867cc0abed3384.png","alt":"第3套第77题原卷配图","width":417,"height":127}],"answer":["A","D","E"],"explanation":"事故面存在炸坑标志物，属于典型的凝聚态爆炸；按照炸坑标志物确认，爆炸TNT当量29.8Kg、爆炸物储量45.9Kg，判定属于事故隐患。","pages":[16],"topic":"防火防爆"},{"id":"3-78","paper":3,"number":78,"type":"multiple","stem":"参照人机工程学概论，人机串联系统应依照人、机特点实现工作分类，通过人机协同作业保障系统安全运行。以5类切削机床为例，下列各项人机功能分类正确的是（）。","options":{"A":"自动更换工件或棒料进给系统，赋予操作者完成","B":"设置模式下的调整、测试工作，赋予操作者完成","C":"高温、高湿等恶劣环境的作业，赋予操作者完成","D":"降速模式下的维护和检修作业，赋予操作者完成","E":"自动模式下工作状态的实时反馈，赋予机械完成"},"images":[],"answer":["B","D","E"],"explanation":"自动更换工件或棒料进给系统，赋予机械完成；设置模式下的调整、测试工作，赋予操作者完成；高温、高湿等恶劣环境的作业，赋予机械完成；降速模式下的维护和检修作业，赋予操作者完成；自动模式下工作状态的实时反馈，赋予机械完成。","pages":[16],"topic":"机械与人机安全"},{"id":"3-79","paper":3,"number":79,"type":"multiple","stem":"钢丝绳及卷筒的防松防脱装置是起重机械的安全装置，主要用于卷筒侧的固定承载。以施工现场的塔式起重机为例，下列关于放松防脱装置的各项说法中，符合规定的是（）。","options":{"A":"严禁使用接长的钢丝绳","B":"吊具处于最低点，钢丝绳在卷筒上不应少于2圈（除固定绳尾圈数外）","C":"绳夹固定时，绳夹连接强度不小于钢丝绳破断拉力的85%","D":"压板固定时，固定强度不低于钢丝绳破断拉力的80%","E":"多根钢丝绳承受时，装设能够有效保证各根钢丝绳受力均衡的装置"},"images":[],"answer":["C","E"],"explanation":"除辅助机构外，不允许使用接长的钢丝绳；塔式起重机吊具处于最低点，钢丝绳在卷筒上不应少于3圈（除固定绳尾圈数外）；绳夹固定时，绳夹连接强度不小于钢丝绳破断拉力的85%；压板固定时，固定强度不低于钢丝绳破断拉力的80%(塔式起重机为100%)；多根钢丝绳承受时，装设能够有效保证各根钢丝绳受力均衡的装置。","pages":[16,17],"topic":"特种设备安全"},{"id":"3-80","paper":3,"number":80,"type":"multiple","stem":"防雷装置包括外部防雷装置和内部防雷装置，外部防雷装置由接闪器、引下线和接地装置组成。内部防雷装置主要指防雷等电位联结及防雷间距，关于防雷装置安全技术的说法，正确的有（）。","options":{"A":"避雷线一般采用截面积不小于50mm2的热镀铜钢绞线","B":"用金属屋面做接闪器时，金属板之间搭接长度不得小于100mm","C":"阀式避雷器的接地电阻一般不应大于5Ω","D":"接地电阻满足要求前提下，防雷接地装置可以和其他接地装置共用","E":"引下线截面锈蚀30%以上时应予以跨接"},"images":[],"answer":["B","C"],"explanation":"避雷线一般采用截面积不小于50mm2的热镀锌钢绞线或铜绞线；用金属屋面做接闪器时，金属板之间搭接长度不得小于100mm；阀式避雷器的接地电阻一般不应大于5Ω；除独立避雷针以外，接地电阻满足要求前提下，防雷接地装置可以和其他接地装置共用；引下线截面锈蚀30%以上时应予以更换。","pages":[17],"topic":"电气安全"},{"id":"3-81","paper":3,"number":81,"type":"multiple","stem":"按照《建筑设计防火规范》和建筑防爆设施应用手册等规定要求，建筑内的爆炸性区域应通过平面布局、泄压设施将区域内的爆炸波导至安全区域，从而消减对建筑、设备和人员的影响。下列各项关于区域防爆的各项说法中，正确的是（）。","options":{"A":"尽量减少泄压设施的单位质量（重力惯性）和连接强度","B":"泄压设施的设置应避开有爆炸危险的部位区域","C":"泄压窗应采用平推床、百叶窗或中悬窗","D":"分段计算泄压面积，不得采用计算段中的公共截面作为泄压面积","E":"有冰雪积蓄风险的区域严禁采用屋面泄压设施"},"images":[],"answer":["A","D"],"explanation":"尽量减少泄压设施的单位质量（重力惯性）和连接强度；泄压设施的设置应靠近有爆炸危险的部位区域；泄压窗应采用平推床、中悬窗；分段计算泄压面积，不得采用计算段中的公共截面作为泄压面积；有冰雪积蓄风险的区域采用屋面泄压设施时，应采取措施防止冰雪积蓄。","pages":[17],"topic":"防火防爆"},{"id":"3-82","paper":3,"number":82,"type":"multiple","stem":"压力容器的维护保养保障起处于完好状态，能有效提高工作效率并延长使用寿命，下列各项压力容器保养要求的说法正确的是（）。","options":{"A":"保持容器的干燥和清洁，防止大气腐蚀","B":"停用的设备，腐蚀性介质要排放、置换并清洗防止积存","C":"承装氧气的设备，氧气经过干燥或经常排放容器中的积水","D":"一氧化碳只有在含水分情况下对钢制容器产生应力腐蚀","E":"含有稀碱液的容器，采取措施保证碱液不会被稀释"},"images":[],"answer":["A","B","C","D"],"explanation":"含有稀碱液的容器，采取措施保证碱液不会被浓缩。","pages":[17],"topic":"特种设备安全"},{"id":"3-83","paper":3,"number":83,"type":"multiple","stem":"接触腐蚀性危险化学品会对人体造成伤害。关于腐蚀性危险化学品对人体危害的说法，正确的有（）。","options":{"A":"部分腐蚀性化学品会产生有毒蒸汽","B":"表皮黏膜组织的严重灼伤会引发炎症","C":"液体、气体腐蚀性物质会进入人体内部器官","D":"腐蚀性危险化学品会引起表皮细胞组织破坏造成灼伤","E":"人体组织接触腐蚀性危险化学品可能造成电离"},"images":[],"answer":["A","B","C","D"],"explanation":"腐蚀性物品接触人的皮肤、眼睛、肺部、食道等，会引起表皮细胞组织发生破坏作用而造成灼伤，而且被腐蚀性物品灼伤的伤口不易愈合。内部器官被灼伤时，严重的会引起炎症，如肺炎，甚至会造成死亡。特别是接触氢氟酸时，能发生剧痛，使组织坏死，如不及时治疗，会导致严重后果。E错误，人体组织在受到射线照射时，能发生电离。","pages":[17],"topic":"危险化学品安全"},{"id":"3-84","paper":3,"number":84,"type":"multiple","stem":"化学抑爆系统通过自动探测爆炸信号并采取物理化学手段阻断爆炸链式反应，技术核心在于快速响应机制，由探测器、控制器与喷洒装置构成完整闭环系统，能在毫秒级时间内完成爆炸信号的识别与抑制操作。下列关于化学抑爆系统的说法，符合要求的是（）。","options":{"A":"适用于爆燃气体、油雾或粉尘的任意密闭设备","B":"由爆炸波推动系统的物理阻隔，从而实现初期火灾爆炸抑制","C":"避免物料、明火窜出设备，但对设备强度的要求较高","D":"抑制剂一般采用化学粉末、卤代烷和混合抑制剂","E":"适用于泄爆易导致二次爆炸或无法开设泄爆口的设备设施"},"images":[],"answer":["A","E"],"explanation":"系统依赖毫秒级的探测预警装置，从而实现初期火灾爆炸阻隔；避免物料、明火窜出设备，但对设备强度的要求较低；化学抑制剂，通常采用化学粉末、水、卤代烷和混合抑制剂；适用于泄爆易导致二次爆炸或无法开设泄爆口的设备设施。","pages":[17,18],"topic":"防火防爆"},{"id":"4-2","paper":4,"number":2,"type":"single","stem":"剩余电流动作保护装置是防止间接接触电击和直接接触电击的主要安全措施，通过规定时间内的速断实现防护，也能提示设备的工作状态。下列关于剩余电流动作保护装置的各项说法，正确的是（）。","options":{"A":"电子式保护装置结构简单，灵敏度高且承受电磁冲击能力较强","B":"保护装置额定剩余不动作电流不得低于额定剩余动作电流的1/2","C":"消防、安全电气设备的电源，应装设高灵敏度、快速型装置","D":"延时型装置适用于30mA及以下的剩余电流保护装置"},"images":[],"answer":["B"],"explanation":"电磁式保护装置结构简单，承受电磁冲击能力较强，但是灵敏度不高；保护装置额定剩余不动作电流不得低于额定剩余动作电流的1/2；消防、安全电气设备的电源，应装设报警型装置；延时型装置适用于30mA以上的剩余电流保护装置。","pages":[1],"topic":"电气安全"},{"id":"4-5","paper":4,"number":5,"type":"single","stem":"某工厂车间金属压力容器，在投用满三年时进行了首次全面检查，检验机构根据此次检查结果认定，表述为：①存在焊缝缺陷，但未发现扩展趋势；②主体材料不符合有关规定，表现出明显的老化倾向，最终认定在检验周期内无法安全使用。综上所述，针对压力容器安全状况分级判定及检测周期的要求，正确的是（）。","options":{"A":"安全状况2级，6年检验一次","B":"安全状况3级，3~6年检验一次","C":"安全状况3级，累计监控使用时间不得超过3年","D":"安全状况4级，应当对缺陷进行处理，否则不得继续使用"},"images":[],"answer":["D"],"explanation":"4级（严重缺陷，监控使用），技术资料缺失或主体材料不符合规定；结构或强度存在严重缺陷（如材料老化、线性焊接缺陷）；无法在正常检验周期内安全使用，需限条件短期运行并采取修复措施。安全状况等级为4级的，监控使用，其检验周期由检验机构确定，累计监控使用时间不得超过3年，监控使用期间应当采取有效的监控措施。","pages":[1,2],"topic":"特种设备安全"},{"id":"4-8","paper":4,"number":8,"type":"single","stem":"工业装置易受雷击部分应采取直击雷防护措施，主要措施包括避雷针、避雷线、避雷网和避雷带。下列以大型石油路储区的罐体为例，下列设置方式符合要求的是（）。","options":{"A":"严禁在装有避雷针的构筑物上架设通信线、广播线或低压线","B":"露天装设的金属罐壁厚不小于4mm时，允许不再接地","C":"金属罐接地点不少于两处，冲击接地电阻不应大于10Ω","D":"应在人员经常通行的地方架设独立避雷针，并单设接地装置"},"images":[],"answer":["A"],"explanation":"露天装设的金属罐壁厚不小于4mm时，允许不再装设接闪器但是必须接地，接地点不少于两处，冲击接地电阻不应大于30Ω；此外，独立避雷针不应架设在人员经常通行的地方。","pages":[3],"topic":"电气安全"},{"id":"4-11","paper":4,"number":11,"type":"single","stem":"化学品安全标签是化学品作为商品属性在流通领域的简易型使用说明，通过标识、警示词和象形图阐明危险特性及注意事项。针对如图所示安全技术说明书，下列说法中正确的是（）。","options":{"A":"未注明应急咨询电话、资料参阅提示语，不符合设计要求","B":"未注明化学品分子式、组成、成分，不符合设计要求","C":"设置信号词警告，未同时采用信号词危险，不符合设计要求","D":"设置三种图形标识表示危化品的危险特性，不符合设计要求"},"images":[{"src":"../assets/08b85aead6e924a5b78e8f6b.jpg","alt":"第4套第11题原卷配图","width":395,"height":261}],"answer":["A"],"explanation":"对属于商业机密的成分可以不表明组成、成分信息；化学品危险、警告不应同时出现；分别设置三种图形标识表示危化品的危险特性，符合设计要求。","pages":[3],"topic":"危险化学品安全"},{"id":"4-12","paper":4,"number":12,"type":"single","stem":"锅炉停炉后，潮湿的环境氛围会加剧对金属的腐蚀，实践证明停炉期间的腐蚀往往比运行中的腐蚀更为严重。因此，常用的保养方法不包括（）。","options":{"A":"充气保养","B":"充水保养","C":"湿法保养","D":"干法保养"},"images":[],"answer":["B"],"explanation":"停炉保养主要指炉内保养，常用的保养方法包括压力保养、湿法保养、干法保养和充气保养。","pages":[3,4],"topic":"特种设备安全"},{"id":"4-15","paper":4,"number":15,"type":"single","stem":"木工机械通过安全设计应尽可能在源头避免或消除危险，提高设备的可靠性和可维修性能。下列木工机械各项设计要求中，符合要求且能消减机械危害的是（）。","options":{"A":"圆锯机提供主轴锁定装置","B":"木工平刨床唇板上开孔或设置梳状槽","C":"带锯机在靠近锯齿边的适当处设置锯条承受器","D":"木工平刨床台面离地高度应为750mm~900mm"},"images":[],"answer":["A"],"explanation":"木工平刨床唇板上开孔或设置梳状槽，主要是降低噪声和振动；带锯机在靠近锯齿边的适当处设置锯条承受器，主要是降低锯条的震颤；木工平刨床台面离地高度应为750mm~900mm，主要是考虑到设备的人机工程学。","pages":[4],"topic":"机械与人机安全"},{"id":"4-17","paper":4,"number":17,"type":"single","stem":"照明设备不正常运行可能导致火灾，也可能导致人身触电事故，下列针对电气照明的安全要求中，正确的是（）。","options":{"A":"配电箱内单相照明线路的开关严禁采用单极开关","B":"Ⅰ类灯具的外露可导电部分必须与中性导体可靠连接","C":"接线盒引至嵌入式灯的电线应采用绝缘柔性导管保护不得裸露","D":"建筑照明电源线路的进户处，应装设带有保护装置的总开关"},"images":[],"answer":["D"],"explanation":"配电箱内单相照明线路的开关必须采用双极开关；照明器具的单极开关必须装在相线上。Ⅰ类灯具的外露可导电部分必须与保护接地导体可靠连接。接线盒引至嵌入式灯具或槽灯的电线应采用金属柔性导管保护，不得裸露；柔性导管与金属壳体应采用专用接头连接。","pages":[4],"topic":"电气安全"},{"id":"4-20","paper":4,"number":20,"type":"single","stem":"火花熄灭器按照工作原理分为迷宫型、水浴型、栅片型、叠片型和组合型等多种型式结构，通常在可能产生火星设备的排放系统安装火星熄灭器，以防止飞出的火星引燃可燃物。关于火星熄灭器工作机理的说法中，错误的是（）。","options":{"A":"设置合适灭火间隙限制烟气流速，加速烟气火星沉降","B":"设置网格、格栅等障碍物将火星挡住","C":"设置旋转叶轮改变烟气流向增加路程，加速火星的熄灭","D":"采用喷水或水蒸气的方法熄灭火星"},"images":[],"answer":["A"],"explanation":"当烟气由管径较小的管道进入管道较大的火花熄灭器中，气流由小容积进入大容积条件，致使流速减慢、压力降低，烟气中的火星沉降。","pages":[5],"topic":"防火防爆"},{"id":"4-21","paper":4,"number":21,"type":"single","stem":"民用爆炸品受外界能量激发导致爆轰，在爆炸冲击波、高温及爆炸碎片的作用下对周边环境、设备造成破坏作用。下列关于民用爆炸品工厂的平面布局、工艺布置要求中，符合规范要求的是（）。","options":{"A":"工艺布置时，宜将危险生产工序小型化、分散布置","B":"危险品暂存间宜布置在地处偏僻的一端","C":"生产厂房和库房在平面上宜设计成复杂的凹型、L型","D":"有泄爆要求的区域布置正对其他建筑物时，应采取隔爆措施"},"images":[],"answer":["B"],"explanation":"工艺布置时，宜将危险生产工序布置在一端；危险品暂存间宜布置在地处偏僻的一端；生产厂房和库房在平面上宜设计成简单的矩形；有泄爆要求的区域布置时，应使其泄爆方向不直接正对其他建筑物或主要道路。","pages":[5],"topic":"防火防爆"},{"id":"4-23","paper":4,"number":23,"type":"single","stem":"依据《常用危险化学品贮存通则》（GB 15603），企业在贮存危险化学品时要严格遵守相关要求。下列危险化学品的贮存行为中，符合规范要求的是（）。","options":{"A":"仓库应采用采用分区、分隔、分库的方式对危险化学品进行储存","B":"储存爆炸物的仓库其外部安全防护距离应符合GB50016的要求","C":"储存仓库内禁止进行开桶、分装、改装作业","D":"剧毒化学品、易制爆危化品应实行双人收发、双人保管制度"},"images":[],"answer":["C"],"explanation":"仓库应采用采用隔离、隔开、分离的方式对危险化学品进行储存；储存爆炸物的仓库，其外部安全防护距离以及物品存放应满足GB18265的要求；剧毒化学品、构成重大危险源的化学品应实行双人收发、双人保管制度。","pages":[5],"topic":"危险化学品安全"},{"id":"4-24","paper":4,"number":24,"type":"single","stem":"锻造加工过程中，当红热的坯料、机械设备、工具等出现不正常情况时，易造成人身伤害。针对锻造作业中的危险有害因素，按照其原因所能表现出的包括（）。","options":{"A":"热辐射、噪声振动、有害气体、电磁辐射","B":"热辐射、光辐射、高频电离辐射","C":"尘毒危害、高频电磁辐射、起重致害","D":"高处坠落、高温和热辐射、急性中毒"},"images":[],"answer":["A"],"explanation":"锻造作业中的危险有害因素主要包括热辐射、噪声振动、粉尘、有害气体、光辐射高频电磁辐射。","pages":[5,6],"topic":"机械与人机安全"},{"id":"4-26","paper":4,"number":26,"type":"single","stem":"设置在港口上完成大宗货物运送作业的龙门吊，采用液压变幅模式、通过地面上的固定轨道辅助转场工序。针对上述起重机械，应设置的安全装置是（）。","options":{"A":"偏斜显示（限制）装置","B":"起重力矩限制器","C":"防碰撞装置","D":"幅度限制器"},"images":[],"answer":["B"],"explanation":"龙门吊采用液压变幅模式、通过地面上的固定轨道辅助转场工序，属于典型的臂架式起重机应设置起重力矩限制器，无需设置偏斜显示（限制）装置；采用液压变幅模式，并不强制设置幅度限制器。","pages":[7],"topic":"特种设备安全"},{"id":"4-27","paper":4,"number":27,"type":"single","stem":"在人机系统中，通常应考虑人机功能分配、信息传递要求、人机系统可靠度差异等诸多因素。在常见的人机系统中，人通常作为监督决策者、操作控制者的形式出现，因此人机系统应充分考虑人的心理特性和生理特性。因此，下列针对人的特性的各项说法中最为正确的是（）。","options":{"A":"轮班作业是消除疲劳的主要手段","B":"单调作业是产生肌肉疲劳的主要诱因","C":"意志是对待事物的态度和社会行为中表现出的稳定心理特征","D":"情绪是由肌体生理需求是否得到满足所产生的体验"},"images":[],"answer":["D"],"explanation":"轮班作业是导致疲劳的主要原因、单调作业是产生精神疲劳的主要诱因，因此A、B不满足要求；性格是对待事物的态度和社会行为方式中所表现出的稳定的心理特征。","pages":[7],"topic":"机械与人机安全"},{"id":"4-30","paper":4,"number":30,"type":"single","stem":"实际应用中，通常利用消除点火源、隔离间距、消减爆炸性混合物等措施实现电气防火防爆。以室内电压10kV、总油量500Kg的油浸式电力变压器的配电间为例，下列的检查项目符合要求的是（）。","options":{"A":"安装在两侧有隔爆的间隔内","B":"设置在爆炸危险环境的正下方","C":"和甲、乙类间的防火间距不应小于15m","D":"与爆炸危险环境毗连，隔墙采用非燃性材料"},"images":[],"answer":["D"],"explanation":"总油量在60~600Kg，应安装在由防爆隔墙的间隔内，不得设在爆炸危险环境的正上方或正下方，与爆炸危险环境毗连，隔墙采用非燃性材料。此外，与甲、乙类间的防火间距不应小于25m。","pages":[8],"topic":"电气安全"},{"id":"4-32","paper":4,"number":32,"type":"single","stem":"民用爆炸品生产加工工段的电气防爆要求将作业区划分为F0、F1和F2区，针对不同区域有不同防火防爆措施及具体要求。下列针对区域的电气危险场所的定义，正确的是（）。","options":{"A":"火工品、起爆药的制造场所属于F0区场所","B":"F1场所照明采用安装在建筑外墙的壁龛灯或装在室外的投光灯","C":"理化分析成品试验站属于F2场所，选用密封型、防水防尘型","D":"F2场所应优先选用ⅡB类隔爆型、本质安全型"},"images":[],"answer":["C"],"explanation":"火工品、起爆药的储存场所属于F0区场所，F0场所照明采用安装在建筑外墙的壁龛灯或装在室外的投光灯；理化分析成品试验站属于F2场所选用密封型、防水防尘型；F1场所选用ⅡB类隔爆型、本质安全型。","pages":[8,9],"topic":"电气安全"},{"id":"4-37","paper":4,"number":37,"type":"single","stem":"近期专项检查极大强化从业者对电气防爆的认知，规范已明确未用防爆设备属重大隐患，但爆炸危险区的线缆选型与敷设却属于管理盲区。部分专家因此提议，应将供电线路的违规设置同步列为重大事故隐患。综上所述，下列关于爆炸性区域线缆敷设要求的说法中，正确的是（）。","options":{"A":"钢管配线应采用多股铜芯软线","B":"中性线应与相线有相同的绝缘能力，并在同一护套内","C":"架空线路与爆炸性气体环境的水平距离，不应小于杆塔高度","D":"电气线路沟道、桥架，穿越不同区域间应采用阻燃性材料严密封堵"},"images":[],"answer":["B"],"explanation":"钢管配线可采用无护套的绝缘单芯和多芯导线；架空线路与爆炸性气体环境的水平距离，不应小于杆塔高度的1.5倍；电气线路沟道、桥架，穿越不同区域间应采用非燃性材料严密封堵。","pages":[10],"topic":"电气安全"},{"id":"4-38","paper":4,"number":38,"type":"single","stem":"材料在一定的高温环境下长期使用，所受到的拉应力低于该温度下的屈服强度，也会随时间的延长而发生缓慢持续的伸长，即蠕变现象，材料长期发生蠕变会导致性能下降或产生蠕变裂纹，最终造成破坏失效。关于管道材料蠕变失效说法，错误的是（）。","options":{"A":"管道在长度方向有明显的变形","B":"蠕变断口表面被氧化层覆盖","C":"管道焊缝熔合线处蠕变开裂","D":"管道在运行中沿轴向开裂"},"images":[],"answer":["A"],"explanation":"长期蠕变致使管道在直径方向有明显的变形，而不是长度方向。","pages":[10,11],"topic":"特种设备安全"},{"id":"4-39","paper":4,"number":39,"type":"single","stem":"内浮顶储罐通过浮盘（浮箱）的遮盖作用能降低爆炸危险性并消减蒸发损耗量，在不考虑投资成本的基础上具有安全推广意义。以加油加气站的内浮顶储罐为例（如下图显示），下列关于爆炸性分区的划分定义正确的是（）。","options":{"A":"贮罐浮盘上方区域划分为爆炸性0区","B":"贮罐外壁和顶部3m范围内划分为1区","C":"防火堤内爆炸区域内地坪下坑沟划分为2区","D":"放空口为中心，半径1.5m的空间划分为1区"},"images":[{"src":"../assets/56ac090c3863f9771f26b8a0.jpg","alt":"第4套第39题原卷配图","width":763,"height":271}],"answer":["D"],"explanation":"贮罐浮盘上方区域划分为爆炸性1区；贮罐外壁和顶部3m范围内划分为2区；防火堤内爆炸区域内地坪下坑沟划分为1区；放空口为中心，半径1.5m的空间划分为1区。","pages":[11],"topic":"电气安全"},{"id":"4-42","paper":4,"number":42,"type":"single","stem":"某机械加工成型车间采用甲烷（爆炸下限5%）对型材进行热加工处理，设置天然气增压泵房和平衡罐（封闭式环境，通风对流条件有限）保证燃料工艺压力和流量。依照规范要求，拟进行施工改造作业增设可燃气体探测报警系统，参照设计文件中的各项说法，符合要求的是（）。 注释：上述题干中所有百分数均表述为体积分数，不存在疑问","options":{"A":"探测器的安装高度宜在释放源下方0.5~1.0m","B":"探测器所接电线应采用多股铜芯软线","C":"探测器和潜在泄漏点间的水平距离均不超过10m","D":"探测器报警设定值设定为1%（爆炸下限的20%）"},"images":[],"answer":["D"],"explanation":"甲烷相对密度比空气轻，探测器应在释放源上方2.0m内，采用三芯屏蔽电缆，探测器和潜在泄漏点的水平距离不宜超过1m（按照规范不应超过5m）。","pages":[11,12],"topic":"防火防爆"},{"id":"4-44","paper":4,"number":44,"type":"single","stem":"静电防护主要是防止由于静电积蓄从而引发燃爆事故，通常包括工艺控制法、封闭削尖法、泄漏导走法和电荷中和法等。因此，下列关于气态和粉态物料的静电防护措施中，并未表现出防护效果的是（）。","options":{"A":"加入防静电添加剂消除静电","B":"粉末加湿","C":"采用重
