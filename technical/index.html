力输送代替气力输送","D":"采用管道静电消除器"},"images":[],"answer":["A"],"explanation":"参照规范GB12158关于气态和粉态物料的静电防护措施，添加抗静电添加剂并不能充分接触混合不能实现静电消解作用。","pages":[12],"topic":"电气安全"},{"id":"4-49","paper":4,"number":49,"type":"single","stem":"电气设备运行过程中如果散热不良或发生故障，可能导致发热量增加、温度升高、达到危险温度，关于电动机产生危险温度的说法，最为符合要求的是（）。","options":{"A":"电机卡死造成无转矩输出，会产生危险温度","B":"电机长时间运转导致铁芯涡流和磁滞损耗，产生危险温度","C":"电气设备在运行状态下的电磁感应会导致危险温度","D":"电气设备在运行状态下短时间或瞬间过载都会产生危险温度"},"images":[],"answer":["C"],"explanation":"电机卡死不属于无扭矩输出但是会导致危险温度；电机长时间运转导致铁芯涡流和磁滞损耗，不会产生危险温度；电机长时间故障运转由于风道堵塞会导致危险温度；电气设备在运行状态下长时间或严重过载都会产生危险温度","pages":[13],"topic":"电气安全"},{"id":"4-52","paper":4,"number":52,"type":"single","stem":"电流对人体的作用事先没有任何征兆，瞬间的生物学效应可能导致呼吸麻痹、心室纤维性颤动甚至死亡。参照下表所示，电流大小对人体的影响因素，下列选项中相对最为符合要求的是（）。","options":{"A":"区域1情况，人体对电流没有明显感觉反应","B":"区域1情况，若电流持续时间过长可能导致心脏停止跳动","C":"区域1情况，人体可以感受电流但一般尚不致造成严重后果","D":"区域1情况，瞬间冲击电压导致心源性休克瞬间死亡"},"images":[{"src":"../assets/4cf6704223fa1eb737e756fd.jpg","alt":"第4套第52题原卷配图","width":353,"height":272}],"answer":["C"],"explanation":"区域1情况在感知电流、摆脱电流之间，人体可以感受电流点一般尚不致造成严重后果。","pages":[14,15],"topic":"电气安全"},{"id":"4-56","paper":4,"number":56,"type":"single","stem":"系留式观光气球作为新兴网红项目，其盲目跟风的配置与粗放随意的运维操作，不仅降低了游客体验，更严重透支了行业的公共信任，埋下了安全隐患。因此，下列关于系留式观光气球的保护装置及防护措施，满足规范要求的是（）。","options":{"A":"为防止缆绳破裂应设置不少于3根锚绳","B":"气囊内应当充装氨气，禁止使用氢气","C":"气囊系统应包含气囊和副气囊，使用温度应覆盖环境温度","D":"副气囊应不小于充装后气囊内温度升高15℃所增加的体积与温度降低15℃所减少的体积之差"},"images":[],"answer":["D"],"explanation":"锚绳数量不少于3根，为防止缆绳破裂应设置不少于3根保险绳；气囊内应当充装氦气，禁止使用氢气；气囊系统应包含气囊和副气囊，使用温度应覆盖-35℃~60℃；副气囊应不小于充装后气囊内温度升高15℃所增加的体积与温度降低15℃所减少的体积之差。","pages":[15,16],"topic":"特种设备安全"},{"id":"4-60","paper":4,"number":60,"type":"single","stem":" 轻质烃类易燃气体的爆炸极限可采用理论混合比估算，通常和实际测定值的误差不超过10%。以易燃气体甲烷为例，完全燃烧所需要的氧气n0=2，请考生估算甲烷的爆炸下限（）。","options":{"A":"5.2%","B":"4.5%","C":"2.0%","D":"1.5%"},"images":[],"answer":["A"],"explanation":"采用理论混合比估算轻质烃的爆炸极限","pages":[16],"topic":"防火防爆"},{"id":"4-63","paper":4,"number":63,"type":"single","stem":"可燃液体按照其危险性可划分为甲类、乙类、丙类、丁类和戊类，厂房和仓库按照其生产、使用和储存的介质危险选择和设置相应的防灭火设施。参照规范《建筑设计防火规范》，确定液体类介质火灾危险性主要参照（）。","options":{"A":"爆炸极限","B":"燃点和自燃点","C":"闪燃和闪点","D":"着火迟滞期"},"images":[],"answer":["C"],"explanation":"参照规范《建筑设计防火规范》，确定液体类介质火灾危险性主要参照液体介质的闪燃和闪点。","pages":[17],"topic":"防火防爆"},{"id":"4-66","paper":4,"number":66,"type":"single","stem":"大型加油、加气母站的汽油储罐依照规范要求设置油气回收系统，充装作业期间检测到气压增加自动启动抽吸系统将油气吸送至回收系统，降低呼吸损耗量并提高现场安全等级。下列关于油气回收系统中，阻火器的设置要求符合规定的是（）。","options":{"A":"设置阻爆燃型阻火器","B":"单项阻火器安装时，应将阻火侧朝向安全区","C":"阻火器阻火速度不大于安装位置所达到的火焰传播速度","D":"阻火器最大间隙不大于介质的最大试验安全间隙"},"images":[],"answer":["D"],"explanation":"油气回收系统设置阻爆轰型阻火器，单向阻火器安装时，应将阻火侧朝向点火源；阻火器阻火速度不小于安装位置所达到的火焰传播速度，阻火器最大间隙不大于介质的最大试验安全间隙。","pages":[17,18],"topic":"防火防爆"},{"id":"4-71","paper":4,"number":71,"type":"multiple","stem":"某饲料加工车间消防安全重点部位的碾磨车间属于典型的爆炸性21区，厂房整体采用矩形布置，东西侧外墙设置桥式起重机运行轨道、北侧作为紧急避难点。消防安全检查中，发现的下列情况符合规范要求的是（）。","options":{"A":"南北侧外墙采用质量不超过60Kg/m2的轻质墙体泄压","B":"泄压用推拉窗，采用安全玻璃等在爆炸时不产生碎片的材料","C":"防爆泄压设施宜靠近爆炸中心区域","D":"屋面上的泄压设施应采取措施防冰雪积蓄","E":"南侧外墙的泄压面积不足可采用贴邻车间辅助泄压"},"images":[],"answer":["C","D"],"explanation":"东西侧外墙设置桥式起重机运行轨道、北侧作为紧急避难点，因此应将南侧外墙设置为泄压设施，泄压面积不足可采用屋面泄压；泄压窗应采用平开窗、中悬窗，不应采用推拉窗。","pages":[18,19],"topic":"防火防爆"},{"id":"4-72","paper":4,"number":72,"type":"multiple","stem":"烟花爆竹企业通过合理的工艺布置通过确保防火防爆间距、畅通的疏散通道及有效的有害物质隔离，能从源头遏制事故扩大。因此，下列烟花爆竹企业的工艺布置符合规范要求的是（）。","options":{"A":"危险品中转库最大存药量不应超过2天生产需求量","B":"临时存药洞最大药量不应超过单人半天需用量且不超过10Kg","C":"引火线厂房应单人单栋独立设置，采取抗爆间室可以联建","D":"1.1级厂房可设置生产辅助用室、更衣室","E":"1.3级厂房联建采用密实砌体墙隔开，且联建不应超过6间"},"images":[],"answer":["B","E"],"explanation":"危险品中转库最大存药量不应超过2天生产需求量，且单库不应超过《烟花爆竹工程设计安全标准》的规定；临时存药洞最大药量不应超过单人半天需用量且不超过10Kg；引火线厂房应单间单机布置，每栋厂房联建不超过4间；1.1级厂房不应设置除更衣室外的辅助用房；1.3级厂房联建采用密实砌体墙隔开，且联建不应超过6间。","pages":[19],"topic":"防火防爆"},{"id":"4-73","paper":4,"number":73,"type":"multiple","stem":"低压电器可分为控制电器和保护电器，控制电器主要用来接通、断开线路和用来控制电气设备，常用的刀开关、低压断路器、减压启动器、电磁起动器属于低压控制电器。下列关于低压控制电器的说法，正确的是（）。","options":{"A":"主令控制器触头多、档位多，用于起重机的控制","B":"接触器有灭弧机构用来分合负荷电流用作主开关","C":"刀开关能切断较大的负荷电流，与熔断器串联使用","D":"隔离开关没有或只有简单的灭弧机构，主要用来隔离电压","E":"低压断路器有强力的灭弧机构，能分断短路电流用作主开关"},"images":[],"answer":["A","B","D","E"],"explanation":"接触器有灭弧机构用来分合负荷电流、不能切断短路电流用作主开关；刀开关不能切断短路电流和较大的负荷电流，与熔断器串联使用。","pages":[19],"topic":"电气安全"},{"id":"4-74","paper":4,"number":74,"type":"multiple","stem":"游览区、机场内的专用机动车辆发生事故，不但影响乘客的人身安全也会对设备产生不良影响，尤其是近期多发的观光车辆看似简单的机械结构、低速运营模式却暗藏重大安全隐患。下列关于观光车辆安全装置的设计要求，符合规定的是（）。","options":{"A":"靠近车体边缘乘客的安全扶手，距离座椅上表面不低于180mm","B":"顶部蒙皮优先选用金属材料，非金属材料应当有金属骨架","C":"观光列车最后一节车厢，设置安全员和司机沟通用对讲机","D":"观光列车的连接装置，应当设置牵引失效的二次保护装置","E":"观光列车的连接部位，应当设置防止振动撞击导致脱开的安全装置"},"images":[],"answer":["A","B"],"explanation":"观光列车最后一节车厢，设置安全员和司机双向沟通用装置；观光列车的连接装置，应当设置防止振动撞击导致脱开的安全装置；观光列车的连接部位，应当设置牵引失效的二次保护装置。","pages":[19],"topic":"特种设备安全"},{"id":"4-75","paper":4,"number":75,"type":"multiple","stem":"事故模型分析能够反推事故情景，为定量指标的建立提供参照基准，同时为定性结论的判定提供逻辑依据。以某民爆炸生产企业为例，要求临时转药间储量不超过10Kg的成品药（超过构成重大事故隐患）。事故发生后，转药间残留深度0.20m、直径1.5m左右浅坑洞，成品药的TNT当量系数以1.2计。转药间进行抗爆设计时，围挡结构能承载35kPa，但是事故现场围挡附近的作业人员呈现双肺重度挫伤、现场直接死亡。针对上述情况，下列事故面定性定量结论中，符合要求的是（）。","options":{"A":"凝聚态爆炸，按炸坑标志物计算TNT当量7.2Kg","B":"凝聚态爆炸，按炸坑标志物计算成品药储量8.64Kg","C":"凝聚态爆炸，成品药储量构成重大事故隐患","D":"凝聚态爆炸，暴露人员受到的波阵面超压超过100kPa","E":"凝聚态爆炸，围挡结构的防爆设计不符合规范要求"},"images":[],"answer":["A","D","E"],"explanation":"按照凝聚态爆炸，炸坑标志物计算TNT当量7.2Kg，计算成品药储量6.0Kg，因此不构成重大事故隐患。暴露人员受到的波阵面超压超过100kPa，围挡结构的防爆设计不符合规范要求。","pages":[19],"topic":"防火防爆"},{"id":"4-76","paper":4,"number":76,"type":"multiple","stem":"某食品加工企业存在下列区域：①配电间、弱电集成柜，无留守人员；②液氨压缩机房，动设备集中布置，人员定期巡检；③中央控制室、监控室，监控设备为主并设置纸质资料柜，24h常驻值班员；④食用油处理间，自动化设备易产生流散类火灾，无留守人员；⑤中间仓库，储存固体氧化剂，食品级硝酸盐和氯酸盐消毒剂，无留守人员。针对上述消防安全重点部位的检查中，下列的消防设施、灭火器材设置得当的是（）。","options":{"A":"配电间、弱电集成柜主要E类火灾，设置细水雾灭火系统","B":"液氨压缩机房主要是B、C类火灾，设置自动喷水灭火系统","C":"中央控制室、监控室，设置BC干粉灭火器、二氧化碳灭火器","D":"食品油处理间主要是B类火灾，设置泡沫灭火系统","E":"中间仓库主要是强氧化剂类火灾，设置二氧化碳灭火系统"},"images":[],"answer":["A","D"],"explanation":"配电间、弱电集成柜主要E类火灾，设置细水雾灭火系统；液氨压缩机房主要是C类火灾，设置自动喷水灭火系统用于吸收喷淋和冷却满足要求，此外应增设灭火器辅助灭火；中央控制室、监控室，设置ABC干粉灭火器、二氧化碳灭火器；食品油处理间主要是B类火灾，设置泡沫灭火系统；中间仓库主要是强氧化剂类火灾，设置自动喷水灭火系统。","pages":[19,20],"topic":"防火防爆"},{"id":"4-78","paper":4,"number":78,"type":"multiple","stem":"爆破片结构简单、泄放速度快，属于非重复启闭型断裂式泄压装置，使用单位应对其进行日常检查、定期检查及定期更换。检查期间发现下列情况中的（），应立即更换爆破片。","options":{"A":"超过最小爆破压力而未爆破","B":"设备停工超过6个月后，再次投入使用的","C":"夹持器出现变形、裂纹或者有较大面积腐蚀","D":"夹持器密封面损坏","E":"爆破片装置进出口安装的截断阀妨碍安全泄放"},"images":[],"answer":["A","B"],"explanation":"选项C、D中的情况，应更换夹持器；选项E的情况应调整更换截断阀。","pages":[20],"topic":"特种设备安全"},{"id":"4-79","paper":4,"number":79,"type":"multiple","stem":"某大型冲压设备参照其设计文件设有手动、自动选择模式：手动模式下手工进出料配合自动化机床周期性的冲模作业，防止在模具闭合期间身体探入；自动模式下防止身体部位在任意情况探入。通过安全装置使模具在任意位置急停的功能。此外，为保障设备的工作模式，应限制模具的最大行程、限定模具的最大运载速度并通过销钉和安全杠防止制动状态下的模具危险运动。针对上述情景，下列保护装置的选择设置要求正确的是（）。","options":{"A":"手动模式，设置光电保护装置","B":"自动模式，设置保持-运行装置","C":"模具在任意位置急停功能，设置急停装置实现","D":"限制模具最大行程，设置机械约束装置","E":"限定模具最大运载速度，设置限制装置"},"images":[],"answer":["A","E"],"explanation":"手动模式，设置光电保护装置；自动模式，设置三位置使能装置；模具在任意位置急停功能，设置急停装置实现，但是不建议考生选择C选项，急停装置在教材中确实属于保护装置，但是参照规范GB15706、GB30574，均将其设定为补充保护装置；限制模具最大行程，设置有限运动控制装置；限定模具最大运载速度，设置限制装置。","pages":[20],"topic":"机械与人机安全"},{"id":"4-80","paper":4,"number":80,"type":"multiple","stem":"锻造通过高温高压形变消除金属内部缺陷、细化晶粒并形成顺应力方向的流线组织，从而显著提升工件的强度、韧性和抗疲劳寿命，是确保重大装备核心零部件安全可靠运行的基础制造工艺。下列关于锻造安全技术措施的说法中，正确的是（）。","options":{"A":"动力源断开后，蓄能器应自动稳压或安全闭锁","B":"刚性离合器应具有将工作部件在任意位置急停的功能","C":"往复运动的锻压机械，应按需要设置安全栓并与控制系统联锁","D":"急停装置在任何操作规范下都能停止锻压机械所有工作","E":"大型锻压机械的飞轮传动应设置行程指示装置"},"images":[],"answer":["B","C"],"explanation":"动力源断开后，蓄能器应自动泄压或安全闭锁；刚性离合器应具有将工作部件在任意位置急停的功能；往复运动的锻压机械，应按需要设置安全栓并与控制系统联锁；急停装置在任何操作规范下都能停止锻压机械工作，但不应断开若中断工作可能引起事故的装置；大型锻压机械的飞轮传动应设置飞轮制动器、转向指示装置。","pages":[20,21],"topic":"机械与人机安全"},{"id":"4-81","paper":4,"number":81,"type":"multiple","stem":"工业机器人作为现代制造业的重要力量，以其高效、精确、可重复性的特性，极大提升生产效率和产品质量。但是，高效的作业模式也给从业者带来潜在的危险因素。因此，下列关于工业机器人安全技术要求的各项说法，正确的是（）。","options":{"A":"机器人至少具备自动方式、手动高速、手动降速模式","B":"自动状态下，无法通过三位使能装置让机器人使能或启动程序","C":"降速控制功能，速度应限制在250mm/s及以下","D":"操作者进入协同空间时机器人未进入停止状态，引发保护性停止","E":"示教期间，机器人运动只能受示教器控制，不响应其他遥控命令"},"images":[],"answer":["C","D","E"],"explanation":"机器人至少具备自动方式、手动降速模式；手动状态下，自动操作是被禁止的，无法通过三位使能装置以外的方式让机器人使能或启动程序。","pages":[21],"topic":"机械与人机安全"},{"id":"4-82","paper":4,"number":82,"type":"multiple","stem":"接地保护供电方式在实际应用中的表现型式和理论有所不一致，但基本原理相同。某建筑物采用如下的供电保护方式，针对如下图所示防护措施，说法正确的是（）。","options":{"A":"R1属于工作接地电阻，通过低电阻接地能将故障电压限定在安全值","B":"TN-S系统中设置切断式剩余电流保护装置，三相设备连接符合要求","C":"重复接地电阻R3能有效降低故障电压","D":"重复接地电阻R3能有效减轻中性导体断开的危险性","E":"R2属于保护接地电阻，能实现低压小型用于的直接供电"},"images":[{"src":"../assets/3bc11ddef5ac0e7bb8cf4e28.jpg","alt":"第4套第82题原卷配图","width":323,"height":187}],"answer":["B","C"],"explanation":"R1属于工作接地电阻，通过低电阻接地能改善电网的防雷性能；属于TN-S的供电保护方式，三相设备R2电阻属于正常的连接保护方式，只要供电网中设置高灵敏度、切断型剩余电流保护装置即可；重复接地电阻R3能有效降低故障电压、能有效减轻保护接地导体断开的危险性；R2属于保护接地电阻，能有效降低故障电压。","pages":[21],"topic":"电气安全"},{"id":"4-84","paper":4,"number":84,"type":"multiple","stem":"预防火灾爆炸事故的发生，阻止火灾爆炸的蔓延途径是工业防爆的重要考虑因素，可通过一系列的阻火隔爆装置用以实现上述目的。下列关于防火防爆安全装置的说法中，正确的有（）。","options":{"A":"严禁将化学抑爆技术适用于无法开设泄爆口的设备","B":"当安全阀的入口处装有的隔断阀必须保持常开状态并加铅封","C":"加热炉的烟道、汽车、拖拉机的尾气排放管等，安装火星熄灭器","D":"主动式、被动式隔爆装置是靠装置执行元件的动作阻隔火焰","E":"系统流体的进出口间、压缩机与油泵的进口管线上安置单向阀"},"images":[],"answer":["B","C","D"],"explanation":"化学抑爆技术适用于无法开设泄爆口的设备；工业阻火器不应用于含固体颗粒物粉尘的空气输送管道。","pages":[22],"topic":"防火防爆"},{"id":"4-85","paper":4,"number":85,"type":"multiple","stem":"化学品安全技术说明书是传递化学品危害信息的重要文件，保障下游企业的安全运营条件。以甲苯为例，甲苯属于甲类易燃液体、有毒且表现出致癌性，针对甲苯的特性下列对应安全技术说明书部分正确的是（）。","options":{"A":"呼吸摄入导致急性中毒的自救、互救措施，参照急救措施","B":"泄漏后火灾的应及时施救、灭火剂的选择，参照泄漏应急处理","C":"火灾事故面消防人员个体防护的选择，参照接触控制和个体防护","D":"最高允许浓度、沸点、饱和蒸汽压，参照理化特性","E":"急性毒性、刺激性、致癌性、亚急性和慢性毒性，参照毒理学信息"},"images":[],"answer":["A","E"],"explanation":"呼吸摄入导致急性中毒的自救、互救措施，参照急救措施；泄漏后火灾的应及时施救、灭火剂的选择，参照消防措施；火灾事故面消防人员个体防护的选择，参照消防措施；沸点、饱和蒸汽压，参照理化特性；急性毒性、刺激性、致癌性、亚急性和慢性毒性，参照毒理学信息。考证就上233网校APP 免费题库，复习资料包，扫码下载即可获得","pages":[22],"topic":"危险化学品安全"},{"id":"5-2","paper":5,"number":2,"type":"single","stem":"火花熄灭器又称防火帽，主要适用于可能产生火星设备的排放系统，类似于汽车、拖拉机的尾气排放管和加热炉的烟道。按照其工作方式类似于工业阻火器，但是作用机理却大相径庭。下列关于火花熄灭器的原理，说法正确的是（）。","options":{"A":"变径式火花熄灭器通过降低孔隙，提升火花流速从而熄灭火星","B":"迷宫式火花熄灭器通过网格障碍物，阻挡火星从而加速沉降","C":"水浴式火花熄灭器通过喷水、水蒸气的方式熄灭火星","D":"栅片式火花熄灭器能改变烟气流动方向，加速火星的熄灭"},"images":[],"answer":["C"],"explanation":"【解析】变径式火花熄灭器通过增加孔隙，降低火花流速从而沉降灭火；迷宫式栅片式火花熄灭器通过网格障碍物，阻挡火星从而加速沉降；水浴式火花熄灭器通过喷水、水蒸气的方式熄灭火星；迷宫式火花熄灭器能改变烟气流动方向，加速火星的熄灭。","pages":[1],"topic":"防火防爆"},{"id":"5-4","paper":5,"number":4,"type":"single","stem":"爆炸危险区域按照《爆炸危险环境电力装置设计规范》识别爆炸危险介质并据此划定爆炸危险区，是企业电气防爆的基础前提条件。下列关于爆炸危险介质、危险区域的划定和设备选择要求的各项说法中，正确的是（）。","options":{"A":"爆炸危险1区一定存在爆炸性气体释放源","B":"爆炸危险1区应选用Ⅰ类防爆型设备","C":"爆炸危险1区一定存在一级释放源","D":"存在连续级释放源的区域一定划为0区"},"images":[],"answer":["A"],"explanation":"爆炸危险1区一定存在爆炸性气体释放源；爆炸危险1区应选用Ⅱ类防爆型设备；存在一级释放源可划分为1区，但是通风不良的2区也应提高其爆炸性分区标准；存在连续级释放源的区域按照爆炸危险介质分别可划为0区、20区。","pages":[1,2],"topic":"电气安全"},{"id":"5-10","paper":5,"number":10,"type":"single","stem":"结合承压类特种设备安全附件安全状况，市场监管总局对《安全阀安全技术监察规程》、《爆破片装置安全技术监察规程》等安全技术规范进行整合修订，并完善安全附件的安全技术要求，形成《承压类特种设备安全附件安全技术规程》。新规范的落实给承压设备（压力容器）制造、使用单位都提出更高的管控、设置要求，下列各项说法中符合规范要求的是（）。","options":{"A":"气体及最高温度高于等于标准沸点的液体，应选用全启式安全阀","B":"气体及最高温度小于标准沸点的液体，应选用微启式安全阀","C":"单独用于压力快速增长的场所，应选用全启式安全阀","D":"物料有剧毒或其他妨碍公共安全的性质，严禁设置安全泄压装置"},"images":[],"answer":["A"],"explanation":"D 4.1 气体、蒸汽、液化气体及最高工作温度高于或者等于其标准沸点的液体，应当选用全启式安全阀；工作介质为液体时，可以选用微启式安全阀。B.4.2 安全阀不能单独用于压力快速增长的场所—泄压动作延迟B.4.4 当容器内的物料有剧毒或其他妨碍公共安全的性质时，不宜单独使用安全阀—阀式泄压装置密封性不及爆破片。B.4.1 安全阀适用于清洁、无颗粒、低黏度的流体。B.4.3 安全阀不宜单独用于阀座与阀瓣密封面可能被介质粘连或介质可能产生结晶的场合。容器内的物料含有较多的固体颗粒，安全阀回座后会导致密封不严。","pages":[3],"topic":"特种设备安全"},{"id":"5-11","paper":5,"number":11,"type":"single","stem":"接闪器是外部防雷装置的核心，通过金属导体的通道作用实现区域防雷，下列关于防雷接闪器的各项说法，符合规范要求的是（）。","options":{"A":"建筑物的金属屋面可作为接闪器","B":"金属屋面做接闪器，金属板之间的搭接长度不得小于100mm","C":"接闪器应采用具有良好电导通效应的铜导体镀锌材料","D":"接闪器锈蚀30%以上时，应进行镀锌防腐处理"},"images":[],"answer":["B"],"explanation":"除第一类防雷建筑物外，建筑物的金属屋面可作为接闪器；金属屋面做接闪器，金属板之间的搭接长度不得小于100mm；接闪器应采用具有良好电导通效应的导体镀锌材料；接闪器锈蚀30%以上时，应予更换。","pages":[3],"topic":"电气安全"},{"id":"5-12","paper":5,"number":12,"type":"single","stem":"木材加工作业通过刀具切割作用破坏木质纤维素之间的联系从而改变木材结构、形状和尺寸，常用的木工加工机械包括圆锯机、带锯机和平刨床。下列木工机械的安全技术措施，不符合要求的是（）。","options":{"A":"圆锯片直径应小于夹紧法兰外夹紧直径的4倍","B":"带锯机上锯轮在任何位置，裸露部分不应超过1/4锯轮表面","C":"带锯机上锯轮处于最高位置，与防护罩内衬表面不应大于100mm","D":"带锯条的锯齿应锋利，锯深不得超过锯宽的1/4"},"images":[],"answer":["C"],"explanation":"圆锯片直径应小于夹紧法兰外夹紧直径的4倍；带锯机上锯轮在任何位置，裸露部分不应超过1/4锯轮表面；带锯机上锯轮处于最高位置，与防护罩内衬表面不应小于100mm；带锯条的锯齿应锋利，锯深不得超过锯宽的1/4。","pages":[3],"topic":"机械与人机安全"},{"id":"5-14","paper":5,"number":14,"type":"single","stem":"某烟花爆竹生产车间采用单层矩形布置按照工艺流程估算最大计算存药量500Kg主要用于烟火药氧化剂的筛选，设置独立的抗爆间室用于湿法制开球药（最大设计计算药量50Kg）通过隔离操作、动力隔断实现安全联锁。针对上述车间情况，下列说法正确的是（）。","options":{"A":"车间按照生产工序的危险等级属于1.1-1级","B":"按照计算药量550Kg，综合确定车间安全距离","C":"车间和本厂住宅区之间的安全距离按照内部距离计算","D":"设置更衣室辅助用房，保持个人、环境的安全卫生清洁"},"images":[],"answer":["D"],"explanation":"厂房主体用于烟火药氧化剂的筛选、抗爆间室用于湿法制开球药，均不属于1.1-1级厂房；抗爆间室设计药量50Kg，未超过屏障内建筑存药量，因此按照计算药量500Kg，综合确定车间安全距离；车间和本厂住宅区之间的安全距离按照外部距离计算。","pages":[4],"topic":"防火防爆"},{"id":"5-17","paper":5,"number":17,"type":"single","stem":"气瓶的装卸、运输、储存、保管和发送等环节都必须建立安全制度，尤其是按照近年应急管理部统计数据分析，充装单位应通过各种管理措施有效提高充装作业人员的安全基础知识、明确充装要求及规定。下列各项充装规定要求，最符合规定的是（）。","options":{"A":"液化气体充装后的压力不得超过气瓶的公称工作压力","B":"禁止将移动式压力容器的气体直接对气瓶进行倒装","C":"车用焊接绝热气瓶应当采用衡器逐瓶复检","D":"溶解乙炔气体期间，应按照相关标准同期补加溶剂量"},"images":[],"answer":["B"],"explanation":"压缩气体充装后的压力不得超过气瓶的公称工作压力；禁止将移动式压力容器内的气体直接对气瓶进行倒装或者将气瓶内的气体直接对气瓶进行充装；充装单位应当采用衡器逐瓶（车用焊接绝热气瓶除外）复检充装低温液化气体及低温液体的气瓶，充装超量的气瓶应当及时采取有效措施进行处置，否则不允许出充装站；溶解乙炔气体前，应按照相关标准同期补加溶剂量。","pages":[4],"topic":"特种设备安全"},{"id":"5-23","paper":5,"number":23,"type":"single","stem":"金属浇铸作业的核心设备之一就是浇包，通过浇包的转运作用实现浇铸作业，但是隶属于动力浇铸设备的浇包却往往是安全管理的薄弱环节。下列针对浇包的各项要求及说法中，不符合规定的是（）。","options":{"A":"带吊梁的浇包应设置载重量限制装置","B":"电动浇包的电缆应采用耐高温防烫防护套","C":"倾转式浇包的倾转机构应具备自锁或锁定功能","D":"底注式浇包的塞杆机构应设置锁定装置"},"images":[],"answer":["A"],"explanation":"带吊梁的浇包应设置吊梁锁定装置；电动浇包应采用耐高温防烫防护套；倾转式浇包的倾转机构应具备自锁或锁定功能；底注式浇包的塞杆机构应设置锁定装置。","pages":[6],"topic":"机械与人机安全"},{"id":"5-27","paper":5,"number":27,"type":"single","stem":"触电按照对人体的伤害类型分为电击和电伤，由于带电体状态、途径和作用方式的差异导致伤害类型是有差异的，以某次触电事故为例：低压带电抢修作业中，电工检查线缆是否呈带电状态用手背轻触导体，结果冲击性放电导致手掌瞬间被弹开碰撞到配电柜门上导致掌骨骨折并在接触处留下永久性瘢痕。针对上述情景，下列说法定义中正确的是（）。","options":{"A":"按照带电体的状态，触电事故属于单线电击","B":"按照电伤的型式，掌骨骨折主要由于电气机械性伤害所导致","C":"通常而言，电流越大、时间越长、电阻越大导致的瘢痕越明显","D":"一般而言，站在绝缘良好站台、穿戴绝缘鞋能有效规避上述事故"},"images":[],"answer":["D"],"explanation":"按照带电体的状态，触电事故属于直接接触电击；按照电伤的型式，掌骨骨折主要由于电伤导致的二次伤害；通常而言，电流越大、时间越长、电阻越大导致的电流灼伤越严重，但是永久性瘢痕不属于电流灼伤；一般而言，站在绝缘良好站台、穿戴绝缘鞋能有效规避上述事故。","pages":[6],"topic":"电气安全"},{"id":"5-28","paper":5,"number":28,"type":"single","stem":"低压电气分为控制电器和保护电器，其中的控制电器主要用于电气设备的通断工作安全，包括低压隔离开关、低压断路器、接触器和控制器。下列关于低压控制电器的各项说法，符合要求的是（）。","options":{"A":"低压隔离开关通常和断路器串联使用，用作电气设备主开关","B":"断路器具有强力的灭弧装置能自动分断短路、过载电流","C":"接触器具有灭弧机构且本身具有失压保护功能用作线路主开关","D":"控制器触头多、档位多，通常和接触器串联用作复杂命令控制"},"images":[],"answer":["C"],"explanation":"低压隔离开关通常和熔断器串联使用；断路器具有强力的灭弧装置能自动分断短路电流；接触器具有灭弧机构且本身具有失压保护功能用作线路主开关；控制器触头多、档位多，通常用作复杂命令控制。","pages":[6,7],"topic":"电气安全"},{"id":"5-30","paper":5,"number":30,"type":"single","stem":"锅炉利用生物质能源燃烧产生的热能实现能量的转移、供热和驱动，是现代工业体系的基础设备。下列关于锅炉燃烧类型、定义分类的说法中，正确的是（）。","options":{"A":"旋风炉能有效提高燃烧效率且飞灰磨损较小","B":"室燃炉采用火室燃烧，适用于粗煤粉或煤屑","C":"流化床锅炉通过布风板上的流化燃烧，适用于劣质燃煤","D":"层燃炉采用固体燃料的火床燃烧，主要用于电站和工业锅炉"},"images":[],"answer":["C"],"explanation":"旋风炉能有效提高燃烧效率，但是飞灰磨损比较严重；室燃炉采用火室燃烧，适用于颗粒度比较小的煤粉、燃气或燃油锅炉；流化床锅炉通过布风板上的流化燃烧，适用于劣质燃煤；层燃炉采用固体燃料的火床燃烧，燃烧效率偏低一般不用做电站和工业锅炉。","pages":[7],"topic":"特种设备安全"},{"id":"5-31","paper":5,"number":31,"type":"single","stem":"乳化炸药是将水相和油相生产物料在高速运转和强剪切力的作用下，借助乳化剂的乳化作用形成基质，再经敏化剂敏华得到的爆炸性物质。因此，乳化炸药在生产中的危险性描述正确的是（）。","options":{"A":"高温、撞击摩擦、电气和静电火花、雷电引起的危险","B":"硝酸铵在一定条件下的自然分解爆炸","C":"撞击、坠落、碰撞及摩擦等险情导致燃烧或爆炸","D":"长期接触氧气、氧化试剂，引发的燃烧爆炸事故"},"images":[],"answer":["A"],"explanation":"硝酸铵在一定条件下的自然分解爆炸，属于原料储存阶段的危险；撞击、坠落、碰撞及摩擦等险情导致燃烧或爆炸属于运输期间的危险；长期接触氧气、氧化试剂，引发的燃烧爆炸事故属于产品保存条件不当导致的危险。","pages":[7],"topic":"防火防爆"},{"id":"5-33","paper":5,"number":33,"type":"single","stem":"危险化学品的安全标签实际上是一系列文字信息、图形信息的集合，通过特有标识和文字传递安全使用须知，下列关于化学品危险信息排序的各项说法正确的是（）。","options":{"A":"危险性说明按照健康危害、物理危险和环境危害顺序排列","B":"选用信号词“警告”，则不应出现信号词“紧急”","C":"选用骷髅交叉骨图形符号，不应出现健康危害图形符号","D":"选用腐蚀图形符号，不应出现感叹号图形符号"},"images":[],"answer":["D"],"explanation":"危险性说明按照物理危险、健康危害和环境危害顺序排列；选用信号词“警告”，则不应出现信号词“危险”；选用骷髅交叉骨图形符号，不应出现感叹号图形符号；选用腐蚀图形符号，不应出现感叹号图形符号。","pages":[7],"topic":"危险化学品安全"},{"id":"5-36","paper":5,"number":36,"type":"single","stem":"DNAN基熔铸炸药在现代火炸药领域得到广泛应用，在TNT炸药的基础上通过甲醇氧化提高引燃能量、稳定性，甚至在火焰炙烤的情况下也能保持稳定状态从而保证其安全性能。此外，通过模型塑膜得到特定的围观孔状结构提高燃烧热释放速率达到更高效的杀伤效率。综上所述，对比TNT炸药熔铸炸药的（）特征得到极大的保障和提高。","options":{"A":"能量特征、燃烧特性","B":"安全性、燃烧特性","C":"安定性、安全性","D":"热稳定性、力学特性"},"images":[],"answer":["B"],"explanation":"TNT炸药通过甲氧基化反应提高引燃能即使遇到明火也不会被引爆，能有效提高安全性；通过浇铸成型形成具体的微观结构提高热释放速率，能有效提高燃烧特性。","pages":[8],"topic":"防火防爆"},{"id":"5-37","paper":5,"number":37,"type":"single","stem":"参照规范《饲料加工系统粉尘防爆安全规范》，应依据饲料粉尘环境出现的频繁程度和持续时间，将饲料加工系统的粉尘涉爆区域划分为20区、21区和22区。下列区域中，均属于爆炸性21区的是（）。","options":{"A":"溜管取样点、混合机取样点","B":"粉碎机补风口、冷却器补风口","C":"软连接材料不能完全阻隔粉尘释放的连接点周围","D":"采用不可靠密封形式的集尘点周围"},"images":[],"answer":["A"],"explanation":"溜管取样点、混合机取样点属于爆炸性21区；粉碎机补风口、冷却器补风口属于爆炸性22区；软连接材料不能完全阻隔粉尘释放的连接点周围属于爆炸性22区；采用不可靠密封形式的集尘点周围属于爆炸性22区。","pages":[8],"topic":"电气安全"},{"id":"5-38","paper":5,"number":38,"type":"single","stem":"移动式、手持式电动工具由于其工作特点和恶劣的作业环境，本身更容易损毁导致金属外壳带电导致触电事故。下列关于移动式、手持式电气设备的安全使用要求，符合规范规定的是（）。","options":{"A":"Ⅰ类设备电源线的绿线、黄线，只能用作保护接地导体","B":"Ⅱ类、Ⅲ类设备采用剩余电流动作保护装置、隔离变压器等措施","C":"单相设备的相线和中性线应装设双极开关和熔断器","D":"手持式设备的插头、插座的保护接地极只能单独连接保护接地导体"},"images":[],"answer":["D"],"explanation":"Ⅰ类设备电源线的绿/黄双色线，只能用作保护接地导体； Ⅰ类设备采用剩余电流动作保护装置、隔离变压器等措施；单相设备的相线和中性线应装设双极开关，中性线上不应装有熔断器；手持式设备的插头、插座的保护接地极只能单独连接保护接地导体。","pages":[8],"topic":"电气安全"},{"id":"5-39","paper":5,"number":39,"type":"single","stem":"危险化学品对人体危害所表现出的窒息，实际上按照致害性机理分为急性中毒和物理性窒息，不同致害表现形式要求采取不同的应急处置措施。下列关于窒息致害的各项说法中，正确的是（）。","options":{"A":"氮气、二氧化碳导致氧含量降低致使供氧不足属于单纯窒息","B":"一氧化碳影响机体和氧气结合能力属于细胞内窒息","C":"血液窒息对人的呼吸道、胃肠道黏膜造成刺激","D":"常见的硫化氢、氰化氢、氨气会影响机体输送氧气的能力"},"images":[],"answer":["A"],"explanation":"硫化氢、氰化氢影响机体和氧气结合能力属于细胞内窒息；血液窒息对人的呼吸道、胃肠道黏膜不一定会造成刺激性作用。","pages":[8,9],"topic":"危险化学品安全"},{"id":"5-41","paper":5,"number":41,"type":"single","stem":"气瓶钢印是识别气瓶的重要依据，按照使用用途包括制造钢印标志、检验钢印标志，检查中发现如下所示钢印标志。关于此类钢印标识，说法正确的是（）。","options":{"A":"属于气瓶检验钢印，①代表制造认证机构代号","B":"属于气瓶检验钢印，②代表气瓶有效使用期限","C":"钢印应采用蚀刻、镂刻、铭牌或标签等永久性标记","D":"无缝钢瓶的定期检验钢印标志上，应按照年份涂检验色标"},"images":[{"src":"../assets/22ff0a1e6583503377dcc73a.png","alt":"第5套第41题原卷配图","width":492,"height":504}],"answer":["D"],"explanation":"属于气瓶检验钢印，①代表制造检验机构代号、②代表气瓶检验期限；钢印应采用蚀刻、镂刻等永久性标记并在无缝钢瓶的定期检验钢印标志上按照年份涂检验色标。","pages":[9],"topic":"特种设备安全"},{"id":"5-44","paper":5,"number":44,"type":"single","stem":"设置在室外的具有爆炸性的储罐应依据其危险特性，设置合适的防雷装置消减直击雷、二次放电和感应雷危险。下列关于具有爆炸性的露天储罐的定性、定量要求符合规定的是（）。","options":{"A":"属于第一类防雷建（构）筑物，间距不足时应予以跨接","B":"壁厚不小于4mm时，允许和独立避雷针共用接地电阻","C":"接地点不应少于两处，接地点之间的距离不应大于30m","D":"露天储罐防止直击雷的冲击接地电阻不应大于10Ω"},"images":[],"answer":["C"],"explanation":"属于第二类防雷建（构）筑物，间距不足时应予以跨接；壁厚不小于4mm时，允许不在附设接闪器；露天储罐防止直击雷的冲击接地电阻不应大于30Ω；接地点不应少于两处，接地点之间的距离不应大于30m。","pages":[10],"topic":"电气安全"},{"id":"5-45","paper":5,"number":45,"type":"single","stem":"触电事故按照带电体型式分为直接接触电击、间接接触电击，下列的安全防护措施仅对间接接触电击起防护作用的是（）。","options":{"A":"双重绝缘和不导电环境","B":"绝缘、屏护和间距","C":"安全隔离变压器供电二次侧不接地的供电方式","D":"剩余电流动作保护装置"},"images":[],"answer":["A"],"explanation":"双重绝缘和不导电环境防止间接接触电击；绝缘、屏护和间距防止直接接触电击；安全隔离变压器供电二次侧不接地的供电方式、剩余电流动作保护装置对直接接触电击、间接接触电击防护兼具防护作用。","pages":[10],"topic":"电气安全"},{"id":"5-46","paper":5,"number":46,"type":"single","stem":"机械加工作业面应充分考虑人机作业环境的影响因素对作业人员、工作效率和安全扰动的影响，下列照明环境控制的各项说法中正确的是（）。","options":{"A":"视觉显示器之间的亮度差应提高明暗对比度","B":"配置比较暗淡的一般照明作业空间，应按需设置应急照明","C":"有控制要求的房间基于安全保密要求，应不设或少设窗户","D":"面对作业人员的墙壁，避免采用低对比度的颜色对比"},"images":[],"answer":["C"],"explanation":"视觉显示器之间的亮度差应避免大于10:1；有控制要求的房间基于安全保密要求，应不设或少设窗户；配置比较暗淡的一般照明作业空间，应按需设置应急照明；面对作业人员的墙壁，避免采用强烈的颜色对比。","pages":[10],"topic":"机械与人机安全"},{"id":"5-48","paper":5,"number":48,"type":"single","stem":"按照规范《机器人 安全要求应用规范 》，应通过工业机器人的性能化设计在保证可操作性的基础上提升安全性能，下列关于工业机器人设计要求及保护措施的各项说法中，正确的是（）。","options":{"A":"使能装置应在手动降速方式和手动高速方式下生效","B":"机器人应至少具备自动方式、手动降速方式和手动高速方式","C":"超过降速功能的限定速度，自动触发机器人紧急停止","D":"奇异点可被控制而不产生任何危险运动的情况下，需要额外附加保护"},"images":[],"answer":["A"],"explanation":"使能装置应在手动降速方式和手动高速方式下生效；机器人应至少具备自动方式、手动降速方式；超过降速功能的限定速度，自动触发机器人保护性停止；在奇异点可被控制而不产生任何危险运动的情况下，不需要额外的保护。","pages":[10],"topic":"机械与人机安全"},{"id":"5-52","paper":5,"number":52,"type":"single","stem":"保护导体（Protective Conductor）是电气安全系统中的关键组成部分，其核心功能是在设备发生绝缘故障时提供低阻抗路径，将故障电流安全导入大地，从而触发保护装置（如断路器）动作，防止触电事故。下列各项关于保护导体的说法中，符合规定要求的是（）。","options":{"A":"保护导体干线应经两条联结线和设备外露导电部分连接","B":"保护导体不得采用固定敷设的绝缘线或裸导体","C":"保护导体（包括具有保护作用的PEN导体）不应安装熔断器","D":"特殊情况下，可利用设备外露导电部分用作保护导体"},"images":[],"answer":["C"],"explanation":"保护导体干线应经两条联结线和接地体连接；保护导体可采用固定敷设的绝缘线或裸导体；保护导体（包括具有保护作用的PEN导体）不应安装熔断器；不得利用设备外露导电部分用作保护导体。","pages":[11],"topic":"电气安全"},{"id":"5-53","paper":5,"number":53,"type":"single","stem":"空中飞人系列在近年成为网红景点，但是运营单位对大型游乐设施的认识不足、维护保养能力不当，安全设施冗余化设计不充分都会导致难以预料的安全事故。下列关于空中飞人系列专用保护装置和防护装置的各项要求，正确的是（）。","options":{"A":"刚性乘人装置的安全压杠与提升机构应当设置联锁控制","B":"与运行干涉的栅栏应与控制系统联锁，栅栏装置关闭后方能提升","C":"悬崖秋千的最大单侧摆角应当不大于90°","D":"提升装置应当设置两套独立的动力驱动装置"},"images":[],"answer":["A"],"explanation":"与运行干涉的栅栏应与控制系统联锁，栅栏装置打开后方能提升；悬崖秋千的最大单侧摆角应当不大于75°；提升装置应当设置两套独立的制动装置。","pages":[11],"topic":"特种设备安全"},{"id":"5-54","paper":5,"number":54,"type":"single","stem":"某金属锻造车间主要有两种工种，分别是手工锤锻作业、加工搬运作业（间断搬运中等重物）。按照作业规程，上述作业方式在高温作业面的时间均设置在6h，实测作业面湿球黑球温度分别为27℃、34℃，其中的湿球黑球权重分别按照70%和30%确定。上述情况中，下列说法正确的是（）。注释：WBGT温度按照四舍五入的要求，保留至小数点后一位","options":{"A":"手工锤锻作业属于中等劳动，WBGT指数符合要求","B":"加工搬运作业属于重劳动， WBGT指数符合要求","C":"手工锤锻作业应将接触时间率降低至50%，方满足要求","D":"加工搬运作业应将接触时间率降低至50%，方满足要求"},"images":[],"answer":["D"],"explanation":"作业面实测黑球湿球温度29.1℃，因此手工锤锻作业、加工搬运作业均不满足作业要求。手工锤锻作业属于重劳动，应将接触时间率降低至25%，方满足要求；加工搬运作业属于中等劳动，应将接触时间率降低至50%，方满足要求。","pages":[11,12],"topic":"机械与人机安全"},{"id":"5-55","paper":5,"number":55,"type":"single","stem":"严格按照工贸企业可燃气体探测探测报警系统设计规定，某锻造企业采用天然气对型材进行热加工处理，天然气爆炸极限按照5%~15%计算。下列关于探测报警系统的设置要求中，符合要求的是（）。注释：各位同学，严格按照工贸企业电力设计规范，不是化工、不是化工、不是化工，切忌和化工安全对应","options":{"A":"探测器检测到天然气含量达到2.5%时能发出信号或切断电源","B":"探测器安装在距屋面0.3~0.6m的顶部","C":"探测器采用芯线截面不应小于2.5mm2的三芯屏蔽电缆","D":"探测器检测到天然气含量达到1.25%时探测报警"},"images":[],"answer":["A"],"explanation":"探测器安装在潜在泄漏点（释放源）上方2m内；探测器采用芯线截面不应小于1.0mm2的三芯屏蔽电缆；探测器检测到天然气含量达到1.0%时探测报警。","pages":[12],"topic":"防火防爆"},{"id":"5-57","paper":5,"number":57,"type":"single","stem":"机械设备的防护装置属于安全防护措施的重要组成部分，通过在人和设备间构成安全防护屏障实现基本安全功能。下列关于防护装置的各项说法中，正确的是（）。","options":{"A":"封闭式防护装置不应出现漏保护区，严禁采用局部遮盖式防护","B":"联锁式防护装置和控制系统联锁，关闭防护装置启动预设动作","C":"可调式防护装置的可调活动部件，在全程保持固定、自锁状态","D":"距离型防护装置不完全封闭危险区，通过安全距离防止逾越危险区"},"images":[],"answer":["D"],"explanation":"封闭式防护装置不应出现漏保护区，通过箱式防护罩实现危险区域全遮盖；联锁式防护装置和控制系统联锁，在防护装置关闭后机械功能可以运行，但是关闭防护装置不会启动预设动作；可调式防护装置的可调活动部件，在特定工作期间保持固定、自锁状态。","pages":[12],"topic":"机械与人机安全"},{"id":"5-59","paper":5,"number":59,"type":"single","stem":"单线往复式客运索道在高落差、客流量不大的景区有着广泛应用，在最大程度控制投资运营成本的基础上实现物资和人流输送。下列关于往复式客运索道安全保护装置的各项说法中，正确的是（）。","options":{"A":"保护装置应能在危险事件发生时，停止危险过程","B":"越位开关在客车达到停车位置时，索道应能自动紧急停车","C":"超速保护在运行速度达到额定速度时，索道自动停车","D":"托压索轮组内侧应设有防止钢丝绳往回跳的挡绳板"},"images":[],"answer":["A"],"explanation":"保护装置应能在危险事件即将发生时，停止危险过程；越位开关在客车超越停车位置时，索道应能自动紧急停车；超速保护在运行速度超过额定速度时能自动停车；托压索轮组内侧应设有防止钢丝绳往回跳的挡绳板不属于保护装置。","pages":[12],"topic":"特种设备安全"},{"id":"5-61","paper":5,"number":61,"type":"single","stem":"爆破片—易熔合金塞泄压装置，因其双重密封形式兼具双重泄压的优越性。下列关于爆破片—易熔合金塞泄压装置的各项说法中，正确的是（）。","options":{"A":"适用于剧毒气体、车载气体气瓶","B":"适用于燃气气瓶、惰性气体气瓶","C":"适用于密封性能要求严格的有毒气体压力容器","D":"应具有动作压力、公称动作温度等永久性标志"},"images":[],"answer":["D"],"explanation":"爆破片—易熔合金塞泄压装置应具有动作压力、公称动作温度等永久性标志，适用于有毒气体、车载气体气瓶，由于泄压装置泄放量有限不能适用于压力容器。","pages":[13],"topic":"特种设备安全"},{"id":"5-62","paper":5,"number":62,"type":"single","stem":"单线固定抱索器循环式客运索道在跨度小、客流量较小的景区应用相对较多，用于兼顾游览代步作用。下列各项安全装置的设置，符合规定的是（）。","options":{"A":"张紧小车前后均应装设缓冲和行程保护装置","B":"轿厢设越位开关，超越停车位置时应能自动紧急停车","C":"设进站速度检测开关，应能按设定减速曲线低速进站","D":"无特殊规定，客运索道不允许夜间运行"},"images":[],"answer":["A"],"explanation":"张紧小车前后均应装设缓冲和行程保护装置；但是循环式客运索道没有固定的轨道行程末端因此不需设置轿厢设越位开关；紧急制动或断电后，事故开关复位前不能重新启动驱动装置；脉冲式客运索道需设进站速度检测开关，应能按设定减速曲线低速进站；客运索道夜间运行上应有针对性照明，支架上电力线不允许超过36V。","pages":[13],"topic":"特种设备安全"},{"id":"5-65","paper":5,"number":65,"type":"single","stem":"某企业生产硫化氢缓释剂，主要用于撕裂装伤口创面恢复、治疗心血管疾病，上述应用实例能证明传承上千年的传统文化—是药三分毒的说法并不是所谓糟粕。但是，生产中缓释剂会缓慢释放硫化氢，一旦硫化氢在局部浓度积蓄过高极易导致闪电型死亡。下列针对上述作业区，预防危化品中毒污染事故的各项应对措施中，最为符合要求的是（）。","options":{"A":"设置有机蒸汽型防毒面具并定期更换滤毒盒","B":"密闭性设备的中央通气孔设置惰性气体吹扫","C":"现场配备弱碱性洗剂、硫酸镁催吐剂","D":"设置全面机械送排风系统并在局部增设吸风罩"},"images":[],"answer":["D"],"explanation":"硫化氢属于酸性有毒气体，应设置酸性有毒气体防护型防毒面具并定期更换滤毒盒；密闭性设备的中央通气孔设置惰性气体吹扫用于防爆，为降低硫化氢浓度可设置全面机械送排风系统并在局部增设吸风罩；现场配备弱碱性洗剂主要防止酸性介质导致的化学品灼伤，此外硫化氢进入体内主要通过呼吸道硫酸镁催吐剂并没有实际意义。","pages":[13],"topic":"危险化学品安全"},{"id":"5-67","paper":5,"number":67,"type":"single","stem":"电化学储能电池的火灾在消防安全领域一直是难以彻底解决的顽固性难题，以最新EI上发表的论文—锂电池热失控产气极限氧浓度分析为例，暂不考虑储能效率、电能转换的基础条件下电解液蒸汽在氮气条件下的极限氧浓度7.5%、在二氧化碳条件下的极限氧浓度12.0%，储能电池气相空间按照25L确定（氧含量20%计算）。综上所述，按照惰性气体防爆下列的各项说法中正确的是（）。结果保留一位小数点，四舍五入（上述结果中的极限氧浓度属于专业规范名词，实际上就是教材中的最高氧含量）","options":{"A":"相对而言，氮气具有更强的惰化抑爆能力","B":"氮气惰化条件，惰化需求量按照41.6L计算","C":"二氧化碳惰化条件，惰化需求量按照18.8L计算","D":"相对而言，惰性气体的需求量直接取决于爆炸下限"},"images":[],"answer":["B"],"explanation":"相对而言，二氧化碳具有更强的惰化抑爆能力；氮气惰化条件，惰化需求量按照41.6L计算；二氧化碳惰化条件，惰化需求量按照16.7L计算；相对而言，惰性气体的需求量直接取决于极限氧浓度。","pages":[14],"topic":"防火防爆"},{"id":"5-69","paper":5,"number":69,"type":"single","stem":"金属切削机床通过刀具和加工件之间的相对运动切除多余金属，从而获得符合要求的金属件，按照应用及相关危险分为四类机床。下列关于3类机床的定义和安全要求的各项说法中，正确的是（）。","options":{"A":"属于具有有限数控功能的手动控制机床","B":"配备自动模式、手动模式、手自动协同模式","C":"停止或紧急停止时，主运动应优先于进给运动被制动","D":"活动式防护装置打开时，应在满足2类机床规定的要求下运动"},"images":[],"answer":["D"],"explanation":"3类机床属于数控机床配置自动模式、设置模式，活动式防护装置打开时，应在满足2类机床规定的要求下运动；停止或紧急停止时，进给运动应不迟于主运动停止。","pages":[14],"topic":"机械与人机安全"},{"id":"5-71","paper":5,"number":71,"type":"multiple","stem":"压力管道年度检查是指使用单位在管道运行条件下的检查，根据《压力管道定期检查规则—工业管道》，下列各项检查中，属于压力管道年查检查的项目包括（）。","options":{"A":"有明显腐蚀的弯头进行壁厚测定","B":"输送燃爆危险性较大的工业管道测定防雷、防静电接地电阻","C":"安全阀整定压力","D":"T型焊缝按要求进行的硬度检测","E":"管道外表面进行无损探伤试验"},"images":[],"answer":["A","B","C"],"explanation":"T型焊缝按要求进行的硬度检测和管道外表面进行无损探伤试验，通常属于定期检测项目。","pages":[14],"topic":"特种设备安全"},{"id":"5-74","paper":5,"number":74,"type":"multiple","stem":"最新的《危险化学品目录》与《化学品分类和危险性公示通则》 进行了统一，将危险化学品分为3大类，分别是物理危险、健康危险和环境危害。下列危化品类别中，（）属于典型的物理危险。","options":{"A":"退敏爆炸物","B":"气溶胶","C":"危害臭氧层","D":"皮肤腐蚀/刺激","E":"加压气体"},"images":[],"answer":["A","B","E"],"explanation":"退敏爆炸物、气溶胶和加压气体属于物理危险；危害臭氧层属于环境危害；皮肤腐蚀/刺激属于健康危害。","pages":[15],"topic":"危险化学品安全"},{"id":"5-75","paper":5,"number":75,"type":"multiple","stem":"火灾发展模型按照确定性特征、场景增长模式分为场区混合模型、场模型和火灾增长模型等，其中的t2模型属于最典型的火灾增长模型。下列各项说法中，符合t2模型的是（）。","options":{"A":"火灾事故发展阶段分为扩散期、初起期、发展期和最盛期","B":"发展期的火灾特释放速率和时间的平方成正比","C":"发展期最典型的特征表现为轰然","D":"最盛期火势的大小由建筑物的可燃物残留量情况决定","E":"初起期是火灾开始发生的阶段，主要特征是开始出现火焰"},"images":[],"answer":["B","C"],"explanation":"火灾事故发展阶段分为初起期、发展期、最盛期和熄灭期；发展期的火灾特释放速率和时间的平方成正比；发展期最典型的特征表现为轰然；最盛期火势的大小由建筑物的通风情况决定；初起期是火灾开始发生的阶段，主要特征是冒烟、阴燃。","pages":[15],"topic":"防火防爆"},{"id":"5-76","paper":5,"number":76,"type":"multiple","stem":"某电气设备采用如下所示的供电保护方式，图中所示的RCD属于剩余电流保护装置，针对图示所示下列各项说法中正确的是（）。","options":{"A":"PE干线与电源中性点和接地体相连","B":"接地电阻1称作工作接地电阻，能有效减轻PE线断开的危险性","C":"属于TN-S系统，用于火灾爆炸性较大、用电复杂的供电区域","D":"接地电阻2称作重复接地电阻，能有效缩短故障持续时间","E":"3属于设备间的辅助等电位联结线，属于保护导体的组成部分"},"images":[{"src":"../assets/1d94e40605eaca1ad1e17791.png","alt":"第5套第76题原卷配图","width":601,"height":236}],"answer":["A","C","D","E"],"explanation":"PE干线与电源中性点和接地体相连；接地电阻1称作工作接地电阻，主要用于引出PE线；属于TN-S系统，用于火灾爆炸性较大、用电复杂的供电区域；接地电阻2称作重复接地电阻，能有效缩短故障持续时间；3属于设备间的辅助等电位联结线，属于保护导体的组成部分。","pages":[15,16],"topic":"电气安全","explanationImages":[{"src":"../assets/3017d7f19b7b6b878f0dd1fb.png","alt":"第5套第76题原卷解析电气接线图","width":601,"height":258}]},{"id":"5-77","paper":5,"number":77,"type":"multiple","stem":"在人机系统中，上世纪末出现的两人监控人机系统受到极大的推广应用：①正常状态下，控制器显示工况参数，两人实现工艺参数的调整控制，工作模式如下图1；②事故状态下，两人均能通过格子的手动停止按钮切断电路，机械也能通过自身监管实现安全联锁，工作模式如下图2。假定两人的可靠度均为0.9、机械可靠度0.8，则下列说法定义中正确的是（）。","options":{"A":"正常工作状态，呈现人、人、机械串联模式","B":"故障事故状态，呈现两人并联、人机串联模式","C":"故障事故状态下，系统可靠度0.792","D":"正常工作状态，两人监控人机导致可靠度增加","E":"异常状态下，两人监控人机导致可靠度增加"},"images":[{"src":"../assets/72dc888ae0b80e2d7db89988.png","alt":"第5套第77题原卷配图","width":324,"height":178}],"answer":["A","B","C","E"],"explanation":"正常工作状态，呈现人、人、机械串联模式，两人监控人机导致可靠度下降；故障事故状态，呈现两人并联、人机串联模式系统可靠度0.792，两人监控人机导致可靠度增加。","pages":[16],"topic":"机械与人机安全"},{"id":"5-78","paper":5,"number":78,"type":"multiple","stem":"工业机器人的示教编程期间的危险因素最为突出，通常可认定为进入危险区的协同作业，因此《机器人 安全要求应用规范 》明确规定编程中的附加安全防护措施。下列各项说法，满足要求的是（）。","options":{"A":"示教员应具有和使用有单独控制机器人运动功能的示教盒","B":"编程示教前，示教员应将暂停使用的安全防护装置功能恢复","C":"机器人系统中所有保护性停止装置都应保持有效","D":"示教时，机器人的运动速度应小于或等于250 mm/s","E":"编程时，应关断机器人驱动器不需要的动力（必需的平衡装置保持有效）"},"images":[],"answer":["A","D","E"],"explanation":"示教员应具有和使用有单独控制机器人运动功能的示教盒；示教期间，机器人不应响应来自其他地方的遥控命令；机器人系统中所有紧急停止装置都应保持有效；示教时，机器人的运动速度应小于或等于250 mm/s；编程时，应关断机器人驱动器不需要的动力（必需的平衡装置保持有效）。","pages":[16],"topic":"机械与人机安全"},{"id":"5-79","paper":5,"number":79,"type":"multiple","stem":"高压开关柜通过机械式联锁装置、电磁式联锁装置实现所谓的“五防”功能，能有效避免人员操作失误导致的危险达到实务-安全的目的。但是，加强作业人员的教育培训使其掌握基本的使用操作要求也是安全管理的重要一环。下列关于高压开关柜使用中的注意事项，符合规定的是（）。","options":{"A":"接地开关断开后，方才能拆卸柜的下封板","B":"开关柜应在额定参数下运行","C":"移开式配电柜的手车拖出柜外，附加万向轮应自锁固定","D":"安装调试后，应将一次、二次电缆孔进行封堵","E":"运行中断路器故障跳闸，应详细检查隔离触头和断路器"},"images":[],"answer":["B","D","E"],"explanation":"接地开关闭合后，方才能拆卸柜的下封板；开关柜应在额定参数下运行；移开式配电柜的手车拖出柜外，附加万向轮应转向灵活；安装调试后，应将一次、二次电缆孔进行封堵；运行中断路器故障跳闸，应详细检查隔离触头和断路器。","pages":[16],"topic":"电气安全"},{"id":"5-80","paper":5,"number":80,"type":"multiple","stem":"场内专用机动车辆事故的预防应分别从规章制度、安全管理和安全部件等多方面实现，尤其是多数企业正面临场内专用机动车辆起步较晚的窘迫现状。下列各项关于场内专用机动车辆设计安全的系统部件的各项要求中，正确的是（）。","options":{"A":"蓄电池叉车应设置防护措施，保证蓄电池箱未经允许不能被打开","B":"链条必须符合相关标准，进行极限拉伸载荷和检验载荷实验","C":"叉取装载不稳的货物时，设置稳定支腿保证和增加车辆稳定性","D":"姿态感知系统应与个人信息身份进行绑定，验证司机操作权限","E":"高压胶管应进行耐压试验、长度变化试验、脉冲试验等"},"images":[],"answer":["B","E"],"explanation":"直流电压超过120v的蓄电池叉车应设置防护措施，保证蓄电池箱未经允许不能被打开；链条必须符合相关标准，进行极限拉伸载荷和检验载荷实验；叉取装载不稳的货物时，设置货物稳定器防止货物坍塌；权限信息采集器应与个人信息身份进行绑定，验证司机操作权限；高压胶管应进行耐压试验、长度变化试验、爆破试验、脉冲试验和泄漏试验。","pages":[16,17],"topic":"特种设备安全"},{"id":"5-81","paper":5,"number":81,"type":"multiple","stem":"参照《火灾分类》、《燃烧学应用原理》等规范书籍，将可燃物的类型及其燃烧特性将火灾分为六类。下列关于火灾场景划分，应急施救措施及灭火剂的选择，符合现场应急救援要求的是（）。","options":{"A":"液化石油气管道泄漏着火属于C类火灾，应立即压灭喷射状火焰","B":"汽油储罐泄露着火属于B类火灾，应采用抗溶性泡沫灭火剂施救","C":"小面积的甲醇流散类火灾属于B类火灾，可采用ABC灭火器施救","D":"烟火药堆垛着火属于A类火灾，应采用水流吊射压灭火灾","E":"电缆仓库着火属于E类火灾，应采用二氧化碳灭火器进行施救"},"images":[],"answer":["C","D"],"explanation":"液化石油气管道泄漏着火属于C类火灾，在没有封堵措施的基础上切忌灭火；汽油储罐泄露着火属于B类火灾，非水溶性液体火灾不强制采用抗溶性泡沫灭火剂施救；小面积的甲醇流散类火灾属于B类火灾，可采用ABC灭火器施救；烟火药堆垛着火属于A类火灾，切忌使用射流冲击堆垛；电缆仓库着火属于A类火灾，可采用清水灭火剂施救。","pages":[17],"topic":"防火防爆"},{"id":"5-83","paper":5,"number":83,"type":"multiple","stem":"冲压机器人的安全核心愿景是实现从人防到技控的根本转变，彻底解决传统冲压作业中的安全隐患，通过智能化技术将安全生产的关口前移。下列关于冲压机器人的各项应用说法中，符合规范要求的是（）。","options":{"A":"多机联线生产工艺的机器人与相邻设备间应有安全运行互锁控制信号接口","B":"冲压机器人本体、控制装置、动力源都应接地，接地电阻不应大于4Ω","C":"动力交流电源电路与壳体之间绝缘电阻不小于1MΩ","D":"冲压机器人在额定负载和额定工作速度下，连续运行120h应正常","E":"冲压机器人在额定负载运行时产生的噪声应不大于80dB（A）"},"images":[],"answer":["A","C","D","E"],"explanation":"多机联线生产工艺的机器人与相邻设备间应有安全运行互锁控制信号接口；冲压机器人本体、控制装置、动力源都应接地，接地电阻不应大于0.1Ω；动力交流电源电路与壳体之间绝缘电阻不小于1MΩ；冲压机器人在额定负载和额定工作速度下，连续运行120h应正常；冲压机器人在额定负载运行时产生的噪声应不大于80dB（A）。","pages":[17],"topic":"机械与人机安全"},{"id":"5-84","paper":5,"number":84,"type":"multiple","stem":"在TN供电系统中PE线被称作保护接地导体，主要是由于PE线与电源侧中性点的接电电阻有直接联系。下列关于电源侧中性点接地的各项要求和说法中，正确的是（）。","options":{"A":"配电网在变压器和发电机中性点的接地被称作工作接地","B":"工作接地的主要作用是减轻各种过电压的危险","C":"不接地的10kV系统，工作接地与变压器外壳和避雷器的接地共用","D":"直接接地10kV系统，工作接地与变压器外壳和避雷器的接地分开","E":"共用接地电阻在高土壤电阻率地区，允许放宽至≤4Ω"},"images":[],"answer":["A","B","C","D"],"explanation":"配电网在变压器和发电机中性点的接地被称作工作接地电阻；工作接地的主要作用是减轻各种过电压的危险；不接地的10kV系统，工作接地与变压器外壳和避雷器的接地共用；共用接地电阻在高土壤电阻率地区，允许放宽至≤10Ω；直接接地10kV系统，工作接地与变压器外壳和避雷器的接地分开。","pages":[17],"topic":"电气安全"},{"id":"5-85","paper":5,"number":85,"type":"multiple","stem":"工业生产中，基于各类原因难以彻底消除爆炸性混合物，因此通过点火源控制是防火防爆的基本措施。以加油加气母站的航空煤油储罐罐区点火源控制措施为例，下列要求正确的是（）。","options":{"A":"明火加热设备布置在装置区边缘，且位于罐区的下风向","B":"飞溅火花设备布置在装置区边缘，且位于罐区的侧风向","C":"航空煤油储罐按要求设置氮气密封系统","D":"紧急切断阀采用氮气驱动的气动阀","E":"储罐防火堤内设置可燃气体探测器并联动紧急切断阀"},"images":[],"answer":["B","D"],"explanation":"明火加热设备布置在装置区边缘，且位于罐区的上风向；飞溅火花设备布置在装置区边缘，且位于罐区的侧风向；航空煤油储罐按要求设置氮气密封系统，属于正确措施但是不属于点火源控制要求；紧急切断阀采用氮气驱动的气动阀，属于点火源控制措施防止产生电火源；储罐防火堤内设置可燃气体探测器并联动紧急切断阀，属于正确措施但是不属于点火源控制要求。","pages":[17,18],"topic":"防火防爆"}],"release":"2026-10-05-r7"}</script>
<script>

'use strict';
const BANK=JSON.parse(document.getElementById('bank').textContent);
const BY_ID=new Map(BANK.questions.map(q=>[q.id,q]));
const STORAGE_KEY='tianyu-error-notebook-'+BANK.version;
const app=document.getElementById('app');
let storageOK=true,scope='all',view='home',session=null,toastTimer,autoAdvanceTimer;
let wrongCounts={};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
try{const raw=localStorage.getItem(STORAGE_KEY);if(raw){const stored=JSON.parse(raw);const s=stored.schema===2?stored.session:stored;wrongCounts=cleanCounts(stored.schema===2?stored.wrongCounts:{});if(s&&Array.isArray(s.ids)&&s.ids.length&&s.ids.every(id=>BY_ID.has(id))){s.answers=s.answers&&typeof s.answers==='object'?s.answers:{};s.index=Math.max(0,Math.min(Number(s.index)||0,s.ids.length-1));s.ids.forEach(id=>{s.answers[id]=Array.isArray(s.answers[id])?s.answers[id].filter(x=>x in BY_ID.get(id).options):[]});s.submitted=!!s.submitted&&(s.endReason==='early'||s.ids.every(id=>s.answers[id]?.length));session=s;scope=s.scope||'all'}}}catch{storageOK=false}
function persist(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify({schema:2,session,wrongCounts}));storageOK=true;return true}catch{storageOK=false;toast('浏览器未允许保存进度，请保持页面打开。');return false}}
function cleanCounts(raw){const counts={};if(raw&&typeof raw==='object')for(const [id,n] of Object.entries(raw))if(BY_ID.has(id)&&Number.isSafeInteger(n)&&n>=0)counts[id]=n;return counts}
function clearAutoAdvance(){clearTimeout(autoAdvanceTimer);autoAdvanceTimer=null}
function recordStats(){if(!session?.submitted||session.statsRecorded)return;for(const q of activeQuestions())if(session.answers[q.id]?.length&&!isCorrect(q))wrongCounts[q.id]=(wrongCounts[q.id]||0)+1;session.statsRecorded=true}
function autoAdvance(q){clearAutoAdvance();if(q.type!=='single'||session.index>=session.ids.length-1)return;const currentSession=session,index=session.index;autoAdvanceTimer=setTimeout(()=>{if(session===currentSession&&view==='quiz'&&!session.submitted&&session.index===index)go(index+1)},220)}
function toast(message){document.querySelector('.toast')?.remove();clearTimeout(toastTimer);const el=document.createElement('div');el.className='toast';el.textContent=message;el.setAttribute('role','status');document.body.append(el);document.getElementById('live').textContent=message;toastTimer=setTimeout(()=>el.remove(),4500)}
function answeredCount(){return session?session.ids.filter(id=>session.answers[id]?.length).length:0}
function isCorrect(q){return [...(session.answers[q.id]||[])].sort().join(',')===[...q.answer].sort().join(',')}
function activeQuestions(){return session.ids.map(id=>BY_ID.get(id))}
function imageHTML(images=[],eager=false){return images.length?'<div class="images">'+images.map(im=>`<img src="${im.src}" alt="${esc(im.alt)}" width="${im.width||''}" height="${im.height||''}" loading="${eager?'eager':'lazy'}" onclick="this.classList.toggle('large')">`).join('')+'</div>':''}
function home(){clearAutoAdvance();view='home';if(!['all',...BANK.papers.map(p=>String(p.id))].includes(String(scope)))scope='all';const has=session&&!session.submitted;const options=[{id:'all',title:'全部错题',count:BANK.questions.length,single:BANK.questions.filter(q=>q.type==='single').length,multiple:BANK.questions.filter(q=>q.type==='multiple').length},...BANK.papers];app.innerHTML=`<div class="intro"><h1>把错题，再做一遍。</h1><p class="small">选择练习范围。答完后提交，或直接结束本轮，查看已答题的答案与解析。下次继续可暂存进度。</p></div>${has?`<div class="resume"><div><strong>${session.pausedAt?'练习已暂存':'上次练习还没结束'}</strong><p class="small">已作答 ${answeredCount()} / ${session.ids.length} 题 · 停在第 ${session.index+1} 题</p></div><button type="button" class="primary" id="resume-btn">继续作答</button></div>`:''}${session?.submitted?`<div class="resume"><div><strong>上次练习已结束</strong><p class="small">${answeredCount()} 道已答题可查看答案与解析</p></div><button type="button" id="last-result">查看结果</button></div>`:''}<div class="papers" role="radiogroup" aria-label="选择练习范围">${options.map(p=>`<label class="paper"><span class="paper-main"><input type="radio" name="scope" value="${p.id}" ${String(scope)===String(p.id)?'checked':''}><span><strong>${p.title}</strong><span class="small">单选 ${p.single} · 多选 ${p.multiple}</span></span></span><span class="count">${p.count}<span>题</span></span></label>`).join('')}</div><div class="home-action"><button type="button" class="primary" id="start-btn">开始练习</button><span class="small">按原卷题序练习</span></div><p class="storage-note">${storageOK?'进度自动保存在当前浏览器，可关掉页面后继续。使用同一个专属同步链接，手机和电脑可以自动同步。':'当前浏览器未允许保存进度，请保持页面打开。'}</p>`;document.getElementById('start-btn').onclick=()=>startRound(scope);document.getElementById('resume-btn')?.addEventListener('click',()=>{session.pausedAt=null;persist();view='quiz';quiz()});document.getElementById('last-result')?.addEventListener('click',()=>results());document.querySelectorAll('input[name="scope"]').forEach(el=>el.addEventListener('change',()=>scope=el.value));window.scrollTo(0,0)}
function confirmRestart(){return new Promise(resolve=>{const d=document.getElementById('restart-dialog');let accepted=false;document.getElementById('cancel-restart').onclick=()=>d.close();document.getElementById('confirm-restart').onclick=()=>{accepted=true;d.close()};d.addEventListener('close',()=>resolve(accepted),{once:true});d.showModal()})}
async function startRound(chosen,ids){clearAutoAdvance();if(session&&!session.submitted&&answeredCount()>0&&!await confirmRestart())return;const questions=ids?ids.map(id=>BY_ID.get(id)):BANK.questions.filter(q=>chosen==='all'||String(q.paper)===String(chosen));if(!questions.length)return;session={ids:questions.map(q=>q.id),answers:{},index:0,submitted:false,scope:String(chosen),startedAt:new Date().toISOString()};persist();view='quiz';quiz()}
function quiz(){clearAutoAdvance();if(!session)return home();if(session.submitted)return results();view='quiz';const q=BY_ID.get(session.ids[session.index]);const total=session.ids.length,done=answeredCount(),selected=session.answers[q.id]||[];app.innerHTML=`<div class="statusbar"><span>本轮已作答 <strong>${done} / ${total}</strong></span><span>${storageOK?'进度已保存':'进度未保存'}</span></div><progress value="${done}" max="${total}" aria-label="作答进度"></progress><div class="quiz-top"><div class="meta">第${q.paper}套 · 原题${q.number}<span class="type">${q.type==='single'?'单选题':'多选题'}</span></div><button type="button" id="show-nav">答题卡 ${session.index+1}/${total}</button></div><section class="question-card" aria-label="第${session.index+1}题"><h1 class="sr-only">第${session.index+1}题，共${total}题</h1><p class="stem">${esc(q.stem)}</p>${imageHTML(q.images)}${q.note?`<p class="note">${esc(q.note)}</p>`:''}<fieldset class="options"><legend class="sr-only">${q.type==='single'?'请选择一个选项':'请选择所有符合题意的选项'}</legend>${Object.entries(q.options).map(([letter,text])=>`<label class="option"><input type="${q.type==='single'?'radio':'checkbox'}" name="answer" value="${letter}" ${selected.includes(letter)?'checked':''}><span><span class="letter">${letter}.</span>${esc(text)}</span></label>`).join('')}</fieldset><div class="question-foot"><span class="hint">${q.type==='single'?'单选后自动下一题':'可选择多个选项，确认后下一题'}</span><span class="hint" id="choice-status">${selected.length?'已作答':'尚未作答'}</span></div></section><div class="actions"><button type="button" id="prev-btn" ${session.index===0?'disabled':''}>上一题</button><button type="button" class="primary" id="next-btn">${session.index===total-1?'检查未答题':'下一题'}</button></div><div class="actions session-actions"><button type="button" id="pause-btn">下次继续</button><button type="button" id="end-btn">直接结束作答</button></div><div class="submit-wrap"><button type="button" id="submit-btn" ${done<total?'disabled':''}>${done===total?'全部作答完成 · 提交并查看答案':`还剩 ${total-done} 题未答 · 答完后可提交`}</button><p>结束或提交后才显示答案与解析；下次继续不显示答案。</p></div>`;document.querySelectorAll('input[name="answer"]').forEach(input=>input.addEventListener('change',()=>{const values=[...document.querySelectorAll('input[name="answer"]:checked')].map(el=>el.value);session.answers[q.id]=values;persist();document.querySelector('.statusbar span:last-child').textContent=storageOK?'进度已保存':'进度未保存';const n=answeredCount();document.querySelector('.statusbar strong').textContent=`${n} / ${total}`;document.querySelector('progress').value=n;document.getElementById('choice-status').textContent=values.length?'已作答':'尚未作答';const b=document.getElementById('submit-btn');b.disabled=n<total;b.textContent=n===total?'全部作答完成 · 提交并查看答案':`还剩 ${total-n} 题未答 · 答完后可提交`;if(values.length)autoAdvance(q)}));document.getElementById('show-nav').onclick=showNavigator;document.getElementById('prev-btn').onclick=()=>go(session.index-1);document.getElementById('next-btn').onclick=()=>{if(session.index<total-1)go(session.index+1);else{const un=session.ids.findIndex(id=>!session.answers[id]?.length);if(un>=0){go(un);toast('已跳转到未作答的题目。')}else toast('全部题目已作答，可提交并查看答案。')}};document.getElementById('pause-btn').onclick=pause;document.getElementById('end-btn').onclick=confirmEnd;document.getElementById('submit-btn').onclick=submit;window.scrollTo(0,0)}
function go(index){clearAutoAdvance();if(!session||index<0||index>=session.ids.length)return;session.index=index;persist();quiz()}
function showNavigator(){clearAutoAdvance();const dialog=document.getElementById('navigator');dialog.querySelector('.legend').textContent=`已答 ${answeredCount()} 题 · 未答 ${session.ids.length-answeredCount()} 题。蓝色表示已作答，白色表示未作答，边框标出当前题。`;document.getElementById('nav-grid').innerHTML=session.ids.map((id,index)=>`<button type="button" data-index="${index}" aria-label="第${index+1}题，${session.answers[id]?.length?'已作答':'未作答'}" class="${session.answers[id]?.length?'answered ':''}${session.index===index?'current':''}">${index+1}</button>`).join('');document.querySelectorAll('#nav-grid button').forEach(b=>b.onclick=()=>{dialog.close();go(Number(b.dataset.index))});dialog.showModal()}
function pause(){clearAutoAdvance();if(!session||session.submitted)return;session.pausedAt=new Date().toISOString();if(persist()){home();toast('已暂存。下次打开，点击继续作答即可接着做。')}else{session.pausedAt=null;document.querySelector('.statusbar span:last-child').textContent='进度未保存'}}
function confirmEnd(){clearAutoAdvance();if(!session||session.submitted)return;const d=document.getElementById('end-dialog'),done=answeredCount();document.getElementById('end-summary').textContent=`已作答 ${done} 题，未作答 ${session.ids.length-done} 题。结束后查看已答题的答案与解析，未答题不计入正确率。本轮结束后不能继续作答。`;document.getElementById('cancel-end').onclick=()=>d.close();document.getElementById('confirm-end').onclick=()=>{d.close();finish('early')};d.showModal()}
function finish(reason){clearAutoAdvance();if(!session||session.submitted)return;session.submitted=true;session.endReason=reason;session.pausedAt=null;session.submittedAt=new Date().toISOString();recordStats();persist();results()}
function submit(){if(!session||session.ids.some(id=>!session.answers[id]?.length)){toast('请先完成本轮全部题目。');return}finish('complete')}
function topicSummary(wrong){if(!wrong.length)return '<section class="topic-summary"><h2>本次错题分类</h2><p class="small">本轮没有已作答的错题。</p></section>';const grouped=new Map();for(const q of wrong){const topic=q.topic||'其他';grouped.set(topic,(grouped.get(topic)||0)+1)}return `<section class="topic-summary" aria-labelledby="topic-title"><h2 id="topic-title">本次错题分类</h2><p class="small">按题目主要知识点归类，点击分类只看本轮该类错题。</p><div class="topic-filters" role="group" aria-label="筛选本次错题"><button type="button" class="topic-filter" data-topic="" aria-pressed="true">全部已答题</button>${[...grouped].sort((a,b)=>b[1]-a[1]).map(([topic,count])=>`<button type="button" class="topic-filter" data-topic="${esc(topic)}" aria-pressed="false">${esc(topic)} <strong>${count} 题</strong></button>`).join('')}</div></section>`}
function filterReviews(topic){document.querySelectorAll('.review-card').forEach(card=>card.hidden=!!topic&&(card.dataset.topic!==topic||card.dataset.wrong!=='true'));document.querySelectorAll('.topic-filter').forEach(button=>button.setAttribute('aria-pressed',String(button.dataset.topic===topic)));document.getElementById('review-title').textContent=topic?`${topic} · 本次错题解析`:'已答题 · 答案与解析'}
function results(){clearAutoAdvance();if(!session?.submitted)return quiz();view='results';const all=activeQuestions(),qs=all.filter(q=>session.answers[q.id]?.length),unanswered=all.length-qs.length,right=qs.filter(isCorrect).length,wrong=qs.filter(q=>!isCorrect(q));app.innerHTML=`<div class="result-summary"><div><h1>本轮练习已结束</h1><p class="small">已作答 ${qs.length} / ${all.length} 题<br>答对 ${right} 题 · 答错 ${wrong.length} 题 · 未答 ${unanswered} 题</p></div><div class="score">${qs.length?Math.round(right/qs.length*100):'—'}${qs.length?'<span>%</span>':''}<div class="small">已答题正确率</div></div></div><div class="result-actions"><button type="button" class="primary" id="retry-wrong" ${wrong.length?'':'disabled'}>再练错题 ${wrong.length} 题</button><button type="button" id="back-home">返回题库</button></div>${topicSummary(wrong)}<h2 id="review-title">已答题 · 答案与解析</h2>${unanswered?'<p class="small">未答题不计入正确率，也不显示答案与解析。</p>':''}${!qs.length?'<p class="note">本轮没有已作答的题目。返回题库可以开始新一轮练习。</p>':''}${qs.map((q,i)=>`<section class="review-card" data-topic="${esc(q.topic||'其他')}" data-wrong="${!isCorrect(q)}"><div class="review-top"><span class="meta">${session.ids.indexOf(q.id)+1}. 第${q.paper}套 · 原题${q.number} · ${q.type==='single'?'单选':'多选'}</span><span class="result-tag ${isCorrect(q)?'correct':'incorrect'}">${isCorrect(q)?'答对':'答错'}</span></div><p class="review-history">${esc(q.topic||'其他')} · 练习累计答错 <strong>${wrongCounts[q.id]||0}</strong> 次</p><p class="stem">${esc(q.stem)}</p>${imageHTML(q.images)}${q.note?`<p class="note">${esc(q.note)}</p>`:''}${Object.entries(q.options).map(([letter,text])=>`<div class="review-option ${q.answer.includes(letter)?'right':(session.answers[q.id]||[]).includes(letter)?'wrong':''}"><span class="letter">${letter}.</span>${esc(text)}${q.answer.includes(letter)?' <span class="small correct">（正确选项）</span>':''}</div>`).join('')}<div class="answers-line">你的选择：${(session.answers[q.id]||[]).join('、')}　正确答案：${q.answer.join('、')}</div><div class="explanation"><strong>原卷解析：</strong>${esc(q.explanation|| (q.explanationImages?.length?'见下方原卷解析表格。':'原卷未提供文字解析。'))}</div>${imageHTML(q.explanationImages,true)}</section>`).join('')}`;document.querySelectorAll('.topic-filter').forEach(button=>button.onclick=()=>filterReviews(button.dataset.topic));document.getElementById('retry-wrong').onclick=()=>startRound('wrong',wrong.map(q=>q.id));document.getElementById('back-home').onclick=home;window.scrollTo(0,0)}
document.getElementById('subject-link').onclick=()=>{clearAutoAdvance();if(session&&!session.submitted){session.pausedAt=new Date().toISOString();persist()}};document.getElementById('home-btn').onclick=home;document.getElementById('close-nav').onclick=()=>document.getElementById('navigator').close();if(session?.submitted&&!session.statsRecorded){recordStats();persist()}home();
// Structured browser actions respect the same submit gate as the visible controls.
if(navigator.modelContext?.registerTool){navigator.modelContext.registerTool({name:'notebook_progress',description:'读取当前练习的题数和已作答数；提交之前不提供正确答案。',inputSchema:{type:'object',properties:{},additionalProperties:false},execute:async()=>({content:[{type:'text',text:JSON.stringify({view,total:session?.ids.length||0,answered:answeredCount(),submitted:!!session?.submitted})}]})});}


// Both subjects share flags, notes, cumulative learning records and encrypted cross-device sync.
(function(){
const T=window.Tianyu,SUBJECT='technical',oldPersist=persist,oldHome=home,oldQuiz=quiz,oldNav=showNavigator,oldResults=results;
let pendingRemote=false,renderedFeatures="";
function features(){return JSON.stringify(Object.fromEntries(Object.entries(T.doc.cells).filter(([k])=>k.startsWith(SUBJECT+"/")&&/\/(flag|note|seen|complete)\//.test(k)).map(([k,c])=>[k,c.value])))}
function selectedQuestions(){return session?session.ids.map(id=>BY_ID.get(id)).filter(q=>session.answers[q.id]?.some(v=>String(v).trim())):[]}
function redraw(){if(view==='quiz')quiz();else if(view==='results')results();else home()}
home=function(){oldHome();T.homePanel(SUBJECT,BANK,ids=>startRound('learning',ids));renderedFeatures=features()};
quiz=function(){oldQuiz();if(view==='quiz'&&session&&!session.submitted)T.quizPanel(SUBJECT,session.ids[session.index]);renderedFeatures=features()};
showNavigator=function(){oldNav();T.navPanel(SUBJECT,session.ids)};
results=function(){oldResults();if(view==='results')T.reviewPanel(SUBJECT,selectedQuestions());renderedFeatures=features()};
persist=function(){const saved=oldPersist();if(saved&&!T.applying){T.record(SUBJECT,{schema:2,session,wrongCounts},BANK);wrongCounts=T.counts(SUBJECT);renderedFeatures=features()}return saved};
T.register(SUBJECT,{bank:BANK,read:()=>({schema:2,session,wrongCounts}),cancelAuto:()=>clearAutoAdvance(),apply:snap=>{
 if(document.activeElement?.matches('textarea,input[type="text"]')){pendingRemote=true;return false}
 if(T.same(session,snap.session)&&T.same(wrongCounts,snap.wrongCounts)&&renderedFeatures===features())return true;
 clearAutoAdvance();session=snap.session;wrongCounts=snap.wrongCounts;if(session){scope=session.scope||'all';}redraw();pendingRemote=false;return true;
}});
// Reapply deferred remote changes after typing, without stealing the caret or overwriting another small question.
document.addEventListener('focusout',()=>{if(pendingRemote)setTimeout(()=>{if(!document.activeElement?.matches('textarea,input[type="text"]')){const snap=T.snapshot(SUBJECT);session=snap.session;wrongCounts=snap.wrongCounts;redraw();pendingRemote=false}},0)});
redraw();
})();

 const css=document.createElement('style');css.textContent='#offline-button{font-size:12px;min-height:36px;padding:6px 10px;background:#fff;color:#172b43;border:1px solid #d8e0eb;border-radius:10px}body>header{flex-wrap:wrap}#offline-dialog p{font-size:14px;line-height:1.8}#offline-dialog button{min-height:44px;padding:8px 12px;border:1px solid #d8e0eb;border-radius:10px;background:white;color:#172b43}';document.head.append(css);
 function show(s){busy=!!s.busy;const done=s.done||0,total=s.total||0;document.getElementById('offline-progress').max=total||1;document.getElementById('offline-progress').value=done;const complete=total>0&&done===total;document.getElementById('offline-status').textContent=s.error|| (s.busy?`正在下载 ${done} / ${total} 项…`:complete?`离线题库已完整下载 · ${total} 项 · 约 ${(s.bytes/1048576).toFixed(1)} MB`:`已缓存 ${done} / ${total} 项${s.bytes?' · 完整题库约 '+(s.bytes/1048576).toFixed(1)+' MB':''}`);const b=document.getElementById('download-offline');b.disabled=busy||complete;b.textContent=busy?'正在下载…':complete?'已完成下载':'下载到当前设备';}
 async function send(type){if(!('serviceWorker' in navigator)){show({error:'当前浏览器不支持离线缓存，请用 Safari 或 Chrome 打开。'});return}const b=document.getElementById('download-offline');b.disabled=true;try{const registration=await navigator.serviceWorker.register(new URL('sw.js',root),{updateViaCache:'none'});await registration.update().catch(()=>{});const worker=registration.installing||registration.waiting||registration.active;if(!worker)throw Error('网络暂不可用，请联网后重试。');if(worker.state!=='activated')await new Promise((resolve,reject)=>{const t=setTimeout(()=>reject(Error('缓存初始化较慢，请稍后重试。')),15000);worker.addEventListener('statechange',()=>{if(worker.state==='activated'){clearTimeout(t);resolve()}if(worker.state==='redundant'){clearTimeout(t);reject(Error('请刷新页面后重试。'))}})});const ch=new MessageChannel();ch.port1.onmessage=e=>show(e.data);worker.postMessage({type},[ch.port2]);}catch(e){show({error:e.message||'无法下载，请检查网络后重试。'})}}
 function init(){document.body.append(message);const header=document.querySelector('.appbar-inner')||document.querySelector('header');const button=document.createElement('button');button.id='offline-button';button.textContent='离线下载';header.append(button);button.onclick=()=>{message.showModal();send('OFFLINE_STATUS')};document.getElementById('close-offline').onclick=()=>message.close();document.getElementById('download-offline').onclick=()=>{if(!busy)send('OFFLINE_DOWNLOAD')};}
