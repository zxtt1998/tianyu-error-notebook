<script src="../learning.js?v=r4"></script><script id="bank" type="application/json">{"version":"practical-v1","release":"2026-10-03-r3","title":"其他安全专业实务 · 错题本","papers":[{"id":1,"title":"第1套","count":13,"single":7,"multiple":3,"short":3,"parts":13},{"id":2,"title":"第2套","count":3,"single":0,"multiple":0,"short":3,"parts":13},{"id":3,"title":"第3套","count":19,"single":14,"multiple":2,"short":3,"parts":14}],"questions":[{"id":"p1-1","paper":1,"number":1,"topic":"电气与机械安全","type":"single","images":[],"stem":"人机作业环境中的照明因素、声环境和照明环境等均影响作业安全性，综上所述合适的照明条件、亮度控制要求是企业应纳入综合考量的重要因素。针对作业面的照明特性及要求的各项说法中，符合规定的是（）。","options":{"A":"光照强度越高，远视力和近视力越强","B":"设置合适的眩光，能有效提高从业者的注意力","C":"出于减少反射光及安全保密等因素，应不设或少设窗户","D":"视觉显示器之间的亮度差应超过10:1，确保使用时无闪烁"},"answer":["C"],"explanation":"A选项错误：合适的光照强度方能提高远视力和近视力；B选项错误：眩光是导致视觉疲劳的主要因素，应避免出现眩光；C选项正确：出于减少反射光引起视物不清及安全保密等理由，应不设或少设窗户；D选项错误：视觉显示器之间的亮度差不应超过10:1，确保使用时无闪烁。","explanationImages":[]},{"id":"p1-5","paper":1,"number":5,"topic":"特种设备安全","type":"single","images":[],"stem":"长期运行状态下的压力容器受介质侵蚀需进行焊补作业，已知壁厚15mm焊补深度10mm、材质为有色金属合金材料。经过焊接作业后的压力容器，应进行的监测试验方法最优的是（）。","options":{"A":"X射线探伤","B":"超声探伤","C":"泄漏量试验","D":"耐压试验"},"answer":["A"],"explanation":"焊补深度超过壁厚的1/2的压力容器应重新进行耐压强度试验，但是耐压强度实验之前为保证设备具有足够的承载能力应首先进行无损探伤试验，考虑到介质是有色金属合金为保证有足够的穿透能力应选择X射线。","explanationImages":[]},{"id":"p1-8","paper":1,"number":8,"topic":"防火防爆","type":"single","images":[],"stem":"烟火药的成分包括氧化剂、还原剂、黏合剂、添加剂等，其组分决定了其具有燃烧和爆炸的特性，在烟火药生产过程中，必须采取相应的防火防爆措施。下列烟火药生产过程防火防爆措施的要求中，正确的是（）。","options":{"A":"药柱制作应采用湿法筑压","B":"氯酸盐烟火药混合应采用球磨机","C":"烟火药干燥后散热应及时收取","D":"手工制作引火线应在专用工房内"},"answer":["A"],"explanation":"A选项正确：制作药柱应采用湿药筑压；B选项错误：不应使用球磨机混合氯酸盐烟火药等高感度药物；C选项错误：药物干燥散热时不应翻动和收取，应冷却至室温时收取；D选项错误：引火线应机械制作，并在专用工房操作，机械动力装置应与制引机隔离。","explanationImages":[]},{"id":"p1-10","paper":1,"number":10,"topic":"电气与机械安全","type":"single","images":[],"stem":"安全检测是保障安全生产的重要手段，常用的电气安全检测仪器包括绝缘电阻测量仪、接地电阻测量仪、红外测温仪、可燃气体检测仪等。下列使用安全检测仪器进行测量的说法，正确的是（）。","options":{"A":"谐波分析仪可测量各相谐波、实时显示波形并能完成相关计算显示","B":"兆欧表测量时，连接导线应采用双股绝缘导线","C":"红外测温仪测量时，测量区域应大于被测目标的范围","D":"接地电阻测量仪测量时，电极间连接线应与邻近高压架空线路平行"},"answer":["A"],"explanation":"A选项正确：谐波分析仪可同时测量各相谐波，可实时显示波形，并能完成相关计算，把结果以波形图表的形式显示出来B选项错误：使用兆欧表测量时，连接导线不得采用双股绝缘线，而应采用绝缘良好单股线分开连接，以免双股线绝缘不良带来测量误差；C选项错误：红外测温仪测量时，测量区域应小于被测目标的范围；D选项错误：使用接地电阻测量仪测量时，测量电极间的连接线应避免与邻近的高压架空线路平行，以防止感应电压的危险。","explanationImages":[]},{"id":"p1-11","paper":1,"number":11,"topic":"电气与机械安全","type":"single","images":[],"stem":"大型游乐设施的滑索通常属于无动力游乐设施，利用地形高差，通过钢索从高处向低处滑行从而跨越地形障碍。因此，下列关于滑索的各项说法中正确的是（）。","options":{"A":"设置放行联锁装置，确保乘客安全就座后方才允许放行","B":"每条滑索到达站应当设置不少于两套独立的自动制动装置","C":"无动力牵引滑索的出发站安全门开启方向应与行进方向相同","D":"无动力牵引滑索停止区长度应不大于6m"},"answer":["B"],"explanation":"A选项错误：设有放行联锁装置，到达站操作人员确认乘客安全离开后，操作允许放行按钮，出发站操作人员接收到允许放行信号后，才能启动放行联锁装置放行。B选项正确：每条滑索到达站应当设置不少于两套独立的自动制动装置；C选项错误：无动力牵引滑索的出发站应设置安全门，安全门开启方向不应当与乘客行进方向相同；D选项错误：无动力牵引滑索停止区（通过制动装置到达缓冲垫之间的区域）长度应不小于6m；","explanationImages":[]},{"id":"p1-14","paper":1,"number":14,"topic":"危险化学品安全","type":"single","images":[],"stem":"爆破片更换周期应当根据设备使用条件、介质性质等具体影响因素，或者设计预期使用年限合理确定。针对下列检查出的情况，（）应立即更换爆破片。","options":{"A":"排放接管不畅通，伴随严重腐蚀","B":"爆破片前的截止阀处于开启状态，但铅封被破坏","C":"爆破片外表面有损伤和腐蚀情况","D":"带刀架的夹持器，刀片有损伤缺口或者刀口变钝"},"answer":["C"],"explanation":"运行中的爆破片，出现下列情况之一的应更换：\n（1）检查爆破片装置安装方向是否正确，核实铭牌上的爆破压力和爆破温度是否符合运行要求；\n（2）检查爆破片外表面有无损伤和腐蚀情况，是否有明显变形，有无异物黏附、有无泄漏等；\n（3）爆破片装置与安全阀串联使用时，检查爆破片装置与安全阀之间的压力指示装置，确认爆破片装置、安全阀是否泄漏；","explanationImages":[]},{"id":"p1-20","paper":1,"number":20,"topic":"防火防爆","type":"single","images":[],"stem":"爆炸冲击波毁伤准则应充分考虑暴露在事故面的人在爆炸冲击波超压波阵面的影响下的伤害型式，在工程设计、事故后的应急救援中都具有不可替代作用。因此，某起事故中暴露在作业面50m范围左右的人受到70~75kPa超压作用，针对上述事故面的暴露人员可能受到的伤害是（）。","options":{"A":"轻微挫伤肺部和中耳，局部心肌撕裂","B":"体腔、脾脏破裂，导致大部分暴露人员死亡","C":"肝脾包膜下出血、融合性撕裂","D":"心肌撕裂、可能引起死亡"},"answer":["D"],"explanation":"70~75Kpa会造成严重损伤(严重内脏挫伤，可引起死亡)，重度中耳和肺挫伤，脚，心肌撕裂，可能引起死亡。D选项正确；A选项属于轻微挫伤；B选项极严重伤害；C选项属于中等损伤；","explanationImages":[{"src":"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAA88AAAEDCAIAAACEXKFyAAEAAElEQVR4nOz9d5Bc13UnjndO0z05J2AwyAOAyBlEIMEcIFKisiWXbGtXdrm2trbK6z/2n636fuu3VV5/XV5b9q5XlixTlEiREkGCmSACCRIAQeQ8A 5}]},{"id":"p1-24","paper":1,"number":24,"topic":"电气与机械安全","type":"multiple","images":[],"stem":"依据案例背景事故后的应对方案，下列关于人、机械、系统可靠度和人机特征的各项说法中，正确的是（）。","options":{"A":"人的可靠度R1为0.999","B":"人机关系中，机械为主体","C":"人机关系中，机械作为动力源、人作为操作者和控制者","D":"人机系统的可靠度0.9931","E":"人机安全性取决于功能分配的合理性、机械本质安全性"},"answer":["B","D"],"explanation":"A选项错误：人的可靠度R1=1×0.98×0.95=0.931；B选项正确、C选项错误：人机系统属于自动化系统，在人机关系中机械为主体，依靠信号的闭环传递实现操控，人作为监视者和管理者；D选项正确：人机系统可靠度=1-（1-0.9）×（1-0.931）=0.9931；E选项错误：人机系统的安全性取决于机器的本质的冗余化设计、人低负荷时的应急反应。","explanationImages":[],"material":"根据案例背景—情景描述，回答21-25问题大型物流单位构建连接生产端与消费端的主动脉，通过规模化的运输调度和智能化的路径优化，显著降低了单位商品的流通成本并缩短了周转周期。这种高效的商品流通体系，是支撑现代产业链分工、灵活响应市场变化以及实现资源优化配置的关键基础设施。大型物流单位的大型带式输送机是最典型的机械设备。带式输送设备辅助物流品的输运作业通过固定岗位的作业人员依次完成分类分拣作业，已知某男性工人（性别系数男性取值1.0）从事物流品的分拣作业（W取值0.8），净劳动时长4h（工作日总工时按照8h安排）、实测能量代谢率3.75KJ/min·m2。基于上述作业情景，单调的劳动作业方式极易导致疲劳、注意力不集中等问题，看似有序和缓的作业方式也容易让人忽视现场的安全隐患。恰逢特殊的时间段导致物流分拣压力陡增，2#皮带停转故障卡死，事故查验表明故障因皮带安检设备中的大型货物堆积所致。安检设备存在辐射源、皮带交接口属于最典型的危险区域，采用安全栅栏进行物理隔断并设置具有安全联锁功能的防护门。设备检修期间依照检修方案将联锁功能隔断、电机断电，试运行期间检修人员违反规定擅自在安全防护区内停留观察设备运行状态，结果高速运行状态下的皮带绷带导致打击致死。企业为避免同类事故并有效提高工作效率，引入全自动化智能机械臂，具备协同作业的空间配置能够检测操作者是否处于协同工作空间内的安全适用设备，机器臂应在操作者进入协作工作空间时提前切换到安全适用的受监控停止状态，并一直保持这一状态，直到操作者离开协作工作空间。若操作者进入协作工作空间时机器人还未进入安全适用的受监控停止状态，则会引发保护性停止。引入自动化智能机械臂后属于典型的全自动化系统，已知人的信息接受的可靠度1.0、信息判断的可靠度0.98、信息处理的可靠度0.95；此外，机械的可靠度定义为0.9。正常状态，人机系统工作方式如下：","materialImages":[{"src":"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAX8AAACvCAIAAACab0mrAAAcX0lEQVR4nO3deXBU150v8HPO3XpTq7ULhAAtYISEMHiNwZaxM3YcEzwkpYcNwi5nMpmZmpo3r1z1/h8yf7x/3l+pyUtVqkLKbDbhESdeCDZ+GJJgdsxiQCAJSQiE1Gjv7a7nvDrdQoCQQOBW36u+v0+psGhaOtdXrW+f/SAEAAAAAAAAAAAAAAAAAKQLTtt3AmnS2NgYDofhdqZdcXHxrl274MY6B6SPIzQ0NMyZM4f/PJLsvpzsxBgbu7dbt261+3IApI8DbNiwIfVbIUlWSUkkGIz7fLosm3ZfV1ZJJOREQh4Y8N+8GUCIpMJo27Ztdl+Xq8HbrJ0aGxsVRcEYh0KxZ565Ul9/NT8/JkmmKFJBYLZeWrYxTWKaRNfF3t7g0aNVZ87MTSQkhJDP5/vNb35j99W5FKSPbd54441AIEAIqqm5sXbtyZKSYcLfksG0M03S0lLyxz8+0d0dopTpug79QbYQ7SnW9RoaGoLBIMb0qafaf/KTEz6f7vpbkjmiSGtqbuTl/WXHju9duVKkKArcfFvAu609ysvLGWMLFvRC9NiltHRk3bqjhYVRhFBTU5Nt1 于最典型的危险区域，采用安全栅栏进行物理隔断并设置具有安全联锁功能的防护门。设备检修期间依照检修方案将联锁功能隔断、电机断电，试运行期间检修人员违反规定擅自在安全防护区内停留观察设备运行状态，结果高速运行状态下的皮带绷带导致打击致死。企业为避免同类事故并有效提高工作效率，引入全自动化智能机械臂，具备协同作业的空间配置能够检测操作者是否处于协同工作空间内的安全适用设备，机器臂应在操作者进入协作工作空间时提前切换到安全适用的受监控停止状态，并一直保持这一状态，直到操作者离开协作工作空间。若操作者进入协作工作空间时机器人还未进入安全适用的受监控停止状态，则会引发保护性停止。引入自动化智能机械臂后属于典型的全自动化系统，已知人的信息接受的可靠度1.0、信息判断的可靠度0.98、信息处理的可靠度0.95；此外，机械的可靠度定义为0.9。正常状态，人机系统工作方式如下：","materialImages":[{"src":"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAX8AAACvCAIAAACab0mrAAAcX0lEQVR4nO3deXBU150v8HPO3XpTq7ULhAAtYISEMHiNwZaxM3YcEzwkpYcNwi5nMpmZmpo3r1z1/h8yf7x/3l+pyUtVqkLKbDbhESdeCDZ+GJJgdsxiQCAJSQiE1Gjv7a7nvDrdQoCQQOBW36u+v0+psGhaOtdXrW+f/SAEAAAAAAAAAAAAAAAAAKQLTtt3AmnS2NgYDofhdqZdcXHxrl274MY6B6SPIzQ0NMyZM4f/PJLsvpzsxBgbu7dbt261+3IApI8DbNiwIfVbIUlWSUkkGIz7fLosm3ZfV1ZJJOREQh4Y8N+8GUCIpMJo27Ztdl+Xq8HbrJ0aGxsVRcEYh0KxZ565Ul9/NT8/JkmmKFJBYLZeWrYxTWKaRNfF3t7g0aNVZ87MTSQkhJDP5/vNb35j99W5FKSPbd54441AIEAIqqm5sXbtyZKSYcLfksG0M03S0lLyxz8+0d0dopTpug79QbYQ7SnW9RoaGoLBIMb0qafaf/KTEz6f7vpbkjmiSGtqbuTl/WXHju9duVKkKArcfFvAu609ysvLGWMLFvRC9NiltHRk3bqjhYVRhFBTU5Nt1+FikD42aGhoQAgFg+ratSeh1mOjsrKhV175FmPGGPSy2QDSxwbl5eUIoaefvlJWNmhH+eC2pUuvVlT0wSwHW0D62IAxJstWbe11mNljO59Pr6u7npr3YPe1uA70OtsAY1xQEC0qithROBj3s0ALFvTAJE9bQPrYw+fTPR4Y53KE/PwYQsyyqN0X4jrQ8rKHohgwm9khRNFSFBO6fjIP0sceGDOYW+gcGMOYlw0gfQAA9oD0cb24SDpzkQVrbkCmQa+z25F+n+9XT9FZUf2FTnNRH/IZsPgPZAakj+uZhAx7hHBAPFdsLupT3z5DS2OuvykgE6Dl5Xa8xZXqcqXYfLKbFsXtviLgFpA+rkcx/+D1YKo/fxXBvkIgUyB9XM/C2BR4JcgUyIDX9bcDZA6kD7jj1RD2w+0AGQO9zq5n8IoPQwxJlPQG0JJHP04Dj8hCR+j23wljXpOJlIVUFtChTQfGgfRxOzLoSf6HWRWD5EYA0UevEAut+f5fPjv2V4YZ8iTTJ6jxEf0VV82am8hjpevKwUwH6eN2o309PH2GhKu5vCqkpCcgMMMoIfEO7YgiXA+Kp0rNZT1q43laEoMpRQD6fQAig7fSp3KQ9Pqxzhti3xEj1KjvMep7zIpB5jUYoQwxTIl0crbvl8/wGhYsqwJQ9wG4P5k+AjNr+nBEwQNelvOdt/5QrPh7R0Y/t7DQmSvvq5IP8x0dhe6g58O6+L+cQF44sMztYMzL3UyCI/xEBxrUWI5Gi2PixcI0FyEwq3Io8e432iutqQfEC0Via36aSwEzEKSPq+G4iDXe90dnRRFGdHZEbClAxjS8KmSq/egyU3h9B5uCcLkg/UWAmQbSx9V4UyuRTJ+yEd5ImjtMunLx8LScb8X8Oi0YXcZBRuAILQDp426k34sjMhOoNedW+gwpQucdc3bSCSM6+m 8+fZxM/V779A/5fLK5NX357IHLZCLtW7KENdUaZ+zCYAryjRosjM8ZslyDGjqN3WyA6kHWdf2KMDSIAL8eM3906TZpTWy2WytHIMBD5zBtm1CXJkunT5267pzdfxp6N28FfesWLFiQa+6EyeSiHdIg1Bdlfa4dvFR7ihQWXFBrDAe9Y8g9nY0K554QBRNukSyHzFGk+dmTx3pmHf2HfJHCkXME8HQ9durc+fPJ+QPkj7D+KLKrrZ6N/f39pGOlnfCOqToE9DVSm0WK7DNOcA9KrK1Aa9Bs1GKzrlpoNvv0LmSq2bI71iUw7Z3fkM3hQSI6mbx05fQZcn4X+aOtP6bscLnZpgUL+3MLVrqOM05bAOP0miyzF2e/AhYS4IR/YaBwFtm59Yhi2iNgrAcL3oN2UGDvi4v6FRIYNu2n4DSbCEyimLlw9MLZM//Mn917zeoazC+6oaWlNc22GWMqCSCAFnl38KnFLoW8PcRnc1j03H7Ozhuf5SrjU7ftkz6RGZWKPEgzHJ+YmJg5e5Bc+cd7gPk/ouxml5traW1pyrUvyGWztNAF84op1BxiZFjq2cnks7EIsEVBXoiF2Od6eoi263A6DMN4eGhkbJyUrz/q/1+a7Mj8le0nGZ8UFgSNDTQD/V6+B0VYW/A1WHVLoKFYyySGUni5mM5Mk5lxUg1tg8ifcP3/fLaGetghLEsAAAAASUVORK5CYII=","alt":"第1套原题25原卷配图","width":105,"height":104}]}},{"id":"p1-26","paper":1,"number":26,"topic":"事故辨识与检维修","type":"short","images":[],"stem":"案例2 · 简答题","material":"案例二：锅炉是典型的热传递设备，引领人类将燃料化学能高效转化为热能并进一步驱动机械做功的技术变革，为现代工业、电力生产和集中供热奠定了核心基础。但是，看似成熟的工业设计体系却暗藏诸多安全风险，监管、运行、维护不当都会导致严重的安全事故。因此，下列案例背景以中国企业为核心主导的南亚某大型工业园区为例进行详细阐述，涉及部分名称、工艺、设备等特征数值进行模糊处理，不涉及任何保密要求。注释：涉及保密要求切忌对号入座，考生应按照国内标准执行。园区致力于构建新型产业产能模式，围绕基础核心产能，依托服务型企业打通并整合全产业链，最终形成完整的内循环生态产业闭环。服务性企业A主要保证园区电力、蒸汽、热水、循环冷却水的供应，同时能够提供压力容器介质的转运管理（包括但不限于液氨、天然气等）、三废排放处理及检维修队伍常驻园区的深层次服务，实现对生产工艺功能的全方位支撑。企业2#锅炉机组属于高效燃油炉投产超过十年但期间工艺工况稳定，废液经过稀释剂处理后由高压空气泵入炉膛，在高压空气的强剪切力作用下形成毫米级雾滴保障燃烧传热效率。运行中，现场作业人员反馈烟道部分燃烧形成明焰，通过烟道的灭火装置和蒸汽吹扫设备并未压灭火焰最终紧急停炉。经过对烟道及相关设备修复检测后尝试点火并炉，对设备进行检查后正常上水点火，但由于空气预热器及送风设备等原因未能正常引燃，再次点火期间发生炉膛爆炸。事故共导致两人死亡、八人失联且上百人送医，据当地居民表示事发时距爆炸点3.5km外存在明显震感且门窗玻璃破损。为厘清事故原因，针对锅炉近期全过程进行复盘查验：半年前，按要求进行周期性停炉检修，由企业维修部、设备部和安全管理部共同负责。其中，灭火装置采用ABC干粉联用卤代烷灭火剂提高灭火施救效率，但是卤代烷灭火剂驱动气、灭火剂气均不具备足够压力。由于设备交接验收工作不到位导致事故期间未能正常启动。查阅检查及整改记录显示，采用中国人师傅带徒弟的方式且重要岗位尽量设置富有经验的中国监管人员。期间，监管人员多次反馈作业人员隐患意识、操作能力和应急施救能力严重不足，且安全员连最基本的隐患辨识都不具备。检查期间发现：\n（1）灯具、探测器的防爆形式选择不当；\n（2）喷砂机的压力罐存在严重变形；\n（3）擅自将气瓶带入有限空间且氧气瓶、乙炔气瓶间距不足；\n（4）未按要求设置安全标志；\n（5）具有协同报警功能探测器，声压强度不足被现场噪音遮盖；\n（6）电焊用防弧光眼镜设置严重不足；\n（7）高压蒸汽管道未按要求设置保温层且距出入口间距不足；\n（8）探伤作业未设置必要的警戒隔离；\n（9）落地式砂轮机防护罩开口过大、防振阻尼装置损毁。依据上述案例背景，回答下列问题（22分）","parts":[{"number":1,"prompt":"锅炉烟道燃烧属于什么事故并简述事故预防措施。","referenceAnswer":"尾部烟道二次燃烧。\n（1）提高燃烧效率，减少锅炉启停次数；\n（2）加强尾部受热面的吹灰；\n（3）保证烟道门孔和烟道挡板的密封良好；\n（4）锅炉的尾部烟道装设灭火装置。","referenceImages":[]},{"number":2,"prompt":"参照GB13861辨识作业面的物理性危险有害因素及致害物。","referenceAnswer":"（1）设备、设施、工具、附件缺陷：设备选型不当、压力罐变形；\n（2）防护缺陷：间距不足；\n（3）信号缺陷：报警功能探测器声压级强度不足；\n（4）标志标识缺陷：未按要求设置安全标志；\n（5）电危害：电气设备、供电线缆；\n（6）噪声：喷砂除锈设备、砂轮机产生噪声；\n（7）振动危害：喷砂除锈设备、砂轮机产生振动；\n（8）运动物危害：抛射物、飞溅物、坠落物、气流等；\n（9）电离辐射：探伤作业辐射源；\n（10）非电离辐射：电焊作业的弧光；\n（11）高温物质：焊渣、打磨碎屑；\n（12）其他物理性危险和有害因素。","referenceImages":[]},{"number":3,"prompt":"为避免同类事故，简述设备交接时确认项目。","referenceAnswer":"（1）锅炉检修质量符合要求；\n（2）按照施工文件、作业方案完成检修作业；\n（3）锅炉受压面完整性、密封性能；\n（4）试压及气密性试验结果符合要求；\n（5）临时拆除的安全设施及安全附件全部恢复；\n（6）能量隔离措施恢复至正常生产备用状态；\n（7）上水泵等设备试车情况良好；\n（8）自动化仪表等设施完成检验或调试。","referenceImages":[]},{"number":4,"prompt":"简述检修作业前的安全交底的内容要求。","referenceAnswer":"（1）检修作业/有限空间作业的法律法规及标准规范；\n（2）检修作业面危险有害因素辨识及控制措施；\n（3）锅炉检修作业方案及工期安排；\n（4）作业面涉及烟气、有毒气体的理化性质及作业环境；\n（5）锅炉检修作业的正常操作条件及注意事项；\n（6）锅炉的吹扫、通风情况；\n（7）个体防护装备的配备与使用方法；\n（8）应急处置措施、自救互救、急救方法及安全疏散要求。","referenceImages":[]}]},{"id":"p1-27","paper":1,"number":27,"topic":"粉尘防爆与隐患治理","type":"short","images":[],"stem":"案例3 · 简答题","material":"国内的粮食安全政策强调以我为主、立足国内的根本原则，与很多依赖国际市场或受国内结构性问题困扰的国家形成了鲜明对比，并在确保口粮安全、维持市场稳定及保护农田基础方面展现出显著优点。在全阶段寿命安全管理中，加工储运系统防爆安全属于重中之重。经过粉碎碾磨后的粉料通过正压风床输送至粉料散存仓，由于设备密封性失效导致车间瞬间弥漫白色粉末扬尘，车间主任见状立即关闭正压风床通过现场状况查验决定执行清理作业：\n（1）不关闭碾磨设备，降低输送风压转送至临时粉料锥形舱；\n（2）保持低速工作模式下，打开端墙上的直灌式送风设备；\n（3）采用燃油举升机完成粉料抬升作业提高工作效率；\n（4）切断控制室、配电间电气联锁，避免触发粉尘联锁状态；清理作业期间发生爆炸事故，导致现场三名作业人员当场死亡、控制室内的车间主任和班长严重烧伤，现场设备由于爆炸碎片的毁伤作用修复难度极大。事故发生后，针对现场检查期间发现下列情况：\n（1）滤袋采用耐高温材质，保持烟气流稳定防止扰动扬尘；\n（2）除尘器未按要求设置风压差检测报警装置；\n（3）除尘器灰斗未按要求设置锁气泄灰装置；\n（4）除尘系统单独采用隔爆措施；\n（5）除尘系统未按要求设置灰斗温度检测报警装置；\n（6）打包间、清理间防爆灯具选型不当，距粮面不足300mm；\n（7）地面未按要求进行防静电消火花处理；\n（8）未按规范要求正确划分爆炸性分区。查阅企业安全管理文件，现场爆炸性分区划分大致如下：\n（1）粉碎间、碾磨间定义为爆炸性20区；\n（2）配料间、配粉间和粉料散存仓，划分为爆炸性21区；\n（3）封闭式输送廊道、卸粮坑内部属于爆炸性20区；\n（4）风机送风口、排风口，均划分为22区；\n（5）敞开式楼梯间、控制室，划分为爆炸性22区。依据上述案例背景，回答下列问题（22分）：","parts":[{"number":1,"prompt":"依照重大事故隐患判定依据，粉尘涉爆区域是否构成重大事故隐患，如果是请指出判定依据。","referenceAnswer":"粉尘设备区域构成重大事故隐患。\n（1）粉尘爆炸场所内设有办公室、休息室等人员聚集场所的；\n（2）木质粉尘的干式除尘系统未设置锁气卸灰装置的。","referenceImages":[]},{"number":2,"prompt":"参照规范《生产安全事故分类与编码》、《生产安全事故报告和调查处理条例》确认清理事故类别，并据此完善车间内应急物资柜应设置的应急物资。","referenceAnswer":"按照《生产安全事故分类与编码》属于粉尘爆炸；按照《生产安全事故报告和调查处理条例》属于较大事故。火灾和物质爆炸—防高温救援服、干粉灭火器、消防沙；高处坠落和物体打击—安全绳、安全带和安全帽；触电—绝缘手套、绝缘鞋和绝缘衬垫。其他伤害（通用性应急物资）—生命体征探测器、可燃气体探测器、有毒气体探测器、医疗急救箱、应急照明设备、通讯联络设备（对讲机）、洗消设备（洗眼器）和破拆工具。","referenceImages":[]},{"number":3,"prompt":"依照规范《粮食加工、储运系统粉尘防爆安全规范》，指正企业爆炸性分区的划分定义。","referenceAnswer":"（1）粉碎间、碾磨间，划分为爆炸性21区；\n（2）粉料散存仓，划分为爆炸性20区；\n（3）封闭式输送廊道，划分为爆炸性21区；\n（4）送风口通常设置在非爆炸危险区；\n（5）敞开式楼梯间、控制室，划分为非爆炸危险区。","referenceImages":[]},{"number":4,"prompt":"参照静电防护规程、防爆泄压设计规范，简述粮食加工企业应采取的防火防爆安全措施。","referenceAnswer":"设置除尘设备、粉尘浓度探测报警系统、防爆型电气设备、严禁使用铁质器具、采用铜铝等有色金属代替、设置静电接地、人体静电导出装置、设备间的等电位联结、空气增湿。火灾自动报警系统、自动灭火系统、消防器材、防爆泄压设施。","referenceImages":[]}]},{"id":"p1-28","paper":1,"number":28,"topic":"重大危险源与安全管理","type":"short","images":[{"src":"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAioAAAB7CAIAAADVHzyfAAEAAElEQVR4nMT9B5gc1bU9jp5YVd09UaNRTihHBApICJAAiSRyzhhsY2MbsLGNc7zOAWPjjMHYBBuDyTmKIIFAQkgoI6GcJ4furqqT3rdO9YwE9v393+9733uvr6+QJnRX1Tlnh7XXXpsOnDZVExczzqRQygjGBaHOWEctIcT6P5ljlhL/soxYwlnsHCFMGBYyGadWCMGostQap62jgkhGHDeKcGupUERLSpW1hIRSRlRbZZUW1FLH8MNUMhYwJ6nD+/PIOGocEYIYm1JKreGCBUQzwZ1lZe20oZwSzi2jlKZUE8ICHqkkjoSz1BljKQuYYYYSw5WjVmrhKDGMOEKkyW6EONxRdo+EOyIU/l60SjlrCcW1GEspNZT7n9WU4c0tJRTPwAknrbWMEUU0pZRy5jSnnCnmqI2riLbWdhMhRU6mhBFtuNLEMVKw1jE8FaoZsVZLh3fUzBFCAy0IYYZSR51zRnDqDGGusgoBDY1RgWCJVoLnSjo1nDjmAho4kwpmtU5CERniUkckk7xEOOeJII4agYdvDbOOEmYZc0RYQRlTRCvqmBRpmoYsIM4I/LqiQjpnmLacSU0CQojQZRmwktOWCmZDSkiOkNTGhuEOpGWCWq3KXPLUMCoktY7js5wymrPIMqdJQikNbGAoSYUxTEtjiaOOBMYRzkOnYmnSMB+0q5iLIFAUa8OcY9Q47ah1glJto0QEPIgpvkIJ1jQRjBASKSxrzKmQMolLUSAopaqc5HlIrNN46MRRPGhLGXNWWIIPwGYnxEkqpDGKSq61kgElRrlUh66aCVk2CZHEUoVfpdxaK2mYpnHAhaUW98CZMUZy4Qyh1jkqHDOOamsNp5IRaql2uI+QOGYdNoKjlFgXUK50HEYsNZoqKcMgdQkhhNPAaaNsks/n05JzzDmRYh/iyVvulGOW2JA6Iomj1 },{"number":5,"prompt":"分析判定异常工况处置方案不具可执行性的原因及措施。","referenceAnswer":"（1）处置方案单独由安环部起草不符合要求，由负责安全生产管理部门或相关职能部门负责起草；\n（2）未按要求通过会签，应征得相关部门或员工的意见建议；\n（3）仅通过合规性审查不符合要求，技术性较强应邀请专家；\n（4）签发流程不当，全局性管理制度应由主要负责人签发；\n（5）未明确发布方式，应采用固定的方式进行发布；\n（6）培训目标未明确，应组织相关人员进行考试；\n（7）未按要求进行及时的反馈和持续改进。","referenceImages":[]}]},{"id":"p2-26","paper":2,"number":26,"topic":"氨制冷与应急预案","type":"short","images":[],"stem":"案例2 · 简答题","material":"案例背景—情景描述G公司是一家食品加工企业，共有从业人员340人，主要生产冷冻食品，下设生产车间、冷藏库、冷冻库、氨制冷机房、配电室、办公楼、食堂、锅炉房、液化气瓶间等。氨制冷车间内液氨储罐、氨制冷压缩机、冷凝器之间通过不同管径的压力管道（GC1等级）相连接。G公司委托H安全评价机构对液氨储罐进行安全评估，确定液氨储罐构成2级重大危险源并撰写了安全评估报告。G公司按规定向当地县级应急管理部门进行了重大危险源的备案。2024年5月，按照压力管道定期检验要求，G公司组织对氨制冷车间压力管道进行了全面检查，具体情形如下：①供液管道耐压强度校核不合格；②排气管道单个焊接头未熔合长度为焊接接头长度的20%；③管道咬边深度不超过3mm；④ 管道安装位置不符合要求， 受条件限制无法调整，对管道安全运行影响不大；⑤管道材质不明，强度校核不合格；⑥管道本身原因泄漏性试验不合格；⑦管道支吊架出现异常；⑧管道组成件出现泄漏，影响管道安全使用；⑨管道阀门砂眼，经堵漏后仍有轻微泄漏，但不影响使用。G公司氨制冷机房为单层建筑，面积为500m2，划分为一个防火分区。其周围设置净宽度和净高度均不小于4m的消防通道，与附近办公楼距离20m。氨制冷机房与冷库贴邻建造，采用耐火极限不低于3.00h的防火隔墙分隔。氨制冷机房设置一个安全出口，安全出口采用平开门，向机房内开启。2024年11月，G公司氨制冷机房发生氨气泄漏，由于建筑防火设计不合理，3人未能及时疏散，分别出现不同程度的中毒现象，其中2人就医无效死亡。事故发生后，G公司针对氨制冷机房进行整改，并重新编制了氨制冷机房的专项应急预案。根据以上场景，回答下列问题：","parts":[{"number":1,"prompt":"简述H安全评价机构撰写的重大危险源安全评估报告的内容。","referenceAnswer":"简述H安全评价机构撰写的重大危险源安全评估报告的内容。\n（1）评估的主要依据；\n（2）重大危险源的基本情况；\n（3）事故发生的可能性及危害程度；\n（4）个人风险和社会风险值（仅适用定量风险评价方法）；\n（5）可能受事故影响的周边场所、人员情况；\n（6）重大危险源辨识、分级的符合性分析；\n（7）安全管理措施、安全技术和监控措施；\n（8）事故应急措施；\n（9）评估结论与建议。","referenceImages":[]},{"number":2,"prompt":"辨识G公司氨制冷车间压力管道安全等级状况属于4级的情形。","referenceAnswer":"辨识G公司氨制冷车间压力管道安全等级状况属于4级的情形。\n（1）供液管道耐压强度校核不合格；\n（2）管道材质不明，强度校核不合格；\n（3）管道本身原因泄漏性试验不合格；\n（4）管道组成件出现泄漏，影响管道安全使用。","referenceImages":[]},{"number":3,"prompt":"根据《氨制冷企业安全规范》（AQ 7015），指出氨制冷车间建筑防火设计上的不合理之处。","referenceAnswer":"根据《氨制冷企业安全规范》（AQ 7015），指出氨制冷车间建筑防火设计上的不合理之处。\n（1）氨制冷机房与附近办公楼距离20m，不合理。氨制冷机房与民用建筑的防火间距不应小于25m。\n（2）氨制冷机房与冷库贴邻建造，采用耐火极限不低于3.00h的防火隔墙分隔，不合理。氨制冷机房及其控制室与加工间、冷库或仓库库房贴邻建造时，应采用不开门窗洞口的防火墙分隔，且氨制冷机房及其控制室屋面板耐火极限不应低于1.00h。\n（3）氨制冷机房设置一个安全出口，不合理。氨制冷机房每个防火分区不应少于2个安全出口，且两个安全出口最近边缘之间的水平距离应不小于5m。\n（4）安全出口采用平开门，向机房内开启，不合理。氨制冷机房及其控制室和变配电所安全出口的门应采用平开门，并向疏散方向开启。","referenceImages":[]},{"number":4,"prompt":"简述应及时修订应急预案的情形。","referenceAnswer":"简述应及时修订应急预案的情形。\n（1）依据的法律、法规、规章、标准及上位预案中的有关规定发生重大变化的；\n（2）应急指挥机构及其职责发生调整的；\n（3）安全生产面临的风险发生重大变化的；\n（4）重要应急资源发生重大变化的；\n（5）在应急演练和事故应急救援中发现需要修订预案的重大问题的；\n（6）编制单位认为应当修订的其他情况。","referenceImages":[]}]},{"id":"p2-27","paper":2,"number":27,"topic":"粉尘防爆与隐患治理","type":"short","images":[],"stem":"案例3 · 简答题","material":"案例背景—情景描述C公司是一家小型食品配料生产企业，主要生产食品添加剂、调味料等。C公司租用一座砖混结构的二层建筑作为生产厂房，占地面积约为1100㎡。二层设置有发电机房、风机房等辅助生产用房，产品研发室，车间检化验室及人员临时办公室。一层自西向东分别为成品库房、生产车间及原料库房，分别设置在三个防火分区内，其除尘系统将含尘废气通过一根管道排至室外。C公司的生产工艺主要是利用混合机将各种原材料按比例均匀混合后包装，生产过程不存在温度、压力等特殊条件，产品生产过程为纯物理混合过程。生产原料主要有小麦粉、食用玉米淀粉、氧化淀粉、食用盐、食品添加剂、香辛料等，通过配料、筛选、混合后制成不同产品，经包装、检验后产品入库。生产车间内的主要设备包括卧式混合设备、立式混合设备及半自动分体包装机。2025年2月15日13时许，C公司发生一起粉尘爆炸事故，造成5人死亡，直接经济损失约840万元。位于生产车间中部的立式混合设备在混合搅拌过程中，因罐内进入金属碎片与罐体摩擦形成点火源，导致罐内淀粉等物料发生爆炸，爆炸引发生产车间内积聚的淀粉、浆粉等物料形成粉尘云，继而发生二次爆炸。C公司在没有论证实施方案安全性和采取安全防护措施的情况下，自行安装、改造、使用立式混合设备。作业前，施工项目部针对作业面情况进行检查确认：\n（1）灯具、探测器的防爆形式选择不当；\n（2）喷砂机的压力罐存在严重变形；\n（3）未按要求设置安全标志；\n（4）协同报警功能探测器，声压级强度不足被现场噪音遮盖；\n（5）电焊用防弧光眼镜设置严重不足；\n（6）高压蒸汽管道未按要求设置保温层且距出入口间距不足；\n（7）落地式砂轮机防护罩开口过大、防振阻尼装置损毁。事故调查发现，C公司现场管理混乱，爆炸现场发现有氧气、乙炔气等气瓶混存，生产车间存放有角磨机等工具，生产用设备设施均未采用防爆设计，包材库存放打印机、电焊机等物品。查阅资料得知，C公司未制定粉尘防爆安全管理制度，未采取监测、报警和泄爆、抑爆等安全措施，在易产生机械点火源的工艺设备前，未设置铁、石等杂物去除装置，未针对粉尘爆炸风险组织相应的安全教育培训。C公司未设置安全生产管理岗位，日常安全事项由各班组长口头告知、提醒。县级应急管理部门对C公司进行处罚，并要求其落实事故整改和防范措施。根据以上场景，回答下列问题。","parts":[{"number":1,"prompt":"根据《工贸企业重大事故隐患判定标准》，辨识C公司存在的重大事故隐患。","referenceAnswer":"根据《工贸企业重大事故隐患判定标准》，辨识C公司存在的重大事故隐患。\n（1）C公司租用一座砖混结构的二层建筑作为生产厂房，粉尘爆炸危险场所设置人员办公室等人员密集场所。\n（2）成品库房、生产车间及原料库房，分别设置在三个防火分区内，其除尘系统将含尘废气通过一根管道排至室外，不同防火分区共用一套除尘系统。\n（3）生产用设备设施均未采用防爆设计，除尘器、收尘仓等划分为20区的粉尘爆炸危险场所电气设备不符合防爆要求。\n（4）在易产生机械点火源的工艺设备前，未设置铁、石等杂物去除装置。\n（5）未制定粉尘清理制度，现场积尘严重。\n（6）未采取监测、报警和泄爆、抑爆等安全措施，干式除尘系统未采取泄爆、惰化、抑爆等任一种爆炸防控措施。","referenceImages":[]},{"number":2,"prompt":"分析C公司粉尘爆炸事故原因。","referenceAnswer":"分析C公司粉尘爆炸事故原因。\n（1）直接原因：立式混合设备在混合搅拌过程中，金属碎片与罐体摩擦形成点火源，导致罐内淀粉等物料发生爆炸，爆炸引发生产车间内积聚的淀粉、浆粉等物料形成粉尘云，继而发生二次爆炸。\n（2）间接原因：未制定相关安全生产规章制度和操作规程，缺少粉尘防爆安全管理制度；安全教育培训不到位，未针对粉尘爆炸风险组织相应的安全教育培训；安全生产检查和事故隐患排查不到位，现场管理混乱；未配备安全生产管理人员，专门负责企业的安全生产管理工作；未履行安全设施“三同时”的规定，对其安全生产条件和设施进行综合分析；未掌握新设备安全技术特性，未制定工作方案，未采取安全保护措施，自行组装调试设备并进行试生产。","referenceImages":[]},{"number":3,"prompt":"列出C公司生产车间应设置的安全装置。","referenceAnswer":"列出C公司生产车间应设置的安全装置。防爆通风系统，防爆除尘系统，粉尘浓度监测报警装置，静电接地装置，人体静电导除装置，安全监控系统，火灾自动报警系统，自动灭火系统，消火栓系统，灭火器材，泄爆装置，抑爆装置，隔爆装置，建筑泄压设施。","referenceImages":[]},{"number":4,"prompt":"参照GB13861辨识改造作业面的物理性危险有害因素及致害物。","referenceAnswer":"参照GB13861辨识改造作业面的物理性危险有害因素及致害物。\n（1）灯具、探测器的防爆形式选择不当；\n（2）喷砂机的压力罐存在严重变形；\n（3）未按要求设置安全标志；\n（4）协同报警功能探测器，声压级强度不足被现场噪音遮盖；\n（5）电焊用防弧光眼镜设置严重不足；\n（6）落地式砂轮机防护罩开口过大、防振阻尼装置损毁。","referenceImages":[]}]},{"id":"p2-28","paper":2,"number":28,"topic":"吊装作业与特殊作业","type":"short","images":[{"src":"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAABXkAAAOOCAIAAADasIZgAAEAAElEQVR4nOz9f0xTd/8//nevvHJd7euP17q+E619JbN2yUvYEu0wmYhRO8gUXCagmaBEqJqpzKig8QcsCmoGqBGYxhU1uhaDFhelaBzVBeg0Ii4RK8lGvZJBuZIL6v7A+v6n59o/fvPh8f08v+d72p6etqelwP32h6mlPW1PT895Ph/Px/PxVCgAAAAAAAAAAAAAAAAAAAAAUtM7CoWit7fXZDJN9TsBAEgSl8v16aefGgyGP/74AzsdAGakrVu3Wq3Wmpqa2traqX4vAAAwG69B/zHVbwMAAAAAAAAAZhTEGgAAAAAAAABATog1AAAAAAAAAICcEGsAAAAAAAAAADkh1gAAAAAAAAAAckKsAQAAAAAAAADkhFgDAAAAAAAAAMgJsQYAAAAAAAAAkBNiDQAAAAAAAAAgJ8QaAAAAAAAAAEBOiDUAAAAAAAAAgJwQawAAAAAAAAAAOSHWAAAAAAAAAAByQqwBAAAAAAAAAOSEWAMAAAAAAAAAyAmxBgAAAAAAAACQE2INAAAAAAAAACAnxBoAAAAAAAAAQE6INQAAAAAAAACAnBBrAAAAAAAAAAA5IdYAAAAAAAAAAHJCrAEAAAAAAAAA5IRYAwAAAAAAAADICbEGAAAAAAAAAJDTzI81+Hw+1ySPxyPL1qJ9CsdxisTz+/1JeBVIfX6/PzmHnEKh8Hq9OPBmj2jPfkk7DqfjQZi0nTPlcNhAQvn9fmrjud1u7GoAgFkXa3C5XO9M2rp1q2Iq3L9//9NJp06dinNTdrvdYDDU1tZKf0ptbe0HH3xgs9lieLmGhoYPPvjg66+/djgc4o+srq7W6XT9/f2K6YMdGDk5OanZrPd6vfQOP/jggxT/gHzHjx9XqVTr1693Op2JexW327127doFCxYcP348qidu3bqVdktsP4oUVF1dvWnTJpvNFtynstvt//Vf/5WTk9PQ0JCgV3e5XLWTQp4lmpub6a9erzeeV+E4btOmTR999JH01jzHcR999NH69etj6wB8+OGHy5cvj/jOvV7v8uXLP//88+nVdW9oaPif//mfiGfsJZOam5un16djcNjMEvFcKOPndrupjXfgwAHF1LHZbNLbulu3bo2qJQkAML319va+TZje3l56Fb nceAnswer":"参照规范《危险化学品企业特殊作业安全规范》指正作业票的不当之处。\n（1）风险辨识不到位，存在物体打击、坠落危险；\n（2）交底人、被交底人应签字确认；\n（3）作业前安全措施确认人应由安全专工王某负责；\n（4）安全交底应由项目负责人李某实施；\n（5）未注明作业持续时间；\n（6）安全措施项不全，未检查物资落实情况。","referenceImages":[]},{"number":5,"prompt":"参照规范《危险化学品企业特殊作业安全规范》简述作业前安全技术交底的内容。","referenceAnswer":"参照规范《危险化学品企业特殊作业安全规范》简述作业前安全技术交底的内容。\n（1）吊装作业相关的法律法规及标准规范；\n（2）作业面危险有害因素辨识及控制措施；\n（3）吊装人员、监护人员的岗位职责和操作技能；\n（4）安全设施的使用和维护方法；\n（5）个体防护装备的配备与使用方法；\n（6）紧急情况下自救互救、急救方法及安全疏散要求；\n（7）起重致害、物体打击事故后现场紧急情况的处理；\n（8）典型事故案例分析。","referenceImages":[]}]},{"id":"p3-2","paper":3,"number":2,"topic":"电气与机械安全","type":"single","images":[],"stem":"剪板机属于压力机械的一种，通过刀架的往复直线运动实现板材的尺寸断裂分离。下列关于剪板机安全要求的各项说法中，正确的是（）。","options":{"A":"剪板机前工作台不应延伸到保护区域以外","B":"可调整的前托料和后挡料能将其调整到刀口下方","C":"除配备后托料，后挡料的设计不允许将后挡料调整到刀口之间","D":"单次循环模式刀架和压料脚只能工作一个行程"},"answer":["D"],"explanation":"A选项错误：剪板机前工作台应延伸到保护区域以外；B选项错误：可调整的前托料和后挡料不能将其调整到刀口下方；C选项错误：即使配备后托料，后挡料的设计也不允许将后挡料调整到刀口之间；D选项正确：选择单次循环操作后，即使控制装置持续有效,刀架和压料脚也只能工作一个行程。","explanationImages":[]},{"id":"p3-3","paper":3,"number":3,"topic":"电气与机械安全","type":"single","images":[],"stem":"机械加工作业区的机床设备应合理化布局，按照工作流程兼顾安全需求力求实现本质化安全。某机加工作业区，设有机床参数如下：①机床存在水平主轴呈往复运行，主轴运动极限位置超过机床主体轮廓；②机床最大外形尺寸12m；③机床质量12t。如上陈述，针对上述参数的机床下列检查结论中，符合规范要求的是（  ）。","options":{"A":"机床操作面安全距离1.0m","B":"机床操作面离墙柱安全距离2.0m","C":"属于中型机床，安全距离从主轴极限位置算起","D":"属于大型机床，安全距离从机床安装基础面算起"},"answer":["B"],"explanation":"A选项错误：机床操作面最小安全距离1.5m；B选项正确：机床操作面离墙柱最小安全距离1.8m，2.0m＞1.8m符合要求；C选项错误：属于大型机床，安全距离从主轴极限位置算起；D选项错误：属于大型机床，安全距离从主轴极限位置算起；","explanationImages":[]},{"id":"p3-4","paper":3,"number":4,"topic":"特种设备安全","type":"single","images":[],"stem":"机械式停车装置属于特殊的起重机械，在满足基本要求的同时应考虑其运行条件及工作特点，下列针对机械式停车装置的安全装置的定义，满足要求的是（  ）。","options":{"A":"应设紧急停止开关，异常情况立即停止运转","B":"人车共乘式的汽车专用升降机应设防坠落安全器","C":"应设运转限制装置，车位状况进行检测防堆置重叠","D":"当重量超过额定承载的100%~110%时，应当发出报警信号"},"answer":["A"],"explanation":"A选项正确：应设紧急停止开关，异常情况立即停止运转；B选项错误：人车共乘式的汽车专用升降机应设安全钳和限速器；C选项错误：应设运转限制装置，人员未出设备，设备不能启动运转；D选项错误：当重量超过额定承载的95%时，应当发出报警信号。","explanationImages":[]},{"id":"p3-5","paper":3,"number":5,"topic":"防火防爆","type":"single","images":[],"stem":"某木工加工企业属于典型的粉尘涉爆区域，在木工切割作业车间设置喷漆间用于防腐蚀喷涂，经过安全设计论证喷漆间（爆炸性1区）、切割车间（爆炸性21区）可用同一套除尘净化系统（可靠性论证，不构成重大事故隐患）。针对上述除尘净化系统的管道系统的要求，下列说法正确的是（  ）。","options":{"A":"除尘系统的集尘袋采用防静电阻燃材料","B":"除尘风机采用Ex ia Ⅰ Ma型防爆设备","C":"阻火器的阻火间隙应小于介质的最大安全间隙","D":"风管采用阻火器装置，设置阻爆轰型阻火器"},"answer":["A"],"explanation":"A选项正确：除尘系统的集尘袋采用防静电阻燃材料B选项错误：除尘风机采用Ex ia Ⅰ Ma型防爆设备，不符合要求，上述设备适用于井下甲烷环境；C选项错误：阻火器的最大间隙应不大于介质在操作工况下的最大试验安全间隙。D选项错误：风管中存在爆炸性粉尘积蓄，因此不应采用阻火器装置。","explanationImages":[]},{"id":"p3-7","paper":3,"number":7,"topic":"特种设备安全","type":"single","images":[],"stem":"压力容器的保养是生产经营企业保障安全运行条件的基本措施，也能有效延缓设备腐蚀，保障设备的安全完整性。下列关于压力容器维护保养的说法中，正确的是（  ）。","options":{"A":"局部保温层、防腐蚀涂层破损，可继续使用","B":"氧气或其他强氧化性气体，使用中应经常排除容器中的积水","C":"承载压缩天然气的钢制容器，使用中需采取酸洗、干燥的方法","D":"安全附件和检测元件，应定期维护并根据需要校正"},"answer":["B"],"explanation":"A选项错误：防腐蚀涂层破损，不可继续使用；B选项正确：氧气或其他强氧化性气体，使用中应经常排除容器中的积水；C选项错误：承载压缩天然气的钢制容器，使用中需采取碱洗、干燥的方法；D选项错误：安全附件和检测元件，应定期维护和校正。","explanationImages":[]},{"id":"p3-8","paper":3,"number":8,"topic":"危险化学品安全","type":"single","images":[],"stem":"危化品生产经营企业由于泄漏导致的二次事故通常是灾难性的，也就是所谓的事故多米诺效应。某油漆生产企业采用石油苯溶剂，但是石油苯有毒、致癌且难以被身体代谢表现出靶器官毒性。针对上述情景，下列属于最有效的化学中毒、污染事故预防控制措施的是（  ）。","options":{"A":"采用氯苯代替苯溶剂","B":"苯储罐采用氮气密封","C":"将生产设备与操作室实现空间隔离","D":"配置有机蒸汽防护面具"},"answer":["C"],"explanation":"【老师寄语】这种类型的题实际上完全参照2025真题，且为尽量保证本题目的合理性，对比2025真题在题干中增加“最有效的”关键词。A选项错误：属于防爆措施；B选项错误：属于防爆措施；C选项正确。D选项错误：虽然也属于中毒污染事故预防措施，但通常作为最后的屏障不属于最有效的应对措施。","explanationImages":[]},{"id":"p3-9","paper":3,"number":9,"topic":"防火防爆","type":"single","images":[],"stem":"烟花爆竹极具观赏性和娱乐性，是重大节假日庆祝所不可或缺的环节，但是富能基团导致火炸药的稳定性极大制约其使用及生产安全。综上所述，下列关于烟花爆竹生产制造的各项说法，正确的是（  ）。","options":{"A":"引火线应人工制引，并在专用工房操作","B":"引火线制引机应与机械动力装置隔离","C":"烟火药干燥散热时，应及时翻动并收取","D":"三元黑火药制造应将碳、硫磺二元混合后粉碎"},"answer":["B"],"explanation":"A选项错误：引火线应在专用工房内机械制引；B选项正确：引火线制引机应与机械动力装置隔离；C选项错误：烟火药干燥散热时，不应及时翻动并收取；D选项错误：三元黑火药制造应先将碳、硫黄进行二元混合。","explanationImages":[]},{"id":"p3-10","paper":3,"number":10,"topic":"特种设备安全","type":"single","images":[],"stem":"安全泄压装置按照其动作原理、动作方式及工作特点分为可重复启闭型阀式泄压装置、断裂型泄压装置和温度驱动型泄压装置。关于不同类型泄压装置的说法，正确的是（  ）。","options":{"A":"液压传动设备、液化天然气储罐的安全阀安装在液面以下","B":"爆破片的防爆效率取决于其厚度、泄压面积和安装位置","C":"达到规定压力未开启的爆破片，应予以更换","D":"达到规定温度未动作的易熔合金塞，经修整检验后使用"},"answer":["C"],"explanation":"A选项错误：液压传动设备的安全阀安装在液面以下，液化天然气储罐的安全阀安装在气相空间；B选项错误：爆破片的防爆效率取决于其厚度、泄压面积和材质材料；C选项正确：达到规定压力未开启的爆破片立即废弃更换；D选项错误：达到规定温度未动作的易熔合金塞，立即废弃更换。","explanationImages":[]},{"id":"p3-11","paper":3,"number":11,"topic":"防火防爆","type":"single","images":[],"stem":"静电防护是石化企业、工贸企业防火防爆安全措施的重要环节，防止由于静电击穿所导致的燃烧爆炸事故。以爆炸性粉尘环境的饲料加工企业为例，下列防护措施有效的是（  ）。","options":{"A":"悬浮性饲料粉尘，添加抗静电添加剂消解静电","B":"输送物料能产生静电的绝缘管道的金属屏蔽层接地","C":"高绝缘性材料通过静电接地、等电位联结消解静电","D":"为降低罐内物料电位，过滤器不应离注入口过远"},"answer":["B"],"explanation":"A选项错误：悬浮性饲料粉尘，添加抗静电添加剂消解静电是没有静电消解意义的；B选项正确：输送物料能产生静电的绝缘管道的金属屏蔽层接地；C选项错误：高绝缘性材料通过增湿、添加抗静电添加剂消除静电；D选项错误：为降低罐内物料电位，过滤器不应离注入口过近。","explanationImages":[]},{"id":"p3-12","paper":3,"number":12,"topic":"防火防爆","type":"single","images":[],"stem":"爆炸波阵面的超压是导致人员伤亡、建筑结构受损的主要致害因素，通常比爆炸碎片的致死范围更大、比中毒燃烧等衍生事故的致死率更高。某事故面实测波阵面超压25kPa，上述冲击波作用于建筑物、受害者时，表现的伤害类型体现在（  ）。","options":{"A":"大部分砖木结构受到破坏","B":"除坚固的钢筋混凝土建筑外，其余部分全部破坏","C":"玻璃标志物开裂或成大块破裂","D":"人体中等损伤，肝脾包膜下出血"},"answer":["A"],"explanation":"某事故面实测波阵面超压20~30kPa，作用在建筑物导致大部分砖木结构受到破坏、玻璃标志物破裂成小碎片甚至粉碎、人体轻微挫伤和局部心肌撕裂。故本题A选项符合题意，BCD选项错误。","explanationImages":[]},{"id":"p3-13","paper":3,"number":13,"topic":"电气与机械安全","type":"single","images":[],"stem":"保护导体在供电回路中通常用于保护作用，按照设计使用功能分为人工保护导体和自然保护导体。下列各项关于保护导体的设计要求及说法中，正确的是（  ）。","options":{"A":"保护导体干线必须与电源中性点和接地体相连","B":"保护导体包括接地导体、保护接地中性导体和保护联结导体","C":"低压系统中，允许利用流经可燃液体或气体的金属管道做保护导体","D":"保护导体（包括具有保护作用的PEN线）应安装熔断器"},"answer":["A"],"explanation":"A选项正确：保护导体干线必须与电源中性点和接地体相连；B选项错误：保护导体包括接地导体、保护接地导体和保护联结导体；C选项错误：低压系统中，允许利用不流经可燃液体或气体的金属管道做保护导体；D选项错误：保护导体（包括具有保护作用的PEN线）不应安装熔断器和单极开关。","explanationImages":[]},{"id":"p3-19","paper":3,"number":19,"topic":"特种设备安全","type":"single","images":[],"stem":"叉车、蓄电瓶车及非公路用旅游观光车均属于场内专用机动车辆，按照应急管理部事故通报统计分析，场内专用机动车辆事故中尤以违反操作规程导致的事故为主。综上所述，下列各项安全操作的要求中正确的是（  ）。","options":{"A":"司机视线受阻或不良、指挥信号不清时，严禁行驶","B":"叉车蓄电池不要暴露在火花或明火中，以免引起爆炸","C":"叉车叉取重量不明、超载的货物时，应试叉检查稳定性","D":"叉车叉取气瓶等装载不稳的货物时，应采用安全绳加固"},"answer":["B"],"explanation":"A选项错误：司机视线受阻或不良，可以低速倒车行驶；B选项正确：叉车蓄电池不要暴露在火花或明火中，以免引起爆炸；C选项错误：叉车叉取重量不明的货物时，应试叉检查稳定性；严禁超载运输；D选项错误：叉车叉取装载不稳的货物时，应采用安全绳加固；严禁使用叉车叉取气瓶；","explanationImages":[]},{"id":"p3-21","paper":3,"number":21,"topic":"事故辨识与检维修","type":"single","images":[],"stem":"按照案例背景，针对锅炉点火失败事件的下列各项定义分类、原因及应对措施的说法中，符合要求的是（  ）。","options":{"A":"属于水击事故，并炉期间应打开过热器疏水阀避免水击","B":"属于水击事故，并炉期间应做好过热器、蒸汽管道的预热","C":"属于满水事故，点火升压期间应上水至最低水位后停止上水","D":"属于汽水共腾事故，推测可能由于未按要求进行煮炉导致","E":"属于汽水共腾事故，推测可能由于压力下降过快所导致"},"answer":["E"],"explanation":"依照案例背景打开蒸汽锅炉的供气阀并汽瞬间，大量锅水瞬间涌入过热器导致过热器水击损毁属于汽水共腾事故，推测可能由于压力下降过快所导致。故本题E选项符合题意，选项ABCD错误。","explanationImages":[],"material":"锅炉对近现代能源体系的贡献，在于其作为化石能源向热能、机械能与电能转换的核心枢纽，为工业革命提供了稳定可控的动力基础，支撑了全球电力生产与城市集中供热，并以“万能热源”身份深度参与化工、纺织、冶金等基础工业，即便在新能源时代仍以调峰和废弃物消纳的角色发挥不可替代的作用。隐藏的危险同样不容忽视，超压运行、缺水干烧、安全附件失效均可能导致爆炸事故，高温蒸汽泄漏造成灼烫伤害；燃气锅炉若燃烧不完全或燃气泄漏，还易引发爆燃或一氧化碳中毒；长期运行中的腐蚀、结垢与疲劳损伤若未及时发现，则可能演变为突发性灾难事故。因此，锅炉的安全管理始终是工业安全的重中之重。（一）锅炉点火失败事件   以本年度锅炉事故为例，能源单位新建大型煤粉锅炉（锅炉机组150MW）用于褐煤、石煤的高效燃烧并将炉渣用于下游日化和建筑单位。企业为提高燃煤燃烧效率设置磨煤机，利用风流实现粉煤分离和燃料输送。点火升压前，锅炉系统全面检查外观、内部和外部环节无误后上水至正常水位并降低上水量，点火升压期间注意压力上升速度、受热面温度情况等。待过热蒸汽达到预设温度压力后，尝试将新增锅炉并入原设备机组，打开蒸汽锅炉的供气阀并汽瞬间，大量锅水瞬间涌入过热器导致过热器水击损毁。（二）锅炉爆炸现场指挥人员立即下达停炉命令，更换受损的过热器、检查受压面及附件完整性后重新点火，结果点火瞬间爆炸导致现场参与试车的两名作业人员当场死亡，距事发地1.5km外具有明显震感。事故调查报告指出：上次试车在炉膛内残留的粉煤、碳颗粒等颗粒在风流的作用下产生悬浮性扬尘并最终引发爆炸。（三）检查确认事故调查组入驻企业期间发现，企业安全管理松懈对安全认识不足、技术负责人对锅炉工况及运行安全没有清晰认知，甚至部分管理层庆幸事故发生在新法规条文执行前夕。于是，要求企业彻底检查所有在役锅炉机组的安全隐患并逐一落实“一设备一策”的整改方针，其中2#电站锅炉检查期间发现：\n（1）液位报警及联锁保护装置失效；\n（2）锅炉燃料输送管道未按要求设置压力检测装置并形成联锁；\n（3）磨煤机未按要求设置卸灰联锁保护装置；\n（4）主要汽水管道泄漏；\n（5）安全阀频繁起跳。（四）检查确认此外，检查期间发现企业用工不合理，对孕期、经期的女工保护不足，结合现场的用工情况，通过作业情况如下：\n（1）间断负重，每次负重超过25公斤的作业；\n（2）距地面15m处，搭设600mm×400mm跳板的修复作业；\n（3）体力劳动强度指数20的搬运作业；\n（4）工作时长8h，控制室内的操作、控制作业；\n（5）冷水作业分级标准中规定的第二级冷水作业。针对上述案例背景，","materialImages":[]},{"id":"p3-22","paper":3,"number":22,"topic":"事故辨识与检维修","type":"single","images":[],"stem":"参照《特种设备事故报告和调查处理规定》、《生产安全事故分类与编码》和《特种设备安全监察条例》，针对上述案例背景中的事故定性分析结论符合规定的是（  ）。","options":{"A":"按照《生产安全事故分类与编码》，属于粉尘爆炸","B":"按照《生产安全事故分类与编码》，属于锅炉爆炸","C":"按照《特种设备安全监察条例》，属于一般事故","D":"按照《特种设备事故报告和调查处理规定》，事故由市级人民政府牵头调查","E":"按照《特种设备事故报告和调查处理规定》，事故调查报告应报上级人民政府批准"},"answer":["A"],"explanation":"按照《生产安全事故分类与编码》，属于粉尘爆炸；按照《特种设备安全监察条例》，属于较大事故，事故由省级人民政府特种设备监督管理部门牵头调查，事故调查报告应报本级人民政府批准。故本题A选项正确，选项BCDE错误。","explanationImages":[],"material":"锅炉对近现代能源体系的贡献，在于其作为化石能源向热能、机械能与电能转换的核心枢纽，为工业革命提供了稳定可控的动力基础，支撑了全球电力生产与城市集中供热，并以“万能热源”身份深度参与化工、纺织、冶金等基础工业，即便在新能源时代仍以调峰和废弃物消纳的角色发挥不可替代的作用。隐藏的危险同样不容忽视，超压运行、缺水干烧、安全附件失效均可能导致爆炸事故，高温蒸汽泄漏造成灼烫伤害；燃气锅炉若燃烧不完全或燃气泄漏，还易引发爆燃或一氧化碳中毒；长期运行中的腐蚀、结垢与疲劳损伤若未及时发现，则可能演变为突发性灾难事故。因此，锅炉的安全管理始终是工业安全的重中之重。（一）锅炉点火失败事件   以本年度锅炉事故为例，能源单位新建大型煤粉锅炉（锅炉机组150MW）用于褐煤、石煤的高效燃烧并将炉渣用于下游日化和建筑单位。企业为提高燃煤燃烧效率设置磨煤机，利用风流实现粉煤分离和燃料输送。点火升压前，锅炉系统全面检查外观、内部和外部环节无误后上水至正常水位并降低上水量，点火升压期间注意压力上升速度、受热面温度情况等。待过热蒸汽达到预设温度压力后，尝试将新增锅炉并入原设备机组，打开蒸汽锅炉的供气阀并汽瞬间，大量锅水瞬间涌入过热器导致过热器水击损毁。（二）锅炉爆炸现场指挥人员立即下达停炉命令，更换受损的过热器、检查受压面及附件完整性后重新点火，结果点火瞬间爆炸导致现场参与试车的两名作业人员当场死亡，距事发地1.5km外具有明显震感。事故调查报告指出：上次试车在炉膛内残留的粉煤、碳颗粒等颗粒在风流的作用下产生悬浮性扬尘并最终引发爆炸。（三）检查确认事故调查组入驻企业期间发现，企业安全管理松懈对安全认识不足、技术负责人对锅炉工况及运行安全没有清晰认知，甚至部分管理层庆幸事故发生在新法规条文执行前夕。于是，要求企业彻底检查所有在役锅炉机组的安全隐患并逐一落实“一设备一策”的整改方针，其中2#电站锅炉检查期间发现：\n（1）液位报警及联锁保护装置失效；\n（2）锅炉燃料输送管道未按要求设置压力检测装置并形成联锁；\n（3）磨煤机未按要求设置卸灰联锁保护装置；\n（4）主要汽水管道泄漏；\n（5）安全阀频繁起跳。（四）检查确认此外，检查期间发现企业用工不合理，对孕期、经期的女工保护不足，结合现场的用工情况，通过作业情况如下：\n（1）间断负重，每次负重超过25公斤的作业；\n（2）距地面15m处，搭设600mm×400mm跳板的修复作业；\n（3）体力劳动强度指数20的搬运作业；\n（4）工作时长8h，控制室内的操作、控制作业；\n（5）冷水作业分级标准中规定的第二级冷水作业。针对上述案例背景，","materialImages":[]},{"id":"p3-23","paper":3,"number":23,"topic":"特种设备安全","type":"multiple","images":[],"stem":"参照《特种设备重大事故隐患判定准则》，结合现场对2#电站锅炉的检查结论，其中属于特种设备重大事故隐患判定标准的是（  ）。","options":{"A":"液位报警及联锁保护装置失效","B":"锅炉燃料输送管道未按要求设置压力检测装置并形成联锁","C":"磨煤机未按要求设置卸灰联锁保护装置","D":"主要汽水管道泄漏","E":"安全阀频繁起跳"},"answer":["A","D"],"explanation":"4.2 锅炉有下列情形之一仍继续使用的,应判定为重大事故隐患。a) 定期检验的检验结论为“不符合要求”。b) 热工仪表失效或控制电(气)源中断,导致无法监视、调整主要运行参数。c) 安全阀(爆破片装置)缺失或失效。d) 系统报警装置缺失或失效。e) 联锁保护装置缺失或失效。f) 熄火保护装置缺失或失效。g) 电站锅炉主要汽水管道泄漏或锅炉范围内管道破裂。故本题A选项：液位报警及联锁保护装置失效、D选项：主要汽水管道泄漏，属于锅炉特种设备重大事故隐患判定标准。选项BCE选项不属于重大事故隐患判定情形。","explanationImages":[],"material":"锅炉对近现代能源体系的贡献，在于其作为化石能源向热能、机械能与电能转换的核心枢纽，为工业革命提供了稳定可控的动力基础，支撑了全球电力生产与城市集中供热，并以“万能热源”身份深度参与化工、纺织、冶金等基础工业，即便在新能源时代仍以调峰和废弃物消纳的角色发挥不可替代的作用。隐藏的危险同样不容忽视，超压运行、缺水干烧、安全附件失效均可能导致爆炸事故，高温蒸汽泄漏造成灼烫伤害；燃气锅炉若燃烧不完全或燃气泄漏，还易引发爆燃或一氧化碳中毒；长期运行中的腐蚀、结垢与疲劳损伤若未及时发现，则可能演变为突发性灾难事故。因此，锅炉的安全管理始终是工业安全的重中之重。（一）锅炉点火失败事件   以本年度锅炉事故为例，能源单位新建大型煤粉锅炉（锅炉机组150MW）用于褐煤、石煤的高效燃烧并将炉渣用于下游日化和建筑单位。企业为提高燃煤燃烧效率设置磨煤机，利用风流实现粉煤分离和燃料输送。点火升压前，锅炉系统全面检查外观、内部和外部环节无误后上水至正常水位并降低上水量，点火升压期间注意压力上升速度、受热面温度情况等。待过热蒸汽达到预设温度压力后，尝试将新增锅炉并入原设备机组，打开蒸汽锅炉的供气阀并汽瞬间，大量锅水瞬间涌入过热器导致过热器水击损毁。（二）锅炉爆炸现场指挥人员立即下达停炉命令，更换受损的过热器、检查受压面及附件完整性后重新点火，结果点火瞬间爆炸导致现场参与试车的两名作业人员当场死亡，距事发地1.5km外具有明显震感。事故调查报告指出：上次试车在炉膛内残留的粉煤、碳颗粒等颗粒在风流的作用下产生悬浮性扬尘并最终引发爆炸。（三）检查确认事故调查组入驻企业期间发现，企业安全管理松懈对安全认识不足、技术负责人对锅炉工况及运行安全没有清晰认知，甚至部分管理层庆幸事故发生在新法规条文执行前夕。于是，要求企业彻底检查所有在役锅炉机组的安全隐患并逐一落实“一设备一策”的整改方针，其中2#电站锅炉检查期间发现：\n（1）液位报警及联锁保护装置失效；\n（2）锅炉燃料输送管道未按要求设置压力检测装置并形成联锁；\n（3）磨煤机未按要求设置卸灰联锁保护装置；\n（4）主要汽水管道泄漏；\n（5）安全阀频繁起跳。（四）检查确认此外，检查期间发现企业用工不合理，对孕期、经期的女工保护不足，结合现场的用工情况，通过作业情况如下：\n（1）间断负重，每次负重超过25公斤的作业；\n（2）距地面15m处，搭设600mm×400mm跳板的修复作业；\n（3）体力劳动强度指数20的搬运作业；\n（4）工作时长8h，控制室内的操作、控制作业；\n（5）冷水作业分级标准中规定的第二级冷水作业。针对上述案例背景，","materialImages":[]},{"id":"p3-25","paper":3,"number":25,"topic":"职业卫生与劳动保护","type":"multiple","images":[],"stem":"参照《女职工劳动保护特别规定》，结合企业的用工情况，下列作业中适合女职工但是不适用于经期女工的作业应包括（  ）。","options":{"A":"间断负重，每次负重超过25公斤的作业","B":"距地面15m处，搭设600mm×400mm跳板的修复作业","C":"体力劳动强度指数20的搬运作业","D":"工作时长8h，控制室内的操作、控制作业","E":"冷水作业分级标准中规定的第二级冷水作业"},"answer":["B","E"],"explanation":"A选项错误：间断负重，每次负重超过25公斤的作业，属于女职工禁忌作业，不满足要求；B选项正确：距地面15m处，搭设600mm×400mm跳板的修复作业属于Ⅲ级高处作业，属于女职工能从事但是经期女工禁忌作业，符合题干要求；C选项错误：体力劳动强度指数20的搬运作业，属于二级体力劳动强度，女职工和经期女工均能从事，不符合题干要求；D选项错误：工作时长8h，控制室内的操作、控制作业属于一级体力劳动强度，女职工和经期女工均能从事，不符合题干要求；E选项正确：冷水作业分级标准中规定的第二级冷水作业，属于女职工能从事但是经期女工禁忌作业，符合题干要求。","explanationImages":[],"material":"锅炉对近现代能源体系的贡献，在于其作为化石能源向热能、机械能与电能转换的核心枢纽，为工业革命提供了稳定可控的动力基础，支撑了全球电力生产与城市集中供热，并以“万能热源”身份深度参与化工、纺织、冶金等基础工业，即便在新能源时代仍以调峰和废弃物消纳的角色发挥 "referenceAnswer":"2.简述锂电池起火后应采取的应急救援措施。\n（1）启动事故应急预案，采取措施进行应急救援。\n（2）按规定向当地有关部门上报事故。\n（3）扑救初期火灾，组织抢救遇险人员。\n（4）检测风向变化，防止毒性浓烟的交叉影响，组织现场及周边人员向上风侧撤离。\n（5）限制事故影响范围，清除周围一切可燃物，划分灭火隔离带。\n（6）设立事故现场的警戒区域，严禁无关人员进入。\n（7）拨打120请求救援，拨打119请求消防救援。\n（8）法律、法规规定的其他应急救援措施。","referenceImages":[]},{"number":3,"prompt":"简述F公司出租厂房应履行的职责。","referenceAnswer":"3.简述F公司出租厂房应履行的职责。\n（1）建立完善承包商安全管理制度；\n（2）对承包商进行资质审查，审查承包商是否具有相应施工资质；\n（3）特种作业人员、特种设备操作人员是否持证上岗；\n（4）进行全员安全教育，向承包商进行作业现场安全交底；\n（5）与承包商签订专门的安全生产管理协议，明确管理职责；\n（6）对承包商的安全作业规程、施工方案和应急预案进行审查；\n（7）对承包商的作业进行全过程监督，定期进行安全检查；\n（8）定期对承包商的安全业绩进行评价，对不能履行安全职责的承包商进行考核直至清退。","referenceImages":[]},{"number":4,"prompt":"根据《电动汽车用动力蓄电池安全要求》（GB 38031—2025），列举锂电池单体安全试验的类别。","referenceAnswer":"4.根据《电动汽车用动力蓄电池安全要求》（GB 38031—2025），列举锂电池单体安全试验的类别。过放电试验，过充电试验，外部短路试验，加热试验，温度循环试验，挤压试验，快充循环后安全试验。","referenceImages":[]}]},{"id":"p3-27","paper":3,"number":27,"topic":"粉尘防爆与风险评估","type":"short","images":[{"src":"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAiEAAAC/CAIAAACnhpvKAADlPklEQVR4nOz9d1zN///4jz8eZ9dpaS8NlSiUjJSdHQ1pPstTJEVmIiJEKPJE0iAtRSglaVApFKU0pZT23uvs9b28ur8/j9/5Zbw8n08aXq5/dOk8zuOc8xj3x/12u98mfOvWrY6ODjabDf1m1EGhUBgMhk6nT7hrj8PhmEzm72Hzzy7dRLzjXwSDwUAQxGQyx/pAJjy4X2hUIKBQqDlz5sBz5sxZtGiRtLT07/li9G9ASUnJhw8fLCwsJtbFR6FQ4eHhixYtUlJSmlhHPubQ6fSwsDArKyt+fn5ogoPBYDIyMlAo1JIlS34Pg38DlUq9ffu2paXlLzAqEFAoVHl5ORqNxsjIyOzfv19BQWGsD+l/kWfPniUmJh4+fBiaaJSXlzs4OGhpaY31gUwwOBxOQUHB4cOHBQUFoYkPDw8PHo/fvn37WB/IxIbJZBYVFbm6ugoICEC/EC9fvoyJiUEBKTrWB/M/Co1GYzAY0ASEyWTSaLSxPoqJB4VCYTKZv8wTxxhmrI9iwkOhUNhs9i8zKhDAFPEfGfOb3/zmN7/5zc9gzGRMV1fX06dPe3t7kS2ZmZmJiYkUCmXEnr29vbdu3Xr06BG3zbe7uzs4ODghIeF/xBDc3Nz84cMH8D+VSq2oqPjiblQqNTw8/OHDhxAEsVgsCILIZHJUVFRiYuIIj2Jra2tycnJnZyey5f379zExMc3NzdDowmAwBgcHh4aGBj8DbESOnMVijXgXwL2RTCaDnfv7+0NCQrKyskb8HJPJZDAYzGEYDAaHwxmxA5vNfvjwYXBwcHt7OzQ+qKioaGxsBP/39vbW1tZ+cbfOzs7g4OBXr16Bs4AgqKOjIzw8/MWLFyNOs6KiIjMzk0QiIVtev34dFxfHvWU8UFdXFxwcnJ2d/bUdurq6goOD4+PjkXmgpqYmOTm5o6Pjb/0QlUrlXpCxWCxkkHwOg8EYJ9MOk8nMy8tDLAofP35Exv8IXr58GRwc3NPTg4yEly9fRkVFNTQ0 ，因设备隔离措施不到位、作业方式不当导致作业面瞬间闪爆，燃烧爆炸后的火源引燃车间内半成品及成品库内存储的成品，车间燃起大火。事故最终造成6人死亡，3人烧伤，直接经济损失794元。事发后企业为避免同类型事故的频繁发生，应上级部门领导要求针对事故隐患分析并着手进行安全整改，运用工作危害分析方法进行简易型评估（LEC法），LEC赋权标准见下表，带压状态下的检修作业的概率表述为可能，但不经常发生（非必要不进行），检修作业属于连续化工艺，人员暴露的表述为工作时暴露、三名作业人员操作巡检暴露在事故面通常定义为严重伤残。根据以上场景，回答下列问题：","parts":[{"number":1,"prompt":"按照《生产安全事故报告和调查处理条例》对本次事故进行分类，并简述E公司上报事故的内容。","referenceAnswer":"1.按照《生产安全事故报告和调查处理条例》对本次事故进行分类，并简述E公司上报事故的内容。\n（1）按照《生产安全事故报告和调查处理条例》属于较大事故。\n（2）事故报告内容应当包括：\n①事故发生单位概况；\n②事故发生的时间、地点以及事故现场情况；\n③事故的简要经过；\n④事故已经造成或者可能造成的伤亡人数（包括下落不明的人数）和初步估计的直接经济损失；\n⑤已经采取的措施和其他应当报告的情况。","referenceImages":[]},{"number":2,"prompt":"根据《工贸企业重大事故隐患判定标准》，指出E公司存在的重大事故隐患，并说明原因。简述重大事故隐患治理方案的内容。","referenceAnswer":"2.根据《工贸企业重大事故隐患判定标准》，指出E公司存在的重大事故隐患，并说明原因。简述重大事故隐患治理方案的内容。\n（1）未建立生产车间粉尘清扫制度，生产车间作业现场积聚大量粉尘；\n（2）干式除尘系统未采取泄爆、惰化、抑爆等任一种爆炸防控措施的。\n①重大事故隐患治理方案的内容：\n②治理的目标和任务；\n③采取的方法和措施；\n④经费和物资的落实；\n⑤负责治理的机构和人员；\n⑥治理的时限和要求；\n⑦安全措施和应急预案。","referenceImages":[]},{"number":3,"prompt":"简述贾某在检维修作业中的职责要求。","referenceAnswer":"3.简述贾某在检维修作业中的职责要求。\n（1）申领并验证作业票，包括签字落实、时限要求和范围等要求；\n（2）组织工作安全分析，辨识能量隔离、气体环境、坠落等风险；\n（3）检查安全措施落实情况、应急物资的设置情况等。\n（4）核查特种作业人员持证情况；\n（5）现场安全交底，明确危险区域、逃生路线及应急处置程序。\n（6）全程监督作业行为，制止违章操作；\n（7）定期复测和安全巡查，发现异常立即终止作业；\n（8）事故后，启动应急预案组织初期救援；\n（9）作业结束确认，清理检查作业面安全隐患并恢复安全设施。","referenceImages":[]},{"number":4,"prompt":"简述制板车间防爆专项检查的主要内容。","referenceAnswer":"4.简述制板车间防爆专项检查的主要内容。\n（1）作业人员是否正确穿戴防静电劳动防护用品；\n（2）作业人员是否违规携带火种或使用明火；\n（3）制板车间电气设备是否选用了合格的防爆电气设备；\n（4）作业工具是否采用不产生静电和火花的材质；\n（5）消防设施与消防器材是否有效；\n（6）是否安装粉尘防爆检测与报警装置；\n（7）安全标志是否齐全、是否正确；\n（8）制板车间通风是否良好，通风量是否满足安全标准；\n（9）车间内是否有粉尘积聚。","referenceImages":[]},{"number":5,"prompt":"依照案例背景，通过工作危害分析方法进行简易型评估确认检维修作业安全风险表现形式并简述安全风险分级管控清单的内容。","referenceAnswer":"5.依照案例背景，通过工作危害分析方法进行简易型评估确认检维修作业安全风险表现形式并简述安全风险分级管控清单的内容。\n（1）检维修作业风险危害程度表现为显著危险，需要整改。\n（2）安全风险分级管控清单内容：危险源位置、危险源名称、危险源可能导致事故的途径、可能导致的事故类型、安全风险等级、风险管控措施、管控责任主体。","referenceImages":[]}]},{"id":"p3-28","paper":3,"number":28,"topic":"氨制冷与事故分析","type":"short","images":[],"stem":"案例4 · 简答题","material":"案例四：D公司是一家冷冻食品加工企业，主要从事肉类的分割、加工、冷冻业务。D公司采用液氨进行制冷，液氨机房呈东西向设置于厂区内东侧位置，机房门朝北。距离北侧围墙约5米，墙根内侧东西向排列有高压液氨储罐2个，设置在同一防火堤内，每个储罐容积约为5立方米，共储存液氨12吨。液氨机房内共设有制冷压缩机3台、低压循环桶2台、中间冷却器2台。储罐设置有液位、温度检测仪表，进出物料管道上设置了远程控制的开关阀。每个液氨储罐设置了一套液位连续检测仪表和一个高高液位开关。液位连续检测仪表具备高低液位报警、高高和低低液位报警功能。高液位报警设定值略高于储罐的设计储存高液位，高高液位报警设定值为液相体积达到储罐计算容积95%时的高度。储罐设置有压力检测仪表，设置一级压力报警，报警阈值设为正常工作压力的上限。储罐设置了防雷接地及静电导除装置。2024年7月8日23时许，制冷工孙某开启压缩机实施制冷作业。零时30分许，仓库保管员吴某回宿舍休息，听到液氨机房方向发出“嗤嗤”响声，跑过去查看，发现机房处“冒白烟”，闻到有刺激性的氨味，未见制冷工孙某，于是拨打总经理张某电话，说明了情况，张某在外地，于是电话指挥吴某拨打119报警，同时联系其他值班人员进行现场处置。吴某发现位于机房门口处的1台压缩机气缸盖处正往外泄氨，便紧急将连通泄漏点的各阀门逐一关闭。50分钟后，救援人员赶到事故现场，开始在现场全面实施喷淋稀释。救援人员在东侧液氨储罐向东3米处发现昏迷不醒的孙某，孙某被抬出后逐渐恢复意识，经医护人员救治诊断，孙某身体被泄漏的液氨灼伤、呼吸道严重灼伤。此次事故造成的经济损失如下：孙某医疗费用10万元；孙某家属参与善后处理的交通费、住宿费等2万元；泄漏液氨损失1万元；D公司应急救援费用2万元；消防队应急救援费用10万元；清理事故现场费用6万元；停产损失价值20万元；应急管理部门对D公司罚款30万元；应急管理部门对主要负责人王某罚款5万元；赔偿客户违约费用3万元。事故调查发现如下问题：\n（1）压缩机气缸下端螺栓松动，压盖Ｏ型石棉密封垫已严重老化。\n（2）D公司主要负责人王某未确保充足的安全生产投入。\n（3）孙某违章冒险从事应急处置作业。\n（4）发现液氨泄漏，未采取任何安全防护措施进行应急处置，过程中被从压缩机气缸喷射的氨液溅到面部，并吸入大量氨气。\n（4）未对从业人员进行安全教育培训，制冷工孙某未持证上岗。\n（5）氨压缩机操作规程老旧，未定期组织修订。\n（6）未按规定组织开展事故隐患排查治理，造成遗留事故隐患。应急管理部门要求D公司停业整顿，落实事故防范和整改措施。根据以上场景，回答下列问题：","parts":[{"number":1,"prompt":"液氨储罐是否构成重大危险源，指出其安全设计的不合理之处。","referenceAnswer":"1.液氨储罐是否构成重大危险源，指出其安全设计的不合理之处。\n（1）液氨储罐共储存液氨12吨，大于液氨的临界量，构成重大危险源。\n（2）【考点注释】真题超纲，一般要求是指出，并写明应对措施，本题列举应对措施是为了考生作答期间能做到有效对照。不合理之处一：每个液氨储罐设置了一套液位连续检测仪表和一个高高液位开关。应对措施：压力式储罐应至少设置2套液位连续检测仪表和1个高高液位开关或设置3套液位连续检测仪表。不合理之处二：液位连续检测仪表具备高低液位报警、高高和低低液位报警功能。应对措施：液位连续检测仪表还应当应具备液位就地指示功能。不合理之处三：高液位报警设定值略高于储罐的设计储存高液位。应对措施：高液位报警设定值不应大于储罐的设计储存高液位。不合理之处四：高高液位报警设定值为液相体积达到储罐计算容积95%时的高度。应对措施：高高液位报警设定值不应大于液相体积达到储罐计算容积90%时的高度。不合理之处五：储罐设置有压力检测仪表，设置一级压力报警，报警阈值设为正常工作压力的上限。应对措施：压力式储罐的压力报警高限应至少设置两级。","referenceImages":[]},{"number":2,"prompt":"根据《生产安全事故分类与编码》（GB 6441-2025），辨识液氨制冷车间存在的危险有害因素。","referenceAnswer":"2.根据《生产安全事故分类与编码》（GB 6441-2025），辨识液氨制冷车间存在的危险有害因素。物体打击、机械致害、触电、跌落、泄漏、火灾、可燃气体爆炸、容器爆炸、管道爆炸、灼烫、中毒、窒息、其他。","referenceImages":[]},{"number":3,"prompt":"简述氨压缩机的安全操作要点。","referenceAnswer":"3.简述氨压缩机的安全操作要点。\n（1）启动前，应当对压缩机及其附属仪器仪表进行全面检查，确认无泄漏、破损等情况。检查泄漏报警器等安全设施是否完好有效。检查周围环境是否存在可燃物及点火源，确保机房通风正常。\n（2）作业前，操作人员必须穿戴防毒面具、护目镜、防护服、防护手套等个人防护装备，禁止穿化纤服装、钉鞋。\n（3）操作人员必须经过专业技术培训，持证上岗。\n（4）开机时，先开启冷却水系统，再启动压缩机工作；停机时，先停止压缩机工作，再关闭冷却水系统。\n（5）作业过程中，应实时监控压缩机工作参数，定时检查振动、噪声、泄漏等情况。\n（6）出现泄漏、报警等紧急情况，应当立即按下急停按钮，切断电源和气源。\n（7）在进行应急处置之前，应先穿戴好应急防护用品，严禁盲目施救。\n（8）操作结束后，应对工作区域进行彻底清理。对氨压缩机进行维护保养，确保设备处于良好状态。","referenceImages":[]},{"number":4,"prompt":"根据《大中型企业安全生产标准化管理体系要求》（GB/T 33000-2025），指出D公司在事故调查中发现的问题对应的一级要素。","referenceAnswer":"4.根据《大中型企业安全生产标准化管理体系要求》（GB/T 33000-2025），指出D公司在事故调查中发现的问题对应的一级要素。\n（1）现场管理。\n（2）领导作用。\n（3）应急准备与处置。\n（4）人员管理。\n（5）基础保障。\n（6）事故隐患排查治理。","referenceImages":[]},{"number":5,"prompt":"计算D公司本次事故造成的直接经济损失。","referenceAnswer":"5.计算D公司本次事故造成的直接经济损失。直接经济损失包括：孙某医疗费用10万元，孙某家属参与善后处理的交通费、住宿费等2万元，泄漏液氨损失1万元，D公司应急救援费用2万元，清理事故现场费用6万元。直接经济损失=10+2+1+2+6=21万元。","referenceImages":[]}]}]}</script><script>
'use strict';
const BANK=JSON.parse(document.getElementById('bank').textContent),BY_ID=new Map(BANK.questions.map(q=>[q.id,q]));
const STORAGE_KEY='tianyu-practical-notebook-v1',app=document.getElementById('app');
let session=null,wrongCounts={},scope='all',mode='all',view='home',storageOK=true,autoTimer,toastTimer;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const isShort=q=>q.type==='short';
function values(q){return session?.answers[q.id]||[]}
function touched(q){return values(q).some(v=>String(v).trim())}
function complete(q){return isShort(q)?q.parts.every((_,i)=>values(q)[i]?.trim()):values(q).length>0}
function correct(q){return !isShort(q)&&values(q).slice().sort().join(',')===q.answer.slice().sort().join(',')}
function active(){return session.ids.map(id=>BY_ID.get(id))}
function done(){return session?active().filter(complete).length:0}
function isWrong(q){return isShort(q)?q.parts.some((_,i)=>session.selfGrades?.[q.id]?.[i]==='review'):touched(q)&&!correct(q)}
function clearAuto(){clearTimeout(autoTimer)}
function toast(message){document.querySelector('.toast')?.remove();clearTimeout(toastTimer);const el=document.createElement('div');el.className='toast';el.textContent=message;el.setAttribute('role','status');document.body.append(el);document.getElementById('live').textContent=message;toastTimer=setTimeout(()=>el.remove(),4500)}
function persist(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify({schema:2,session,wrongCounts}));storageOK=true;return true}catch{storageOK=false;toast('浏览器未允许保存，请保持页面打开。');return false}}
try{
 const stored=JSON.parse(localStorage.getItem(STORAGE_KEY)||'null');
 if(stored?.schema===2){
  for(const [id,n] of Object.entries(stored.wrongCounts||{}))if((BY_ID.has(id)||BANK.questions.some(q=>isShort(q)&&q.parts.some(p=>id===q.id+':'+p.number)))&&Number.isSafeInteger(n)&&n>=0)wrongCounts[id]=n;
  const s=stored.session;
  if(s&&Array.isArray(s.ids)&&s.ids.length&&s.ids.every(id=>BY_ID.has(id))){
   s.answers=s.answers&&typeof s.answers==='object'?s.answers:{};s.selfGrades=s.selfGrades&&typeof s.selfGrades==='object'?s.selfGrades:{};
   for(const id of s.ids){const q=BY_ID.get(id),a=Array.isArray(s.answers[id])?s.answers[id]:[];s.answers[id]=isShort(q)?q.parts.map((_,i)=>typeof a[i]==='string'?a[i]:''):a.filter(v=>v in q.options);if(isShort(q))s.selfGrades[id]=q.parts.map((_,i)=>['mastered','review'].includes(s.selfGrades[id]?.[i])?s.selfGrades[id][i]:null)}
   s.index=Math.max(0,Math.min(Number(s.index)||0,s.ids.length-1));session=s;s.submitted=!!s.submitted&&(s.endReason==='early'||active().every(complete));scope=s.scope||'all';mode=s.mode||'all';
  }
 }
}catch{storageOK=false}
function images(ims=[]){return ims.length?`<div class="images">${ims.map(im=>`<img src="${im.src}" alt="${esc(im.alt)}" width="${im.width}" height="${im.height}" onclick="this.classList.toggle('large')">`).join('')}</div>`:''}
function material(q){return q.material?`<details class="material" open><summary>案例材料</summary><div class="prose">${esc(q.material)}</div>${images(q.materialImages||q.images)}</details>`:images(q.images)}
function scopeQuestions(p=scope,m=mode){return BANK.questions.filter(q=>(p==='all'||String(q.paper)===String(p))&&(m==='all'||(m==='short'?isShort(q):!isShort(q))))}
function home(){clearAuto();view='home';if(!['all','1','2','3'].includes(String(scope)))scope='all';if(!['all','choice','short'].includes(mode))mode='all';
 const options=[{id:'all',title:'全部实务题'},...BANK.papers];
 app.innerHTML=`<div class="intro"><h1>读懂案例，练会作答。</h1><p class="small">选择题只收录红笔错题；三套卷的案例大题全部收录。结束后看答案，简答题对照参考答案手动自评。</p></div>${session?`<div class="resume"><div><strong>${session.submitted?'上次练习已结束':'上次练习已暂存'}</strong><p class="small">完整作答 ${done()} / ${session.ids.length} 题${session.submitted?'':` · 停在第 ${session.index+1} 题`}</p></div><button class="primary" id="resume-btn">${session.submitted?'查看结果':'继续作答'}</button></div>`:''}<fieldset class="mode-picker"><legend>练习内容</legend>${[['all','全部题型'],['choice','选择题错题'],['short','案例简答题']].map(([id,t])=>`<label><input type="radio" name="mode" value="${id}" ${mode===id?'checked':''}>${t}</label>`).join('')}</fieldset><div class="papers" role="radiogroup" aria-label="练习范围">${options.map(p=>{const qs=scopeQuestions(String(p.id)),sc=qs.filter(isShort);return `<label class="paper"><span class="paper-main"><input type="radio" name="scope" value="${p.id}" ${String(scope)===String(p.id)?'checked':''}><span><strong>${p.title}</strong><span class="small">选择题 ${qs.length-sc.length} · 大题 ${sc.length}${sc.length?`（${sc.reduce((n,q)=>n+q.parts.length,0)} 小问）`:''}</span></span></span><span class="count">${qs.length}<span>题</span></span></label>`}).join('')}</div><p class="note">第2套没有红笔标记的选择题，目前仅收录3道案例大题。</p><div class="home-action"><button class="primary" id="start-btn" ${scopeQuestions().length?'':'disabled'}>开始练习</button><span class="small">按原卷题序</span></div><p class="storage-note">${storageOK?'选择与简答文字自动保存在当前设备的浏览器中；切换科目后仍可继续。':'浏览器未允许保存，请保持页面打开。'}使用同一个专属同步链接，可在手机和电脑间自动同步。</p>`;
 document.getElementById('resume-btn')?.addEventListener('click',()=>{if(session.submitted)return results();session.pausedAt=null;persist();quiz()});
 document.getElementById('start-btn').onclick=()=>startRound();
 document.querySelectorAll('input[name="scope"]').forEach(el=>el.onchange=()=>{scope=el.value;home()});document.querySelectorAll('input[name="mode"]').forEach(el=>el.onchange=()=>{mode=el.value;home()});window.scrollTo(0,0);
}
function confirmRestart(){return new Promise(resolve=>{const d=document.getElementById('restart-dialog');let accepted=false;document.getElementById('cancel-restart').onclick=()=>d.close();document.getElementById('confirm-restart').onclick=()=>{accepted=true;d.close()};d.addEventListener('close',()=>resolve(accepted),{once:true});d.showModal()})}
async function startRound(ids){clearAuto();if(session&&!session.submitted&&active().some(touched)&&!await confirmRestart())return;const qs=ids?ids.map(id=>BY_ID.get(id)):scopeQuestions();if(!qs.length)return;session={ids:qs.map(q=>q.id),answers:{},selfGrades:{},index:0,submitted:false,scope,mode,startedAt:new Date().toISOString()};persist();quiz()}
function updateStatus(){const n=done(),total=session.ids.length;document.querySelector('.statusbar strong').textContent=`${n} / ${total}`;document.querySelector('.statusbar span:last-child').textContent=storageOK?'进度已保存':'进度未保存';document.querySelector('progress').value=n;const q=BY_ID.get(session.ids[session.index]);document.getElementById('choice-status').textContent=isShort(q)?`已填写 ${values(q).filter(v=>v?.trim()).length} / ${q.parts.length} 小问`:touched(q)?'已作答':'尚未作答';const b=document.getElementById('submit-btn');b.disabled=n<total;b.textContent=n===total?'全部作答完成 · 提交并看答案':`还剩 ${total-n} 题未完整作答`;}
function quiz(){clearAuto();if(!session)return home();if(session.submitted)return results();view='quiz';const q=BY_ID.get(session.ids[session.index]),a=values(q),n=done(),total=session.ids.length;
 app.innerHTML=`<div class="statusbar"><span>完整作答 <strong>${n} / ${total}</strong></span><span>${storageOK?'进度已保存':'进度未保存'}</span></div><progress value="${n}" max="${total}" aria-label="作答进度"></progress><div class="quiz-top"><div class="meta">第${q.paper}套 · 原题${q.number}<span class="type">${isShort(q)?'案例简答':q.type==='single'?'单选题':'多选题'}</span></div><button id="show-nav">答题卡 ${session.index+1}/${total}</button></div><section class="question-card" aria-label="第${session.index+1}题"><h1 class="sr-only">第${session.index+1}题</h1>${material(q)}${isShort(q)?`<p class="note">每小问分别填写；可以先写关键词。参考答案在本轮结束后显示，不自动判分。</p>${q.parts.map((p,i)=>`<div class="short-part"><label class="part-prompt" for="part-${i}">${p.number}. ${esc(p.prompt)}</label><textarea id="part-${i}" data-part="${i}" rows="6" placeholder="在这里填写你的回答…">${esc(a[i]||'')}</textarea></div>`).join('')}`:`<p class="stem">${esc(q.stem)}</p><fieldset class="options"><legend class="sr-only">选择答案</legend>${Object.entries(q.options).map(([letter,t])=>`<label class="option"><input type="${q.type==='single'?'radio':'checkbox'}" name="answer" value="${letter}" ${a.includes(letter)?'checked':''}><span><span class="letter">${letter}.</span>${esc(t)}${images(q.optionImages?.[letter])}</span></label>`).join('')}</fieldset>`}<div class="question-foot"><span class="hint">${isShort(q)?'文字自动暂存':q.type==='single'?'单选后自动下一题':'多选确认后下一题'}</span><span class="hint" id="choice-status"></span></div></section><div class="actions"><button id="prev-btn" ${session.index===0?'disabled':''}>上一题</button><button class="primary" id="next-btn">${session.index===total-1?'检查未答题':'下一题'}</button></div><div class="actions session-actions"><button id="pause-btn">下次继续</button><button id="end-btn">直接结束作答</button></div><div class="submit-wrap"><button id="submit-btn"></button><p>结束后显示已作答部分的参考答案；下次继续不显示答案。</p></div>`;
 updateStatus();
 document.querySelectorAll('input[name="answer"]').forEach(el=>el.onchange=()=>{session.answers[q.id]=[...document.querySelectorAll('input[name="answer"]:checked')].map(el=>el.value);persist();updateStatus();clearAuto();if(q.type==='single'&&session.index<total-1){const round=session,index=session.index;autoTimer=setTimeout(()=>{if(session===round&&view==='quiz'&&!session.submitted&&session.index===index)go(index+1)},220)}});
 document.querySelectorAll('textarea[data-part]').forEach(el=>el.oninput=()=>{session.answers[q.id]=q.parts.map((_,i)=>document.getElementById('part-'+i).value);persist();updateStatus()});
 document.getElementById('show-nav').onclick=showNavigator;document.getElementById('prev-btn').onclick=()=>go(session.index-1);document.getElementById('next-btn').onclick=()=>{if(session.index<total-1)go(session.index+1);else{const index=active().findIndex(q=>!complete(q));if(index>=0){go(index);toast('已跳转到未完整作答的题目。')}else toast('全部题目已作答，可以提交。')}};document.getElementById('pause-btn').onclick=pause;document.getElementById('end-btn').onclick=confirmEnd;document.getElementById('submit-btn').onclick=()=>{if(active().every(complete))finish('complete')};window.scrollTo(0,0);
}
function go(i){clearAuto();if(i<0||i>=session.ids.length)return;session.index=i;persist();quiz()}
function showNavigator(){clearAuto();const d=document.getElementById('navigator');d.querySelector('.legend').textContent='蓝色：完整作答；橙色：部分填写；白色：未答。边框为当前题。';document.getElementById('nav-grid').innerHTML=active().map((q,i)=>`<button data-index="${i}" aria-label="第${i+1}题，${complete(q)?'完整作答':touched(q)?'部分填写':'未答'}" class="${complete(q)?'answered':touched(q)?'partial':''} ${i===session.index?'current':''}">${i+1}</button>`).join('');d.querySelectorAll('[data-index]').forEach(b=>b.onclick=()=>{d.close();go(Number(b.dataset.index))});d.showModal()}
function pause(){clearAuto();session.pausedAt=new Date().toISOString();if(persist()){home();toast('已暂存，下次可以接着作答。')}else{session.pausedAt=null;updateStatus()}}
function confirmEnd(){clearAuto();const d=document.getElementById('end-dialog');document.getElementById('end-summary').textContent=`已完整作答 ${done()} / ${session.ids.length} 题。结束后查看已作答的选择题和已填写的小问的答案；空白小问不判错。本轮结束后不能继续填写。`;document.getElementById('cancel-end').onclick=()=>d.close();document.getElementById('confirm-end').onclick=()=>{d.close();finish('early')};d.showModal()}
function recordStats(){if(!session?.submitted||session.statsRecorded)return;for(const q of active())if(!isShort(q)&&touched(q)&&!correct(q))wrongCounts[q.id]=(wrongCounts[q.id]||0)+1;session.statsRecorded=true}
function finish(reason){clearAuto();if(session.submitted)return;session.submitted=true;session.endReason=reason;session.submittedAt=new Date().toISOString();recordStats();persist();results()}
function shortReview(q){const grades=session.selfGrades[q.id]||[];return q.parts.map((p,i)=>`<div class="short-review"><h3>${p.number}. ${esc(p.prompt)}</h3>${values(q)[i]?.trim()?`<p class="small">你的回答</p><div class="your-text prose">${esc(values(q)[i])}</div><p class="small">原卷参考答案</p><div class="reference prose">${esc(p.referenceAnswer)}</div>${images(p.referenceImages)}<div class="self-grade" role="group" aria-label="第${p.number}小问自评">${[['mastered','已掌握'],['review','需复习']].map(([value,label])=>`<button data-qid="${q.id}" data-part="${i}" data-grade="${value}" aria-pressed="${grades[i]===value}">${label}</button>`).join('')}</div><p class="small">${grades[i]==='review'?'本问已标记需复习':grades[i]==='mastered'?'本问已标记掌握':'本问待自评'} · 累计需复习 <strong>${wrongCounts[q.id+':'+p.number]||0}</strong> 次</p>`:'<p class="small">本问未作答，未计入自评，也未显示参考答案。</p>'}</div>`).join('')}
function choiceReview(q){return `<p class="stem">${esc(q.stem)}</p>${Object.entries(q.options).map(([letter,t])=>`<div class="review-option ${q.answer.includes(letter)?'right':values(q).includes(letter)?'wrong':''}"><span class="letter">${letter}.</span>${esc(t)}${images(q.optionImages?.[letter])}${q.answer.includes(letter)?'<span class="small correct">（正确选项）</span>':''}</div>`).join('')}<div class="answers-line">你的选择：${values(q).join('、')}　正确答案：${q.answer.join('、')}</div><div class="explanation prose"><strong>原卷解析：</strong>${esc(q.explanation||'见下方原卷解析配图。')}</div>${images(q.explanationImages)}`}
function results(){clearAuto();if(!session?.submitted)return quiz();view='results';const all=active(),qs=all.filter(touched),choices=qs.filter(q=>!isShort(q)),right=choices.filter(correct).length,wrong=qs.filter(isWrong),written=qs.filter(isShort).reduce((n,q)=>n+values(q).filter(v=>v?.trim()).length,0);let grades=0,revisit=0;for(const q of qs.filter(isShort))q.parts.forEach((p,i)=>{if(values(q)[i]?.trim()&&session.selfGrades[q.id]?.[i]){grades++;if(session.selfGrades[q.id][i]==='review')revisit++}});const groups=new Map();wrong.forEach(q=>groups.set(q.topic,(groups.get(q.topic)||0)+1));
 app.innerHTML=`<div class="result-summary"><div><h1>本轮练习已结束</h1><p class="small">选择题：已答 ${choices.length} · 答对 ${right} · 答错 ${choices.length-right}<br>简答题：已填写 ${written} 小问 · 待自评 ${written-grades} · 需复习 ${revisit}<br>未作答 ${all.length-qs.length} 题</p></div><div class="score">${choices.length?Math.round(right/choices.length*100):'—'}${choices.length?'<span>%</span>':''}<div class="small">选择题正确率</div></div></div><div class="result-actions"><button class="primary" id="retry-wrong" ${wrong.length?'':'disabled'}>再练错题／需复习 ${wrong.length} 题</button><button id="back-home">返回题库</button></div><section class="topic-summary"><h2>本次错题与复习分类</h2><p class="small">包含选择题错题和手动标记需复习的案例题；简答题不自动判分。</p><div class="topic-filters"><button class="topic-filter" data-topic="" aria-pressed="true">全部已答题</button>${[...groups].map(([t,n])=>`<button class="topic-filter" data-topic="${esc(t)}" aria-pressed="false">${esc(t)} <strong>${n} 题</strong></button>`).join('')}</div></section><h2 id="review-title">已答题 · 答案与解析</h2>${!qs.length?'<p class="note">本轮没有已作答的题目。</p>':''}${qs.map(q=>`<section class="review-card" id="review-${q.id}" data-topic="${esc(q.topic)}" data-wrong="${isWrong(q)}"><div class="review-top"><span class="meta">第${q.paper}套 · 原题${q.number} · ${isShort(q)?'案例简答':q.type==='single'?'单选':'多选'}</span><span class="result-tag ${isShort(q)?'':correct(q)?'correct':'incorrect'}">${isShort(q)?'手动自评':correct(q)?'答对':'答错'}</span></div><p class="review-history">${esc(q.topic)}${isShort(q)?'':` · 练习累计答错 <strong>${wrongCounts[q.id]||0}</strong> 次`}</p>${material(q)}${isShort(q)?shortReview(q):choiceReview(q)}</section>`).join('')}`;
 document.querySelectorAll('.topic-filter').forEach(b=>b.onclick=()=>filterReviews(b.dataset.topic));document.querySelectorAll('[data-grade]').forEach(b=>b.onclick=()=>selfGrade(b.dataset.qid,Number(b.dataset.part),b.dataset.grade));document.getElementById('retry-wrong').onclick=()=>startRound(wrong.map(q=>q.id));document.getElementById('back-home').onclick=home;window.scrollTo(0,0);
}
function filterReviews(topic){document.querySelectorAll('.review-card').forEach(c=>c.hidden=!!topic&&(c.dataset.topic!==topic||c.dataset.wrong!=='true'));document.querySelectorAll('.topic-filter').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.topic===topic)));document.getElementById('review-title').textContent=topic?topic+' · 本次错题与复习':'已答题 · 答案与解析'}
function selfGrade(id,i,grade){if(!session?.submitted)return;const q=BY_ID.get(id);if(!isShort(q)||!values(q)[i]?.trim())return;session.selfGrades[id]??=[];const before=session.selfGrades[id][i],countId=id+':'+q.parts[i].number;if(before===grade)return;if(grade==='review')wrongCounts[countId]=(wrongCounts[countId]||0)+1;else if(before==='review')wrongCounts[countId]=Math.max(0,(wrongCounts[countId]||0)-1);session.selfGrades[id][i]=grade;const y=window.scrollY;persist();results();window.scrollTo(0,y)}
document.getElementById('home-btn').onclick=home;document.getElementById('close-nav').onclick=()=>document.getElementById('navigator').close();
// Changing subjects saves the same session; never let a pending single-choice timer move its position.
document.getElementById('subject-link').onclick=()=>{clearAuto();if(session&&!session.submitted){session.pausedAt=new Date().toISOString();persist()}};
if(session?.submitted&&!session.statsRecorded){recordStats();persist()}home();


// Both subjects share flags, notes, cumulative learning records and encrypted cross-device sync.
(function(){
const T=window.Tianyu,SUBJECT='practical',oldPersist=persist,oldHome=home,oldQuiz=quiz,oldNav=showNavigator,oldResults=results;
let pendingRemote=false,renderedFeatures="";
function features(){return JSON.stringify(Object.fromEntries(Object.entries(T.doc.cells).filter(([k])=>k.startsWith(SUBJECT+"/")&&/\/(flag|note|seen|complete)\//.test(k)).map(([k,c])=>[k,c.value])))}
function selectedQuestions(){return session?session.ids.map(id=>BY_ID.get(id)).filter(q=>session.answers[q.id]?.some(v=>String(v).trim())):[]}
function redraw(){if(view==='quiz')quiz();else if(view==='results')results();else home()}
home=function(){oldHome();T.homePanel(SUBJECT,BANK,ids=>startRound(ids));renderedFeatures=features()};
quiz=function(){oldQuiz();if(view==='quiz'&&session&&!session.submitted)T.quizPanel(SUBJECT,session.ids[session.index]);renderedFeatures=features()};
showNavigator=function(){oldNav();T.navPanel(SUBJECT,session.ids)};
results=function(){oldResults();if(view==='results')T.reviewPanel(SUBJECT,selectedQuestions());renderedFeatures=features()};
persist=function(){const saved=oldPersist();if(saved&&!T.applying){T.record(SUBJECT,{schema:2,session,wrongCounts},BANK);wrongCounts=T.counts(SUBJECT);renderedFeatures=features()}return saved};
T.register(SUBJECT,{bank:BANK,read:()=>({schema:2,session,wrongCounts}),cancelAuto:()=>clearAuto(),apply:snap=>{
 if(document.activeElement?.matches('textarea,input[type="text"]')){pendingRemote=true;return false}
 if(T.same(session,snap.session)&&T.same(wrongCounts,snap.wrongCounts)&&renderedFeatures===features())return true;
 clearAuto();session=snap.session;wrongCounts=snap.wrongCounts;if(session){scope=session.scope||'all';mode=session.mode||'all';}redraw();pendingRemote=false;return true;
}});
// Reapply deferred remote changes after typing, without stealing the caret or overwriting another small question.
document.addEventListener('focusout',()=>{if(pendingRemote)setTimeout(()=>{if(!document.activeElement?.matches('textarea,input[type="text"]')){const snap=T.snapshot(SUBJECT);session=snap.session;wrongCounts=snap.wrongCounts;redraw();pendingRemote=false}},0)});
redraw();
})();

</script></body></html>
