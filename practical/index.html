<script>(function(){

function valid(d){if(!d||d.schema!==4||!d.cells||typeof d.cells!=='object'||Array.isArray(d.cells))return null;const cells={};for(const [k,c] of Object.entries(d.cells)){if(k.length>200||!c||typeof c.clock!=='string'||!/^\d{16}-[\w-]+$/.test(c.clock))continue;cells[k]=c;tick=Math.max(tick,Number(c.clock.slice(0,16)))}return {schema:4,cells}}

function merge(a,b){const result=copy(a);for(const [k,c] of Object.entries(b.cells)){const old=result.cells[k];if(!old||c.clock>old.clock)result.cells[k]=copy(c);if(old&&k.endsWith('/current')&&old.value!==c.value){const subject=k.split('/')[0],ma=a.cells[subject+'/round/'+old.value+'/meta']?.value,mb=b.cells[subject+'/round/'+c.value+'/meta']?.value;if((ma?.startedAt||'')>(mb?.startedAt||''))result.cells[k]=copy(old);else if((ma?.startedAt||'')<(mb?.startedAt||''))result.cells[k]=copy(c);}if(old&&(/\/(?:baseline|seen|complete)\//.test(k))&&old.value>c.value)result.cells[k]={value:old.value,clock:old.clock>c.clock?old.clock:c.clock}}return result}

function save(){try{const stored=valid(JSON.parse(localStorage.getItem(STORE)||'null'));if(stored)doc=merge(doc,stored);localStorage.setItem(STORE,JSON.stringify(doc));return true}catch{status='保存失败，请保持页面打开';paintStatus();return false}}
// Only compact, confirmed grading results enter the existing encrypted document.
const PDF_HISTORY='tianyu-pdf-records-v1';
function cleanPdfRecord(raw){
 if(!raw||!['technical','practical'].includes(raw.subject)||!/^([a-f0-9]{64})$/.test(raw.id)||!Array.isArray(raw.selections)||!raw.selections.length||raw.selections.length>400||!Number.isFinite(Date.parse(raw.date)))return null;
 const ids=new Set(),rows=[];
 for(const r of raw.selections){if(!r||typeof r.id!=='string'||!(raw.subject==='technical'?/^\d+-\d+$/:/^p\d+-\d+$/).test(r.id)||ids.has(r.id)||!Array.isArray(r.choices)||r.choices.some(v=>!['A','B','C','D','E'].includes(v)))return null;ids.add(r.id);rows.push({id:r.id,choices:[...new Set(r.choices)].sort(),right:!!r.right})}
 const answered=rows.filter(r=>r.choices.length).length,right=rows.filter(r=>r.choices.length&&r.right).length;
 const out={id:raw.id,exportId:String(raw.exportId||'').slice(0,100),subject:raw.subject,date:new Date(raw.date).toISOString(),answered,right,wrong:answered-right,blank:rows.length-answered,selections:rows};
 if(Number.isFinite(raw.earnedPoints)&&Number.isFinite(raw.totalPoints)&&raw.earnedPoints>=0&&raw.totalPoints>=raw.earnedPoints){out.earnedPoints=raw.earnedPoints;out.totalPoints=raw.totalPoints}
 return out;
}
function pdfRecords(){return Object.entries(doc.cells).filter(([k])=>k.startsWith('pdf/record/')).map(([,c])=>cleanPdfRecord(c.value)).filter(Boolean).sort((a,b)=>b.date.localeCompare(a.date)||a.id.localeCompare(b.id))}
function markPdfProgress(r){for(const row of r.selections)if(row.choices.length){set(r.subject+'/seen/'+row.id,true);set(r.subject+'/complete/'+row.id,true)}}
function writePdfHistory(){try{localStorage.setItem(PDF_HISTORY,JSON.stringify(pdfRecords()))}catch{status='本机记录保存失败'}}
function pdfChanged(){window.dispatchEvent(new CustomEvent('tianyu-learning-change'))}
function importPdfHistory(){let changed=false;try{const saved=JSON.parse(localStorage.getItem(PDF_HISTORY)||'[]');if(Array.isArray(saved))for(const raw of saved){const r=cleanPdfRecord(raw);if(!r||get('pdf/record/'+r.id))continue;set('pdf/record/'+r.id,r);markPdfProgress(r);changed=true}}catch{}return changed}
function recordPdf(raw){const r=cleanPdfRecord(raw);if(!r)throw Error('PDF批改记录格式不完整。');const previous=get('pdf/record/'+r.id);
 // Repeated grading of the same file is one record; corrections replace its selections.
 if(previous&&same(previous.selections,r.selections))return true;
 if(previous)r.date=previous.date;
 set('pdf/record/'+r.id,r);markPdfProgress(r);const saved=save();writeEnvelopes();writePdfHistory();pdfChanged();queue();return saved;
}
function pdfQuestion(subject,id){const matches=pdfRecords().filter(r=>r.subject===subject&&r.selections.some(row=>row.id===id&&row.choices.length));return {attempts:matches.length,wrong:matches.filter(r=>r.selections.find(row=>row.id===id)?.right===false).length}}

function isShort(id){return /^p\d+-2[6-8]$/.test(id)}
function partCount(id){return /-28$/.test(id)||id==='p3-27'?5:4}
function capture(subject,env,bank,legacy=false){if(!env)return;const s=env.session,prior=lastSnapshots[subject]?.session,sameRound=!!prior&&!!s?.roundId&&prior.roundId===s.roundId;
 if(!get(subject+'/baselineReady',false)){for(const [id,n] of Object.entries(env.wrongCounts||{})){set(subject+'/baseline/'+id,n);if(n>0&&!id.includes(':')){set(subject+'/seen/'+id,true);set(subject+'/complete/'+id,true)}}set(subject+'/baselineReady',true)}
 if(!s?.ids?.length)return;
 s.roundId=s.roundId||'r-'+crypto.randomUUID();const r=s.roundId,base=subject+'/round/'+r;
 if(legacy&&!get(base+'/initial',null))set(base+'/initial',{counted:!!s.statsRecorded,grades:s.selfGrades||{}});
 if(!get(base+'/initial',null))set(base+'/initial',{counted:false,grades:{}});
 const initial=get(base+'/initial');
 const metadata={...s};delete metadata.answers;delete metadata.selfGrades;delete metadata.exclusions;delete metadata.confirmed;
 const previous=get(base+'/meta',null);if(previous?.submitted&&!metadata.submitted)metadata.submitted=true;
 const oldMeta=prior?{...prior}:null;if(oldMeta){delete oldMeta.answers;delete oldMeta.selfGrades;delete oldMeta.exclusions;delete oldMeta.confirmed}if(!sameRound||!same(oldMeta,metadata))set(base+'/meta',metadata);
 const current=get(subject+'/current',null),other=current?get(subject+'/round/'+current+'/meta',null):null;
 if(!current||current===r||!other||(s.startedAt||'')>=(other.startedAt||''))set(subject+'/current',r);
 for(const id of s.ids){const a=s.answers?.[id]||[],short=isShort(id),parts=short?partCount(id):0;
  if(short){for(let i=0;i<parts;i++)if(!sameRound||a[i]!==prior.answers?.[id]?.[i])set(base+'/answer/'+id+':'+i,typeof a[i]==='string'?a[i]:'');for(let i=0;i<parts;i++){const grade=s.selfGrades?.[id]?.[i]||null;if(!sameRound||grade!==(prior.selfGrades?.[id]?.[i]||null))set(base+'/grade/'+id+':'+i,grade);if(s.submitted&&a[i]?.trim()&&(grade||initial.grades[id]?.[i]||get(subject+'/count/'+id+':'+(i+1)+'/'+r)!==undefined)){const orig=initial.counted&&initial.grades[id]?.[i]==='review'?1:0;set(subject+'/count/'+id+':'+(i+1)+'/'+r,(grade==='review'?1:0)-orig)}}}
  else {if(!sameRound||!same(a,prior.answers?.[id]||[]))set(base+'/answer/'+id,Array.isArray(a)?a:[]);if(s.submitted&&!initial.counted&&a.length&&bank){const q=bank.questions.find(q=>q.id===id);if(q)set(subject+'/count/'+id+'/'+r,[...a].sort().join(',')===[...q.answer].sort().join(',')?0:1)}}
  if(!short){const excluded=s.exclusions?.[id]||{},previousExclusions=sameRound?(prior.exclusions?.[id]||{}):{};for(const letter of new Set([...Object.keys(excluded),...Object.keys(previousExclusions)])){if(!/^[A-E]$/.test(letter))continue;if(!sameRound||!!excluded[letter]!==!!previousExclusions[letter])set(base+'/exclude/'+id+'/'+letter,!!excluded[letter])}if(s.confirmed?.[id]&&(!sameRound||!prior.confirmed?.[id]))set(base+'/confirmed/'+id,true)}
  const touched=short?a.some(v=>v?.trim()):a.length>0,completed=short?a.length>=parts&&a.slice(0,parts).every(v=>v?.trim()):a.length>0;
  if(touched)set(subject+'/seen/'+id,true);if(completed)set(subject+'/complete/'+id,true);
 }
 lastSnapshots[subject]=copy(env);
}
function counts(subject){const result={};for(const [k,c] of Object.entries(doc.cells)){if(k.startsWith(subject+'/baseline/'))result[k.slice((subject+'/baseline/').length)]=c.value;}
 for(const [k,c] of Object.entries(doc.cells)){if(k.startsWith(subject+'/count/')){const id=k.slice((subject+'/count/').length).split('/')[0];result[id]=(result[id]||0)+(Number(c.value)||0)}}for(const r of pdfRecords())if(r.subject===subject)for(const row of r.selections)if(row.choices.length&&!row.right)result[row.id]=(result[row.id]||0)+1;for(const k of Object.keys(result))result[k]=Math.max(0,result[k]);return result}
function snapshot(subject){const r=get(subject+'/current',null),meta=r?get(subject+'/round/'+r+'/meta',null):null;if(!meta)return {schema:2,session:null,wrongCounts:counts(subject)};
 const s=copy(meta),base=subject+'/round/'+r;s.answers={};s.selfGrades={};s.exclusions={};s.confirmed={};
 for(const id of s.ids){if(isShort(id)){s.answers[id]=Array.from({length:partCount(id)},(_,i)=>get(base+'/answer/'+id+':'+i,''));s.selfGrades[id]=Array.from({length:partCount(id)},(_,i)=>get(base+'/grade/'+id+':'+i,null));}else {s.answers[id]=get(base+'/answer/'+id,[]);const excluded={};for(const letter of ['A','B','C','D','E'])if(get(base+'/exclude/'+id+'/'+letter,false))excluded[letter]=true;if(Object.keys(excluded).length)s.exclusions[id]=excluded;if(get(base+'/confirmed/'+id,false))s.confirmed[id]=true}}
 return {schema:2,session:s,wrongCounts:counts(subject)};
}
function writeEnvelopes(){for(const subject of Object.keys(KEYS)){if(!get(subject+'/current'))continue;try{localStorage.setItem(KEYS[subject],JSON.stringify(snapshot(subject)))}catch{status='本机保存失败'}}}
function apply(){writeEnvelopes();writePdfHistory();applying=true;try{for(const [subject,a] of adapters){const snap=snapshot(subject);if(a.apply(snap)!==false)lastSnapshots[subject]=copy(snap)}}finally{applying=false}paintStatus();paintPortal();pdfChanged()}
function record(subject,env,bank){if(applying)return;capture(subject,env,bank);save();writeEnvelopes();queue()}
function progress(subject,id){return get(subject+'/complete/'+id,false)?'已做':get(subject+'/seen/'+id,false)?'部分填写':'未做'}
function flag(subject,id){return !!get(subject+'/flag/'+id,false)}
function note(subject,id){return get(subject+'/note/'+id,'')}
function edit(subject,id,text){set(subject+'/note/'+id,text);const saved=save();queue();return saved}
function toggle(subject,id){set(subject+'/flag/'+id,!flag(subject,id));save();queue();return flag(subject,id)}
function totals(subject,ids){return {done:ids.filter(id=>progress(subject,id)==='已做').length,partial:ids.filter(id=>progress(subject,id)==='部分填写').length,flags:ids.filter(id=>flag(subject,id)).length,total:ids.length}}
function bytes64(bytes){let s='';for(const b of bytes)s+=String.fromCharCode(b);return btoa(s)}
function from64(str){return Uint8Array.from(atob(str),c=>c.charCodeAt(0))}
async function key(){return crypto.subtle.importKey('raw',Uint8Array.from(atob(code.replace(/-/g,'+').replace(/_/g,'/')+'='),c=>c.charCodeAt(0)),{name:'AES-GCM'},false,['encrypt','decrypt'])}
async function auth(){const h=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('tianyu-auth:'+code));return Array.from(new Uint8Array(h),b=>b.toString(16).padStart(2,'0')).join('')}
async function encrypt(d){const iv=crypto.getRandomValues(new Uint8Array(12)),data=await crypto.subtle.encrypt({name:'AES-GCM',iv},await key(),new TextEncoder().encode(JSON.stringify(d)));return {version:1,iv:bytes64(iv),data:bytes64(new Uint8Array(data))}}
async function decrypt(enc){if(!enc)return {schema:4,cells:{}};const raw=await crypto.subtle.decrypt({name:'AES-GCM',iv:from64(enc.iv)},await key(),from64(enc.data));const d=valid(JSON.parse(new TextDecoder().decode(raw)));if(!d)throw new Error('invalid_state');return d}
function queue(){clearTimeout(timer);if(code)timer=setTimeout(()=>sync(),1000);paintStatus()}
async function request(method,body){const controller=new AbortController(),timeout=setTimeout(()=>controller.abort(),8000);try{const r=await fetch(API,{method,headers:{'X-Notebook-Key':await auth(),...(body?{'Content-Type':'application/json'}:{})},body:body?JSON.stringify(body):undefined,signal:controller.signal,cache:'no-store'});const data=await r.json();return {ok:r.ok,status:r.status,data}}finally{clearTimeout(timeout)}}
async function sync(){if(!code||inflight||document.visibilityState==='hidden')return;if(!navigator.onLine){status='网络断开 · 已保存在本机';paintStatus();return};inflight=true;status='正在同步';paintStatus();try{
 for(let retry=0;retry<4;retry++){
  const remote=await request('GET');if(!remote.ok)throw new Error(remote.status===401?'invalid_code':'cloud_unavailable');
  const cloud=await decrypt(remote.data.encrypted),before=JSON.stringify(doc);doc=merge(doc,cloud);save();if(JSON.stringify(doc)!==before)apply();
  if(same(doc,cloud)){dirty=false;retryDelay=30000;status='已同步';lastSync=new Date().toLocaleTimeString('zh-CN',{hour12:false});break}
  const sending=copy(doc),encrypted=await encrypt(sending),sent=await request('PUT',{revision:remote.data.revision,encrypted});
  if(sent.status===409)continue;if(!sent.ok)throw new Error('cloud_unavailable');
  retryDelay=30000;dirty=!same(doc,sending);status=dirty?'等待同步':'已同步';lastSync=new Date().toLocaleTimeString('zh-CN',{hour12:false});apply();break;
 }
 if(status==='正在同步'){status='等待同步';dirty=true}
 }catch(e){status=e.message==='invalid_code'?'同步链接无效':'同步暂不可用 · 本机可继续作答';dirty=true}finally{inflight=false;paintStatus();if(dirty&&code){clearTimeout(timer);timer=setTimeout(()=>sync(),retryDelay);retryDelay=Math.min(retryDelay*2,120000)}}}
function personalLink(){const root=new URL(location.pathname.includes('/technical/')||location.pathname.includes('/practical/')||location.pathname.includes('/pdf/')?'../':'./',location.href);root.search='';root.hash='sync='+code;return root.href}
function connect(value){let next=String(value).trim();try{if(next.includes('#'))next=new URL(next).hash.slice(1).replace(/^sync=/,'')}catch{}if(!/^[A-Za-z0-9_-]{43}$/.test(next))return false;code=next;localStorage.setItem(SECRET,code);location.hash='sync='+code;dirty=true;paintStatus();sync();return true}
function paintStatus(){document.querySelectorAll('[data-sync-status]').forEach(el=>el.textContent=code?status+(status==='已同步'&&lastSync?' '+lastSync:''):'仅本机保存');document.querySelectorAll('a#subject-link,a#technical,a#practical,a#pdf-entry,a#back').forEach(a=>{if(code){const u=new URL(a.href,location.href);u.hash='sync='+code;a.href=u.href}});const link=document.getElementById('sync-link');if(link){link.value=code?personalLink():'';link.placeholder=code?'':'请点开聊天里发给你的专属链接';}document.getElementById('copy-sync')?.toggleAttribute('disabled',!code);document.getElementById('force-sync')?.toggleAttribute('disabled',!code);const desc=document.getElementById('sync-description');if(desc)desc.textContent=code?'同一个专属链接在手机和电脑打开后，会自动同步。链接绑定你的记录，请只在自己的设备间分享。':'首次连接：请点开 Codex 聊天中发给你的“专属同步链接”，也可以将它粘贴在下方。连接后这里会自动显示链接。关闭此窗口即可直接练习，本机进度照常保存。';}
function paintPortal(){for(const [subject,target,total] of [['technical','tech-resume',Number(document.getElementById('technical')?.dataset.total||239)],['practical','prac-resume',35]]){const el=document.getElementById(target);if(!el)continue;const ids=Object.keys(doc.cells).filter(k=>k.startsWith(subject+'/complete/')).map(k=>k.split('/').pop());el.textContent=`累计已做 ${ids.length} / ${total} 题`+(get(subject+'/current')?' · 有练习记录':'')}}
function dialogs(){if(document.getElementById('sync-dialog'))return;document.body.insertAdjacentHTML('beforeend',`<dialog id="sync-dialog"><div class="dialog-top"><h2>跨设备同步</h2><button id="close-sync">关闭</button></div><p id="sync-description"></p><p data-sync-status role="status"></p><label for="sync-link">你的专属同步链接</label><input id="sync-link" readonly autocomplete="off"><div class="actions"><button id="copy-sync">复制同步链接</button><button id="force-sync">立即同步</button></div><label for="connect-link">连接已有同步链接</label><input id="connect-link" autocomplete="off" placeholder="粘贴专属链接或同步码"><button id="connect-sync">连接同步</button><p class="small" id="sync-message"></p></dialog><dialog id="records-dialog"><div class="dialog-top"><h2>题目记录</h2><button id="close-records">关闭</button></div><div class="record-filters"><button data-record-filter="all">全部</button><button data-record-filter="unseen">未做</button><button data-record-filter="flag">疑问</button><button data-record-filter="noted">有笔记</button></div><div id="record-list"></div></dialog><dialog id="note-dialog"><div class="dialog-top"><h2 id="note-title">我的笔记</h2><button id="close-note">关闭</button></div><textarea id="note-editor" rows="10" placeholder="记录你的理解、疑问和记忆方法…"></textarea><p class="small" id="note-status" role="status">输入自动保存</p></dialog>`);
 document.getElementById('close-sync').onclick=()=>document.getElementById('sync-dialog').close();document.getElementById('close-records').onclick=()=>document.getElementById('records-dialog').close();document.getElementById('close-note').onclick=()=>document.getElementById('note-dialog').close();
 document.getElementById('copy-sync').onclick=async()=>{if(!code){document.getElementById('sync-message').textContent='请先打开专属同步链接。';return}try{await navigator.clipboard.writeText(personalLink());document.getElementById('sync-message').textContent='链接已复制，发送到自己的另一台设备即可。'}catch{document.getElementById('sync-link').select();document.getElementById('sync-message').textContent='请长按上方链接复制。'}};
 document.getElementById('force-sync').onclick=()=>sync();document.getElementById('connect-sync').onclick=()=>{document.getElementById('sync-message').textContent=connect(document.getElementById('connect-link').value)?'已连接，正在同步。':'链接格式不正确。'};
}
function initUI(){dialogs();const h=document.querySelector('.appbar-inner')||document.querySelector('header');if(h&&!document.getElementById('sync-button')){h.insertAdjacentHTML('beforeend','<button class="sync-button" id="sync-button"><span data-sync-status>仅本机保存</span></button>');document.getElementById('sync-button').onclick=()=>{paintStatus();document.getElementById('sync-dialog').showModal()}}paintStatus();paintPortal()}
function openNote(subject,id,label){dialogs();const e=document.getElementById('note-editor');document.getElementById('note-title').textContent=label+' · 我的笔记';e.value=note(subject,id);e.oninput=()=>{document.getElementById('note-status').textContent=edit(subject,id,e.value)?'已自动保存 · '+(code?'等待同步':'仅本机'):'保存失败，请保持页面打开'};document.getElementById('note-dialog').showModal()}
function records(subject,bank,onPractice){dialogs();const d=document.getElementById('records-dialog');let filter='all';function render(){const qs=bank.questions.filter(q=>filter==='all'||filter==='unseen'&&progress(subject,q.id)!=='已做'||filter==='flag'&&flag(subject,q.id)||filter==='noted'&&note(subject,q.id));document.getElementById('record-list').innerHTML=qs.map(q=>`<div class="record-row"><div><strong>第${q.paper}套 · 原题${q.number}</strong><p class="small">${progress(subject,q.id)}${pdfQuestion(subject,q.id).attempts?' · PDF作答 '+pdfQuestion(subject,q.id).attempts+'次':''}${flag(subject,q.id)?' · ★ 疑问':''}${note(subject,q.id)?' · 有笔记':''}</p></div><button data-record-practice="${q.id}">作答</button><button data-record-note="${q.id}">笔记</button></div>`).join('')||'<p class="small">没有符合条件的题目。</p>';d.querySelectorAll('[data-record-practice]').forEach(b=>b.onclick=()=>{d.close();onPractice([b.dataset.recordPractice])});d.querySelectorAll('[data-record-note]').forEach(b=>b.onclick=()=>{const q=bank.questions.find(q=>q.id===b.dataset.recordNote);openNote(subject,q.id,`第${q.paper}套原题${q.number}`)})}d.querySelectorAll('[data-record-filter]').forEach(b=>b.onclick=()=>{filter=b.dataset.recordFilter;render()});render();d.showModal()}
function homePanel(subject,bank,onPractice){if(document.querySelector('.learning-dashboard'))return;const t=totals(subject,bank.questions.map(q=>q.id));document.getElementById('app').insertAdjacentHTML('afterbegin',`<section class="learning-dashboard"><h2>我的学习记录</h2><p>累计已做 <strong>${t.done}</strong> · 未完整作答 <strong>${t.total-t.done}</strong>${t.partial?`（部分填写 ${t.partial}）`:''} · 疑问 <strong>${t.flags}</strong></p><div class="learning-actions"><button id="practice-unseen">练习未做题</button><button id="practice-flags" ${t.flags?'':'disabled'}>练习疑问题</button><button id="view-records">查看题目记录</button></div><p class="small" data-sync-status></p></section>`);document.getElementById('practice-unseen').onclick=()=>onPractice(bank.questions.filter(q=>progress(subject,q.id)!=='已做').map(q=>q.id));document.getElementById('practice-flags').onclick=()=>onPractice(bank.questions.filter(q=>flag(subject,q.id)).map(q=>q.id));document.getElementById('view-records').onclick=()=>records(subject,bank,onPractice);paintStatus()}
function flagButton(subject,id){return `<button class="flag-button" data-flag-id="${id}" aria-pressed="${flag(subject,id)}">${flag(subject,id)?'★ 已标记疑问':'☆ 标记疑问'}</button>`}
function bindFlags(subject){document.querySelectorAll('[data-flag-id]').forEach(b=>b.onclick=()=>{adapters.get(subject)?.cancelAuto?.();const yes=toggle(subject,b.dataset.flagId);b.setAttribute('aria-pressed',String(yes));b.textContent=yes?'★ 已标记疑问':'☆ 标记疑问'})}
function quizPanel(subject,id){const top=document.querySelector('.quiz-top');if(top&&!document.querySelector('.quiz-mark'))top.insertAdjacentHTML('afterend',`<div class="quiz-mark">${flagButton(subject,id)}<span class="small">标记不会影响作答和判分</span></div>`);bindFlags(subject)}
function navPanel(subject,ids){const grid=document.getElementById('nav-grid');for(const b of [...grid.querySelectorAll('button[data-index]')]){const id=ids[Number(b.dataset.index)],wrap=document.createElement('div');wrap.className='nav-item';b.replaceWith(wrap);wrap.append(b);const marked=flag(subject,id);b.classList.toggle('flagged',marked);b.setAttribute('aria-label',b.getAttribute('aria-label')+(marked?'，已标记疑问':''));if(marked)wrap.insertAdjacentHTML('beforeend',`<button class="nav-flag" data-flag-id="${id}" aria-label="取消第${Number(b.dataset.index)+1}题疑问" aria-pressed="true">★ 疑问</button>`)}bindFlags(subject);grid.querySelectorAll('.nav-flag').forEach(b=>{const original=b.onclick;b.onclick=()=>{const number=b.closest('.nav-item').querySelector('[data-index]');original();number.classList.remove('flagged');number.setAttribute('aria-label',number.getAttribute('aria-label').replace('，已标记疑问',''));document.querySelectorAll('.flag-button[data-flag-id]').forEach(mark=>{if(mark.dataset.flagId===b.dataset.flagId){mark.setAttribute('aria-pressed','false');mark.textContent='☆ 标记疑问'}});b.remove()}});document.getElementById('navigator').querySelector('.legend').textContent+=' 仅已标记题显示星标，可点击取消；在题目页面标记疑问。'}

function noteHTML(subject,id,label){return `<div class="my-note"><label for="note-${id}">${esc(label)}</label><textarea id="note-${id}" data-note-id="${id}" rows="4" placeholder="写下自己的理解、疑问、记忆方法…">${esc(note(subject,id))}</textarea><p class="small note-save" role="status">${note(subject,id)?'已保存':'输入自动保存'}</p></div>`}
function reviewPanel(subject,qs){document.querySelectorAll('.review-card').forEach((card,i)=>{const q=qs[i];if(!q)return;card.insertAdjacentHTML('beforeend',`<div class="review-mark">${flagButton(subject,q.id)}</div>`+noteHTML(subject,q.id,'我的笔记（这道题的总记录）'));if(isShort(q.id))card.querySelectorAll('.short-review').forEach((part,j)=>part.insertAdjacentHTML('beforeend',noteHTML(subject,q.id+':'+(j+1),'第'+(j+1)+'小问笔记')))});bindFlags(subject);document.querySelectorAll('[data-note-id]').forEach(e=>e.oninput=()=>{e.closest('.my-note').querySelector('.note-save').textContent=edit(subject,e.dataset.noteId,e.value)?'已自动保存 · '+(code?'等待同步':'仅本机保存'):'保存失败，请保持页面打开'})}
function register(subject,a){adapters.set(subject,a);const initial=a.read();capture(subject,initial,a.bank,true);save();writeEnvelopes();const snap=snapshot(subject);if(a.apply(snap)!==false)lastSnapshots[subject]=copy(snap);initUI();queue()}
window.Tianyu={recordPdf,pdfRecords,pdfQuestion,record,register,snapshot,counts,progress,flag,note,totals,same,homePanel,quizPanel,navPanel,reviewPanel,openNote,sync,connect,get applying(){return applying},get status(){return status},get doc(){return copy(doc)},merge,encrypt,decrypt};

</script><script id="bank" type="application/json">{"version":"practical-v1","release":"2026-10-03-r3","title":"其他安全专业实务 · 错题本","papers":[{"id":1,"title":"第1套","count":13,"single":7,"multiple":3,"short":3,"parts":13},{"id":2,"title":"第2套","count":3,"single":0,"multiple":0,"short":3,"parts":13},{"id":3,"title":"第3套","count":19,"single":14,"multiple":2,"short":3,"parts":14}],"questions":[{"id":"p1-1","paper":1,"number":1,"topic":"电气与机械安全","type":"single","images":[],"stem":"人机作业环境中的照明因素、声环境和照明环境等均影响作业安全性，综上所述合适的照明条件、亮度控制要求是企业应纳入综合考量的重要因素。针对作业面的照明特性及要求的各项说法中，符合规定的是（）。","options":{"A":"光照强度越高，远视力和近视力越强","B":"设置合适的眩光，能有效提高从业者的注意力","C":"出于减少反射光及安全保密等因素，应不设或少设窗户","D":"视觉显示器之间的亮度差应超过10:1，确保使用时无闪烁"},"answer":["C"],"explanation":"A选项错误：合适的光照强度方能提高远视力和近视力；B选项错误：眩光是导致视觉疲劳的主要因素，应避免出现眩光；C选项正确：出于减少反射光引起视物不清及安全保密等理由，应不设或少设窗户；D选项错误：视觉显示器之间的亮度差不应超过10:1，确保使用时无闪烁。","explanationImages":[]},{"id":"p1-5","paper":1,"number":5,"topic":"特种设备安全","type":"single","images":[],"stem":"长期运行状态下的压力容器受介质侵蚀需进行焊补作业，已知壁厚15mm焊补深度10mm、材质为有色金属合金材料。经过焊接作业后的压力容器，应进行的监测试验方法最优的是（）。","options":{"A":"X射线探伤","B":"超声探伤","C":"泄漏量试验","D":"耐压试验"},"answer":["A"],"explanation":"焊补深度超过壁厚的1/2的压力容器应重新进行耐压强度试验，但是耐压强度实验之前为保证设备具有足够的承载能力应首先进行无损探伤试验，考虑到介质是有色金属合金为保证有足够的穿透能力应选择X射线。","explanationImages":[]},{"id":"p1-8","paper":1,"number":8,"topic":"防火防爆","type":"single","images":[],"stem":"烟火药的成分包括氧化剂、还原剂、黏合剂、添加剂等，其组分决定了其具有燃烧和爆炸的特性，在烟火药生产过程中，必须采取相应的防火防爆措施。下列烟火药生产过程防火防爆措施的要求中，正确的是（）。","options":{"A":"药柱制作应采用湿法筑压","B":"氯酸盐烟火药混合应采用球磨机","C":"烟火药干燥后散热应及时收取","D":"手工制作引火线应在专用工房内"},"answer":["A"],"explanation":"A选项正确：制作药柱应采用湿药筑压；B选项错误：不应使用球磨机混合氯酸盐烟火药等高感度药物；C选项错误：药物干燥散热时不应翻动和收取，应冷却至室温时收取；D选项错误：引火线应机械制作，并在专用工房操作，机械动力装置应与制引机隔离。","explanationImages":[]},{"id":"p1-10","paper":1,"number":10,"topic":"电气与机械安全","type":"single","images":[],"stem":"安全检测是保障安全生产的重要手段，常用的电气安全检测仪器包括绝缘电阻测量仪、接地电阻测量仪、红外测温仪、可燃气体检测仪等。下列使用安全检测仪器进行测量的说法，正确的是（）。","options":{"A":"谐波分析仪可测量各相谐波、实时显示波形并能完成相关计算显示","B":"兆欧表测量时，连接导线应采用双股绝缘导线","C":"红外测温仪测量时，测量区域应大于被测目标的范围","D":"接地电阻测量仪测量时，电极间连接线应与邻近高压架空线路平行"},"answer":["A"],"explanation":"A选项正确：谐波分析仪可同时测量各相谐波，可实时显示波形，并能完成相关计算，把结果以波形图表的形式显示出来B选项错误：使用兆欧表测量时，连接导线不得采用双股绝缘线，而应采用绝缘良好单股线分开连接，以免双股线绝缘不良带来测量误差；C选项错误：红外测温仪测量时，测量区域应小于被测目标的范围；D选项错误：使用接地电阻测量仪测量时，测量电极间的连接线应避免与邻近的高压架空线路平行，以防止感应电压的危险。","explanationImages":[]},{"id":"p1-11","paper":1,"number":11,"topic":"电气与机械安全","type":"single","images":[],"stem":"大型游乐设施的滑索通常属于无动力游乐设施，利用地形高差，通过钢索从高处向低处滑行从而跨越地形障碍。因此，下列关于滑索的各项说法中正确的是（）。","options":{"A":"设置放行联锁装置，确保乘客安全就座后方才允许放行","B":"每条滑索到达站应当设置不少于两套独立的自动制动装置","C":"无动力牵引滑索的出发站安全门开启方向应与行进方向相同","D":"无动力牵引滑索停止区长度应不大于6m"},"answer":["B"],"explanation":"A选项错误：设有放行联锁装置，到达站操作人员确认乘客安全离开后，操作允许放行按钮，出发站操作人员接收到允许放行信号后，才能启动放行联锁装置放行。B选项正确：每条滑索到达站应当设置不少于两套独立的自动制动装置；C选项错误：无动力牵引滑索的出发站应设置安全门，安全门开启方向不应当与乘客行进方向相同；D选项错误：无动力牵引滑索停止区（通过制动装置到达缓冲垫之间的区域）长度应不小于6m；","explanationImages":[]},{"id":"p1-14","paper":1,"number":14,"topic":"危险化学品安全","type":"single","images":[],"stem":"爆破片更换周期应当根据设备使用条件、介质性质等具体影响因素，或者设计预期使用年限合理确定。针对下列检查出的情况，（）应立即更换爆破片。","options":{"A":"排放接管不畅通，伴随严重腐蚀","B":"爆破片前的截止阀处于开启状态，但铅封被破坏","C":"爆破片外表面有损伤和腐蚀情况","D":"带刀架的夹持器，刀片有损伤缺口或者刀口变钝"},"answer":["C"],"explanation":"运行中的爆破片，出现下列情况之一的应更换：\n（1）检查爆破片装置安装方向是否正确，核实铭牌上的爆破压力和爆破温度是否符合运行要求；\n（2）检查爆破片外表面有无损伤和腐蚀情况，是否有明显变形，有无异物黏附、有无泄漏等；\n（3）爆破片装置与安全阀串联使用时，检查爆破片装置与安全阀之间的压力指示装置，确认爆破片装置、安全阀是否泄漏；","explanationImages":[]},{"id":"p1-20","paper":1,"number":20,"topic":"防火防爆","type":"single","images":[],"stem":"爆炸冲击波毁伤准则应充分考虑暴露在事故面的人在爆炸冲击波超压波阵面的影响下的伤害型式，在工程设计、事故后的应急救援中都具有不可替代作用。因此，某起事故中暴露在作业面50m范围左右的人受到70~75kPa超压作用，针对上述事故面的暴露人员可能受到的伤害是（）。","options":{"A":"轻微挫伤肺部和中耳，局部心肌撕裂","B":"体腔、脾脏破裂，导致大部分暴露人员死亡","C":"肝脾包膜下出血、融合性撕裂","D":"心肌撕裂、可能引起死亡"},"answer":["D"],"explanation":"70~75Kpa会造成严重损伤(严重内脏挫伤，可引起死亡)，重度中耳和肺挫伤，脚，心肌撕裂，可能引起死亡。D选项正确；A选项属于轻微挫伤；B选项极严重伤害；C选项属于中等损伤；","explanationImages":[{"src":"../assets/8bf6beedddc0f8de77b672ec.png","alt":"第1套原题20原卷配图","width":975,"height":259}]},{"id":"p1-23","paper":1,"number":23,"topic":"电气与机械安全","type":"multiple","images":[],"stem":"按照规范《机器人 安全要求应用规范》，示教器是进行机器人手动操纵、程序编写、参数配置及监控的手持装置。下列关于示教器的安全控制要求，正确的是（）。","options":{"A":"使能装置应在手动降速方式和手动高速方式下生效","B":"使能装置应与安全控制系统的启动电路或其他等效电路连接","C":"单个示教盒应连接到唯一的机器人控制器","D":"同一示教盒控制下的所有机器人，应处于相同的操作模式","E":"对于已被激活的机器人，应提供反激活的功能"},"answer":["A","D","E"],"explanation":"A选项正确：使能装置应在手动降速方式和手动高速方式下生效；B选项错误：使能装置应与安全控制系统的停止电路或其他等效安全停止电路相连接；C选项错误：单个示教盒可连接到一台或多台机器人的控制器。在手动方式操作时，机器人系统的所有功能都应在唯一示教盒的控制下；D选项正确：处于同一示教盒控制下的所有机器人，应处于相同的操作模式（如手动或自动模式），并且处于相同的状态（如打开或关闭电源）。E选项正确：对于已被激活的机器人，应提供反激活（停止激活）的功能。","explanationImages":[],"material":"根据案例背景—情景描述，回答21-25问题大型物流单位构建连接生产端与消费端的主动脉，通过规模化的运输调度和智能化的路径优化，显著降低了单位商品的流通成本并缩短了周转周期。这种高效的商品流通体系，是支撑现代产业链分工、灵活响应市场变化以及实现资源优化配置的关键基础设施。大型物流单位的大型带式输送机是最典型的机械设备。带式输送设备辅助物流品的输运作业通过固定岗位的作业人员依次完成分类分拣作业，已知某男性工人（性别系数男性取值1.0）从事物流品的分拣作业（W取值0.8），净劳动时长4h（工作日总工时按照8h安排）、实测能量代谢率3.75KJ/min·m2。基于上述作业情景，单调的劳动作业方式极易导致疲劳、注意力不集中等问题，看似有序和缓的作业方式也容易让人忽视现场的安全隐患。恰逢特殊的时间段导致物流分拣压力陡增，2#皮带停转故障卡死，事故查验表明故障因皮带安检设备中的大型货物堆积所致。安检设备存在辐射源、皮带交接口属于最典型的危险区域，采用安全栅栏进行物理隔断并设置具有安全联锁功能的防护门。设备检修期间依照检修方案将联锁功能隔断、电机断电，试运行期间检修人员违反规定擅自在安全防护区内停留观察设备运行状态，结果高速运行状态下的皮带绷带导致打击致死。企业为避免同类事故并有效提高工作效率，引入全自动化智能机械臂，具备协同作业的空间配置能够检测操作者是否处于协同工作空间内的安全适用设备，机器臂应在操作者进入协作工作空间时提前切换到安全适用的受监控停止状态，并一直保持这一状态，直到操作者离开协作工作空间。若操作者进入协作工作空间时机器人还未进入安全适用的受监控停止状态，则会引发保护性停止。引入自动化智能机械臂后属于典型的全自动化系统，已知人的信息接受的可靠度1.0、信息判断的可靠度0.98、信息处理的可靠度0.95；此外，机械的可靠度定义为0.9。正常状态，人机系统工作方式如下：","materialImages":[{"src":"../assets/ccd814eb670b72affc8a9c15.png","alt":"第1套原题21原卷配图","width":383,"height":175}]},{"id":"p1-24","paper":1,"number":24,"topic":"电气与机械安全","type":"multiple","images":[],"stem":"依据案例背景事故后的应对方案，下列关于人、机械、系统可靠度和人机特征的各项说法中，正确的是（）。","options":{"A":"人的可靠度R1为0.999","B":"人机关系中，机械为主体","C":"人机关系中，机械作为动力源、人作为操作者和控制者","D":"人机系统的可靠度0.9931","E":"人机安全性取决于功能分配的合理性、机械本质安全性"},"answer":["B","D"],"explanation":"A选项错误：人的可靠度R1=1×0.98×0.95=0.931；B选项正确、C选项错误：人机系统属于自动化系统，在人机关系中机械为主体，依靠信号的闭环传递实现操控，人作为监视者和管理者；D选项正确：人机系统可靠度=1-（1-0.9）×（1-0.931）=0.9931；E选项错误：人机系统的安全性取决于机器的本质的冗余化设计、人低负荷时的应急反应。","explanationImages":[],"material":"根据案例背景—情景描述，回答21-25问题大型物流单位构建连接生产端与消费端的主动脉，通过规模化的运输调度和智能化的路径优化，显著降低了单位商品的 理的可靠度0.95；此外，机械的可靠度定义为0.9。正常状态，人机系统工作方式如下：","materialImages":[{"src":"../assets/ccd814eb670b72affc8a9c15.png","alt":"第1套原题21原卷配图","width":383,"height":175}],"optionImages":{"A":[{"src":"../assets/86a4986baad638a7dc9ca19c.png","alt":"第1套原题25原卷配图","width":131,"height":104}],"B":[{"src":"../assets/ad14533bd6dec3abc98aec7a.png","alt":"第1套原题25原卷配图","width":104,"height":104}],"C":[{"src":"../assets/c19369f9b0b9f1212a64656c.png","alt":"第1套原题25原卷配图","width":109,"height":104}],"D":[{"src":"../assets/39ea2e74c69ed7d19bfce342.png","alt":"第1套原题25原卷配图","width":100,"height":104}],"E":[{"src":"../assets/3db60c69fbde81cb0e40e13a.png","alt":"第1套原题25原卷配图","width":105,"height":104}]}},{"id":"p1-26","paper":1,"number":26,"topic":"事故辨识与检维修","type":"short","images":[],"stem":"案例2 · 简答题","material":"案例二：锅炉是典型的热传递设备，引领人类将燃料化学能高效转化为热能并进一步驱动机械做功的技术变革，为现代工业、电力生产和集中供热奠定了核心基础。但是，看似成熟的工业设计体系却暗藏诸多安全风险，监管、运行、维护不当都会导致严重的安全事故。因此，下列案例背景以中国企业为核心主导的南亚某大型工业园区为例进行详细阐述，涉及部分名称、工艺、设备等特征数值进行模糊处理，不涉及任何保密要求。注释：涉及保密要求切忌对号入座，考生应按照国内标准执行。园区致力于构建新型产业产能模式，围绕基础核心产能，依托服务型企业打通并整合全产业链，最终形成完整的内循环生态产业闭环。服务性企业A主要保证园区电力、蒸汽、热水、循环冷却水的供应，同时能够提供压力容器介质的转运管理（包括但不限于液氨、天然气等）、三废排放处理及检维修队伍常驻园区的深层次服务，实现对生产工艺功能的全方位支撑。企业2#锅炉机组属于高效燃油炉投产超过十年但期间工艺工况稳定，废液经过稀释剂处理后由高压空气泵入炉膛，在高压空气的强剪切力作用下形成毫米级雾滴保障燃烧传热效率。运行中，现场作业人员反馈烟道部分燃烧形成明焰，通过烟道的灭火装置和蒸汽吹扫设备并未压灭火焰最终紧急停炉。经过对烟道及相关设备修复检测后尝试点火并炉，对设备进行检查后正常上水点火，但由于空气预热器及送风设备等原因未能正常引燃，再次点火期间发生炉膛爆炸。事故共导致两人死亡、八人失联且上百人送医，据当地居民表示事发时距爆炸点3.5km外存在明显震感且门窗玻璃破损。为厘清事故原因，针对锅炉近期全过程进行复盘查验：半年前，按要求进行周期性停炉检修，由企业维修部、设备部和安全管理部共同负责。其中，灭火装置采用ABC干粉联用卤代烷灭火剂提高灭火施救效率，但是卤代烷灭火剂驱动气、灭火剂气均不具备足够压力。由于设备交接验收工作不到位导致事故期间未能正常启动。查阅检查及整改记录显示，采用中国人师傅带徒弟的方式且重要岗位尽量设置富有经验的中国监管人员。期间，监管人员多次反馈作业人员隐患意识、操作能力和应急施救能力严重不足，且安全员连最基本的隐患辨识都不具备。检查期间发现：\n（1）灯具、探测器的防爆形式选择不当；\n（2）喷砂机的压力罐存在严重变形；\n（3）擅自将气瓶带入有限空间且氧气瓶、乙炔气瓶间距不足；\n（4）未按要求设置安全标志；\n（5）具有协同报警功能探测器，声压强度不足被现场噪音遮盖；\n（6）电焊用防弧光眼镜设置严重不足；\n（7）高压蒸汽管道未按要求设置保温层且距出入口间距不足；\n（8）探伤作业未设置必要的警戒隔离；\n（9）落地式砂轮机防护罩开口过大、防振阻尼装置损毁。依据上述案例背景，回答下列问题（22分）","parts":[{"number":1,"prompt":"锅炉烟道燃烧属于什么事故并简述事故预防措施。","referenceAnswer":"尾部烟道二次燃烧。\n（1）提高燃烧效率，减少锅炉启停次数；\n（2）加强尾部受热面的吹灰；\n（3）保证烟道门孔和烟道挡板的密封良好；\n（4）锅炉的尾部烟道装设灭火装置。","referenceImages":[]},{"number":2,"prompt":"参照GB13861辨识作业面的物理性危险有害因素及致害物。","referenceAnswer":"（1）设备、设施、工具、附件缺陷：设备选型不当、压力罐变形；\n（2）防护缺陷：间距不足；\n（3）信号缺陷：报警功能探测器声压级强度不足；\n（4）标志标识缺陷：未按要求设置安全标志；\n（5）电危害：电气设备、供电线缆；\n（6）噪声：喷砂除锈设备、砂轮机产生噪声；\n（7）振动危害：喷砂除锈设备、砂轮机产生振动；\n（8）运动物危害：抛射物、飞溅物、坠落物、气流等；\n（9）电离辐射：探伤作业辐射源；\n（10）非电离辐射：电焊作业的弧光；\n（11）高温物质：焊渣、打磨碎屑；\n（12）其他物理性危险和有害因素。","referenceImages":[]},{"number":3,"prompt":"为避免同类事故，简述设备交接时确认项目。","referenceAnswer":"（1）锅炉检修质量符合要求；\n（2）按照施工文件、作业方案完成检修作业；\n（3）锅炉受压面完整性、密封性能；\n（4）试压及气密性试验结果符合要求；\n（5）临时拆除的安全设施及安全附件全部恢复；\n（6）能量隔离措施恢复至正常生产备用状态；\n（7）上水泵等设备试车情况良好；\n（8）自动化仪表等设施完成检验或调试。","referenceImages":[]},{"number":4,"prompt":"简述检修作业前的安全交底的内容要求。","referenceAnswer":"（1）检修作业/有限空间作业的法律法规及标准规范；\n（2）检修作业面危险有害因素辨识及控制措施；\n（3）锅炉检修作业方案及工期安排；\n（4）作业面涉及烟气、有毒气体的理化性质及作业环境；\n（5）锅炉检修作业的正常操作条件及注意事项；\n（6）锅炉的吹扫、通风情况；\n（7）个体防护装备的配备与使用方法；\n（8）应急处置措施、自救互救、急救方法及安全疏散要求。","referenceImages":[]}]},{"id":"p1-27","paper":1,"number":27,"topic":"粉尘防爆与隐患治理","type":"short","images":[],"stem":"案例3 · 简答题","material":"国内的粮食安全政策强调以我为主、立足国内的根本原则，与很多依赖国际市场或受国内结构性问题困扰的国家形成了鲜明对比，并在确保口粮安全、维持市场稳定及保护农田基础方面展现出显著优点。在全阶段寿命安全管理中，加工储运系统防爆安全属于重中之重。经过粉碎碾磨后的粉料通过正压风床输送至粉料散存仓，由于设备密封性失效导致车间瞬间弥漫白色粉末扬尘，车间主任见状立即关闭正压风床通过现场状况查验决定执行清理作业：\n（1）不关闭碾磨设备，降低输送风压转送至临时粉料锥形舱；\n（2）保持低速工作模式下，打开端墙上的直灌式送风设备；\n（3）采用燃油举升机完成粉料抬升作业提高工作效率；\n（4）切断控制室、配电间电气联锁，避免触发粉尘联锁状态；清理作业期间发生爆炸事故，导致现场三名作业人员当场死亡、控制室内的车间主任和班长严重烧伤，现场设备由于爆炸碎片的毁伤作用修复难度极大。事故发生后，针对现场检查期间发现下列情况：\n（1）滤袋采用耐高温材质，保持烟气流稳定防止扰动扬尘；\n（2）除尘器未按要求设置风压差检测报警装置；\n（3）除尘器灰斗未按要求设置锁气泄灰装置；\n（4）除尘系统单独采用隔爆措施；\n（5）除尘系统未按要求设置灰斗温度检测报警装置；\n（6）打包间、清理间防爆灯具选型不当，距粮面不足300mm；\n（7）地面未按要求进行防静电消火花处理；\n（8）未按规范要求正确划分爆炸性分区。查阅企业安全管理文件，现场爆炸性分区划分大致如下：\n（1）粉碎间、碾磨间定义为爆炸性20区；\n（2）配料间、配粉间和粉料散存仓，划分为爆炸性21区；\n（3）封闭式输送廊道、卸粮坑内部属于爆炸性20区；\n（4）风机送风口、排风口，均划分为22区；\n（5）敞开式楼梯间、控制室，划分为爆炸性22区。依据上述案例背景，回答下列问题（22分）：","parts":[{"number":1,"prompt":"依照重大事故隐患判定依据，粉尘涉爆区域是否构成重大事故隐患，如果是请指出判定依据。","referenceAnswer":"粉尘设备区域构成重大事故隐患。\n（1）粉尘爆炸场所内设有办公室、休息室等人员聚集场所的；\n（2）木质粉尘的干式除尘系统未设置锁气卸灰装置的。","referenceImages":[]},{"number":2,"prompt":"参照规范《生产安全事故分类与编码》、《生产安全事故报告和调查处理条例》确认清理事故类别，并据此完善车间内应急物资柜应设置的应急物资。","referenceAnswer":"按照《生产安全事故分类与编码》属于粉尘爆炸；按照《生产安全事故报告和调查处理条例》属于较大事故。火灾和物质爆炸—防高温救援服、干粉灭火器、消防沙；高处坠落和物体打击—安全绳、安全带和安全帽；触电—绝缘手套、绝缘鞋和绝缘衬垫。其他伤害（通用性应急物资）—生命体征探测器、可燃气体探测器、有毒气体探测器、医疗急救箱、应急照明设备、通讯联络设备（对讲机）、洗消设备（洗眼器）和破拆工具。","referenceImages":[]},{"number":3,"prompt":"依照规范《粮食加工、储运系统粉尘防爆安全规范》，指正企业爆炸性分区的划分定义。","referenceAnswer":"（1）粉碎间、碾磨间，划分为爆炸性21区；\n（2）粉料散存仓，划分为爆炸性20区；\n（3）封闭式输送廊道，划分为爆炸性21区；\n（4）送风口通常设置在非爆炸危险区；\n（5）敞开式楼梯间、控制室，划分为非爆炸危险区。","referenceImages":[]},{"number":4,"prompt":"参照静电防护规程、防爆泄压设计规范，简述粮食加工企业应采取的防火防爆安全措施。","referenceAnswer":"设置除尘设备、粉尘浓度探测报警系统、防爆型电气设备、严禁使用铁质器具、采用铜铝等有色金属代替、设置静电接地、人体静电导出装置、设备间的等电位联结、空气增湿。火灾自动报警系统、自动灭火系统、消防器材、防爆泄压设施。","referenceImages":[]}]},{"id":"p1-28","paper":1,"number":28,"topic":"重大危险源与安全管理","type":"short","images":[{"src":"../assets/28be3cbf501000b9ed56b326.png","alt":"第1套原题28原卷配图","width":554,"height":123}],"stem":"案例4 · 简答题","material":"具有战略枢纽、经济物流中心的C地区，素有承东启西、连南接北的说法，因此依照其核心意图，拟新建配套大型石油库转运中心，作为南部、东南部区域的战略后方保证油品物资供应。同时，依托当地丰沛的水能资源、矿物资源，实现经济物流的灵活调控，提升区域能源安全与产业链韧性。作为战略能源单位下属的大型石油库，主要储存汽油、柴油、石脑油、航空煤油、石油醚等高经济附加值轻质油品，共设六大功能性分区下辖32个储区、8座仓库。C地区由于丰富的水能、矿物质资源属于多雷发区域且复杂的水文地质条件给初期设计工作带来极大的不确定性。其中，新建1#库区是最典型区域，库区共设置三种介质储罐分别是汽油罐、航空煤油罐和石脑油罐，具体设计参数见下表：装置区建成正式投产前进行安全评价，在划分评价单元后采用安全检查表—危险和可操作性分析对设备及重要工艺节点进行偏差分析，并据此判定现有技术管控措施的完整性，对达不到安全要求的评价对象明确提出整改措施建议。参照评价结论：\n（1）安全监控系统不符合规定，尤其封闭管理、事故预防方面；\n（2）安全生产规章制度、操作规程未严格参照现有规范标准体系，未健全异常工况处置体系；\n（3）安全包保责任制的制定落实不到位。按照要求制定异常工况处置规程和异常工况处置卡，制定中由总经理牵头任命安全部全体成员在部门经理的带领下参与具体的起草编制，经过法务部门的合法性审核后由部门经理签发并进行全体人员教育培训后正式执行。通过验证性应急演练发现，异常工况处置方案不具备可执行性，表现在：\n（1）未明确具体辨识方法及判定标准依据；\n（2）各部门协调不到位，易发生逆流导致踩踏事故；\n（3）工况处置方案及协同作业方式配置不合理；\n（4）未明确初期事故辨识情况。任命李某为新建轻质油储区的操作负责人对重大危险源的技术管理、运行操作负责，按要求将责任人的履职情况录入双重预防机制数字化系统。李某按要求每半年完成重大危险源安全风险隐患排查任务，排查清单但不限于包括：\n（1）检查涉及重大危险源的外来施工单位及人员有无违章行为；\n（2）检查重大危险源的设备设施是否完好；\n（3）检查应急设施、应急装备、应急器材、消防设施是否完好。依据上述案例背景，回答下列问题","parts":[{"number":1,"prompt":"计算判定重大危险源的分类定级，并完善应设置的监控设施。","referenceAnswer":"属于二级重大危险源。危险化学品重大危险源安全监控系统包括基本过程控制系统、安全仪表系统、气体检测报警系统、电视监视系统、雷电预警系统、接地电阻监测系统中的一个或多个。","referenceImages":[{"src":"../assets/58850a46f3199a9c4f88cc2d.png","alt":"第1套原题28原卷配图","width":554,"height":89}]},{"number":2,"prompt":"按照AQ3072指出包保责任制落实中的不当之处简述包保事项。","referenceAnswer":"（1）操作负责人不负责重大危险源的技术管理；\n（2）操作负责人应每周完成安全风险隐患排查任务。督促检查各岗位执行重大危险源安全生产规章制度和操作规程的情况；对涉及重大危险源的特殊作业、检维修作业等进行监督检查，督促落实作业安全风险管控措施；每周至少组织一次重大危险源安全风险隐患排查；采取措施消除重大危险源事故隐患。","referenceImages":[]},{"number":3,"prompt":"改造项目建成后的评价属于哪个阶段的评价并根据《安全验收评价导则》，说明安全评价机构应收集哪些相关资料？","referenceAnswer":"验收评价。概述、设计依据、设计文件、生产系统及辅助系统生产及安全生产说明、危险有害因素分析所需资料、安全技术和安全管理的措施资料、安全机构设置及人员配置、安全专项投资及使用情况、安全监测和检验测定的数据资料、特种设备使用、特种作和从业许可、安全验收评价所需的其他资料。","referenceImages":[]},{"number":4,"prompt":"请简述重大危险源重大危险源安全包保公示牌应包括的内容。","referenceAnswer":"企业应设立重大危险源安全包保公示牌，公示牌信息应包括主要负责人、技术负责人、操作负责人的姓名、职务、对应的安全包保责任及联系方式。","referenceImages":[]},{"number":5,"prompt":"分析判定异常工况处置方案不具可执行性的原因及措施。","referenceAnswer":"（1）处置方案单独由安环部起草不符合要求，由负责安全生产管理部门或相关职能部门负责起草；\n（2）未按要求通过会签，应征得相关部门或员工的意见建议；\n（3）仅通过合规性审查不符合要求，技术性较强应邀请专家；\n（4）签发流程不当，全局性管理制度应由主要负责人签发；\n（5）未明确发布方式，应采用固定的方式进行发布；\n（6）培训目标未明确，应组织相关人员进行考试；\n（7）未按要求进行及时的反馈和持续改进。","referenceImages":[]}]},{"id":"p2-26","paper":2,"number":26,"topic":"氨制冷与应急预案","type":"short","images":[],"stem":"案例2 · 简答题","material":"案例背景—情景描述G公司是一家食品加工企业，共有从业人员340人，主要生产冷冻食品，下设生产车间、冷藏库、冷冻库、氨制冷机房、配电室、办公楼、食堂、锅炉房、液化气瓶间等。氨制冷车间内液氨储罐、氨制冷压缩机、冷凝器之间通过不同管径的压力管道（GC1等级）相连接。G公司委托H安全评价机构对液氨储罐进行安全评估，确定液氨储罐构成2级重大危险源并撰写了安全评估报告。G公司按规定向当地县级应急管理部门进行了重大危险源的备案。2024年5月，按照压力管道定期检验要求，G公司组织对氨制冷车间压力管道进行了全面检查，具体情形如下：①供液管道耐压强度校核不合格；②排气管道单个焊接头未熔合长度为焊接接头长度的20%；③管道咬边深度不超过3mm；④ 管道安装位置不符合要求， 受条件限制无法调整，对管道安全运行影响不大；⑤管道材质不明，强度校核不合格；⑥管道本身原因泄漏性试验不合格；⑦管道支吊架出现异常；⑧管道组成件出现泄漏，影响管道安全使用；⑨管道阀门砂眼，经堵漏后仍有轻微泄漏，但不影响使用。G公司氨制冷机房为单层建筑，面积为500m2，划分为一个防火分区。其周围设置净宽度和净高度均不小于4m的消防通道，与附近办公楼距离20m。氨制冷机房与冷库贴邻建造，采用耐火极限不低于3.00h的防火隔墙分隔。氨制冷机房设置一个安全出口，安全出口采用平开门，向机房内开启。2024年11月，G公司氨制冷机房发生氨气泄漏，由于建筑防火设计不合理，3人未能及时疏散，分别出现不同程度的中毒现象，其中2人就医无效死亡。事故发生后，G公司针对氨制冷机房进行整改，并重新编制了氨制冷机房的专项应急预案。根据以上场景，回答下列问题：","parts":[{"number":1,"prompt":"简述H安全评价机构撰写的重大危险源安全评估报告的内容。","referenceAnswer":"简述H安全评价机构撰写的重大危险源安全评估报告的内容。\n（1）评估的主要依据；\n（2）重大危险源的基本情况；\n（3）事故发生的可能性及危害程度；\n（4）个人风险和社会风险值（仅适用定量风险评价方法）；\n（5）可能受事故影响的周边场所、人员情况；\n（6）重大危险源辨识、分级的符合性分析；\n（7）安全管理措施、安全技术和监控措施；\n（8）事故应急措施；\n（9）评估结论与建议。","referenceImages":[]},{"number":2,"prompt":"辨识G公司氨制冷车间压力管道安全等级状况属于4级的情形。","referenceAnswer":"辨识G公司氨制冷车间压力管道安全等级状况属于4级的情形。\n（1）供液管道耐压强度校核不合格；\n（2）管道材质不明，强度校核不合格；\n（3）管道本身原因泄漏性试验不合格；\n（4）管道组成件出现泄漏，影响管道安全使用。","referenceImages":[]},{"number":3,"prompt":"根据《氨制冷企业安全规范》（AQ 7015），指出氨制冷车间建筑防火设计上的不合理之处。","referenceAnswer":"根据《氨制冷企业安全规范》（AQ 7015），指出氨制冷车间建筑防火设计上的不合理之处。\n（1）氨制冷机房与附近办公楼距离20m，不合理。氨制冷机房与民用建筑的防火间距不应小于25m。\n（2）氨制冷机房与冷库贴邻建造，采用耐火极限不低于3.00h的防火隔墙分隔，不合理。氨制冷机房及其控制室与加工间、冷库或仓库库房贴邻建造时，应采用不开门窗洞口的防火墙分隔，且氨制冷机房及其控制室屋面板耐火极限不应低于1.00h。\n（3）氨制冷机房设置一个安全出口，不合理。氨制冷机房每个防火分区不应少于2个安全出口，且两个安全出口最近边缘之间的水平距离应不小于5m。\n（4）安全出口采用平开门，向机房内开启，不合理。氨制冷机房及其控制室和变配电所安全出口的门应采用平开门，并向疏散方向开启。","referenceImages":[]},{"number":4,"prompt":"简述应及时修订应急预案的情形。","referenceAnswer":"简述应及时修订应急预案的情形。\n（1）依据的法律、法规、规章、标准及上位预案中的有关规定发生重大变化的；\n（2）应急指挥机构及其职责发生调整的；\n（3）安全生产面临的风险发生重大变化的；\n（4）重要应急资源发生重大变化的；\n（5）在应急演练和事故应急救援中发现需要修订预案的重大问题的；\n（6）编制单位认为应当修订的其他情况。","referenceImages":[]}]},{"id":"p2-27","paper":2,"number":27,"topic":"粉尘防爆与隐患治理","type":"short","images":[],"stem":"案例3 · 简答题","material":"案例背景—情景描述C公司是一家小型食品配料生产企业，主要生产食品添加剂、调味料等。C公司租用一座砖混结构的二层建筑作为生产厂房，占地面积约为1100㎡。二层设置有发电机房、风机房等辅助生产用房，产品研发室，车间检化验室及人员临时办公室。一层自西向东分别为成品库房、生产车间及原料库房，分别设置在三个防火分区内，其除尘系统将含尘废气通过一根管道排至室外。C公司的生产工艺主要是利用混合机将各种原材料按比例均匀混合后包装，生产过程不存在温度、压力等特殊条件，产品生产过程为纯物理混合过程。生产原料主要有小麦粉、食用玉米淀粉、氧化淀粉、食用盐、食品添加剂、香辛料等，通过配料、筛选、混合后制成不同产品，经包装、检验后产品入库。生产车间内的主要设备包括卧式混合设备、立式混合设备及半自动分体包装机。2025年2月15日13时许，C公司发生一起粉尘爆炸事故，造成5人死亡，直接经济损失约840万元。位于生产车间中部的立式混合设备在混合搅拌过程中，因罐内进入金属碎片与罐体摩擦形成点火源，导致罐内淀粉等物料发生爆炸，爆炸引发生产车间内积聚的淀粉、浆粉等物料形成粉尘云，继而发生二次爆炸。C公司在没有论证实施方案安全性和采取安全防护措施的情况下，自行安装、改造、使用立式混合设备。作业前，施工项目部针对作业面情况进行检查确认：\n（1）灯具、探测器的防爆形式选择不当；\n（2）喷砂机的压力罐存在严重变形；\n（3）未按要求设置安全标志；\n（4）协同报警功能探测器，声压级强度不足被现场噪音遮盖；\n（5）电焊用防弧光眼镜设置严重不足；\n（6）高压蒸汽管道未按要求设置保温层且距出入口间距不足；\n（7）落地式砂轮机防护罩开口过大、防振阻尼装置损毁。事故调查发现，C公司现场管理混乱，爆炸现场发现有氧气、乙炔气等气瓶混存，生产车间存放有角磨机等工具，生产用设备设施均未采用防爆设计，包材库存放打印机、电焊机等物品。查阅资料得知，C公司未制定粉尘防爆安全管理制度，未采取监测、报警和泄爆、抑爆等安全措施，在易产生机械点火源的工艺设备前，未设置铁、石等杂物去除装置，未针对粉尘爆炸风险组织相应的安全教育培训。C公司未设置安全生产管理岗位，日常安全事项由各班组长口头告知、提醒。县级应急管理部门对C公司进行处罚，并要求其落实事故整改和防范措施。根据以上场景，回答下列问题。","parts":[{"number":1,"prompt":"根据《工贸企业重大事故隐患判定标准》，辨识C公司存在的重大事故隐患。","referenceAnswer":"根据《工贸企业重大事故隐患判定标准》，辨识C公司存在的重大事故隐患。\n（1）C公司租用一座砖混结构的二层建筑作为生产厂房，粉尘爆炸危险场所设置人员办公室等人员密集场所。\n（2）成品库房、生产车间及原料库房，分别设置在三个防火分区内，其除尘系统将含尘废气通过一根管道排至室外，不同防火分区共用一套除尘系统。\n（3）生产用设备设施均未采用防爆设计，除尘器、收尘仓等划分为20区的粉尘爆炸危险场所电气设备不符合防爆要求。\n（4）在易产生机械点火源的工艺设备前，未设置铁、石等杂物去除装置。\n（5）未制定粉尘清理制度，现场积尘严重。\n（6）未采取监测、报警和泄爆、抑爆等安全措施，干式除尘系统未采取泄爆、惰化、抑爆等任一种爆炸防控措施。","referenceImages":[]},{"number":2,"prompt":"分析C公司粉尘爆炸事故原因。","referenceAnswer":"分析C公司粉尘爆炸事故原因。\n（1）直接原因：立式混合设备在混合搅拌过程中，金属碎片与罐体摩擦形成点火源，导致罐内淀粉等物料发生爆炸，爆炸引发生产车间内积聚的淀粉、浆粉等物料形成粉尘云，继而发生二次爆炸。\n（2）间接原因：未制定相关安全生产规章制度和操作规程，缺少粉尘防爆安全管理制度；安全教育培训不到位，未针对粉尘爆炸风险组织相应的安全教育培训；安全生产检查和事故隐患排查不到位，现场管理混乱；未配备安全生产管理人员，专门负责企业的安全生产管理工作；未履行安全设施“三同时”的规定，对其安全生产条件和设施进行综合分析；未掌握新设备安全技术特性，未制定工作方案，未采取安全保护措施，自行组装调试设备并进行试生产。","referenceImages":[]},{"number":3,"prompt":"列出C公司生产车间应设置的安全装置。","referenceAnswer":"列出C公司生产车间应设置的安全装置。防爆通风系统，防爆除尘系统，粉尘浓度监测报警装置，静电接地装置，人体静电导除装置，安全监控系统，火灾自动报警系统，自动灭火系统，消火栓系统，灭火器材，泄爆装置，抑爆装置，隔爆装置，建筑泄压设施。","referenceImages":[]},{"number":4,"prompt":"参照GB13861辨识改造作业面的物理性危险有害因素及致害物。","referenceAnswer":"参照GB13861辨识改造作业面的物理性危险有害因素及致害物。\n（1）灯具、探测器的防爆形式选择不当；\n（2）喷砂机的压力罐存在严重变形；\n（3）未按要求设置安全标志；\n（4）协同报警功能探测器，声压级强度不足被现场噪音遮盖；\n（5）电焊用防弧光眼镜设置严重不足；\n（6）落地式砂轮机防护罩开口过大、防振阻尼装置损毁。","referenceImages":[]}]},{"id":"p2-28","paper":2,"number":28,"topic":"吊装作业与特殊作业","type":"short","images":[{"src":"../assets/a1a805be4cf435789510caf4.png","alt":"第2套原题28原卷配图","width":1401,"height":910}],"stem":"案例4 · 简答题","material":"案例背景—情景描述2025年某市高新区智能制造产业园加油加气母站防火堤内新增汽油调和罐，将相关设备安装施工作业交由施工单位X，采用倒装固定期间发生一起起重机械吊装事故。介于设备自重和结构特性导致单台起重机无法满足安装需求，拟采用双机抬吊递送法作业，由250t履带式起重机作为主机负责上端主吊点、50t轮胎起重机作为副机负责底部配合递送。为保证吊装作业安全，加油加气站和施工单位签订承包合同并在合同附件中约定双人责任体系，施工单位项目负责人李某负责作业过程全程管理。加油加气站安全专工王某、施工单位安全专工赵某任作业监护人分别负责作业面协调、作业面监管。在递送过程中，主机操作员未能根据副机的回转速度及时调整自身起升速度，导致两台起重机升降速度与旋转速度严重不同步。加之起重机支腿处地基未做充分加固处理，在超载工况下发生不均匀沉降，最终整台起重机向一侧倾覆，倾倒的起重臂砸中下方一名信号指挥工，另有两人被飞溅构件击伤。事故共造成1人死亡、2人受伤，直接经济损失约320万元。针对此次事故暴露出的问题，相关部门提出了明确的防范措施，采用双机抬吊递送法作业必须由专业人员编制详细技术方案并严格审批。检查现场的吊装作业票依据上述案例背景，回答系列问题：","parts":[{"number":1,"prompt":"按照《生产安全事故分类与编码》、《特种设备事故报告和调查处理规定》判定本次事故类别并确认事故调查组织部门。","referenceAnswer":"按照《生产安全事故分类与编码》、《特种设备事故报告和调查处理规定》判定本次事故类别并确认事故调查组织部门。按照《生产安全事故分类与编码》，属于起重致害；按照《特种设备事故报告和调查处理规定》，属于较大事故。特种设备较大事故由省级级人民政府负责特种设备安全监督管理的部门（即市市场监督管理局）会同有关部门组织事故调查组进行调查。","referenceImages":[]},{"number":2,"prompt":"参照《起重机械 作业检查与维护管理规定》简述吊装作业方案的基本内容。","referenceAnswer":"参照《起重机械 作业检查与维护管理规定》简述吊装作业方案的基本内容。\n（1）作业前，检查起重机械的工作状态，检查吊具、吊索等；\n（2）作业前，检查起重机械安全附件和防护装置的完整性；\n（3）作业前，检查作业人员劳动防护用具的配置使用情况；\n（4）作业前，检查作业人员作业资质及教育情况；\n（5）作业中，严禁擅自调整参数，不得带载增加作业幅度；\n（6）作业中，任何情况均不得超过起重量、极限力矩；\n（7）作业中，操作人员不得擅离作业面；\n（8）作业中，操作人员站在安全防护区，不得在吊具和被吊重物正下方；\n（11）作业结束后，清理检查作业面，关闭设备总电源；\n（12）设备异常状态，立即停止设备的工作状态。","referenceImages":[]},{"number":3,"prompt":"参照规范《大中型企业安全生产标准化管理体系要求》阐述企业人员管理需求。","referenceAnswer":"参照规范《大中型企业安全生产标准化管理体系要求》阐述企业人员管理需求。\n（1）人员准入，明确准入制度和任职资格；\n（2）安全培训，定期培训提供师资、场地、设备等资源；\n（3）行为管控中的行为观察，通过统计分析预防不安全行为；\n（4）行为管控中的安全行为激励，引导养成良好的行为习惯；\n（5）行为管控中的不安全行为管控，制止不安全行为并进行教育纠正。","referenceImages":[]},{"number":4,"prompt":"参照规范《危险化学品企业特殊作业安全规范》指正作业票的不当之处。","referenceAnswer":"参照规范《危险化学品企业特殊作业安全规范》指正作业票的不当之处。\n（1）风险辨识不到位，存在物体打击、坠落危险；\n（2）交底人、被交底人应签字确认；\n（3）作业前安全措施确认人应由安全专工王某负责；\n（4）安全交底应由项目负责人李某实施；\n（5）未注明作业持续时间；\n（6）安全措施项不全，未检查物资落实情况。","referenceImages":[]},{"number":5,"prompt":"参照规范《危险化学品企业特殊作业安全规范》简述作业前安全技术交底的内容。","referenceAnswer":"参照规范《危险化学品企业特殊作业安全规范》简述作业前安全技术交底的内容。\n（1）吊装作业相关的法律法规及标准规范；\n（2）作业面危险有害因素辨识及控制措施；\n（3）吊装人员、监护人员的岗位职责和操作技能；\n（4）安全设施的使用和维护方法；\n（5）个体防护装备的配备与使用方法；\n（6）紧急情况下自救互救、急救方法及安全疏散要求；\n（7）起重致害、物体打击事故后现场紧急情况的处理；\n（8）典型事故案例分析。","referenceImages":[]}]},{"id":"p3-2","paper":3,"number":2,"topic":"电气与机械安全","type":"single","images":[],"stem":"剪板机属于压力机械的一种，通过刀架的往复直线运动实现板材的尺寸断裂分离。下列关于剪板机安全要求的各项说法中，正确的是（）。","options":{"A":"剪板机前工作台不应延伸到保护区域以外","B":"可调整的前托料和后挡料能将其调整到刀口下方","C":"除配备后托料，后挡料的设计不允许将后挡料调整到刀口之间","D":"单次循环模式刀架和压料脚只能工作一个行程"},"answer":["D"],"explanation":"A选项错误：剪板机前工作台应延伸到保护区域以外；B选项错误：可调整的前托料和后挡料不能将其调整到刀口下方；C选项错误：即使配备后托料，后挡料的设计也不允许将后挡料调整到刀口之间；D选项正确：选择单次循环操作后，即使控制装置持续有效,刀架和压料脚也只能工作一个行程。","explanationImages":[]},{"id":"p3-3","paper":3,"number":3,"topic":"电气与机械安全","type":"single","images":[],"stem":"机械加工作业区的机床设备应合理化布局，按照工作流程兼顾安全需求力求实现本质化安全。某机加工作业区，设有机床参数如下：①机床存在水平主轴呈往复运行，主轴运动极限位置超过机床主体轮廓；②机床最大外形尺寸12m；③机床质量12t。如上陈述，针对上述参数的机床下列检查结论中，符合规范要求的是（  ）。","options":{"A":"机床操作面安全距离1.0m","B":"机床操作面离墙柱安全距离2.0m","C":"属于中型机床，安全距离从主轴极限位置算起","D":"属于大型机床，安全距离从机床安装基础面算起"},"answer":["B"],"explanation":"A选项错误：机床操作面最小安全距离1.5m；B选项正确：机床操作面离墙柱最小安全距离1.8m，2.0m＞1.8m符合要求；C选项错误：属于大型机床，安全距离从主轴极限位置算起；D选项错误：属于大型机床，安全距离从主轴极限位置算起；","explanationImages":[]},{"id":"p3-4","paper":3,"number":4,"topic":"特种设备安全","type":"single","images":[],"stem":"机械式停车装置属于特殊的起重机械，在满足基本要求的同时应考虑其运行条件及工作特点，下列针对机械式停车装置的安全装置的定义，满足要求的是（  ）。","options":{"A":"应设紧急停止开关，异常情况立即停止运转","B":"人车共乘式的汽车专用升降机应设防坠落安全器","C":"应设运转限制装置，车位状况进行检测防堆置重叠","D":"当重量超过额定承载的100%~110%时，应当发出报警信号"},"answer":["A"],"explanation":"A选项正确：应设紧急停止开关，异常情况立即停止运转；B选项错误：人车共乘式的汽车专用升降机应设安全钳和限速器；C选项错误：应设运转限制装置，人员未出设备，设备不能启动运转；D选项错误：当重量超过额定承载的95%时，应当发出报警信号。","explanationImages":[]},{"id":"p3-5","paper":3,"number":5,"topic":"防火防爆","type":"single","images":[],"stem":"某木工加工企业属于典型的粉尘涉爆区域，在木工切割作业车间设置喷漆间用于防腐蚀喷涂，经过安全设计论证喷漆间（爆炸性1区）、切割车间（爆炸性21区）可用同一套除尘净化系统（可靠性论证，不构成重大事故隐患）。针对上述除尘净化系统的管道系统的要求，下列说法正确的是（  ）。","options":{"A":"除尘系统的集尘袋采用防静电阻燃材料","B":"除尘风机采用Ex ia Ⅰ Ma型防爆设备","C":"阻火器的阻火间隙应小于介质的最大安全间隙","D":"风管采用阻火器装置，设置阻爆轰型阻火器"},"answer":["A"],"explanation":"A选项正确：除尘系统的集尘袋采用防静电阻燃材料B选项错误：除尘风机采用Ex ia Ⅰ Ma型防爆设备，不符合要求，上述设备适用于井下甲烷环境；C选项错误：阻火器的最大间隙应不大于介质在操作工况下的最大试验安全间隙。D选项错误：风管中存在爆炸性粉尘积蓄，因此不应采用阻火器装置。","explanationImages":[]},{"id":"p3-7","paper":3,"number":7,"topic":"特种设备安全","type":"single","images":[],"stem":"压力容器的保养是生产经营企业保障安全运行条件的基本措施，也能有效延缓设备腐蚀，保障设备的安全完整性。下列关于压力容器维护保养的说法中，正确的是（  ）。","options":{"A":"局部保温层、防腐蚀涂层破损，可继续使用","B":"氧气或其他强氧化性气体，使用中应经常排除容器中的积水","C":"承载压缩天然气的钢制容器，使用中需采取酸洗、干燥的方法","D":"安全附件和检测元件，应定期维护并根据需要校正"},"answer":["B"],"explanation":"A选项错误：防腐蚀涂层破损，不可继续使用；B选项正确：氧气或其他强氧化性气体，使用中应经常排除容器中的积水；C选项错误：承载压缩天然气的钢制容器，使用中需采取碱洗、干燥的方法；D选项错误：安全附件和检测元件，应定期维护和校正。","explanationImages":[]},{"id":"p3-8","paper":3,"number":8,"topic":"危险化学品安全","type":"single","images":[],"stem":"危化品生产经营企业由于泄漏导致的二次事故通常是灾难性的，也就是所谓的事故多米诺效应。某油漆生产企业采用石油苯溶剂，但是石油苯有毒、致癌且难以被身体代谢表现出靶器官毒性。针对上述情景，下列属于最有效的化学中毒、污染事故预防控制措施的是（  ）。","options":{"A":"采用氯苯代替苯溶剂","B":"苯储罐采用氮气密封","C":"将生产设备与操作室实现空间隔离","D":"配置有机蒸汽防护面具"},"answer":["C"],"explanation":"【老师寄语】这种类型的题实际上完全参照2025真题，且为尽量保证本题目的合理性，对比2025真题在题干中增加“最有效的”关键词。A选项错误：属于防爆措施；B选项错误：属于防爆措施；C选项正确。D选项错误：虽然也属于中毒污染事故预防措施，但通常作为最后的屏障不属于最有效的应对措施。","explanationImages":[]},{"id":"p3-9","paper":3,"number":9,"topic":"防火防爆","type":"single","images":[],"stem":"烟花爆竹极具观赏性和娱乐性，是重大节假日庆祝所不可或缺的环节，但是富能基团导致火炸药的稳定性极大制约其使用及生产安全。综上所述，下列关于烟花爆竹生产制造的各项说法，正确的是（  ）。","options":{"A":"引火线应人工制引，并在专用工房操作","B":"引火线制引机应与机械动力装置隔离","C":"烟火药干燥散热时，应及时翻动并收取","D":"三元黑火药制造应将碳、硫磺二元混合后粉碎"},"answer":["B"],"explanation":"A选项错误：引火线应在专用工房内机械制引；B选项正确：引火线制引机应与机械动力装置隔离；C选项错误：烟火药干燥散热时，不应及时翻动并收取；D选项错误：三元黑火药制造应先将碳、硫黄进行二元混合。","explanationImages":[]},{"id":"p3-10","paper":3,"number":10,"topic":"特种设备安全","type":"single","images":[],"stem":"安全泄压装置按照其动作原理、动作方式及工作特点分为可重复启闭型阀式泄压装置、断裂型泄压装置和温度驱动型泄压装置。关于不同类型泄压装置的说法，正确的是（  ）。","options":{"A":"液压传动设备、液化天然气储罐的安全阀安装在液面以下","B":"爆破片的防爆效率取决于其厚度、泄压面积和安装位置","C":"达到规定压力未开启的爆破片，应予以更换","D":"达到规定温度未动作的易熔合金塞，经修整检验后使用"},"answer":["C"],"explanation":"A选项错误：液压传动设备的安全阀安装在液面以下，液化天然气储罐的安全阀安装在气相空间；B选项错误：爆破片的防爆效率取决于其厚度、泄压面积和材质材料；C选项正确：达到规定压力未开启的爆破片立即废弃更换；D选项错误：达到规定温度未动作的易熔合金塞，立即废弃更换。","explanationImages":[]},{"id":"p3-11","paper":3,"number":11,"topic":"防火防爆","type":"single","images":[],"stem":"静电防护是石化企业、工贸企业防火防爆安全措施的重要环节，防止由于静电击穿所导致的燃烧爆炸事故。以爆炸性粉尘环境的饲料加工企业为例，下列防护措施有效的是（  ）。","options":{"A":"悬浮性饲料粉尘，添加抗静电添加剂消解静电","B":"输送物料能产生静电的绝缘管道的金属屏蔽层接地","C":"高绝缘性材料通过静电接地、等电位联结消解静电","D":"为降低罐内物料电位，过滤器不应离注入口过远"},"answer":["B"],"explanation":"A选项错误：悬浮性饲料粉尘，添加抗静电添加剂消解静电是没有静电消解意义的；B选项正确：输送物料能产生静电的绝缘管道的金属屏蔽层接地；C选项错误：高绝缘性材料通过增湿、添加抗静电添加剂消除静电；D选项错误：为降低罐内物料电位，过滤器不应离注入口过近。","explanationImages":[]},{"id":"p3-12","paper":3,"number":12,"topic":"防火防爆","type":"single","images":[],"stem":"爆炸波阵面的超压是导致人员伤亡、建筑结构受损的主要致害因素，通常比爆炸碎片的致死范围更大、比中毒燃烧等衍生事故的致死率更高。某事故面实测波阵面超压25kPa，上述冲击波作用于建筑物、受害者时，表现的伤害类型体现在（  ）。","options":{"A":"大部分砖木结构受到破坏","B":"除坚固的钢筋混凝土建筑外，其余部分全部破坏","C":"玻璃标志物开裂或成大块破裂","D":"人体中等损伤，肝脾包膜下出血"},"answer":["A"],"explanation":"某事故面实测波阵面超压20~30kPa，作用在建筑物导致大部分砖木结构受到破坏、玻璃标志物破裂成小碎片甚至粉碎、人体轻微挫伤和局部心肌撕裂。故本题A选项符合题意，BCD选项错误。","explanationImages":[]},{"id":"p3-13","paper":3,"number":13,"topic":"电气与机械安全","type":"single","images":[],"stem":"保护导体在供电回路中通常用于保护作用，按照设计使用功能分为人工保护导体和自然保护导体。下列各项关于保护导体的设计要求及说法中，正确的是（  ）。","options":{"A":"保护导体干线必须与电源中性点和接地体相连","B":"保护导体包括接地导体、保护接地中性导体和保护联结导体","C":"低压系统中，允许利用流经可燃液体或气体的金属管道做保护导体","D":"保护导体（包括具有保护作用的PEN线）应安装熔断器"},"answer":["A"],"explanation":"A选项正确：保护导体干线必须与电源中性点和接地体相连；B选项错误：保护导体包括接地导体、保护接地导体和保护联结导体；C选项错误：低压系统中，允许利用不流经可燃液体或气体的金属管道做保护导体；D选项错误：保护导体（包括具有保护作用的PEN线）不应安装熔断器和单极开关。","explanationImages":[]},{"id":"p3-19","paper":3,"number":19,"topic":"特种设备安全","type":"single","images":[],"stem":"叉车、蓄电瓶车及非公路用旅游观光车均属于场内专用机动车辆，按照应急管理部事故通报统计分析，场内专用机动车辆事故中尤以违反操作规程导致的事故为主。综上所述，下列各项安全操作的要求中正确的是（  ）。","options":{"A":"司机视线受阻或不良、指挥信号不清时，严禁行驶","B":"叉车蓄电池不要暴露在火花或明火中，以免引起爆炸","C":"叉车叉取重量不明、超载的货物时，应试叉检查稳定性","D":"叉车叉取气瓶等装载不稳的货物时，应采用安全绳加固"},"answer":["B"],"explanation":"A选项错误：司机视线受阻或不良，可以低速倒车行驶；B选项正确：叉车蓄电池不要暴露在火花或明火中，以免引起爆炸；C选项错误：叉车叉取重量不明的货物时，应试叉检查稳定性；严禁超载运输；D选项错误：叉车叉取装载不稳的货物时，应采用安全绳加固；严禁使用叉车叉取气瓶；","explanationImages":[]},{"id":"p3-21","paper":3,"number":21,"topic":"事故辨识与检维修","type":"single","images":[],"stem":"按照案例背景，针对锅炉点火失败事件的下列各项定义分类、原因及应对措施的说法中，符合要求的是（  ）。","options":{"A":"属于水击事故，并炉期间应打开过热器疏水阀避免水击","B":"属于水击事故，并炉期间应做好过热器、蒸汽管道的预热","C":"属于满水事故，点火升压期间应上水至最低水位后停止上水","D":"属于汽水共腾事故，推测可能由于未按要求进行煮炉导致","E":"属于汽水共腾事故，推测可能由于压力下降过快所导致"},"answer":["E"],"explanation":"依照案例背景打开蒸汽锅炉的供气阀并汽瞬间，大量锅水瞬间涌入过热器导致过热器水击损毁属于汽水共腾事故，推测可能由于压力下降过快所导致。故本题E选项符合题意，选项ABCD错误。","explanationImages":[],"material":"锅炉对近现代能源体系的贡献，在于其作为化石能源向热能、机械能与电能转换的核心枢纽，为工业革命提供了稳定可控的动力基础，支撑了全球电力生产与城市集中供热，并以“万能热源”身份深度参与化工、纺织、冶金等基础工业，即便在新能源时代仍以调峰和废弃物消纳的角色发挥不可替代的作用。隐藏的危险同样不容忽视，超压运行、缺水干烧、安全附件失效均可能导致爆炸事故，高温蒸汽泄漏造成灼烫伤害；燃气锅炉若燃烧不完全或燃气泄漏，还易引发爆燃或一氧化碳中毒；长期运行中的腐蚀、结垢与疲劳损伤若未及时发现，则可能演变为突发性灾难事故。因此，锅炉的安全管理始终是工业安全的重中之重。（一）锅炉点火失败事件   以本年度锅炉事故为例，能源单位新建大型煤粉锅炉（锅炉机组150MW）用于褐煤、石煤的高效燃烧并将炉渣用于下游日化和建筑单位。企业为提高燃煤燃烧效率设置磨煤机，利用风流实现粉煤分离和燃料输送。点火升压前，锅炉系统全面检查外观、内部和外部环节无误后上水至正常水位并降低上水量，点火升压期间注意压力上升速度、受热面温度情况等。待过热蒸汽达到预设温度压力后，尝试将新增锅炉并入原设备机组，打开蒸汽锅炉的供气阀并汽瞬间，大量锅水瞬间涌入过热器导致过热器水击损毁。（二）锅炉爆炸现场指挥人员立即下达停炉命令，更换受损的过热器、检查受压面及附件完整性后重新点火，结果点火瞬间爆炸导致现场参与试车的两名作业人员当场死亡，距事发地1.5km外具有明显震感。事故调查报告指出：上次试车在炉膛内残留的粉煤、碳颗粒等颗粒在风流的作用下产生悬浮性扬尘并最终引发爆炸。（三）检查确认事故调查组入驻企业期间发现，企业安全管理松懈对安全认识不足、技术负责人对锅炉工况及运行安全没有清晰认知，甚至部分管理层庆幸事故发生在新法规条文执行前夕。于是，要求企业彻底检查所有在役锅炉机组的安全隐患并逐一落实“一设备一策”的整改方针，其中2#电站锅炉检查期间发现：\n（1）液位报警及联锁保护装置失效；\n（2）锅炉燃料输送管道未按要求设置压力检测装置并形成联锁；\n（3）磨煤机未按要求设置卸灰联锁保护装置；\n（4）主要汽水管道泄漏；\n（5）安全阀频繁起跳。（四）检查确认此外，检查期间发现企业用工不合理，对孕期、经期的女工保护不足，结合现场的用工情况，通过作业情况如下：\n（1）间断负重，每次负重超过25公斤的作业；\n（2）距地面15m处，搭设600mm×400mm跳板的修复作业；\n（3）体力劳动强度指数20的搬运作业；\n（4）工作时长8h，控制室内的操作、控制作业；\n（5）冷水作业分级标准中规定的第二级冷水作业。针对上述案例背景，","materialImages":[]},{"id":"p3-22","paper":3,"number":22,"topic":"事故辨识与检维修","type":"single","images":[],"stem":"参照《特种设备事故报告和调查处理规定》、《生产安全事故分类与编码》和《特种设备安全监察条例》，针对上述案例背景中的事故定性分析结论符合规定的是（  ）。","options":{"A":"按照《生产安全事故分类与编码》，属于粉尘爆炸","B":"按照《生产安全事故分类与编码》，属于锅炉爆炸","C":"按照《特种设备安全监察条例》，属于一般事故","D":"按照《特种设备事故报告和调查处理规定》，事故由市级人民政府牵头调查","E":"按照《特种设备事故报告和调查处理规定》，事故调查报告应报上级人民政府批准"},"answer":["A"],"explanation":"按照《生产安全事故分类与编码》，属于粉尘爆炸；按照《特种设备安全监察条例》，属于较大事故，事故由省级人民政府特种设备监督管理部门牵头调查，事故调查报告应报本级人民政府批准。故本题A选项正确，选项BCDE错误。","explanationImages":[],"material":"锅炉对近现代能源体系的贡献，在于其作为化石能源向热能、机械能与电能转换的核心枢纽，为工业革命提供了稳定可控的动力基础，支撑了全球电力生产与城市集中供热，并以“万能热源”身份深度参与化工、纺织、冶金等基础工业，即便在新能源时代仍以调峰和废弃物消纳的角色发挥不可替代的作用。隐藏的危险同样不容忽视，超压运行、缺水干烧、安全附件失效均可能导致爆炸事故，高温蒸汽泄漏造成灼烫伤害；燃气锅炉若燃烧不完全或燃气泄漏，还易引发爆燃或一氧化碳中毒；长期运行中的 器水击损毁。（二）锅炉爆炸现场指挥人员立即下达停炉命令，更换受损的过热器、检查受压面及附件完整性后重新点火，结果点火瞬间爆炸导致现场参与试车的两名作业人员当场死亡，距事发地1.5km外具有明显震感。事故调查报告指出：上次试车在炉膛内残留的粉煤、碳颗粒等颗粒在风流的作用下产生悬浮性扬尘并最终引发爆炸。（三）检查确认事故调查组入驻企业期间发现，企业安全管理松懈对安全认识不足、技术负责人对锅炉工况及运行安全没有清晰认知，甚至部分管理层庆幸事故发生在新法规条文执行前夕。于是，要求企业彻底检查所有在役锅炉机组的安全隐患并逐一落实“一设备一策”的整改方针，其中2#电站锅炉检查期间发现：\n（1）液位报警及联锁保护装置失效；\n（2）锅炉燃料输送管道未按要求设置压力检测装置并形成联锁；\n（3）磨煤机未按要求设置卸灰联锁保护装置；\n（4）主要汽水管道泄漏；\n（5）安全阀频繁起跳。（四）检查确认此外，检查期间发现企业用工不合理，对孕期、经期的女工保护不足，结合现场的用工情况，通过作业情况如下：\n（1）间断负重，每次负重超过25公斤的作业；\n（2）距地面15m处，搭设600mm×400mm跳板的修复作业；\n（3）体力劳动强度指数20的搬运作业；\n（4）工作时长8h，控制室内的操作、控制作业；\n（5）冷水作业分级标准中规定的第二级冷水作业。针对上述案例背景，","materialImages":[]},{"id":"p3-25","paper":3,"number":25,"topic":"职业卫生与劳动保护","type":"multiple","images":[],"stem":"参照《女职工劳动保护特别规定》，结合企业的用工情况，下列作业中适合女职工但是不适用于经期女工的作业应包括（  ）。","options":{"A":"间断负重，每次负重超过25公斤的作业","B":"距地面15m处，搭设600mm×400mm跳板的修复作业","C":"体力劳动强度指数20的搬运作业","D":"工作时长8h，控制室内的操作、控制作业","E":"冷水作业分级标准中规定的第二级冷水作业"},"answer":["B","E"],"explanation":"A选项错误：间断负重，每次负重超过25公斤的作业，属于女职工禁忌作业，不满足要求；B选项正确：距地面15m处，搭设600mm×400mm跳板的修复作业属于Ⅲ级高处作业，属于女职工能从事但是经期女工禁忌作业，符合题干要求；C选项错误：体力劳动强度指数20的搬运作业，属于二级体力劳动强度，女职工和经期女工均能从事，不符合题干要求；D选项错误：工作时长8h，控制室内的操作、控制作业属于一级体力劳动强度，女职工和经期女工均能从事，不符合题干要求；E选项正确：冷水作业分级标准中规定的第二级冷水作业，属于女职工能从事但是经期女工禁忌作业，符合题干要求。","explanationImages":[],"material":"锅炉对近现代能源体系的贡献，在于其作为化石能源向热能、机械能与电能转换的核心枢纽，为工业革命提供了稳定可控的动力基础，支撑了全球电力生产与城市集中供热，并以“万能热源”身份深度参与化工、纺织、冶金等基础工业，即便在新能源时代仍以调峰和废弃物消纳的角色发挥不可替代的作用。隐藏的危险同样不容忽视，超压运行、缺水干烧、安全附件失效均可能导致爆炸事故，高温蒸汽泄漏造成灼烫伤害；燃气锅炉若燃烧不完全或燃气泄漏，还易引发爆燃或一氧化碳中毒；长期运行中的腐蚀、结垢与疲劳损伤若未及时发现，则可能演变为突发性灾难事故。因此，锅炉的安全管理始终是工业安全的重中之重。（一）锅炉点火失败事件   以本年度锅炉事故为例，能源单位新建大型煤粉锅炉（锅炉机组150MW）用于褐煤、石煤的高效燃烧并将炉渣用于下游日化和建筑单位。企业为提高燃煤燃烧效率设置磨煤机，利用风流实现粉煤分离和燃料输送。点火升压前，锅炉系统全面检查外观、内部和外部环节无误后上水至正常水位并降低上水量，点火升压期间注意压力上升速度、受热面温度情况等。待过热蒸汽达到预设温度压力后，尝试将新增锅炉并入原设备机组，打开蒸汽锅炉的供气阀并汽瞬间，大量锅水瞬间涌入过热器导致过热器水击损毁。（二）锅炉爆炸现场指挥人员立即下达停炉命令，更换受损的过热器、检查受压面及附件完整性后重新点火，结果点火瞬间爆炸导致现场参与试车的两名作业人员当场死亡，距事发地1.5km外具有明显震感。事故调查报告指出：上次试车在炉膛内残留的粉煤、碳颗粒等颗粒在风流的作用下产生悬浮性扬尘并最终引发爆炸。（三）检查确认事故调查组入驻企业期间发现，企业安全管理松懈对安全认识不足、技术负责人对锅炉工况及运行安全没有清晰认知，甚至部分管理层庆幸事故发生在新法规条文执行前夕。于是，要求企业彻底检查所有在役锅炉机组的安全隐患并逐一落实“一设备一策”的整改方针，其中2#电站锅炉检查期间发现：\n（1）液位报警及联锁保护装置失效；\n（2）锅炉燃料输送管道未按要求设置压力检测装置并形成联锁；\n（3）磨煤机未按要求设置卸灰联锁保护装置；\n（4）主要汽水管道泄漏；\n（5）安全阀频繁起跳。（四）检查确认此外，检查期间发现企业用工不合理，对孕期、经期的女工保护不足，结合现场的用工情况，通过作业情况如下：\n（1）间断负重，每次负重超过25公斤的作业；\n（2）距地面15m处，搭设600mm×400mm跳板的修复作业；\n（3）体力劳动强度指数20的搬运作业；\n（4）工作时长8h，控制室内的操作、控制作业；\n（5）冷水作业分级标准中规定的第二级冷水作业。针对上述案例背景，","materialImages":[]},{"id":"p3-26","paper":3,"number":26,"topic":"锂电池火灾与安全管理","type":"short","images":[],"stem":"案例2 · 简答题","material":"案例二：E公司是一家电动汽车用锂离子电池组装和销售企业。E公司租用F公司一栋四层建筑的两层进行电池系统的生产和储存。第二层为电池组装车间，生产过程主要包括模组组装和PACK总装两大阶段，同时伴随着贯穿全流程的严格测试。第四层为电池中转仓库。该建筑的一层租用给G中介公司，三层租用给H电商公司做仓库使用。2024年11月7日7时08分左右，E公司第四层仓库内监控录像拍摄到画面右下角货物有闪光出现，2分钟后出现喷溅火光，火光蔓延扩大并有浓烟冒出，5分钟后火光持续扩大失控，随后画面中断。事发时，E公司安全管理人员张某路过，听到仓库内有类似放鞭炮的声音，随后看到四楼靠近货梯的窗户有烟冒上来，第一时间就跑到四楼查看情况，发现是起火后立即用灭火器救火，火势被灭火器扑灭后又开始复燃，后因浓烟过大张某退到二楼寻找防毒面具和公司保安何某、股东谢某帮忙报警救火。随后，员工周某、林某相继到场协助拿水带救火。7时39分，县级政府专职消防队到达现场救援；10时30分，火势得到控制；11时28分，现场明火扑灭。事故过火面积2062平方米，造成2人死亡，直接经济损失人民币911万元。通过监控视频、现场勘验、检测鉴定和专家分析，事故调查组排除了人为纵火、遗留火种、电气线路故障、雷击等起火原因，最终认定起火原因为锂电池热失控引起火灾蔓延扩大。E公司与F公司签订了承租合同，但未签订安全生产管理协议，F公司从未对E公司的安全生产进行监督检查。E公司日常消防安全管理流于形式，未进行过消防应急培训演练，员工逃生自救能力薄弱。建筑内消防设施停用，并且存在消防通道占用堵塞、安全出口上锁问题，为事故的发生埋下了隐患。根据以上场景，回答下列问题：","parts":[{"number":1,"prompt":"列举锂电池热失控的气体产物（至少四种）。","referenceAnswer":"1.列举锂电池热失控的气体产物（至少四种）。一氧化碳，二氧化碳，氢气，甲烷，乙烯，乙炔。","referenceImages":[]},{"number":2,"prompt":"简述锂电池起火后应采取的应急救援措施。","referenceAnswer":"2.简述锂电池起火后应采取的应急救援措施。\n（1）启动事故应急预案，采取措施进行应急救援。\n（2）按规定向当地有关部门上报事故。\n（3）扑救初期火灾，组织抢救遇险人员。\n（4）检测风向变化，防止毒性浓烟的交叉影响，组织现场及周边人员向上风侧撤离。\n（5）限制事故影响范围，清除周围一切可燃物，划分灭火隔离带。\n（6）设立事故现场的警戒区域，严禁无关人员进入。\n（7）拨打120请求救援，拨打119请求消防救援。\n（8）法律、法规规定的其他应急救援措施。","referenceImages":[]},{"number":3,"prompt":"简述F公司出租厂房应履行的职责。","referenceAnswer":"3.简述F公司出租厂房应履行的职责。\n（1）建立完善承包商安全管理制度；\n（2）对承包商进行资质审查，审查承包商是否具有相应施工资质；\n（3）特种作业人员、特种设备操作人员是否持证上岗；\n（4）进行全员安全教育，向承包商进行作业现场安全交底；\n（5）与承包商签订专门的安全生产管理协议，明确管理职责；\n（6）对承包商的安全作业规程、施工方案和应急预案进行审查；\n（7）对承包商的作业进行全过程监督，定期进行安全检查；\n（8）定期对承包商的安全业绩进行评价，对不能履行安全职责的承包商进行考核直至清退。","referenceImages":[]},{"number":4,"prompt":"根据《电动汽车用动力蓄电池安全要求》（GB 38031—2025），列举锂电池单体安全试验的类别。","referenceAnswer":"4.根据《电动汽车用动力蓄电池安全要求》（GB 38031—2025），列举锂电池单体安全试验的类别。过放电试验，过充电试验，外部短路试验，加热试验，温度循环试验，挤压试验，快充循环后安全试验。","referenceImages":[]}]},{"id":"p3-27","paper":3,"number":27,"topic":"粉尘防爆与风险评估","type":"short","images":[{"src":"../assets/977f4aedfcea3e23ef42968b.png","alt":"第3套原题27原卷配图","width":545,"height":191},{"src":"../assets/a0fe45d070d44c7fab555d98.png","alt":"第3套原题27原卷配图","width":400,"height":188}],"stem":"案例3 · 简答题","material":"案例三：E公司主营人造板、中密度纤维板的生产加工作业。制板车间自东向西依次为：纤维料仓、铺装、预压、输送、热压、翻板、锯边、堆垛、存放，即纤维原料从混合料仓风送到铺装机纤维料仓，经铺装机、预压机预压成型后经运输机送到热压机热压成毛边板，毛边板经纵横锯边机整边后存放养生。成品车间自东向西依次为：砂光、分等、入库。生产车间有两套独立的除尘系统，一套是制板车间的锯边机除尘系统，位于主车间外靠近南墙的西段，用于后处理（锯边）工序的粉尘处理，另一套是成品车间的砂光机除尘系统，即发生事故的除尘系统，与锯边除尘系统相邻，位于其东侧，单独用于砂光机工序的粉尘处理。粉尘仓的粉尘经管道输送至锅炉用作燃料烧掉。县应急管理部门联合相关部门对E公司进行现场监督检查，发现如下问题：E公司规章制度和操作规程不健全，未建立生产车间粉尘清扫制度；安全生产投入不足；砂光机除尘系统未采取爆炸防控措施；生产车间作业现场积聚大量粉尘；E公司没有从业人员安全教育培训的记录；缺少安全警示标志。县应急管理部门下达《整改指令书》，要求E公司完成整改。设备运行期间布袋除尘器破损导致作业面出现爆炸性扬尘，为保证正常生产进度车间主任要求降低生产负荷，处于低负荷状态下要求设备班班组长贾某组织完成设备检维修作业。检修中，因设备隔离措施不到位、作业方式不当导致作业面瞬间闪爆，燃烧爆炸后的火源引燃车间内半成品及成品库内存储的成品，车间燃起大火。事故最终造成6人死亡，3人烧伤，直接经济损失794元。事发后企业为避免同类型事故的频繁发生，应上级部门领导要求针对事故隐患分析并着手进行安全整改，运用工作危害分析方法进行简易型评估（LEC法），LEC赋权标准见下表，带压状态下的检修作业的概率表述为可能，但不经常发生（非必要不进行），检修作业属于连续化工艺，人员暴露的表述为工作时暴露、三名作业人员操作巡检暴露在事故面通常定义为严重伤残。根据以上场景，回答下列问题：","parts":[{"number":1,"prompt":"按照《生产安全事故报告和调查处理条例》对本次事故进行分类，并简述E公司上报事故的内容。","referenceAnswer":"1.按照《生产安全事故报告和调查处理条例》对本次事故进行分类，并简述E公司上报事故的内容。\n（1）按照《生产安全事故报告和调查处理条例》属于较大事故。\n（2）事故报告内容应当包括：\n①事故发生单位概况；\n②事故发生的时间、地点以及事故现场情况；\n③事故的简要经过；\n④事故已经造成或者可能造成的伤亡人数（包括下落不明的人数）和初步估计的直接经济损失；\n⑤已经采取的措施和其他应当报告的情况。","referenceImages":[]},{"number":2,"prompt":"根据《工贸企业重大事故隐患判定标准》，指出E公司存在的重大事故隐患，并说明原因。简述重大事故隐患治理方案的内容。","referenceAnswer":"2.根据《工贸企业重大事故隐患判定标准》，指出E公司存在的重大事故隐患，并说明原因。简述重大事故隐患治理方案的内容。\n（1）未建立生产车间粉尘清扫制度，生产车间作业现场积聚大量粉尘；\n（2）干式除尘系统未采取泄爆、惰化、抑爆等任一种爆炸防控措施的。\n①重大事故隐患治理方案的内容：\n②治理的目标和任务；\n③采取的方法和措施；\n④经费和物资的落实；\n⑤负责治理的机构和人员；\n⑥治理的时限和要求；\n⑦安全措施和应急预案。","referenceImages":[]},{"number":3,"prompt":"简述贾某在检维修作业中的职责要求。","referenceAnswer":"3.简述贾某在检维修作业中的职责要求。\n（1）申领并验证作业票，包括签字落实、时限要求和范围等要求；\n（2）组织工作安全分析，辨识能量隔离、气体环境、坠落等风险；\n（3）检查安全措施落实情况、应急物资的设置情况等。\n（4）核查特种作业人员持证情况；\n（5）现场安全交底，明确危险区域、逃生路线及应急处置程序。\n（6）全程监督作业行为，制止违章操作；\n（7）定期复测和安全巡查，发现异常立即终止作业；\n（8）事故后，启动应急预案组织初期救援；\n（9）作业结束确认，清理检查作业面安全隐患并恢复安全设施。","referenceImages":[]},{"number":4,"prompt":"简述制板车间防爆专项检查的主要内容。","referenceAnswer":"4.简述制板车间防爆专项检查的主要内容。\n（1）作业人员是否正确穿戴防静电劳动防护用品；\n（2）作业人员是否违规携带火种或使用明火；\n（3）制板车间电气设备是否选用了合格的防爆电气设备；\n（4）作业工具是否采用不产生静电和火花的材质；\n（5）消防设施与消防器材是否有效；\n（6）是否安装粉尘防爆检测与报警装置；\n（7）安全标志是否齐全、是否正确；\n（8）制板车间通风是否良好，通风量是否满足安全标准；\n（9）车间内是否有粉尘积聚。","referenceImages":[]},{"number":5,"prompt":"依照案例背景，通过工作危害分析方法进行简易型评估确认检维修作业安全风险表现形式并简述安全风险分级管控清单的内容。","referenceAnswer":"5.依照案例背景，通过工作危害分析方法进行简易型评估确认检维修作业安全风险表现形式并简述安全风险分级管控清单的内容。\n（1）检维修作业风险危害程度表现为显著危险，需要整改。\n（2）安全风险分级管控清单内容：危险源位置、危险源名称、危险源可能导致事故的途径、可能导致的事故类型、安全风险等级、风险管控措施、管控责任主体。","referenceImages":[]}]},{"id":"p3-28","paper":3,"number":28,"topic":"氨制冷与事故分析","type":"short","images":[],"stem":"案例4 · 简答题","material":"案例四：D公司是一家冷冻食品加工企业，主要从事肉类的分割、加工、冷冻业务。D公司采用液氨进行制冷，液氨机房呈东西向设置于厂区内东侧位置，机房门朝北。距离北侧围墙约5米，墙根内侧东西向排列有高压液氨储罐2个，设置在同一防火堤内，每个储罐容积约为5立方米，共储存液氨12吨。液氨机房内共设有制冷压缩机3台、低压循环桶2台、中间冷却器2台。储罐设置有液位、温度检测仪表，进出物料管道上设置了远程控制的开关阀。每个液氨储罐设置了一套液位连续检测仪表和一个高高液位开关。液位连续检测仪表具备高低液位报警、高高和低低液位报警功能。高液位报警设定值略高于储罐的设计储存高液位，高高液位报警设定值为液相体积达到储罐计算容积95%时的高度。储罐设置有压力检测仪表，设置一级压力报警，报警阈值设为正常工作压力的上限。储罐设置了防雷接地及静电导除装置。2024年7月8日23时许，制冷工孙某开启压缩机实施制冷作业。零时30分许，仓库保管员吴某回宿舍休息，听到液氨机房方向发出“嗤嗤”响声，跑过去查看，发现机房处“冒白烟”，闻到有刺激性的氨味，未见制冷工孙某，于是拨打总经理张某电话，说明了情况，张某在外地，于是电话指挥吴某拨打119报警，同时联系其他值班人员进行现场处置。吴某发现位于机房门口处的1台压缩机气缸盖处正往外泄氨，便紧急将连通泄漏点的各阀门逐一关闭。50分钟后，救援人员赶到事故现场，开始在现场全面实施喷淋稀释。救援人员在东侧液氨储罐向东3米处发现昏迷不醒的孙某，孙某被抬出后逐渐恢复意识，经医护人员救治诊断，孙某身体被泄漏的液氨灼伤、呼吸道严重灼伤。此次事故造成的经济损失如下：孙某医疗费用10万元；孙某家属参与善后处理的交通费、住宿费等2万元；泄漏液氨损失1万元；D公司应急救援费用2万元；消防队应急救援费用10万元；清理事故现场费用6万元；停产损失价值20万元；应急管理部门对D公司罚款30万元；应急管理部门对主要负责人王某罚款5万元；赔偿客户违约费用3万元。事故调查发现如下问题：\n（1）压缩机气缸下端螺栓松动，压盖Ｏ型石棉密封垫已严重老化。\n（2）D公司主要负责人王某未确保充足的安全生产投入。\n（3）孙某违章冒险从事应急处置作业。\n（4）发现液氨泄漏，未采取任何安全防护措施进行应急处置，过程中被从压缩机气缸喷射的氨液溅到面部，并吸入大量氨气。\n（4）未对从业人员进行安全教育培训，制冷工孙某未持证上岗。\n（5）氨压缩机操作规程老旧，未定期组织修订。\n（6）未按规定组织开展事故隐患排查治理，造成遗留事故隐患。应急管理部门要求D公司停业整顿，落实事故防范和整改措施。根据以上场景，回答下列问题：","parts":[{"number":1,"prompt":"液氨储罐是否构成重大危险源，指出其安全设计的不合理之处。","referenceAnswer":"1.液氨储罐是否构成重大危险源，指出其安全设计的不合理之处。\n（1）液氨储罐共储存液氨12吨，大于液氨的临界量，构成重大危险源。\n（2）【考点注释】真题超纲，一般要求是指出，并写明应对措施，本题列举应对措施是为了考生作答期间能做到有效对照。不合理之处一：每个液氨储罐设置了一套液位连续检测仪表和一个高高液位开关。应对措施：压力式储罐应至少设置2套液位连续检测仪表和1个高高液位开关或设置3套液位连续检测仪表。不合理之处二：液位连续检测仪表具备高低液位报警、高高和低低液位报警功能。应对措施：液位连续检测仪表还应当应具备液位就地指示功能。不合理之处三：高液位报警设定值略高于储罐的设计储存高液位。应对措施：高液位报警设定值不应大于储罐的设计储存高液位。不合理之处四：高高液位报警设定值为液相体积达到储罐计算容积95%时的高度。应对措施：高高液位报警设定值不应大于液相体积达到储罐计算容积90%时的高度。不合理之处五：储罐设置有压力检测仪表，设置一级压力报警，报警阈值设为正常工作压力的上限。应对措施：压力式储罐的压力报警高限应至少设置两级。","referenceImages":[]},{"number":2,"prompt":"根据《生产安全事故分类与编码》（GB 6441-2025），辨识液氨制冷车间存在的危险有害因素。","referenceAnswer":"2.根据《生产安全事故分类与编码》（GB 6441-2025），辨识液氨制冷车间存在的危险有害因素。物体打击、机械致害、触电、跌落、泄漏、火灾、可燃气体爆炸、容器爆炸、管道爆炸、灼烫、中毒、窒息、其他。","referenceImages":[]},{"number":3,"prompt":"简述氨压缩机的安全操作要点。","referenceAnswer":"3.简述氨压缩机的安全操作要点。\n（1）启动前，应当对压缩机及其附属仪器仪表进行全面检查，确认无泄漏、破损等情况。检查泄漏报警器等安全设施是否完好有效。检查周围环境是否存在可燃物及点火源，确保机房通风正常。\n（2）作业前，操作人员必须穿戴防毒面具、护目镜、防护服、防护手套等个人防护装备，禁止穿化纤服装、钉鞋。\n（3）操作人员必须经过专业技术培训，持证上岗。\n（4）开机时，先开启冷却水系统，再启动压缩机工作；停机时，先停止压缩机工作，再关闭冷却水系统。\n（5）作业过程中，应实时监控压缩机工作参数，定时检查振动、噪声、泄漏等情况。\n（6）出现泄漏、报警等紧急情况，应当立即按下急停按钮，切断电源和气源。\n（7）在进行应急处置之前，应先穿戴好应急防护用品，严禁盲目施救。\n（8）操作结束后，应对工作区域进行彻底清理。对氨压缩机进行维护保养，确保设备处于良好状态。","referenceImages":[]},{"number":4,"prompt":"根据《大中型企业安全生产标准化管理体系要求》（GB/T 33000-2025），指出D公司在事故调查中发现的问题对应的一级要素。","referenceAnswer":"4.根据《大中型企业安全生产标准化管理体系要求》（GB/T 33000-2025），指出D公司在事故调查中发现的问题对应的一级要素。\n（1）现场管理。\n（2）领导作用。\n（3）应急准备与处置。\n（4）人员管理。\n（5）基础保障。\n（6）事故隐患排查治理。","referenceImages":[]},{"number":5,"prompt":"计算D公司本次事故造成的直接经济损失。","referenceAnswer":"5.计算D公司本次事故造成的直接经济损失。直接经济损失包括：孙某医疗费用10万元，孙某家属参与善后处理的交通费、住宿费等2万元，泄漏液氨损失1万元，D公司应急救援费用2万元，清理事故现场费用6万元。直接经济损失=10+2+1+2+6=21万元。","referenceImages":[]}]}]}</script><script>
(function(){'use strict';const max=q=>q.type==='short'?0:q.type==='single'?1:2;function points(q,values=[]){if(q.type==='short')return 0;const a=[...new Set(values)],key=[...new Set(q.answer||[])];if(!a.length||a.some(x=>!key.includes(x)))return 0;return a.length===key.length?max(q):q.type==='multiple'?a.length*.5:0}window.ChoiceScoring={max,points};})();

'use strict';
const BANK=JSON.parse(document.getElementById('bank').textContent),BY_ID=new Map(BANK.questions.map(q=>[q.id,q]));
const STORAGE_KEY='tianyu-practical-notebook-v1',app=document.getElementById('app');
let session=null,wrongCounts={},scope='all',mode='all',view='home',storageOK=true,autoTimer,toastTimer;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const isShort=q=>q.type==='short';
function values(q){return session?.answers[q.id]||[]}
function touched(q){return values(q).some(v=>String(v).trim())}
function complete(q){return isShort(q)?q.parts.every((_,i)=>values(q)[i]?.trim()):values(q).length>0}
function correct(q){return !isShort(q)&&values(q).slice().sort().join(',')===q.answer.slice().sort().join(',')}
function active(){return session.ids.map(id=>BY_ID.get(id))}
function done(){return session?active().filter(complete).length:0}
function isWrong(q){return isShort(q)?q.parts.some((_,i)=>session.selfGrades?.[q.id]?.[i]==='review'):touched(q)&&!correct(q)}
function clearAuto(){clearTimeout(autoTimer)}
function toast(message){document.querySelector('.toast')?.remove();clearTimeout(toastTimer);const el=document.createElement('div');el.className='toast';el.textContent=message;el.setAttribute('role','status');document.body.append(el);document.getElementById('live').textContent=message;toastTimer=setTimeout(()=>el.remove(),4500)}
function persist(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify({schema:2,session,wrongCounts}));storageOK=true;return true}catch{storageOK=false;toast('浏览器未允许保存，请保持页面打开。');return false}}
try{
 const stored=JSON.parse(localStorage.getItem(STORAGE_KEY)||'null');
 if(stored?.schema===2){
  for(const [id,n] of Object.entries(stored.wrongCounts||{}))if((BY_ID.has(id)||BANK.questions.some(q=>isShort(q)&&q.parts.some(p=>id===q.id+':'+p.number)))&&Number.isSafeInteger(n)&&n>=0)wrongCounts[id]=n;
  const s=stored.session;

if(instant()){app.querySelector('.submit-wrap p').textContent='逐题确认后显示答案与解析；结束时统计本轮得分。';const next=document.getElementById('next-btn'),original=next.onclick;if(q.type==='multiple'&&!locked&&session.answers[q.id]?.length)next.textContent='确认答案并看解析';next.onclick=()=>{if(session.answers[q.id]?.length&&!confirmed(q)){commit(q);return}original()};if(locked){app.querySelector('.question-card').insertAdjacentHTML('afterend',answerHtml(q));app.querySelectorAll('.option').forEach(label=>{const a=label.querySelector('input').value;label.classList.toggle('revealed-right',q.answer.includes(a));label.classList.toggle('revealed-wrong',!q.answer.includes(a)&&(session.answers[q.id]||[]).includes(a))})}}
}
home=function(){oldHome();if(view==='home')modePicker()};
quiz=function(){const priorId=app.querySelector('.question-card')?.dataset.choiceQuestion,scroll=window.scrollY;oldQuiz();if(view!=='quiz'||!session||session.submitted)return;const q=BY_ID.get(session.ids[session.index]);const tag=document.createElement('p');tag.className='answer-mode-status small';tag.textContent=instant()?'选择题逐题显示答案 · 已确认的答案不能修改':'选择题本轮结束后显示答案';app.querySelector('.quiz-top').before(tag);app.querySelector('.question-card').dataset.choiceQuestion=q.id;if(q.type!=='short')attach(q);if(priorId===q.id)window.scrollTo(0,scroll)};
results=function(){oldResults();if(view!=='results'||!session?.submitted)return;const qs=session.ids.map(id=>BY_ID.get(id)).filter(q=>q.type!=='short'),total=qs.reduce((n,q)=>n+ChoiceScoring.max(q),0),score=qs.reduce((n,q)=>n+ChoiceScoring.points(q,session.answers[q.id]||[]),0);const summary=document.createElement('section');summary.className='exam-points';summary.innerHTML=`<h2>本轮选择题得分 <strong>${score} / ${total} 分</strong></h2><p class="small">单选全对1分；多选全对2分，少选且无错选时每项0.5分，错选或未答0分。简答题不计入此分数。</p>`;app.querySelector('.result-summary').after(summary);for(const card of app.querySelectorAll('.review-card')){const label=card.querySelector('.meta').textContent.match(/第(\d+)套\s*·\s*原题(\d+)/);if(!label)continue;const q=qs.find(q=>q.paper===Number(label[1])&&q.number===Number(label[2]));if(!q)continue;const points=ChoiceScoring.points(q,session.answers[q.id]||[]);if(points>0&&(session.answers[q.id]||[]).length<q.answer.length)card.querySelector('.result-tag').textContent='少选';card.querySelector('.review-history').insertAdjacentHTML('afterend',`<p class="question-points">本题得分：<strong>${points} / ${ChoiceScoring.max(q)} 分</strong>${points>0&&(session.answers[q.id]||[]).length<q.answer.length?' · 少选，部分得分':''}</p>`)}};
document.getElementById('home-btn').onclick=()=>home();
})();

// Both subjects share flags, notes, cumulative learning records and encrypted cross-device sync.
(function(){
const T=window.Tianyu,SUBJECT='practical',oldPersist=persist,oldHome=home,oldQuiz=quiz,oldNav=showNavigator,oldResults=results;
let pendingRemote=false,renderedFeatures="";
function features(){return JSON.stringify(Object.fromEntries(Object.entries(T.doc.cells).filter(([k])=>k.startsWith(SUBJECT+"/")&&/\/(flag|note|seen|complete)\//.test(k)).map(([k,c])=>[k,c.value])))}
function selectedQuestions(){return session?session.ids.map(id=>BY_ID.get(id)).filter(q=>session.answers[q.id]?.some(v=>String(v).trim())):[]}
function redraw(){if(view==='quiz')quiz();else if(view==='results')results();else home()}
home=function(){oldHome();T.homePanel(SUBJECT,BANK,ids=>startRound(ids));renderedFeatures=features()};
quiz=function(){oldQuiz();if(view==='quiz'&&session&&!session.submitted)T.quizPanel(SUBJECT,session.ids[session.index]);renderedFeatures=features()};
showNavigator=function(){oldNav();T.navPanel(SUBJECT,session.ids)};
results=function(){oldResults();if(view==='results')T.reviewPanel(SUBJECT,selectedQuestions());renderedFeatures=features()};
persist=function(){const saved=oldPersist();if(saved&&!T.applying){T.record(SUBJECT,{schema:2,session,wrongCounts},BANK);wrongCounts=T.counts(SUBJECT);renderedFeatures=features()}return saved};
T.register(SUBJECT,{bank:BANK,read:()=>({schema:2,session,wrongCounts}),cancelAuto:()=>clearAuto(),apply:snap=>{
 if(document.activeElement?.matches('textarea,input[type="text"]')){pendingRemote=true;return false}
 if(T.same(session,snap.session)&&T.same(wrongCounts,snap.wrongCounts)&&renderedFeatures===features())return true;
 clearAuto();session=snap.session;wrongCounts=snap.wrongCounts;if(session){scope=session.scope||'all';mode=session.mode||'all';}redraw();pendingRemote=false;return true;
}});
// Reapply deferred remote changes after typing, without stealing the caret or overwriting another small question.
document.addEventListener('focusout',()=>{if(pendingRemote)setTimeout(()=>{if(!document.activeElement?.matches('textarea,input[type="text"]')){const snap=T.snapshot(SUBJECT);session=snap.session;wrongCounts=snap.wrongCounts;redraw();pendingRemote=false}},0)});
redraw();
})();

 const message=document.createElement('dialog');message.id='offline-dialog';message.innerHTML=`<div class="dialog-top"><h2>下载离线题库</h2><button id="close-offline">关闭</button></div><p>完整下载安全技术和其他安全专业实务，包括全部题目、答案、解析和配图。</p><p id="offline-status" role="status">正在检查本机缓存…</p><progress id="offline-progress" max="1" value="0" style="width:100%"></progress><div class="actions"><button id="download-offline">下载到当前设备</button></div><p class="small">下载完成后，用当前浏览器打开收藏的错题本链接即可离线练习。进度和笔记在本机保存，联网后补同步。每台设备需要分别下载；浏览器清理网站数据后需重新下载。</p>`;
 const css=document.createElement('style');css.textContent='#offline-button{font-size:12px;min-height:36px;padding:6px 10px;background:#fff;color:#172b43;border:1px solid #d8e0eb;border-radius:10px}body>header{flex-wrap:wrap}#offline-dialog p{font-size:14px;line-height:1.8}#offline-dialog button{min-height:44px;padding:8px 12px;border:1px solid #d8e0eb;border-radius:10px;background:white;color:#172b43}';document.head.append(css);
 function show(s){busy=!!s.busy;const done=s.done||0,total=s.total||0;document.getElementById('offline-progress').max=total||1;document.getElementById('offline-progress').value=done;const complete=total>0&&done===total;document.getElementById('offline-status').textContent=s.error|| (s.busy?`正在下载 ${done} / ${total} 项…`:complete?`离线题库已完整下载 · ${total} 项 · 约 ${(s.bytes/1048576).toFixed(1)} MB`:`已缓存 ${done} / ${total} 项${s.bytes?' · 完整题库约 '+(s.bytes/1048576).toFixed(1)+' MB':''}`);const b=document.getElementById('download-offline');b.disabled=busy||complete;b.textContent=busy?'正在下载…':complete?'已完成下载':'下载到当前设备';}
 async function send(type){if(!('serviceWorker' in navigator)){show({error:'当前浏览器不支持离线缓存，请用 Safari 或 Chrome 打开。'});return}const b=document.getElementById('download-offline');b.disabled=true;try{const registration=await navigator.serviceWorker.register(new URL('sw.js',root),{updateViaCache:'none'});await registration.update().catch(()=>{});const worker=registration.installing||registration.waiting||registration.active;if(!worker)throw Error('网络暂不可用，请联网后重试。');if(worker.state!=='activated')await new Promise((resolve,reject)=>{const t=setTimeout(()=>reject(Error('缓存初始化较慢，请稍后重试。')),15000);worker.addEventListener('statechange',()=>{if(worker.state==='activated'){clearTimeout(t);resolve()}if(worker.state==='redundant'){clearTimeout(t);reject(Error('请刷新页面后重试。'))}})});const ch=new MessageChannel();ch.port1.onmessage=e=>show(e.data);worker.postMessage({type},[ch.port2]);}catch(e){show({error:e.message||'无法下载，请检查网络后重试。'})}}
 function init(){document.body.append(message);const header=document.querySelector('.appbar-inner')||document.querySelector('header');const button=document.createElement('button');button.id='offline-button';button.textContent='离线下载';header.append(button);button.onclick=()=>{message.showModal();send('OFFLINE_STATUS')};document.getElementById('close-offline').onclick=()=>message.close();document.getElementById('download-offline').onclick=()=>{if(!busy)send('OFFLINE_DOWNLOAD')};}
